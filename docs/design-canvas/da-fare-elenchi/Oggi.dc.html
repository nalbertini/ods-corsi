<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- COM’È OGGI: una riga per cosa, col numero e la frase; per sapere chi, si apre ISCRITTI filtrato. -->
<div style="display: flex; width: 1440px; min-height: 1100px; background: #eef5fa">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" tema="sito" attiva="DA FARE" numeri="" nome="Marco Rossi" ruolo="Segreteria" altezza="1100px" hint-size="240px,1100px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">DA FARE</h1>
      <span style="font-size: 14px; color: #46606f">giovedì 22 ottobre 2026. Quello che aspetta la segreteria: si riconta ogni volta che torni qui.</span>
    </div>
    <dc-import name="CosaManca" tema="sito" colonne="6" voci="0|Appelli non fatti||r; 7|Certificati scaduti||r; 4|Pagamenti||r; 2|Corsi scaduti||r; 0|Senza tessera||v; 3|Richieste online||g" hint-size="100%,72px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <dc-import name="RigaDaFare" tema="sito" principale="{{ true }}" livello="blocca" n="7" titolo="Iscritti senza certificato valido" sotto="Il certificato medico manca o è scaduto: senza, in sala non si entra. Sotto i 6 anni non serve." tasto="Chiedi i certificati" hint-size="100%,96px"></dc-import>
      <dc-import name="RigaDaFare" tema="sito" livello="blocca" n="4" titolo="Iscritti da pagare" sotto="Da pagare, pagato in parte, o pagato fino a una data passata." tasto="Vedi chi deve pagare" hint-size="100%,96px"></dc-import>
      <dc-import name="RigaDaFare" tema="sito" livello="blocca" n="2" titolo="Iscritti con un corso scaduto" sotto="Il trimestre o l’annuale di un corso è finito, o non è pagato del tutto. In sala si entra lo stesso." tasto="Vedi chi" hint-size="100%,96px"></dc-import>
      <div style="padding-top: 6px"></div>
      <dc-import name="RigaDaFare" tema="sito" livello="presto" n="3" titolo="Richieste online nuove" sotto="Iscrizioni arrivate dal modulo, da accogliere o rifiutare." tasto="Accogli le richieste" hint-size="100%,96px"></dc-import>
      <dc-import name="RigaDaFare" tema="sito" livello="presto" n="5" titolo="Certificati in scadenza" sotto="Scadono entro un mese: da ricordare prima che scadano." tasto="Vedi chi" hint-size="100%,96px"></dc-import>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #0d2a3d"><span style="font-weight: 700; letter-spacing: 0.12em; font-size: 12px">QUANDO C’È UN MOMENTO</span> <u>2 richieste con documenti da stampare</u></p>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
