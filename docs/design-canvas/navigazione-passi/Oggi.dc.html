<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f4f1; color: #161616; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- OGGI: sopra il passo, sei cose una sotto l altra: RICHIESTA DI ISCRIZIONE, il bollino PROVA, i segmenti, «5 DI 8 I DOCUMENTI», la riga CHIAMA, LA FAMIGLIA con le pastiglie; poi il titoletto I DOCUMENTI ripete il nome del passo. Il contenuto comincia a meta schermo. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 900px; background: #f4f4f1; color: #161616">
<dc-import name="Titoletto" label="RICHIESTA DI ISCRIZIONE" tema="chiaro" hint-size="100%,50px"></dc-import>
<div style="padding: 12px 20px 0"><dc-import name="Badge" tipo="prova" label="PROVA: RESTA SU QUESTO DISPOSITIVO" tema="chiaro" hint-size="280px,30px"></dc-import></div>
<dc-import name="Avanzamento" numero="5" totale="8" titolo="I DOCUMENTI" tema="chiaro" hint-size="100%,120px"></dc-import>
<dc-import name="RigaChiama" tema="chiaro" hint-size="100%,60px"></dc-import>
<dc-import name="Titoletto" label="LA FAMIGLIA" conto="2" tema="chiaro" hint-size="100%,50px"></dc-import>
<div style="display: flex; gap: 8px; padding: 0 20px 8px"><span style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 2px solid #d4d4ce; background: transparent; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.14em; color: #161616">NICOLA</span><span style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border: 2px solid #161616; background: #e2e2dd; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.14em; color: #161616">MANUELA</span></div>
<dc-import name="Titoletto" label="I DOCUMENTI" tema="chiaro" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 4px 20px 20px; flex-grow: 1">
<dc-import name="CaricaFile" etichetta="LA CARTA D’IDENTITÀ DI NICOLA" se-manca="" dettaglio="Il fronte. È Nicola che firma: serve la sua carta, non quella di Manuela." nome="" tema="chiaro" hint-size="100%,100px"></dc-import>
<dc-import name="CaricaFile" etichetta="IL RETRO DELLA CARTA DI NICOLA" se-manca="FACOLTATIVO" dettaglio="Il retro. Una foto o il PDF." nome="" tema="chiaro" hint-size="100%,100px"></dc-import>
<dc-import name="CaricaFile" etichetta="IL CERTIFICATO DI MANUELA" se-manca="PUOI PORTARLO DOPO" dettaglio="Lo porti in segreteria prima della prima lezione: senza, Manuela non può partecipare." nome="" tema="chiaro" hint-size="100%,100px"></dc-import>
</div>
<dc-import name="BarraPasso" avanti="AVANTI" manca="" nota="" tema="chiaro" hint-size="100%,110px"></dc-import>
</div>
</x-dc>
</body>
</html>
