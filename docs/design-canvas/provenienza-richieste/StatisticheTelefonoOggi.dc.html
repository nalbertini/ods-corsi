<div style="position: relative; display: flex; flex-direction: column; width: 390px; min-height: 900px; background: #eef5fa">
  <dc-import name="BarraTelefono" tema="sito" luogo="SEGRETERIA" da-fare="5" hint-size="100%,62px"></dc-import>
  <main style="display: flex; flex-direction: column; gap: 16px; flex: 1; min-width: 0; padding: 20px 16px 24px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">STATISTICHE</h1>
      <span style="font-size: 14px; color: #46606f">Come va la palestra, mese per mese: chi viene, quando, in quali corsi, quanto entra.</span>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 12px">
      <div style="flex: 1 1 140px"><dc-import name="Campo" tema="sito" contesto="segreteria" tipo="select" etichetta="" valore="Ultimi 3 mesi" hint-size="100%,44px"></dc-import></div>
      <div style="flex: 1 1 140px"><dc-import name="Campo" tema="sito" contesto="segreteria" tipo="select" etichetta="" valore="Tutti i corsi" hint-size="100%,44px"></dc-import></div>
      <dc-import name="Bottone" tema="sito" contesto="segreteria" label="Scarica CSV" variante="linea" hint-size="140px,44px"></dc-import>
    </div>
    <div style="padding: 14px 20px; border: 2px dashed #cfe6f4; border-radius: 6px; font-size: 13px; color: #46606f">I quattro numeri e i riquadri sopra: come oggi</div>
    <div style="overflow: hidden; border-radius: 6px"><div style="width: 640px"><dc-import name="RiquadroStatistica" titolo="ISTRUTTORI" nota="le lezioni svolte, da titolare o da sostituto" colonne="ISTRUTTORE|LEZIONI|DA SOSTITUTO|A LEZIONE|SUGLI ISCRITTI" righe="Marco Rossi|72|4|12,1|%77;Elena Gallo|60|—|10,4|%72;Paolo Ferri|36|6|8,9|%66;Sara Villa|24|2|7,1|%64" griglia="minmax(120px, 1fr) auto auto auto minmax(140px, 1fr)" hint-size="640px,280px"></dc-import></div></div>
    <span style="font-size: 13px; color: #46606f">Oggi le tabelle scorrono di lato, col nome fermo: qui la tabella è tagliata dove finisce lo schermo.</span>
  </main>
