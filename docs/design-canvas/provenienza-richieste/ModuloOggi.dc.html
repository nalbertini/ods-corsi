<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- OGGI. Il modulo di iscrizione (ModuloIscrizione.tsx), il fondo: l'ultimo file, ALTRO con le note, le due caselle e MANDA LA RICHIESTA (come iscrizione-sito/ModuloFile). -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 900px; background: #eef5fa; color: #0d2a3d">
<main style="display: flex; flex-direction: column">
<dc-import name="Titoletto" tema="sito" label="I FILE" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<dc-import name="CaricaFile" tema="sito" etichetta="CERTIFICATO MEDICO" seManca="PUOI PORTARLO DOPO" dettaglio="Se ce l’hai già: una foto o il PDF. Se no, lo porti in segreteria." hint-size="100%,100px"></dc-import>
<dc-import name="CaricaFile" tema="sito" etichetta="RICEVUTA DEL PAGAMENTO" seManca="PUOI PAGARE IN SEGRETERIA" dettaglio="Se hai già pagato la quota associativa e il trimestre, oppure l’annuale." hint-size="100%,120px"></dc-import>
</div>
<dc-import name="Titoletto" tema="sito" label="ALTRO" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<dc-import name="Campo" tema="sito" tipo="area" etichetta="NOTE PER LA SEGRETERIA · FACOLTATIVE" segnaposto="Niente dati sulla salute: quelli si portano in segreteria." hint-size="100%,130px"></dc-import>
<dc-import name="Campo" tema="sito" tipo="spunta" etichetta="" valore="Accetto il Regolamento Sociale dell’associazione." scelto="{{ true }}" hint-size="100%,70px"></dc-import>
<dc-import name="Campo" tema="sito" tipo="spunta" etichetta="" valore="Ho letto l’informativa privacy e so che questi dati li legge solo la segreteria della palestra." scelto="{{ true }}" hint-size="100%,90px"></dc-import>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 20px 20px 28px">
  <dc-import name="Bottone" tema="sito" label="MANDA LA RICHIESTA" variante="vai" hint-size="100%,56px"></dc-import>
</div>
</main>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
