<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- OGGI. Il modulo a passi (IscrizioneAPassi.tsx, solo in prova con #nuova), l'ultimo passo INVIO con due persone della famiglia: riepilogo, le note per la segreteria (una per modulo; il riquadro del conto della famiglia, fra riepilogo e note, qui non e' ridisegnato), MANDA LA RICHIESTA PER TUTTI. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1100px; background: #121212; color: #f2f2f0">
<dc-import name="Testata" luogo="ISCRIZIONI" guida="{{ false }}" hint-size="100%,72px"></dc-import>
<dc-import name="IntestaPasso" riempi="{{ false }}" hint-size="100%,64px"></dc-import>
<main style="display: flex; flex-direction: column; flex-grow: 1">
<dc-import name="Avanzamento" numero="8" totale="8" titolo="INVIO" hint-size="100%,120px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 14px 20px 20px">
<span style="font-size: 14px; line-height: 1.4; color: #f2f2f0">2 iscrizioni, 2 richieste. Tocca MODIFICA per cambiare qualcosa.</span>
<dc-import name="Riepilogo" righe="fatto~Giulia Ferrero~Judo kids · trimestre~MODIFICA|fatto~Marco Ferrero~Judo adulti · annuale~MODIFICA|manca~Ricevuta del pagamento~non caricata: paghi in segreteria~CARICA" hint-size="100%,220px"></dc-import>
<dc-import name="Campo" tipo="area" etichetta="NOTE PER LA SEGRETERIA · FACOLTATIVE" segnaposto="Niente dati sulla salute: quelli si portano in segreteria." hint-size="100%,140px"></dc-import>
<span style="font-size: 14px; line-height: 1.4; color: #8c8c88">Mandale una volta sola: ogni invio è una richiesta per la segreteria</span>
</div>
<dc-import name="RigaChiama" hint-size="100%,72px"></dc-import>
</main>
<dc-import name="BarraPasso" compatta="{{ true }}" nota="Tutto a posto: puoi mandare." avanti="MANDA LA RICHIESTA PER TUTTI" tono="vai" hint-size="100%,150px"></dc-import>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
