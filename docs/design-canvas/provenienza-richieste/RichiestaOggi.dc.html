<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- OGGI. RICHIESTE ONLINE con una richiesta aperta nella finestra (SchedaPopover, costruita): i dati come in Scheda di Richieste.tsx. Da dove arriva non si vede. -->
<div style="position: relative; display: flex; width: 1440px; height: 900px; overflow: hidden; background: #eef5fa">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" tema="sito" attiva="RICHIESTE ONLINE" numeri="RICHIESTE ONLINE:3" nome="Marco Rossi" ruolo="Segreteria" altezza="900px" hint-size="240px,900px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">RICHIESTE ONLINE</h1>
      <span style="font-size: 14px; color: #46606f">3 richieste da guardare.</span>
    </div>
    <div style="display: flex; gap: 10px"><dc-import name="Chip" label="ANCHE QUELLE GIÀ GESTITE" acceso="{{ false }}" tema="sito" hint-size="240px,44px"></dc-import></div>
    <div style="display: flex; flex-direction: column; min-width: 0">
      <dc-import name="TestataTabella" tema="sito" colonne="NOME|CORSI|ARRIVATA|STATO|" griglia="1.2fr 1.4fr 1.3fr 150px 80px" ordinata="ARRIVATA" verso="giu" hint-size="100%,40px"></dc-import>
      <dc-import name="RigaIscritto" tema="sito" nome="Ferrero Davide" corsi="Judo adulti" contatto="17 novembre 2026, 20:45" bollini="" frequenza="NUOVA" stato="scelta" hint-size="100%,50px"></dc-import><dc-import name="RigaIscritto" tema="sito" nome="Bertola Giulia" corsi="Ginnastica artistica" contatto="17 novembre 2026, 19:10" bollini="" frequenza="NUOVA" stato="normale" hint-size="100%,50px"></dc-import><dc-import name="RigaIscritto" tema="sito" nome="Aiello Simone" corsi="Karate ragazzi" contatto="15 novembre 2026, 22:41" bollini="" frequenza="NUOVA" stato="normale" hint-size="100%,50px"></dc-import>
    </div>
  </main>
  <dc-import name="SchedaPopover" titolo="DAVIDE FERRERO" sotto="Arrivata il 17 novembre 2026, 20:45" tinta="#0d2a3d" posizione="1 DI 3" passaggio="{{ true }}" campi="NATO IL:12 aprile 1991|A:Torino|CODICE FISCALE:FRRDVD91D12L219X|RESIDENZA:Via Roma 56, 10093 Collegno|EMAIL:davide.ferrero@esempio.it|TELEFONO:347 210 5518|CORSI:Judo adulti|PAGA:Il trimestre|NOTE:Ha fatto judo da ragazzo, fino alla cintura verde.|REGOLAMENTO:Accettato" azioni="ELIMINA RICHIESTA E FILE:rosso|RIFIUTA:linea|ACCOGLI:pieno" larghezza="760px" altezza="900px" style="position:absolute;left:240px;right:0;top:0" hint-size="1200px,900px"></dc-import>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
