<dc-import name="SitoTestata" logo="logo.webp" attiva="Home" prova="Prova una settimana a 5 €" piccolo="{{ true }}" hint-size="100%,96px"></dc-import><div style="padding:24px 16px 0"><h2 style="font-family:'Big Shoulders Display','Arial Narrow',sans-serif;text-transform:uppercase;font-weight:800;margin:0 0 16px;font-size:56px;line-height:.9">Perché unirti a noi?</h2></div><div style="padding:6px 16px 0"><dc-import name="SitoPerche" n="1" titolo="La crescita viene prima del risultato" testo="Contano i progressi di ciascuno, a ogni età e livello. I risultati arrivano di conseguenza." tono="giallo" piccolo="{{ true }}" hint-size="100%,220px"></dc-import></div><div style="padding:6px 16px 0"><dc-import name="SitoPerche" n="2" titolo="Educazione sportiva, prima di tutto" testo="Rispetto per compagni, istruttori e avversari: è la prima cosa che si impara sul tatami." tono="blu" piccolo="{{ true }}" hint-size="100%,220px"></dc-import></div><div style="height:16px"></div><div style="margin:0 16px 16px;background:#fff;border:3px dashed #e4292a;border-radius:6px;padding:8px 12px;font:600 14px Inter,Arial,sans-serif;color:#0d2a3d">OGGI: quattro punti numerati (circa 1.500 px) senza un dato verificabile. Qui i primi due.</div><div style="padding:24px 16px 0"><h2 style="font-family:'Big Shoulders Display','Arial Narrow',sans-serif;text-transform:uppercase;font-weight:800;margin:0 0 16px;font-size:56px;line-height:.9">Cosa dicono di noi</h2></div><div style="padding:6px 16px 0"><dc-import name="SitoRecensione" testo="Una palestra come ce ne sono poche, la passione guida tutti quelli che la gestiscono e si respira aria di casa. Tutto qui è all’insegna di crescere insieme con lo sport." autore="Nicola A." tono="blu" piccolo="{{ true }}" hint-size="100%,260px"></dc-import></div><div style="padding:6px 16px 0"><dc-import name="SitoRecensione" testo="La professionalità di Maurizio rende l’ambiente cordiale e amichevole è ideale x chi si avvicina alle arti marziali, e per chi già pratica con passione, la location è molto accogliente. L’offerta è vasta tra varie discipline" autore="Nando" tono="inchiostro" piccolo="{{ true }}" hint-size="100%,260px"></dc-import></div><div style="padding:6px 16px 0"><dc-import name="SitoInBreve" righe="Palestra ben attrezzata per sport di combattimento~Stefano G.|Insegnanti molto preparati e posto molto accogliente.~Blorida K.|Discretamente strutturato Persone gentili e ben preparate~Davide R." piccolo="{{ true }}" hint-size="100%,340px"></dc-import></div><div style="margin:0 16px 16px;background:#fff;border:3px dashed #e4292a;border-radius:6px;padding:8px 12px;font:600 14px Inter,Arial,sans-serif;color:#0d2a3d">OGGI: due carte e una tessera «In breve» con tre recensioni di formato diverso; «x chi» e frase senza punto.</div>
