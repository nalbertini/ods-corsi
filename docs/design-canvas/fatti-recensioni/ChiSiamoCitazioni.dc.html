<!-- PROPOSTA: le citazioni accademiche in fondo a Chi siamo. -->
<div style="width: 375px; min-height: 1300px; position: relative; overflow: hidden; background: #eef5fa; color: #0d2a3d">
<dc-import name="SitoTestata" logo="logo.webp" attiva="Home" prova="Prova una settimana a 5 €" piccolo="{{ true }}" hint-size="100%,96px"></dc-import><div style="padding:24px 16px 0"><h2 style="font-family:'Big Shoulders Display','Arial Narrow',sans-serif;text-transform:uppercase;font-weight:800;margin:0 0 16px;font-size:56px;line-height:.9">Lo sport secondo chi lo studia</h2></div><div style="padding:6px 16px 0"><dc-import name="SitoCitazione" testo="«[…] ottima per l’incremento della forza ed il mantenimento del tono muscolare. […] I muscoli di tutto il corpo, oltre a diventare più forti, saranno anche più elastici e reattivi, con un rafforzamento della schiena e di tutte le articolazioni.»" autore="Serena" ruolo="Stud. di Medicina" tono="blu" piccolo="{{ true }}" hint-size="100%,300px"></dc-import></div><div style="padding:6px 16px 0"><dc-import name="SitoCitazione" testo="«Facendo sport si migliora se stessi per essere utili agli altri. In allenamento non serve fingere, si è quello che si è, non serve voler sembrare più bravi degli altri; bisogna fare quello che si può con il massimo impegno.»" autore="Maria" ruolo="Psicologa" tono="inchiostro" piccolo="{{ true }}" hint-size="100%,300px"></dc-import></div><div style="padding:6px 16px 0"><dc-import name="SitoCitazione" testo="«Il judo è una disciplina che allena la gran parte dei muscoli del corpo in maniera bilanciata […] Mantiene attiva la mente e il corpo ed è praticabile ad ogni livello (amatoriale, agonistico, per tenersi in forma) e ad ogni età.»" autore="Rinaldo" ruolo="Prof. di Ed. Fisica" tono="blu" piccolo="{{ true }}" hint-size="100%,300px"></dc-import></div><div style="height:16px"></div><div style="margin:0 16px 16px;background:#fff;border:3px dashed #e4292a;border-radius:6px;padding:8px 12px;font:600 14px Inter,Arial,sans-serif;color:#0d2a3d">PROPOSTA: le tre citazioni escono dalla Home e stanno in fondo a Chi siamo, prima della chiamata finale, con lo stesso estratto di oggi.</div>
