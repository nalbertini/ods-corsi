<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .et { font-family: 'Saira Condensed', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #46606f; }
  </style>
</helmet>
<!-- PROPOSTA · NUOVO MOVIMENTO come pagina intera: sostituisce l'elenco dentro la sezione (menu a sinistra resta). In alto «← I movimenti» (chiede conferma se c'è qualcosa scritto);
     campi su due colonne, max 720px; tasti in fondo. Il Giroconto si apre allo stesso modo. -->
<div style="display: flex; width: 1440px; min-height: 980px; background: #eef5fa">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" tema="sito" attiva="CONTABILITÀ" numeri="" nome="Chiara Bianchi" ruolo="Amministrazione" altezza="980px" hint-size="240px,980px"></dc-import>
  </div>
  <main style="flex: 1; min-width: 0; padding: 28px 36px; display: flex; flex-direction: column; gap: 18px">
    <span class="et" style="color: #8f6a00">PROPOSTA · NUOVO MOVIMENTO A PAGINA INTERA</span>
    <div><dc-import name="Bottone" tema="sito" label="← I movimenti" variante="linea" contesto="segreteria" hint-size="170px,48px"></dc-import></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span class="et">ENTRATA O USCITA</span>
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">NUOVO MOVIMENTO</h1>
    </div>
    <div style="display: flex; flex-direction: column; gap: 16px; max-width: 720px; padding: 24px 28px; background: #fff; border: 2px solid #cfe6f4; border-top: 6px solid #14709f">
      <div style="display: flex; gap: 10px"><dc-import name="Chip" tema="sito" label="Uscita" acceso="{{ true }}" hint-size="130px,44px"></dc-import><dc-import name="Chip" tema="sito" label="Entrata" hint-size="130px,44px"></dc-import></div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px">
        <dc-import name="Campo" tema="sito" contesto="segreteria" tipo="testo" etichetta="DATA" valore="18/10/2026" hint-size="100%,80px"></dc-import>
        <dc-import name="Campo" tema="sito" contesto="segreteria" tipo="testo" etichetta="IMPORTO" segnaposto="40,00" manca="{{ true }}" hint-size="100%,80px"></dc-import>
        <dc-import name="Campo" tema="sito" contesto="segreteria" tipo="select" etichetta="CASSA" valore="Cassa Contanti" hint-size="100%,80px"></dc-import>
        <dc-import name="Campo" tema="sito" contesto="segreteria" tipo="select" etichetta="VOCE" valore="Scegli la voce" manca="{{ true }}" hint-size="100%,80px"></dc-import>
      </div>
      <dc-import name="Campo" tema="sito" contesto="segreteria" tipo="testo" etichetta="DESCRIZIONE" valore="" manca="{{ true }}" hint-size="100%,80px"></dc-import>
      <dc-import name="Campo" tema="sito" contesto="segreteria" tipo="area" etichetta="NOTA · FACOLTATIVA" valore="" hint-size="100%,100px"></dc-import>
      <span style="font-size: 14px; color: #46606f; line-height: 1.4">Un solo importo, senza IVA. Registrato, non si cambia: si annulla e si rifà (la descrizione e la nota sì). Niente dati personali che non servono.</span>
      <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 16px; border-top: 2px solid #cfe6f4">
        <dc-import name="Bottone" tema="sito" label="No, torna indietro" variante="linea" contesto="segreteria" hint-size="200px,48px"></dc-import>
        <dc-import name="Bottone" tema="sito" label="Registra il movimento" variante="pieno" contesto="segreteria" disabled="{{ true }}" hint-size="240px,48px"></dc-import>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
