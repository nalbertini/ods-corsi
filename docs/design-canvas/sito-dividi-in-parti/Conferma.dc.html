<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">

</helmet>
<!-- PROPOSTA «dividi in parti»: la conferma (`chiedi`) dopo il tasto. Dice che il testo non cambia e come tornare indietro (TORNA ALLE PAGINE scarta la divisione). -->
<div style="width: 900px; height: 520px">
  <dc-import name="Dialogo" tipo="conferma" domanda="Dividere «Judo» in parti?" resto="Il testo non cambia: ogni titolo e ogni foto aprono una parte nuova. Non va online finché non pubblichi. Se non ti piace, TORNA ALLE PAGINE e non cambia niente." no="LASCIA STARE" si="DIVIDI" altezza="520px" tema="scuro" hint-size="900px,520px"></dc-import>
</div>
</x-dc>
