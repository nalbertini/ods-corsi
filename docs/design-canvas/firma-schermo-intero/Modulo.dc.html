<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il riquadro della firma nel modulo (come oggi, TavolaFirma) con il tasto nuovo FIRMA A SCHERMO INTERO, principale quando la firma manca. Toccare il riquadro fa lo stesso. Si puo' ancora firmare nel riquadro piccolo. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 700px; background: #121212; color: #f2f2f0">
<dc-import name="Testata" luogo="ISCRIZIONI" guida="{{ false }}" hint-size="100%,72px"></dc-import>
<main style="display: flex; flex-direction: column">
<dc-import name="Titoletto" label="IL MODULO" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 20px">
<span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #8c8c88">LA FIRMA DI <span style="font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0; color: #f2f2f0">Giulia Rossi</span></span>
<dc-import name="TavolaFirma" firmata="{{ false }}" hint-size="100%,170px"></dc-import>
<dc-import name="Bottone" label="FIRMA A SCHERMO INTERO" variante="principale" hint-size="100%,56px"></dc-import>
<span style="font-size: 14px; line-height: 1.4; color: #8c8c88">In orizzontale firmi meglio: gira il telefono quando apri la firma.</span>
</div>
</main>
</div>
</x-dc>
</body>
</html>
