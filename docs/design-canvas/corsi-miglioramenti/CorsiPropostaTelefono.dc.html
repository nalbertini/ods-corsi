<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <title>Corsi proposta telefono</title>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>* { box-sizing: border-box; } body { margin: 0; -webkit-font-smoothing: antialiased; }</style>
</helmet>
<!-- PROPOSTA (375px): la stessa pagina sul telefono. Un solo passo di sezione (64px), titolo 56px, schede da 220px di foto, bersagli >= 48px. -->
<div style="width: 375px; min-height: 5000px; position: relative; overflow: hidden; background: #eef5fa; color: #0d2a3d">

  <dc-import name="SitoTestata" logo="logo.webp" attiva="I corsi" prova="Prova una settimana a 5 €" piccolo="{{ true }}" hint-size="100%,96px"></dc-import>
  <section style="padding:32px 16px 0">
    <dc-import name="SitoTitolo" testo="I nostri corsi" intro="Per bambini, ragazzi e adulti, a ogni età e livello: tecnica, benessere e relazione vanno nella stessa direzione." corpo="56px" hint-size="100%,260px"></dc-import>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:28px">
      <dc-import name="SitoSchedaCorso" titolo="Judo" eta="Dai 7 anni agli adulti" testo="Tecnica, disciplina e rispetto per crescere sul tatami, dai primi passi fino alle gare." tag="Bambini|Adulti|Agonisti" tono="blu" foto="img/judo.jpg" fuoco="50% 0%" fuocoTel="50% 30%" alt="Un istruttore e due ragazzi in judogi, in ginocchio e in piedi sul tatami" alta="220px" piccolo="{{ true }}" hint-size="100%,480px"></dc-import>
      <dc-import name="SitoSchedaCorso" titolo="Lotta" eta="Dai 7 anni agli adulti" testo="Gioco, movimento e rispetto per crescere insieme, dalla prima prova alla gara." tag="Bambini|Adulti|Agonisti" tono="giallo" foto="img/lotta.jpg" fuoco="50% 85%" fuocoTel="50% 50%" alt="Due giovani lottatrici in gara sul tappeto, con l’arbitro dietro" alta="220px" piccolo="{{ true }}" hint-size="100%,480px"></dc-import>
      <dc-import name="SitoSchedaCorso" titolo="Aikido" eta="Dai 7 anni agli adulti" testo="Armonia, equilibrio e difesa, in una disciplina adatta anche a chi ha più anni." tag="Bambini|Adulti|Anziani" tono="inchiostro" foto="img/aikido.jpg" fuoco="50% 5%" fuocoTel="35% 50%" alt="Un istruttore in hakama e una allieva durante una dimostrazione di aikido" alta="220px" piccolo="{{ true }}" nota="DA CONFERMARE C2 · «più anni» e Anziani" hint-size="100%,480px"></dc-import>
      <dc-import name="SitoSchedaCorso" titolo="Pre pugilistica" eta="Dai 18 anni" testo="Primi passi nella boxe: tecnica e coordinazione, per imparare i colpi in sicurezza." tag="Adulti" tono="giallo" foto="" fuoco="" fuocoTel="" alt="" alta="220px" piccolo="{{ true }}" nota="DA CONFERMARE C1 · età 18 o «dal 2015»" hint-size="100%,480px"></dc-import>
      <dc-import name="SitoSchedaCorso" titolo="Metodo Globale di Autodifesa" eta="Dai 15 anni" testo="Autodifesa pratica e realistica, basata su situazioni reali, spiegata passo dopo passo." tag="Adulti" tono="inchiostro" foto="" fuoco="" fuocoTel="" alt="" alta="220px" piccolo="{{ true }}" nota="DA CONFERMARE C1 · età 15 o «dal 2015»" hint-size="100%,480px"></dc-import>
      <dc-import name="SitoSchedaCorso" titolo="Preparazione atletica" eta="Dai 14 anni" testo="Allenamenti mirati per migliorare forza, resistenza, velocità e coordinazione, anche per chi gareggia." tag="Adulti|Anziani|Agonisti" tono="blu" foto="img/sala.jpg" fuoco="50% 50%" fuocoTel="50% 50%" alt="L’istruttore sorride in sala attrezzata mentre i ragazzi si allenano con i pesi" alta="220px" piccolo="{{ true }}" nota="DA CONFERMARE C2 · Anziani" hint-size="100%,480px"></dc-import>
      <dc-import name="SitoSchedaCorso" titolo="Giocomotricità e psicomotricità" eta="Da 3 a 5 anni" testo="Percorsi motori per crescere giocando e migliorare coordinazione e fiducia in sé." tag="Bambini" tono="inchiostro" foto="img/cubi.jpg" fuoco="75% 50%" fuocoTel="75% 50%" alt="Un bambino salta sui materassi colorati della sala di psicomotricità" alta="220px" piccolo="{{ true }}" hint-size="100%,480px"></dc-import>
      <dc-import name="SitoSchedaCorso" titolo="Avviamento alle arti marziali" eta="5-6 anni" testo="Si scoprono le discipline, per aiutare i più piccoli a trovare la propria strada." tag="Bambini" tono="blu" foto="img/avviamento.jpg" fuoco="50% 25%" fuocoTel="50% 25%" alt="Un’istruttrice batte il cinque a un bambino sul tatami" alta="220px" piccolo="{{ true }}" nota="DA DECIDERE · foto 0511 o quella online" hint-size="100%,480px"></dc-import>
      <dc-import name="SitoSchedaCorso" titolo="Sollevamento pesi" eta="Dagli 11 anni" testo="Un percorso per imparare e perfezionare il sollevamento pesi, dai ragazzi agli adulti." tag="Bambini|Adulti|Agonisti" tono="giallo" foto="img/pesi.jpg" fuoco="50% 45%" fuocoTel="50% 45%" alt="Una donna alla panca solleva il bilanciere, con i dischi rossi in primo piano" alta="220px" piccolo="{{ true }}" nota="DA CONFERMARE C3 · Bambini dagli 11 anni" hint-size="100%,480px"></dc-import>
    </div>
  </section>
  <section style="padding:64px 16px 0">
    <dc-import name="SitoCta" titolo="Una settimana per scegliere." testo="5 € e provi tutte le discipline." indirizzo="Ti aspettiamo in Via Sassi 26, Collegno, vicino alla metro Fermi." principale="Prova una settimana a 5 €" secondario="Scrivici" foto="img/istruttori.jpg" fuoco="50% 25%" piccolo="{{ true }}" hint-size="100%,600px"></dc-import>
  </section>
  <section style="padding:24px 16px 24px">
    <dc-import name="SitoPiede" piccolo="{{ true }}" hint-size="100%,420px"></dc-import>
  </section>
</div>
</x-dc>
</body>
</html>
