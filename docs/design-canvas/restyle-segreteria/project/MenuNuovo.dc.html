<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA per il menu della segreteria (Segreteria.tsx, .sg-menu, .sg-gruppo-titolo): stessi gruppi, stesse voci, stessa larghezza.
     Cambiano: titoli dei gruppi in minuscolo (Inter 12px 500, colore #cfe6f4 al 70%, niente spaziatura 0.12em), nessun filo fra i gruppi
     ma 16px d'aria, i numeri come pastiglie tinta invece che riquadri bianchi. La voce corrente resta gialla (regola del marchio ODS).
     Ogni voce resta alta 44px (Regola del Dito di Fretta). Aiuto e Impostazioni restano in fondo, fissi. -->
<nav aria-label="Menu" style="display: flex; flex-direction: column; width: 240px; height: 900px; padding: 20px 12px 12px; background: #0d2a3d; color: #ffffff; overflow: hidden">
  <span style="display: flex; flex-direction: column; gap: 2px; padding: 0 8px 16px">
    <span style="font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">ODS CORSI</span>
    <span style="font-size: 12px; color: #cfe6f4">Gestione</span>
  </span>
  <span style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; margin-bottom: 8px; border-radius: 6px; background: #ffffff; color: #46606f; font-size: 15px">Cerca <span style="padding: 1px 6px; border-radius: 4px; background: #e6eef3; font-size: 12px; font-weight: 600">/</span></span>
  <div style="display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden">
    <sc-for list="{{gruppi}}" as="g" hint-placeholder-count="6">
      <span style="padding: 16px 12px 4px; font-size: 12px; font-weight: 500; color: #cfe6f4; opacity: 0.75">{{g.titolo}}</span>
      <sc-for list="{{g.voci}}" as="v" hint-placeholder-count="3">
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 6px; background: {{v.fondo}}; color: {{v.colore}}; text-decoration: none; font-size: 15px; font-weight: {{v.peso}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{v.icona}}"></path></svg>
          <span style="flex: 1">{{v.nome}}</span>
          <sc-if value="{{v.haNumero}}" hint-placeholder-val="{{ false }}"><span style="padding: 0 7px; border-radius: 999px; background: #cfe6f4; color: #0d2a3d; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">{{v.numero}}</span></sc-if>
        </a>
      </sc-for>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 12px; border-top: 1px solid #46606f">
    <sc-for list="{{piede}}" as="v" hint-placeholder-count="2">
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 6px; background: {{v.fondo}}; color: {{v.colore}}; text-decoration: none; font-size: 15px; font-weight: {{v.peso}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{v.icona}}"></path></svg>
        <span>{{v.nome}}</span>
      </a>
    </sc-for>
  </div>
</nav>
</x-dc>
<script data-dc-script data-props='{"corrente":{"editor":"text","default":"Iscritti"},"$preview":{"width":240,"height":900}}'>
// Icone: le stesse di Menu.dc.html della libreria (Lucide, 24×24, tratto 1.75).

2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z", "contabilita": "M3 21h18M3 10h18M5 6l7-3 7 3M4 10v11M20 10v11M8 14v3M12 14v3M16 14v3", "areaIstruttori": "M8 8a4 4 0 1 0 8 0a4 4 0 1 0 -8 0 M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1", "compensi": "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M16 13H8 M16 17H8", "importazioni": "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3", "link": "M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7 M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"};
ICONE.aiuto = 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3 M12 17h.01';
ICONE.impostazioni = 'M4 6h10 M18 6h2 M4 12h4 M12 12h8 M4 18h12 M20 18h0 M16 4v4 M10 10v4 M16 16v4';
// I gruppi di chi ha segreteria e amministrazione, come nella modalità prova (Segreteria.tsx, GRUPPI_MENU), con i numeri di oggi.
const GRUPPI = [
  ['Ogni giorno', [['Da fare', 'dafare'], ['Richieste online', 'richieste', '3'], ['Presenze', 'presenze', '2']]],
  ['Iscritti e soldi', [['Iscritti', 'iscritti']]],
  ['I conti', [['Contabilità', 'contabilita'], ['Importazioni', 'importazioni']]],
  ['Corsi e orari', [['Settimana', 'settimana'], ['Corsi', 'corsi'], ['Gare', 'gare'], ['Listino', 'listino']]],
  ['Istruttori', [['Presenze istruttori', 'istruttori', '8'], ['Compensi', 'compensi'], ['Istruttori e accessi', 'personale']]],
  ['Il resto', [['Statistiche', 'statistiche'], ['Vestiario', 'vestiario', '2'], ['Segnalazioni', 'segnalazioni'], ['Sito', 'sito'], ['Verbali', 'verbali']]],
];
class Component extends DCLogic {
  renderVals() {
    const corrente = this.props.corrente ?? 'Iscritti';
    const voce = ([nome, id, numero]) => {
      const su = nome === corrente;
      return { nome, icona: ICONE[id] ?? '', numero: numero ?? '', haNumero: !!numero, fondo: su ? '#f4c31b' : 'transparent', colore: su ? '#0d2a3d' : '#ffffff', peso: su ? 600 : 500 };
    };
    return {
      gruppi: GRUPPI.map(([titolo, voci]) => ({ titolo, voci: voci.map(voce) })),
      piede: [['Aiuto', 'aiuto'], ['Impostazioni', 'impostazioni']].map(voce),
    };
  }
}
</script>
</body>
</html>
