<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #0d2a3d; }
  </style>
</helmet>
<!-- PROPOSTA per una sezione di IMPOSTAZIONI (Impostazioni.tsx, .sg-riquadro, .modulo-etichetta, .etichetta-riquadro):
     a sinistra il titolo (16px 600) e cosa fa (14px dim), a destra i campi su bianco. Etichette 14px 500 sopra i campi, in minuscolo.
     «Pronto fino al» è un dato (etichetta + valore), non un riquadro con bordo. Campi e tasto 44px, bordo 1px #14709f.
     «Come funziona?» in minuscolo. stretta = telefono: le due colonne una sopra l'altra. -->
<section style="display: flex; flex-direction: {{direzione}}; gap: {{spazio}}; width: 100%">
  <div style="display: flex; flex-direction: column; gap: 4px; width: {{larghezzaTesta}}; flex: none">
    <h2 style="margin: 0; font-size: 16px; font-weight: 600">Il calendario</h2>
    <p style="margin: 0; font-size: 14px; line-height: 1.45; color: #46606f">Quando cominciano e finiscono i corsi, e fin dove è pronto il calendario.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 20px; flex: 1; min-width: 0; padding: {{riempi}}; border-radius: 6px; background: #ffffff">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; font-weight: 500; color: #46606f">Pronto fino al</span>
      <span style="font-size: 20px; font-weight: 600">30 giugno 2027</span>
    </div>
    <div style="display: grid; grid-template-columns: {{campi}}; gap: 16px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Inizio corsi
        <span style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border: 1px solid #14709f; border-radius: 6px; font-weight: 400; color: #46606f">gg/mm/aaaa
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d2a3d" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2z M16 2v4M8 2v4M3 10h18"></path></svg></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Fine corsi
        <span style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; border: 1px solid #14709f; border-radius: 6px; font-weight: 400; color: #46606f">gg/mm/aaaa
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d2a3d" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2z M16 2v4M8 2v4M3 10h18"></path></svg></span>
      </label>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 20px; border-top: 1px solid #cfe6f4">
      <span style="font-size: 14px; color: #46606f">Senza la fine, il calendario si prepara per i giorni scelti qui sotto e si allunga da sé.</span>
      <label style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 14px">Genera le lezioni per i prossimi
        <span style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 1px solid #14709f; border-radius: 6px; font-weight: 500">60 giorni <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
      </label>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
      <button style="height: 44px; padding: 0 16px; border: 1px solid #14709f; border-radius: 6px; background: #ffffff; color: #0d2a3d; font: 600 15px Inter, sans-serif">Rigenera adesso</button>
      <a href="#" style="display: inline-flex; align-items: center; height: 44px; color: #14709f; font-size: 14px; font-weight: 600">Come funziona?</a>
    </div>
  </div>
</section>
</x-dc>
<script data-dc-script data-props='{"stretta":{"editor":"boolean","default":false},"$preview":{"width":1128,"height":420}}'>
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const s = truthy(this.props.stretta);
    return {
      direzione: s ? 'column' : 'row', spazio: s ? '12px' : '32px', larghezzaTesta: s ? '100%' : '320px',
      riempi: s ? '16px' : '24px', campi: s ? '1fr' : '1fr 1fr',
    };
  }
}
</script>
</body>
</html>
