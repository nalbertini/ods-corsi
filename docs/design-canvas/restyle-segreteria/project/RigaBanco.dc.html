<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #ffffff; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #0d2a3d; }
  </style>
</helmet>
<!-- PROPOSTA per una voce di DA FARE AL BANCO / Da fare (.sg-dafare-riga): una riga d'elenco invece di un riquadro con la barra rossa
     di 4px a sinistra. L'urgenza e' un punto da 8px (rosso #e4292a o giallo #f4c31b) e la parola «appello non fatto» nel colore *-testo;
     il tasto e' il secondario (bianco, bordo 1px blu) a 44px. filo = il filo 1px sopra la riga, dalla seconda in poi. -->
<div style="display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 16px; border-top: {{bordo}}; background: #ffffff">
  <span style="flex: none; width: 8px; height: 8px; border-radius: 50%; background: {{punto}}"></span>
  <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
    <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{titolo}} <span style="font-size: 13px; font-weight: 500; color: {{coloreCosa}}">· {{cosa}}</span></span>
    <span style="font-size: 13px; color: #46606f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sotto}}</span>
  </span>
  <button style="flex: none; height: 44px; padding: 0 12px; border: 1px solid #14709f; border-radius: 6px; background: #ffffff; color: #0d2a3d; font: 600 14px Inter, sans-serif; white-space: nowrap">{{tasto}}</button>
</div>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"Aikido 3"},"cosa":{"editor":"text","default":"appello non fatto"},"sotto":{"editor":"text","default":"gio 12 novembre, 18:00 · 9 iscritti da segnare"},"tasto":{"editor":"text","default":"Fai l&#39;appello"},"tono":{"editor":"enum","options":["r","g"],"default":"r"},"filo":{"editor":"text","default":""},"$preview":{"width":384,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const giallo = p.tono === 'g';
    return {
      titolo: p.titolo ?? '', cosa: p.cosa ?? '', sotto: p.sotto ?? '', tasto: p.tasto ?? '',
      punto: giallo ? '#f4c31b' : '#e4292a', coloreCosa: giallo ? '#8f6a00' : '#b81d1d',
      bordo: p.filo === 'si' ? '1px solid #cfe6f4' : '0',
    };
  }
}
</script>
</body>
</html>
