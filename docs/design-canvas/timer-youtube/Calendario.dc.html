<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Fuori dal TIMER con YouTube che suona: il video entra nella barra piccola, in fondo e in flusso. Il calendario si accorcia, ma niente e' coperto. -->
<div style="display: flex; flex-direction: column; width: 390px; height: 844px; background: #121212">
  <dc-import name="Testata" luogo="ISTRUTTORI" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0; overflow: hidden">
    <dc-import name="Titoletto" label="OGGI · LUNEDÌ 12 OTTOBRE" conto="4" giallo="{{ true }}" hint-size="100%,50px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px">
      <dc-import name="RigaCalendario" ora="18:00" corso="Judo 3" sala="Tatami" istruttore="Maurizio" kanji="龍" tinta="#1b8ac4" iscritti="16" stato="iscritti" hint-size="100%,72px"></dc-import>
      <dc-import name="RigaCalendario" ora="19:00" corso="Judo adulti" sala="Tatami" istruttore="Maurizio" kanji="龍" tinta="#1b8ac4" iscritti="12" stato="iscritti" hint-size="100%,72px"></dc-import>
    </div>
  </main>
  <dc-import name="MusicaMini" musica="suona" titolo="Randori" video="{{ true }}" hint-size="100%,228px"></dc-import>
  <dc-import name="BarraNavigazione" voci="CALENDARIO|TIMER|I MIEI|ORE" attiva="CALENDARIO" hint-size="100%,66px"></dc-import>
</div>
</x-dc>
</body>
</html>
