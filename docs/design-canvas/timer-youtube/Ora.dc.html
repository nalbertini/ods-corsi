<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- ORA (versione 0.50.2): con YouTube il video sta sopra la barra della musica; video e barra prendono circa 340px e il timer resta schiacciato. -->
<div style="display: flex; flex-direction: column; width: 390px; height: 844px; background: #121212">
  <dc-import name="Testata" luogo="ISTRUTTORI" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0">
    <dc-import name="TimerAllenamento" indietro="APPELLO" altezza="290px" hint-size="100%,290px"></dc-import>
  </main>
  <div style="display: flex; justify-content: flex-end; padding: 12px 20px 0"><div style="width: 200px; height: 200px; background: #242424; border: 2px solid #333333"></div></div>
  <dc-import name="MusicaTelefono" musica="suona" fonte="youtube" titolo="Randori" sotto="Playlist YouTube" hint-size="100%,140px"></dc-import>
  <dc-import name="BarraNavigazione" voci="CALENDARIO|TIMER|I MIEI|ORE" attiva="TIMER" hint-size="100%,66px"></dc-import>
</div>
</x-dc>
</body>
</html>
