<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Scheda iscritto in tema chiaro: certificato scaduto con il file ancora in app. Cornice copiata da Pagina.dc.html / PaginaTelefono.dc.html, solo <dc-import>; dati inventati. -->
<div style="display: flex; width: 1440px; min-height: 760px; background: #f4f4f1">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" attiva="ISCRITTI"  numeri="RICHIESTE ONLINE:3, PRESENZE:2" nome="Marco Rossi" ruolo="Segreteria" altezza="760px" tema="chiaro" hint-size="240px,760px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="color: #161616; margin: 0; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 34px; font-weight: 700; letter-spacing: 0.04em; line-height: 1">LUCA BIANCHI</h1>
      <span style="font-size: 14px; color: #656561">Lotta adulti · nato l’8 aprile 1994</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.75fr); gap: 12px">
      <dc-import name="Timbro" titolo="CERTIFICATO" parola="SCADUTO" tono="rosso" righe="il 12 settembre 2026:giallo" tema="chiaro" hint-size="100%,100px"></dc-import>
      <dc-import name="Timbro" titolo="QUOTA" parola="IN REGOLA" tono="verde" righe="pagata il 2 ottobre" tema="chiaro" hint-size="100%,100px"></dc-import>
      <dc-import name="Timbro" titolo="DOCUMENTO" parola="IN SEGRETERIA" tono="verde" righe="" piccolo="{{ true }}" tema="chiaro" hint-size="100%,100px"></dc-import>
    </div>
    <div style="max-width: 640px">
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; min-width: 0; background: #ffffff; border: 2px solid #d4d4ce; "><dc-import name="SchedaCertificato" stato="scaduto_con_file" nome-file="certificato-bianchi.pdf" caricato-il="3 febbraio 2026" scadenza="12 settembre 2026" cancella-il="12 ottobre 2026" tema="chiaro" hint-size="100%,320px"></dc-import></div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
