<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il gesto CARICA / SOSTITUISCI aperto, tema scuro: scegli file + VALIDO FINO AL + un solo SALVA. Cornice copiata da Pagina.dc.html / PaginaTelefono.dc.html, solo <dc-import>; dati inventati. -->
<div style="display: flex; width: 1440px; min-height: 900px; background: #121212">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" attiva="ISCRITTI"  numeri="RICHIESTE ONLINE:3, PRESENZE:2" nome="Marco Rossi" ruolo="Segreteria" altezza="900px" tema="scuro" hint-size="240px,900px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 34px; font-weight: 700; letter-spacing: 0.04em; line-height: 1">LUCA BIANCHI</h1>
      <span style="font-size: 14px; color: #8c8c88">Lotta adulti · nato l’8 aprile 1994</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.75fr); gap: 12px">
      <dc-import name="Timbro" titolo="CERTIFICATO" parola="VALIDO" tono="verde" righe="fino al 14 marzo 2027" tema="scuro" hint-size="100%,100px"></dc-import>
      <dc-import name="Timbro" titolo="QUOTA" parola="IN REGOLA" tono="verde" righe="pagata il 2 ottobre" tema="scuro" hint-size="100%,100px"></dc-import>
      <dc-import name="Timbro" titolo="DOCUMENTO" parola="IN SEGRETERIA" tono="verde" righe="" piccolo="{{ true }}" tema="scuro" hint-size="100%,100px"></dc-import>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
        <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #8c8c88">SOSTITUISCI · FILE E DATA SCELTI, SALVA ACCESO</span>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; min-width: 0; background: #1c1c1c; border: 2px solid #333333; "><dc-import name="SchedaCertificato" stato="valido" scadenza="14 marzo 2027" gesto="{{ true }}" file-scelto="certificato-bianchi-2027.pdf" data-scelta="14/03/2028" tema="scuro" hint-size="100%,440px"></dc-import></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
        <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #8c8c88">CARICA · ANCORA NIENTE, SALVA SPENTO</span>
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; min-width: 0; background: #1c1c1c; border: 2px solid #333333; "><dc-import name="SchedaCertificato" stato="nessuno" gesto="{{ true }}" tema="scuro" hint-size="100%,360px"></dc-import></div>
        <span style="font-size: 14px; color: #8c8c88">Un solo gesto: si sceglie il file, si scrive la data, si preme SALVA. Il certificato non esiste a metà.</span>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
