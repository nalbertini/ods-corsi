<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- La scheda del certificato sul telefono (390px): i tasti vanno in colonna, a tutta larghezza. Cornice copiata da Pagina.dc.html / PaginaTelefono.dc.html, solo <dc-import>; dati inventati. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 844px; background: #121212">
  <dc-import name="Testata" luogo="SEGRETERIA" guida="{{ false }}" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; gap: 14px; padding: 20px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 28px; font-weight: 700; letter-spacing: 0.04em; line-height: 1">LUCA BIANCHI</h1>
      <span style="font-size: 14px; color: #8c8c88">Lotta adulti</span>
    </div>
    <dc-import name="Timbro" titolo="CERTIFICATO" parola="IN SCADENZA" tono="giallo" righe="il 18 ottobre 2026:giallo" hint-size="100%,100px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; min-width: 0; background: #1c1c1c; border: 2px solid #333333; padding: 14px"><dc-import name="SchedaCertificato" stato="in_scadenza" nome-file="certificato-bianchi.pdf" caricato-il="3 febbraio 2026" scadenza="18 ottobre 2026" fra="12" telefono="{{ true }}" tema="scuro" hint-size="100%,330px"></dc-import></div>
  </main>
</div>
</x-dc>
</body>
</html>
