<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PALESTRA oggi, nel Banco col look del sito: il clic sul luogo apre la prima voce, STATISTICHE. Chi cerca SITO o IMPOSTAZIONI
     passa da una pagina di tabelle che non gli serve, e la seconda riga dice le voci senza dire cosa c'è dentro. -->
<div style="display: flex; flex-direction: column; width: 1440px; min-height: 820px; background: #eef5fa">
  <dc-import name="BarraBanco" luogo="PALESTRA" voce="STATISTICHE" numeri="OGGI:7, PERSONE:4, PALESTRA:2, SEGNALAZIONI:2" hint-size="100%,190px"></dc-import>
  <main style="display: flex; flex-direction: column; gap: 18px; padding: 24px 36px 28px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">STATISTICHE</h1>
      <span style="font-size: 14px; color: #46606f">Come va la palestra, mese per mese: chi viene, quando, in quali corsi, quanto entra.</span>
    </div>
    <dc-import name="RiquadroStatistica" hint-size="100%,260px"></dc-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
