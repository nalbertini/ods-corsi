<x-dc>
<helmet>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- RICHIESTE ONLINE: cornice di PaginaSito (menu 240px + corpo), RICHIESTE ONLINE o CORSI con l'elenco com'e' oggi. -->
<div style="position: relative; display: flex; width: 1440px; height: 900px; overflow: hidden; background: #eef5fa">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" tema="sito" attiva="RICHIESTE ONLINE" numeri="RICHIESTE ONLINE:3, PRESENZE ISTRUTTORI:2" nome="Marco Rossi" ruolo="Segreteria" altezza="900px" hint-size="240px,900px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">RICHIESTE ONLINE</h1>
      <span style="font-size: 14px; color: #46606f">3 richieste da guardare. Com’è oggi: elenco e scheda affiancati sopra i 1240 px.</span>
    </div>
    <div style="display:flex;gap:24px;align-items:flex-start">
      <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:18px">
    <div style="display: flex; gap: 10px"><dc-import name="Chip" label="ANCHE QUELLE GIÀ GESTITE" acceso="{{ false }}" tema="sito" hint-size="240px,44px"></dc-import></div>
    <div style="flex-grow:1;min-width:0;display:flex;flex-direction:column">
      <dc-import name="TestataTabella" tema="sito" colonne="NOME|CORSI|ARRIVATA|STATO|" griglia="1.2fr 1.4fr 1.3fr 150px 80px" ordinata="ARRIVATA" verso="giu" hint-size="100%,40px"></dc-import>
      <dc-import name="RigaIscritto" tema="sito" nome="Ferrero Davide" corsi="Judo adulti" contatto="17 ottobre 2026, 20:45" bollini="" frequenza="NUOVA" stato="scelta" hint-size="100%,50px"></dc-import><dc-import name="RigaIscritto" tema="sito" nome="Bertola Giulia" corsi="Lotta 2" contatto="17 ottobre 2026, 19:10" bollini="" frequenza="NUOVA" stato="normale" hint-size="100%,50px"></dc-import><dc-import name="RigaIscritto" tema="sito" nome="Aiello Simone" corsi="Pre-pugilistica, MGA" contatto="15 ottobre 2026, 22:41" bollini="" frequenza="NUOVA" stato="normale" hint-size="100%,50px"></dc-import>
    </div>
      </div>
      <!-- Com'e' oggi: la scheda accanto all'elenco, 420px al minimo dopo la PR 478. -->
      <div style="width:420px;flex-shrink:0;padding:20px 24px;background:#fff;border:2px solid #cfe6f4;border-top:6px solid #0d2a3d;display:flex;flex-direction:column;gap:12px">
        <span style="font-family:'Big Shoulders Display','Arial Narrow',Arial,sans-serif;font-size:28px;font-weight:800;letter-spacing:.04em;line-height:1">DAVIDE FERRERO</span>
        <span style="font-size:13px;color:#46606f">Arrivata il 17 ottobre 2026, 20:45</span>
        <span style="font-size:11px;font-weight:700;letter-spacing:.14em;color:#46606f">NATO IL</span><span style="font-size:15px">12 aprile 1991</span>
        <span style="font-size:11px;font-weight:700;letter-spacing:.14em;color:#46606f">RESIDENZA</span><span style="font-size:15px">Via Roma 56, 10100 Collegno</span>
        <span style="font-size:13px;color:#46606f">… e sotto ancora: documenti, file, tasti (si scorre la pagina)</span>
      </div>
    </div>

</div>
