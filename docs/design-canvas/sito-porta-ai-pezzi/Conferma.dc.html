<!-- PROPOSTA «porta ai pezzi»: la conferma (`chiedi`) dopo il tasto. Dice che non si torna al vecchio editor e che il sito non cambia. -->

  <dc-import name="Dialogo" tipo="conferma" domanda="Portare «Pre pugilistica» ai pezzi?" resto="Non si torna più al vecchio editor di testo. Il testo resta com'è e il sito non cambia finché non pubblichi." no="LASCIA STARE" si="PORTA AI PEZZI" altezza="520px" tema="scuro" hint-size="900px,520px"></dc-import>
