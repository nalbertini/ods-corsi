<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- La pagina pubblica ISCRIZIONI sul telefono, com'e' oggi (App.tsx Iscrizioni + IscrizioniScreen.tsx con `pubblica`; indirizzo iscrizioni/): e' il link che la segreteria manda a chi chiede come ci si iscrive, senza accesso. Col database vero e l'informativa approvata i passi sono quelli del modulo dell'app (PASSI_APP di src/lib/iscrizione.ts): LEGGI IL MODULO, FAI IL PAGAMENTO, MANDA LA RICHIESTA DA QUI. Prima dei passi il riquadro PRIMA DI ISCRIVERTI (le prove, bordo giallo a sinistra), dopo i contatti. I costi e la nota sull'informativa stanno sotto: vedi l'artboard Costi. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1700px; background: #121212; color: #f2f2f0">
<dc-import name="Testata" luogo="ISCRIZIONI" guida="{{ false }}" hint-size="100%,72px"></dc-import>
<main style="display: flex; flex-direction: column">
<dc-import name="Titoletto" label="ISCRIZIONI" conto="3 PASSI" hint-size="100%,50px"></dc-import>
<div style="padding: 0 20px 10px"><dc-import name="RiquadroPasso" tono="prova" etichetta="PRIMA DI ISCRIVERTI" titolo="" righe="Una lezione di prova:3 €|Una settimana di prova:10 €" testo="Una lezione per provare un corso, o una settimana per provare tutti gli sport e scegliere quello giusto, prima di iscriversi. Per cominciare, passa in palestra o chiamaci." tasti="CHIAMA" hint-size="100%,270px"></dc-import></div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px 16px">
<dc-import name="PassoIscrizione" numero="1" titolo="Leggi il modulo" dettaglio="Quello per maggiorenni, o quello per minori che firma il genitore. Lo firmi col dito nell’ultimo passo, o lo stampi e ne fai una foto." tasti="MAGGIORENNI|MINORI" hint-size="100%,200px"></dc-import>
<dc-import name="PassoIscrizione" numero="2" titolo="Fai il pagamento" dettaglio="La quota associativa e il trimestre, oppure l’annuale. Tieni la ricevuta, o paga in segreteria.|Quota associativa 50 €, valida fino a luglio 2027. Bonifico a ASD Il Centro Judo:" iban="IT03 D076 0101 0000 0007 6350 339" dettaglio2="Oppure con Satispay, dall’app." tasti="COPIA IBAN|PAGA CON SATISPAY|VEDI I COSTI" hint-size="100%,400px"></dc-import>
<dc-import name="PassoIscrizione" numero="3" titolo="Manda la richiesta da qui" dettaglio="Le domande, la firma sul modulo, poi le foto della carta d’identità, e del certificato medico e della ricevuta se li hai." tasti="COMPILA LA RICHIESTA" primoPrincipale="{{ true }}" hint-size="100%,200px"></dc-import>
</div>
<div style="padding: 0 20px 16px"><dc-import name="RiquadroPasso" titolo="Hai un dubbio? Chiamaci o passa in palestra." testo="Via Sassi 26, Collegno, a pochi metri dalla metro Fermi. Telefono 346 329 2786." tasti="CHIAMA|MAPPA|INSTAGRAM|FACEBOOK|IL SITO" hint-size="100%,330px"></dc-import></div>
</main>
</div>
</x-dc>
</body>
</html>
