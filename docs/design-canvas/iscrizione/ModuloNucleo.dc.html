<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il modulo di iscrizione aperto dal nucleo (AggiungiUnaPersona in AreaIscritti.tsx; ModuloIscrizione con `nucleo`; QuantoCosta): titolo UNA PERSONA IN PIU', riquadro a bordo giallo che dice di chi e' il nucleo e che cognome, residenza e contatti sono quelli che la segreteria ha gia'. I campi partono compilati col titolare (qui: Tommaso Rossi, minorenne, genitore Marta); nell'app si cambia tutto prima di mandare. Scelti i corsi e come paga, QUANTO COSTA mostra le righe dal listino con lo sconto famiglia (verde), il totale, l'IBAN, la causale col suo nome e COPIA IBAN, COPIA CAUSALE, PAGA CON SATISPAY. Per un minore del nucleo la carta d'identita' non si chiede (la segreteria ha gia' quella del genitore), e il tasto in fondo, a invio fatto, dice TORNA ALLA TUA PAGINA. Cima del modulo e fondo con i file: stesse schermate di ModuloDati e ModuloFile. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1500px; background: #121212; color: #f2f2f0">
<dc-import name="Testata" luogo="ISCRITTI" guida="{{ true }}" hint-size="100%,72px"></dc-import>
<main style="display: flex; flex-direction: column">
<dc-import name="Titoletto" label="UNA PERSONA IN PIÙ" hint-size="100%,50px"></dc-import>
<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 14px 20px 0">
  <dc-import name="Bottone" label="← INDIETRO" variante="linea" alto="48px" corpo="16px" hint-size="160px,48px"></dc-import>
</div>
<div style="padding: 14px 20px 0"><dc-import name="RiquadroPasso" tono="prova" titolo="Una persona in più nel nucleo di Marta" testo="Cognome, residenza e contatti sono quelli che la segreteria ha già, e per un minore il genitore sei tu: cambia quello che non va. La richiesta arriva in segreteria come le altre, e accolta la trovi nella tua pagina." tasti="" hint-size="100%,190px"></dc-import></div>
<dc-import name="Titoletto" label="CHI SI ISCRIVE" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<dc-import name="Campo" etichetta="NOME" valore="Tommaso" hint-size="100%,80px"></dc-import>
<dc-import name="Campo" etichetta="COGNOME" valore="Rossi" hint-size="100%,80px"></dc-import>
<dc-import name="Campo" etichetta="CODICE FISCALE" valore="RSSTMS19D12L219P" codice="{{ true }}" hint-size="100%,80px"></dc-import>
</div>
<dc-import name="Titoletto" label="I CORSI" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<dc-import name="Campo" tipo="scelta" etichetta="" valore="Aikido 2" riga="nati 2019-2018-2017-2016 · lunedì e giovedì 17.00-18.00" scelto="{{ true }}" hint-size="100%,72px"></dc-import>
<dc-import name="Campo" tipo="scelta" etichetta="" valore="Judo 2" riga="nati 2019-2018-2017 · lunedì, mercoledì e venerdì 17.00-18.00" hint-size="100%,72px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 6px">
  <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #8c8c88">COME PAGHI</span>
  <div style="display: flex; gap: 8px">
  <div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="Annuale" scelto="{{ true }}" hint-size="50%,52px"></dc-import></div>
  <div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="Trimestre" hint-size="50%,52px"></dc-import></div>
</div>
</div>
<dc-import name="StimaCosto" righe="Quota associativa:50 €|Aikido 2 · annuale:450 €|Sconto famiglia 20% su Aikido 2:−90 €" totale="410 €" frasi="Lo sconto famiglia va sull’annuale che costa meno nel nucleo: Aikido 2 di Tommaso, che l’ha già avuto o lo avrà in segreteria." intestatario="ASD Il Centro Judo" iban="IT03 D076 0101 0000 0007 6350 339" causale="Iscrizione Tommaso Rossi · Aikido 2" tasti="COPIA IBAN|COPIA CAUSALE|PAGA CON SATISPAY" hint-size="100%,520px"></dc-import>
</div>
</main>
</div>
</x-dc>
</body>
</html>
