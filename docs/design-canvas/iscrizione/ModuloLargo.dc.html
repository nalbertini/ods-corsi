<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il modulo di iscrizione sullo schermo largo (da 560px le sezioni hanno due colonne, .modulo-griglia; .iscrizioni-modulo non supera 920px e sta al centro): qui 1280, un maggiorenne (Luca Bianchi) con le sezioni CHI SI ISCRIVE, RESIDENZA, COME RAGGIUNGERTI e I CORSI in due colonne (nome|cognome, data|luogo, CAP|comune, email|telefono; codice fiscale, via e i corsi a tutta riga: .modulo-largo). Le altre sezioni (IL MODULO, I FILE, ALTRO) hanno lo stesso schema del telefono. La testata e' quella del telefono (vedi IscrizioniLargo). -->
<div style="display: flex; flex-direction: column; width: 1280px; min-height: 1300px; background: #121212">
<dc-import name="Testata" luogo="ISCRIZIONI" guida="{{ false }}" hint-size="100%,72px"></dc-import>
<main style="width: 100%; max-width: 920px; margin: 0 auto; display: flex; flex-direction: column">
<dc-import name="Titoletto" label="RICHIESTA DI ISCRIZIONE" hint-size="100%,50px"></dc-import>
<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 14px 20px 0">
  <dc-import name="Bottone" label="← INDIETRO" variante="linea" alto="48px" corpo="16px" hint-size="160px,48px"></dc-import>
</div>
<dc-import name="Titoletto" label="CHI SI ISCRIVE" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><dc-import name="Campo" etichetta="NOME" valore="Luca" hint-size="100%,80px"></dc-import><dc-import name="Campo" etichetta="COGNOME" valore="Bianchi" hint-size="100%,80px"></dc-import></div>
<dc-import name="Campo" etichetta="CODICE FISCALE" valore="BNCLCU90A01L219X" codice="{{ true }}" hint-size="100%,80px"></dc-import>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><dc-import name="Campo" tipo="sola-lettura" etichetta="DATA DI NASCITA" valore="01/01/1990" nota="36 anni: lo dice il codice fiscale" notaTono="avviso" hint-size="100%,100px"></dc-import><dc-import name="Campo" tipo="sola-lettura" etichetta="LUOGO DI NASCITA" valore="Torino (TO)" hint-size="100%,80px"></dc-import></div>
</div>
<dc-import name="Titoletto" label="RESIDENZA" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<dc-import name="Campo" etichetta="VIA E NUMERO" valore="Via Esempio 12" hint-size="100%,80px"></dc-import>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><dc-import name="Campo" etichetta="CAP" valore="10093" codice="{{ true }}" hint-size="100%,80px"></dc-import><dc-import name="Campo" etichetta="COMUNE" valore="Collegno" hint-size="100%,80px"></dc-import></div>
</div>
<dc-import name="Titoletto" label="COME RAGGIUNGERTI" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px"><dc-import name="Campo" etichetta="EMAIL" valore="luca.bianchi@example.it" hint-size="100%,80px"></dc-import><dc-import name="Campo" etichetta="TELEFONO" valore="333 123 4567" hint-size="100%,80px"></dc-import></div>
<dc-import name="Campo" etichetta="TELEFONO 2 · FACOLTATIVO" valore="" hint-size="100%,80px"></dc-import>
</div>
<dc-import name="Titoletto" label="I CORSI" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
  <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #8c8c88">PER LA SUA ETÀ</span>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
    <dc-import name="Campo" tipo="scelta" etichetta="" valore="Judo adulti" riga="nati nel 2012 o prima · lunedì, mercoledì e venerdì 19.00-20.30" scelto="{{ true }}" hint-size="100%,72px"></dc-import>
    <dc-import name="Campo" tipo="scelta" etichetta="" valore="Lotta 3" riga="nati 2016-2015-2014 e prima · lunedì e mercoledì 18.00-19.30" hint-size="100%,72px"></dc-import>
    <dc-import name="Campo" tipo="scelta" etichetta="" valore="Aikido 3" riga="nati 2015-2014-2013 e prima · lunedì e giovedì 18.00-19.00" hint-size="100%,72px"></dc-import>
    <dc-import name="Campo" tipo="scelta" etichetta="" valore="Prepugilistica" riga="nati 2010-2009-2008 e prima · mercoledì 19.00-20.30" hint-size="100%,72px"></dc-import>
  </div>
</div>
</div>
</main>
</div>
</x-dc>
</body>
</html>
