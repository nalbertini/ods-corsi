<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Dove porta il link dell'email d'invito della segreteria (Porta.tsx ScegliPassword con arrivo «invito»; invito.ts legge il frammento #access_token=…&type=invite): BENVENUTO, si sceglie la password per l'account (la mail e' scritta nel testo) e SALVA ED ENTRA porta nella propria area. Vale per gli accessi che la palestra da' a segreteria, istruttori e sala: un iscritto non ha ancora un accesso (vedi AreaChiusa). Con «password dimenticata» il titolo e' NUOVA PASSWORD e il resto e' uguale, senza la frase iniziale. Non riprodotti: «Un attimo…» mentre il link si legge, gli errori «Almeno otto caratteri» e «Le due password non sono uguali», la scelta DOVE VAI? per chi ha due aree. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 844px; background: #121212">
<dc-import name="Testata" luogo="ACCESSO" guida="{{ false }}" hint-size="100%,72px"></dc-import>
<main style="display: flex; flex-direction: column">
<div style="display: flex; align-items: baseline; gap: 10px; padding: 22px 20px 10px"><span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.24em; color: #8c8c88">BENVENUTO</span><div style="flex-grow: 1; height: 2px; background: #2a2a2a"></div></div>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 16px">
<span style="font-size: 14px; line-height: 1.4; color: #8c8c88; font-size: 15px">La palestra ti ha dato un accesso. Scegli la password per marco.rossi@example.it: è quella con cui entrerai d’ora in poi.</span>
<dc-import name="Campo" etichetta="NUOVA PASSWORD" valore="••••••••••" hint-size="100%,80px"></dc-import>
<dc-import name="Campo" etichetta="RIPETI LA NUOVA PASSWORD" valore="" hint-size="100%,80px"></dc-import>
<dc-import name="Bottone" label="SALVA ED ENTRA" variante="vai" hint-size="100%,56px"></dc-import>
</div>
</main>
</div>
</x-dc>
</body>
</html>
