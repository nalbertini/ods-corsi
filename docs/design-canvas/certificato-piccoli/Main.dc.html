<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- ELENCO ISCRITTI: sopra com'e' oggi, sotto la proposta. Un bambino sotto i 6 anni non e' piu' un rosso: la colonna
     IN REGOLA lo dice, e CERT. NON SERVE e' un bollino spento (come FUORI APP). Chi compie 6 anni entro un mese senza
     certificato ha SERVE DAL 14/10 in giallo, come SCADE IL. -->
<div style="display: flex; flex-direction: column; width: 1100px; background: #121212; padding: 28px 36px 36px; gap: 14px">
  <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #8c8c88">OGGI · BAMBINO DI 5 ANNI SENZA CERTIFICATO</span>
  <div>
    <dc-import name="TestataTabella" hint-size="100%,40px"></dc-import>
    <dc-import name="RigaIscritto" nome="Conti Leo" corsi="Judo kids" contatto="333 7654321" bollini="NO CERTIFICATO:rosso" frequenza="6/8" hint-size="100%,70px"></dc-import>
  </div>
  <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #f4c31b; margin-top: 18px">PROPOSTA</span>
  <div>
    <dc-import name="TestataTabella" hint-size="100%,40px"></dc-import>
    <dc-import name="RigaIscritto" nome="Conti Leo (5 anni)" corsi="Judo kids" contatto="333 7654321" bollini="IN REGOLA:verde|CERT. NON SERVE:spento" frequenza="6/8" hint-size="100%,100px"></dc-import>
    <dc-import name="RigaIscritto" nome="Neri Sofia (5 anni, compie 6 anni il 14/10)" corsi="Judo kids" contatto="333 1112223" bollini="SERVE DAL 14/10:giallo" frequenza="4/8" hint-size="100%,70px"></dc-import>
    <dc-import name="RigaIscritto" nome="Greco Anna (7 anni)" corsi="Judo kids" contatto="333 1234567" bollini="NO CERTIFICATO:rosso" frequenza="7/8" hint-size="100%,70px"></dc-import>
    <dc-import name="RigaIscritto" nome="Riva Marco (senza data di nascita)" corsi="Pilates" contatto="nessun contatto" bollini="NO CERTIFICATO:rosso|MANCA LA DATA:spento" frequenza="2/8" hint-size="100%,100px"></dc-import>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1100,"height":520}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
