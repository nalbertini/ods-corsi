<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- DA FARE: i bambini sotto i 6 anni escono dal conto «senza certificato valido»; una riga nuova, gialla (presto),
     avvisa un mese prima chi compie 6 anni e non ha il certificato, per avvisare la famiglia. -->
<div style="display: flex; flex-direction: column; width: 1100px; background: #121212; padding: 28px 36px 36px; gap: 8px">
  <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #f4c31b; margin-bottom: 6px">PROPOSTA</span>
  <dc-import name="RigaDaFare" n="2" titolo="iscritti senza certificato valido" sotto="Il certificato medico manca o è scaduto: senza, in sala non si entra. Sotto i 6 anni non serve." tasto="VEDI CHI" livello="blocca" hint-size="100%,100px"></dc-import>
  <div style="height: 6px"></div>
  <dc-import name="RigaDaFare" n="3" titolo="iscritti che compiono 6 anni senza certificato" sotto="Dal compleanno il certificato serve: nel prossimo mese, da avvisare alla famiglia." tasto="VEDI CHI" livello="presto" hint-size="100%,100px"></dc-import>
  <dc-import name="RigaDaFare" n="1" titolo="certificato in scadenza" sotto="Scadono entro un mese: da ricordare prima che scadano." tasto="VEDI CHI" livello="presto" hint-size="100%,100px"></dc-import>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1100,"height":380}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
