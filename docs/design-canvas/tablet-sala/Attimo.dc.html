<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il «Un attimo…» a schermo pieno (Tablet.tsx, riga 114): il tablet si e' appena acceso e non sa ancora ne' in che sala e' ne' se c'e' rete. Niente testata, niente barra, niente nastro di prova: solo `.tb` (fondo `bg`) con la nota da 17px in `dim` in alto a sinistra, padding 32px. Dura il tempo di caricare l'app e leggere la sala; senza rete diventa TABLET DI SALA con RIPROVA ADESSO (non riprodotto). Lo stesso testo compare anche, piu' piccolo, sotto la barra mentre si carica il timer. -->
<div style="position: relative; width: 1280px; height: 800px; background: #121212; overflow: hidden; color: #f2f2f0">
  <p style="margin: 0; padding: 32px; font-size: 17px; line-height: 1.5; color: #8c8c88">Un attimo…</p>
</div>
</x-dc>
</body>
</html>
