<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il tablet che si accende prima del wifi (dopo un black-out): non sa in che sala e', non e' un tablet da collegare. Dice il motivo, avvisa che riprova da solo ogni 30 secondi e appena torna la rete, e ha RIPROVA ADESSO. Senza testata ne' barra. Mentre carica l'app c'e' solo «Un attimo…» (non riprodotto). -->
<div style="display: flex; flex-direction: column; gap: 18px; width: 1280px; height: 800px; padding: 32px; background: #121212">
  <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 40px; font-weight: 700; letter-spacing: 0.03em; line-height: 1">TABLET DI SALA</span>
  <span style="font-size: 18px; line-height: 1.5; color: #c9c9c4">Non riesco a sapere in che sala sono</span>
  <span style="font-size: 17px; line-height: 1.5; color: #8c8c88">Riprovo da solo fra poco, e appena torna la rete.</span>
  <div style="align-self: flex-start"><dc-import name="TabletTasto" label="RIPROVA ADESSO" variante="linea" tema="scuro" hint-size="240px,60px"></dc-import></div>
</div>
</x-dc>
</body>
</html>
