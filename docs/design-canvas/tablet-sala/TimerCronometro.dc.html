<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

<!-- Il CRONOMETRO (CronometroScreen in timer/src/components/AlVolo.tsx), che si apre a tutto schermo dalla card CRONOMETRO in STRUMENTI e si chiude con TIMER. Qui e' in corsa, con tre giri segnati e il quarto che corre. Blu e' il suo colore: cornice da 14px, anello e tasto FERMA. L'anello e' la lancetta dei secondi (un giro al minuto) e dentro tiene il giro in corso con il suo tempo; le cifre sono minuti e secondi grandi, i centesimi a destra e piu' piccoli. I giri stanno sotto, il piu' recente in cima, il piu' veloce in verde (GIRO 03); GIRO segna un giro e FERMA mette in pausa. AZZERA riparte da capo. Misure del tablet: il riquadro e' alto 608 px, quindi sotto i 700 il foglio del timer toglie la parola di stato (IN CORSA, FERMO, PRONTO) e la riga sotto le cifre, e stringe l'anello a 97 px (.timer[data-attrezzo] in timer/src/styles.css): sul tablet non si leggono. La cornice colorata non ruba spazio, sta sopra i contenuti. Non riprodotti: il cronometro fermo (FERMO, RIPRENDI) e quello a zero (PRONTO, AVVIA, GIRO spento e senza giri). -->
<div style="position: relative; display: flex; flex-direction: column; width: 1280px; height: 800px; background: #121212; overflow: hidden; color: #f2f2f0">
  <dc-import name="TabletTestataSala" sala="SALA JUDO" data="MARTEDÌ 6 OTTOBRE · OFFICINE DELLO SPORT" ora="18:41" tema="scuro" chip="segna" corso="JUDO KIDS" conteggio="7/12" hint-size="100%,92px"></dc-import>
  <div style="position: relative; flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px 0">
      <span style="display: flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; padding: 0 11px; border: 2px solid #333333; color: #b8b8b2; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em">TIMER</span>
      <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 1px; min-width: 0">
        <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 18px; font-weight: 700; line-height: 1.05">CRONOMETRO</span>
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.18em; color: #8c8c88">CONTA IN SALITA</span>
      </div>
      <span style="display: flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; padding: 0 11px; border: 2px solid #333333; color: #b8b8b2; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em">AZZERA</span>
    </div>
    <div style="position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 56px; padding: 0 60px">
      <dc-import name="TimerAnelloAttrezzo" etichetta="GIRO" numero="4" sotto="00:15.29" progresso="0.19" colore="#1b8ac4" misura="97px" tema="scuro" hint-size="97px,97px"></dc-import>
      <div style="display: flex; align-items: baseline; justify-content: center; gap: 2px; min-width: 0; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums">
        <span style="font-size: 152px; font-weight: 700; line-height: 0.88; letter-spacing: -0.03em">02:11</span>
        <span style="font-size: 67px; font-weight: 700; letter-spacing: -0.02em; color: #8c8c88">.58</span>
      </div>
    </div>
    <div style="flex-shrink: 0; margin: 0 20px">
      <dc-import name="TimerGiri" giri="00:38.40|00:38.40;00:41.07|01:19.47;00:36.82|01:56.29" altezza-max="158px" tema="scuro" hint-size="100%,131px"></dc-import>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px 20px">
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; height: 68px; padding: 0 22px; border: 2px solid #333333; color: #b8b8b2; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 18px; font-weight: 700; letter-spacing: 0.08em">GIRO</span>
      <span style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 68px; background: #1b8ac4; color: #121212; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 22px; font-weight: 700; letter-spacing: 0.16em"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>FERMA</span>
    </div>
    <div style="position: absolute; inset: 0; z-index: 5; pointer-events: none; border: 14px solid #1b8ac4"></div>
  </div>
  <dc-import name="TabletPiedeMusica" scheda="timer" sotto-presenze="7/12 SEGNATI" sotto-timer="JUDO KIDS" musica="suona" fonte="spotify" titolo="Corsa leggera" sotto="Studio Beat · Riscaldamento" volume="40" tema="scuro" hint-size="100%,100px"></dc-import>
</div>
</x-dc>
