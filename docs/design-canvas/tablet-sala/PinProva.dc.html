<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il PIN con i dati di prova (TabletPin.tsx, `d.modo === 'prova'`): sopra il nastro giallo DATI DI PROVA di tutto il tablet e, sotto i pallini, la riga «In prova: 1234 e' Maurizio, 2468 e' Maura, 5678 e' Fabio.» (14px, `dim`) che nell'app vera non c'e'. Nessuna cifra ancora battuta. Il resto e' Pin. -->
<div style="position: relative; display: flex; flex-direction: column; width: 1280px; height: 800px; background: #121212; overflow: hidden; color: #f2f2f0">
  <dc-import name="NastroProva" tema="scuro" hint-size="100%,40px"></dc-import>
  <dc-import name="TabletTestataSala" sala="SALA JUDO" data="MARTEDÌ 6 OTTOBRE · OFFICINE DELLO SPORT" ora="18:40" tema="scuro" hint-size="100%,92px"></dc-import>
  <div style="flex: 1; min-height: 0">
    <dc-import name="TabletPinSchermata" titolo="AREA ISTRUTTORE" testo="Il tuo PIN a quattro cifre. Da qui fai l’appello completo e correggi le presenze segnate sul tablet. Durante una lezione ti segna anche la tua presenza." cifre="0" prova="{{ true }}" tema="scuro" hint-size="100%,608px"></dc-import>
  </div>
  <dc-import name="TabletPiedeMusica" scheda="presenze" sotto-presenze="7/12 SEGNATI" sotto-timer="JUDO KIDS" musica="suona" fonte="spotify" titolo="Corsa leggera" sotto="Studio Beat · Riscaldamento" volume="40" tema="scuro" hint-size="100%,100px"></dc-import>
</div>
</x-dc>
</body>
</html>
