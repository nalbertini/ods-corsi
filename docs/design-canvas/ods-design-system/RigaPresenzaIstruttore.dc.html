<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div role="row" style="display: grid; grid-template-columns: {{griglia}}; gap: 14px; align-items: center; width: 100%; min-height: 64px; padding: 8px 14px; border-bottom: 1px solid {{c.surface2}}; border-left: 6px solid {{tinta}}; text-align: left">
  <span style="font-size: 16px; font-weight: 600; color: {{c.text}}; opacity: {{opacita}}">{{nome}}</span>
  <span style="display: flex; flex-direction: column; gap: 2px; opacity: {{opacita}}">
    <span style="font-size: 16px; font-weight: 600; color: {{c.text}}">{{corso}}</span>
    <span style="font-size: 15px; color: {{c.sec}}">{{quando}}</span>
  </span>
  <span style="font-size: 15px; color: {{c.sec}}; opacity: {{opacita}}">{{previsti}}</span>
  <span style="display: flex; flex-direction: column; gap: 2px; opacity: {{opacita}}">
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; color: {{c.text}}">{{entrata}}</span>
    <span style="font-size: 15px; color: {{c.dim}}">{{come}}</span>
  </span>
  <span style="display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; text-align: right">
    <sc-if value="{{daConfermare}}" hint-placeholder-val="{{ true }}">
      <dc-import name="Bottone" label="CONFERMA" variante="vai" contesto="segreteria" tema="{{tema}}" hint-size="130px,48px"></dc-import>
      <dc-import name="Bottone" label="RIFIUTA" variante="linea" contesto="segreteria" tema="{{tema}}" hint-size="110px,48px"></dc-import>
    </sc-if>
    <sc-if value="{{gestita}}" hint-placeholder-val="{{ false }}">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: {{coloreStato}}">{{parolaStato}}</span>
        <span style="font-size: 15px; color: {{c.dim}}">{{dettoGestita}}</span>
      </span>
      <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 6px; font-size: 15px; color: {{c.dim}}; text-decoration: underline; text-underline-offset: 3px">{{ripensa}}</span>
    </sc-if>
  </span>
</div>
</x-dc>
<script data-dc-script data-props='{"nome":{"editor":"text","default":"Marco Rossi"},"corso":{"editor":"text","default":"Judo kids"},"quando":{"editor":"text","default":"lunedì 5 ottobre, 17:30–18:30"},"previsti":{"editor":"text","default":"Marco Rossi"},"entrata":{"editor":"text","default":"17:24"},"come":{"editor":"text","default":"col PIN"},"tinta":{"editor":"text","default":"#1b8ac4"},"stato":{"editor":"enum","options":["da_confermare","confermata","rifiutata"],"default":"da_confermare"},"gestita":{"editor":"text","default":"da Elena, ieri"},"griglia":{"editor":"text","default":"1fr 1.5fr 1fr 130px 240px"},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":1000,"height":80}}'>
// Riproduzione 1:1 della riga di PRESENZE ISTRUTTORI: .sg-riga-presenza-istr + .sg-presenza-istr (src/styles.css
// righe 1596-1604) in src/components/segreteria/PresenzeIstruttori.tsx (righe 317-372). Griglia 1fr 1.5fr 1fr 130px
// 240px, gap 14px, alta almeno 64px, padding 8px 14px, filetto sotto 1px `surface-2`, barra a sinistra di 6px nel
// colore del corso (`--tinta`). Si legge riga per riga a fine mese: testo a 15-16px.
// Colonne: chi, il corso (16px 600) con giorno e ora (15px `sec`), chi era previsto, quando e come e' entrato
// (ora Saira + "ha fatto l'appello" / "tablet X" / "col PIN", 15px `dim`), e le azioni di riga a destra.
// stato da_confermare: i due tasti CONFERMA (.sg-btn-verde) e RIFIUTA (.sg-btn-linea), da Bottone.
// confermata / rifiutata: la parola in Saira 15px 700 0.12em (verde-testo / rosso-testo), chi e quando sotto, e il
// ripensamento a link (.sg-link a 15px, alto 44px, sottolineato): "Rifiuta" su una confermata e viceversa.
// Una rifiutata ha tutto spento (opacita' 0.5) tranne la colonna delle azioni (data-spento).
// gestita: il testo sotto la parola ("da Elena, ieri"); vuoto con stato da_confermare. La testata e' TestataTabella
// con griglia uguale e grande acceso.
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', surface2: '#242424', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', rosso: '#e4292a', giallo: '#f4c31b', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suColore: '#121212', tasto: '#b8b8b2', menu: '#161616' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#121212', tasto: '#4a4a46', menu: '#ebebe7' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
const stato = p.stato || 'da_confermare';
    const conf = stato === 'confermata';
    const daConfermare = stato === 'da_confermare';
    return {
      c, tema: p.tema || 'scuro',
      nome: p.nome ?? '', corso: p.corso ?? '', quando: p.quando ?? '', previsti: p.previsti || 'nessuno',
      entrata: p.entrata ?? '', come: p.come ?? '', tinta: p.tinta || c.line,
      griglia: p.griglia || '1fr 1.5fr 1fr 130px 240px',
      opacita: stato === 'rifiutata' ? '0.5' : '1',
      daConfermare,
      gestita: !daConfermare,
      parolaStato: conf ? 'CONFERMATA' : 'RIFIUTATA',
      coloreStato: conf ? c.verdeTesto : c.rossoTesto,
      dettoGestita: p.gestita ?? '',
      ripensa: conf ? 'Rifiuta' : 'Conferma',
    };
  }
}
</script>
</body>
</html>
