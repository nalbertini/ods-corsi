<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
<div role="row" style="display: grid; grid-template-columns: {{griglia}}; gap: 14px; align-items: center; width: 100%; min-height: 50px; padding: 0 14px; border-bottom: 1px solid {{c.surface2}}; background: {{sfondo}}; outline: {{contorno}}; outline-offset: -2px; color: {{colore}}; text-align: left">
  <span style="padding: 6px 0; font-size: 15px; font-weight: 600">{{nome}}<sc-if value="{{stesso}}" hint-placeholder-val="{{ false }}"> <span style="display: inline-block; vertical-align: middle"><dc-import name="Badge" tipo="tag" tono="giallo" label="STESSO TELEFONO" tema="{{tema}}" hint-size="120px,20px"></dc-import></span></sc-if><sc-if value="{{haArrivo}}" hint-placeholder-val="{{ true }}"><span style="display: block; font-size: 12px; font-weight: 400; color: {{c.dim}}">{{arrivo}}</span></sc-if></span>
  <span style="font-size: 13px">{{capi}}</span>
  <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 13px">{{telefono}}</span>
  <span><dc-import name="Badge" tipo="segno" tono="{{tono}}" label="{{parola}}" tema="{{tema}}" hint-size="110px,24px"></dc-import></span>
  <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; text-align: right">{{totale}}<sc-if value="{{haResto}}" hint-placeholder-val="{{ false }}"><span style="display: block; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; color: {{c.rossoTesto}}">{{resto}}</span></sc-if></span>
</div>
</x-dc>
<script data-dc-script data-props='{"nome":{"editor":"text","default":"Rossi Paola"},"capi":{"editor":"text","default":"Luca: judogi 130 · Sara: costumino 8, felpa 8"},"telefono":{"editor":"text","default":"333 123 4567"},"stato":{"editor":"enum","options":["da saldare","saldato","annullato"],"default":"da saldare"},"totale":{"editor":"text","default":"93 €"},"arrivo":{"editor":"text","default":"Arrivato il 3 ottobre, 18:20 · dal link"},"stessoTelefono":{"editor":"boolean","default":false},"resto":{"editor":"text","default":""},"scelta":{"editor":"boolean","default":false},"griglia":{"editor":"text","default":"1fr 1.6fr 130px 130px 70px"},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":900,"height":56}}'>
// Riproduzione 1:1 della riga della tabella degli ordini in VESTIARIO: src/components/segreteria/Vestiario.tsx (righe 290-321) con
// .sg-riga-iscritto, .sg-iscritto e .sg-riga-vestiario di src/styles.css (righe 1656, 1697-1706, 2132 e 2152). Griglia da 1001px
// 1fr 1.6fr 130px 130px 70px, gap 14px, alta almeno 50px, padding 0 14px, filetto 1px `surface-2`. Chi ordina («cognome nome») 15px 600;
// i capi per nome di battesimo 13px; il telefono .num 13px; lo stato e' `Segno` (.sg-segno-regola, qui Badge tipo segno): DA SALDARE
// rosso, SALDATO verde, ANNULLATO spento; il totale .num 15px 700 a destra. Testo in `text`.
// Sotto il nome l'arrivo (.sg-vestiario-arrivo, riga 2159: 12px 400 `dim`, «Arrivato il 3 ottobre, 18:20 · dal link» o «· dal banco»);
// stessoTelefono: accanto al nome il .sg-tag giallo (data-tipo presto) STESSO TELEFONO, quando nella raccolta c'e' un altro ordine col
// suo telefono (`stessoTelefono` di src/lib/vestiario.ts). resto: chi ha pagato una parte e non e' saldato, sotto il totale
// (.sg-vestiario-manca, riga 2160: 12px 600 rosso-testo) «mancano 7 €». Non c'e' un «da rendere»: un ordine saldato corretto al ribasso
// resta saldato.
// annullato: la riga NON e' trasparente (come la riga spenta di ISCRITTI), il testo passa a `dim` (data-spento, riga 2152): si legge ancora.
// scelta: fondo `surface-2` e contorno 2px `text` (passaggio del mouse: fondo `surface`, non riprodotto). La testata e' TestataTabella con
// colonne CHI ORDINA|CAPI|TELEFONO|STATO|TOTALE e la stessa griglia. Sotto i 1000px la griglia e' quella di .sg-riga-iscritto
// (1fr auto 70px): non riprodotto.
const T = {
  scuro: { surface2: '#242424', text: '#f2f2f0', dim: '#8c8c88', rossoTesto: '#ff5a52' },
  chiaro: { surface2: '#e9e9e5', text: '#161616', dim: '#656561', rossoTesto: '#b81d1d' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const SEGNO = { 'da saldare': ['DA SALDARE', 'rosso'], saldato: ['SALDATO', 'verde'], annullato: ['ANNULLATO', 'spento'] };
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const stato = SEGNO[p.stato] ? p.stato : 'da saldare';
    const scelta = truthy(p.scelta);
    return {
      c, cond: COND, tema: p.tema || 'scuro',
      nome: p.nome ?? 'Rossi Paola', capi: p.capi ?? 'Luca: judogi 130 · Sara: costumino 8, felpa 8',
      telefono: p.telefono ?? '333 123 4567', totale: p.totale ?? '93 €',
      parola: SEGNO[stato][0], tono: SEGNO[stato][1],
      colore: stato === 'annullato' ? c.dim : c.text,
      sfondo: scelta ? c.surface2 : 'transparent',
      contorno: scelta ? '2px solid ' + c.text : 'none',
      arrivo: p.arrivo ?? 'Arrivato il 3 ottobre, 18:20 · dal link', haArrivo: (p.arrivo ?? 'x') !== '',
      stesso: truthy(p.stessoTelefono), resto: p.resto ?? '', haResto: (p.resto ?? '') !== '',
      griglia: p.griglia || '1fr 1.6fr 130px 130px 70px',
    };
  }
}
</script>
</body>
</html>
