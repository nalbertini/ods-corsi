<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div role="alert" style="display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 12px 14px; background: {{c.surface}}; border: 2px solid {{c.line}}; border-left: 6px solid {{bordoSx}}; font-family: {{corpoFam}}; font-size: 14px; line-height: 1.4; color: {{c.sec}}">
  <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.12em; color: {{c.gialloTesto}}"><span aria-hidden="true">! </span>{{titolo}}</span>
  <span>{{frase}}</span>
  <span style="font-size: 14px; color: {{c.dim}}">Mai orari vecchi: un corso archiviato, senza giorni o con tutte le ricorrenze finite non mostra orari vecchi.</span>
  <span style="display: flex; flex-wrap: wrap; gap: 8px"><span style="display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border: 2px solid {{bordoTasto}}; border-radius: {{raggio}}; color: {{c.sec}}; font-size: {{corpoTasto}}; font-weight: {{pesoTasto}}">{{tasto}}</span></span>
</div>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"Judo adulti non ha giorni"},"frase":{"editor":"text","default":"Il sito non mostra l’orario di questo corso. Aggiungi i giorni in CORSI."},"tasto":{"editor":"text","default":"Apri il corso in CORSI ›"},"$preview":{"width":520,"height":190}}'>
// Riproduzione 1:1 di .avviso-rete / .avviso-rete-titolo (src/styles.css righe 526-527; look sito riga 460) come lo usa OrarioSito.tsx
// sopra il campo dei corsi: role="alert", titolo in MAIUSCOLO col «! » (aria-hidden) davanti, 14px 700 0.12em `giallo-testo`; poi la frase
// (avvisoSenzaOrari di src/lib/sitoOrario.ts), la riga fissa «Mai orari vecchi…» in .sg-sotto e i tasti .sg-btn.sg-btn-linea (48px, bordo 2px)
// «Apri il corso in CORSI ›» (un corso solo) o «Apri «nome» in CORSI ›», e «Apri l'elenco di CORSI ›» per gli archiviati.
// Fondo `surface`, bordo 2px `line`, filo a sinistra 6px (`giallo`; nel look sito `giallo-testo`), padding 12px 14px, gap 4px, quadrato.
const T = {
  sito: { surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', sec: '#0d2a3d', dim: '#46606f', blu: '#14709f', giallo: '#f4c31b', gialloTesto: '#8f6a00' },
};
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const BODY = "Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif";
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
        return {
      c, corpoFam: INTER, titolo: (p.titolo ?? '').toUpperCase(), frase: p.frase ?? '', tasto: p.tasto ?? '',
      bordoSx: c.gialloTesto, bordoTasto: c.text, raggio: '6px',
      corpoTasto: '16px', pesoTasto: 600,
    };
  }
}
</script>
</body>
</html>
