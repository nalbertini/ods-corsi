<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; background: {{c.surface}}; border: 2px solid {{c.line}}; color: {{c.text}}">
  <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; width: 22px; text-align: center; color: {{coloreSegno}}">
    <sc-if value="{{icone}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: block"><path d="{{ic.d}}"></path><path d="{{ic.d2}}"></path></svg></sc-if>
    <sc-if value="{{senzaIcone}}" hint-placeholder-val="{{ true }}">{{segno}}</sc-if></span>
  <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 1px; min-width: 0">
    <span style="font-weight: 600">{{corso}}</span>
    <span style="font-size: 13px; color: {{c.dim}}">{{quando}}</span>
  </span>
  <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: {{coloreSegno}}">{{detto}}</span>
    <sc-if value="{{haSegnalata}}" hint-placeholder-val="{{ false }}">
      <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; white-space: nowrap; color: {{coloreSegnalata}}">{{segnalata}}</span>
    </sc-if>
    <sc-if value="{{puoSegnalare}}" hint-placeholder-val="{{ false }}">
      <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 6px 10px; border: 2px solid {{c.blu}}; background: {{c.surface}}; color: {{c.text}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; letter-spacing: 0.12em">SEGNALA</span>
    </sc-if>
  </span>
</div>
</x-dc>
<script data-dc-script data-props='{"corso":{"editor":"text","default":"Judo kids"},"quando":{"editor":"text","default":"Lunedì 5 ottobre · 17:30"},"stato":{"editor":"enum","options":["presente","assente","giustificato","niente"],"default":"presente"},"soloTasto":{"editor":"boolean","default":false},"icone":{"editor":"boolean","default":false},"segnalata":{"editor":"enum","options":["no","da-confermare","rifiutata"],"default":"no"},"$preview":{"width":360,"height":80}}'>
// Riproduzione 1:1 della riga delle presenze nell'area iscritti: <li className="mia-presenza-voce"> con .mia-presenza in
// src/components/AreaIscritti.tsx (righe 366-399) e src/styles.css (righe 792-807, 797-800). Nell'app le righe stanno in un
// unico riquadro (.mie-presenze, padding 4px 14px) separate da un filo; qui una riga col suo riquadro.
// - stato: presente = segno ✓ e PRESENTE in verde; assente = ✗ e ASSENTE in rosso-testo; giustificato = – e niente = · (NON SEGNATO), spenti in `faint`.
// - segnalata: una segnalazione gia' fatta (DA CONFERMARE in giallo-testo, RIFIUTATA in rosso-testo): sostituisce il tasto.
// - Il tasto SEGNALA (.mia-segnala, 44px, bordo blu) c'e' solo dove non risulta presente ne' giustificato e non c'e' gia' una segnalazione.
const T = {
  // L'area iscritti ha il look del sito (lookDellArea): sempre chiara, coi token di :root[data-look='sito'].
  sito: { surface: '#ffffff', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f', faint: '#46606f', verde: '#12913f', gialloTesto: '#8f6a00', rossoTesto: '#b81d1d', blu: '#14709f' },
};
// COSTRUITA (`../lezioni-icone/`) `icone`: il segno ✓ ✗ – · diventa un cerchio a linea (22px, tratto 2) con dentro
// la spunta, la croce, il trattino o niente (tratteggiato); le parole PRESENTE, ASSENTE... restano.
const CERCHIO = 'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z';
const ICONE = { presente: [CERCHIO, 'M8 12.5l3 3l5-6'], assente: [CERCHIO, 'M9 9l6 6M15 9l-6 6'], giustificato: [CERCHIO, 'M8.5 12h7'], niente: ['M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z', ''] };
const SEGNI = { presente: ['✓', 'PRESENTE'], assente: ['✗', 'ASSENTE'], giustificato: ['–', 'GIUSTIFICATO'], niente: ['·', 'NON SEGNATO'] };
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
    const stato = SEGNI[p.stato] ? p.stato : 'presente';
    const segn = p.segnalata === 'da-confermare' || p.segnalata === 'rifiutata' ? p.segnalata : 'no';
    const icone = p.icone === true || p.icone === 'true';
    const [d, d2] = ICONE[stato];
    return {
      icone,
      senzaIcone: !icone,
      ic: { d, d2 },
      c,
      corso: p.corso ?? 'Judo kids',
      quando: p.quando ?? 'Lunedì 5 ottobre · 17:30',
      segno: SEGNI[stato][0],
      detto: (p.soloTasto === true || p.soloTasto === 'true') && stato === 'niente' ? '' : SEGNI[stato][1], // soloTasto: la riga non segnata mostra solo SEGNALA
      coloreSegno: stato === 'presente' ? c.verde : stato === 'assente' ? c.rossoTesto : c.faint,
      haSegnalata: segn !== 'no',
      segnalata: segn === 'rifiutata' ? 'RIFIUTATA' : 'DA CONFERMARE',
      coloreSegnalata: segn === 'rifiutata' ? c.rossoTesto : c.gialloTesto,
      puoSegnalare: segn === 'no' && stato !== 'presente' && stato !== 'giustificato',
    };
  }
}
</script>
</body>
</html>
