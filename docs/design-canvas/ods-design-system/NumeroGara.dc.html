<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; padding: 10px 14px; background: #ffffff">
  <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #46606f">{{etichetta}}</span>
  <span style="font-size: 20px; font-weight: 700; color: {{colore}}">{{valore}}<span style="font-size: 13px; font-weight: 500; color: #46606f">{{sotto}}</span></span>
</div>
</x-dc>
<script data-dc-script data-props='{"etichetta":{"editor":"text","default":"DA INCASSARE (30 € A TESTA)"},"valore":{"editor":"text","default":"90 €"},"sotto":{"editor":"text","default":""},"tono":{"editor":"enum","options":["neutro","manca","fatto"],"default":"manca"},"$preview":{"width":200,"height":64}}'>
// COSTRUITO (src/components/segreteria/Gare.tsx, `NumeroGara`; stile `.sg-gara-numero` in src/segreteria.css): un numero della striscia in
// testa alla scheda di una gara, nel look del sito. Fondo `surface`, padding 10px 14px; etichetta 11px 700 con spaziatura 0.14em `sec`;
// cifra 20px 700, `rosso-testo` (manca) o `verde-testo` (fatto), `testo` se neutro; `sotto` e' il «su 5» 13px 500 `sec`. Quattro in
// `.sg-gara-numeri`: griglia `auto-fit` da 150px minimo, gap 2px su fondo `line-soft` (i filetti): ATLETI; CERTIFICATO A POSTO «x su n»;
// DA INCASSARE (X A TESTA) e INCASSATO solo se la gara ha una quota e non e' annullata (manca se resta da pagare, fatto se c'e' un incasso).
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const tono = p.tono || 'neutro';
    return {
      etichetta: p.etichetta ?? '', valore: p.valore ?? '', sotto: p.sotto ? ` ${p.sotto}` : '',
      colore: tono === 'manca' ? '#b81d1d' : tono === 'fatto' ? '#0b7a33' : '#0d2a3d',
    };
  }
}
</script>
</body>
</html>
