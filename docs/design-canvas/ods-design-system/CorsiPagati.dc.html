<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<ul style="display: flex; flex-direction: column; gap: 2px; width: 100%; margin: 0; padding: 0; list-style: none; font-size: 13px; color: #0d2a3d">
  <sc-for list="{{righe}}" as="r" hint-placeholder-count="2">
    <li style="color: {{r.colore}}; font-weight: {{r.peso}}">{{r.testo}}</li>
  </sc-for>
</ul>
</x-dc>
<script data-dc-script data-props='{"righe":{"editor":"text","default":"Judo 3: pagato fino al 31 dicembre 2026:sec|Pilates: valeva fino al 30 novembre 2026:dim"},"$preview":{"width":480,"height":60}}'>
// I corsi pagati sotto la QUOTA nella scheda iscritto (`Pagamento` di src/components/segreteria/Iscritti.tsx, righe 1801-1809),
// tema sito: elenco senza punti, gap 2px, 13px `sec`; un corso pagato «pagato fino al …», uno passato «valeva fino al …» in `dim`.
// righe: «testo:tono» separate da |; tono sec, dim, rosso (rosso-testo 600) o giallo (giallo-testo 600).
// rosso e giallo (`testoCorso` di src/lib/corsiDaPagare.ts, costruito da `../corsi-da-pagare/`): il corso scaduto o pagato in parte di chi e' ancora iscritto.
// Sopra l'elenco l'etichetta CORSI (13px 700 0.12em `dim`); sotto un corso scaduto il consiglio «Una ricevuta nuova con «Trimestre …» lo rimette a posto» (14px `dim`).
const TONI = { sec: ['#0d2a3d', 400], dim: ['#46606f', 400], rosso: ['#b81d1d', 600], giallo: ['#8f6a00', 600] };
class Component extends DCLogic {
  renderVals() {
    const righe = String(this.props.righe ?? '').split('|').map((s) => s.trim()).filter(Boolean).map((s) => {
      const i = s.lastIndexOf(':');
      const [colore, peso] = TONI[s.slice(i + 1).trim()] || TONI.sec;
      return { testo: s.slice(0, i), colore, peso };
    });
    return { righe };
  }
}
</script>
</body>
</html>
