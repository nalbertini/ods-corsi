<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 86px; padding: 13px 15px; background: {{c.surface}}; border: 2px solid {{c.line}}; color: {{c.text}}">
  <span style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0">
    <span style="display: flex; align-items: center; gap: 8px"><span style="padding: 3px 9px; background: {{tinta}}; color: #0d2a3d; font-size: 10px; font-weight: 700; letter-spacing: 0.16em">{{tipo}}</span><span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; color: {{c.dim}}">{{durata}}</span></span>
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 21px; font-weight: 700; letter-spacing: 0.03em; line-height: 1.05">{{nomeMaiuscolo}}</span>
    <sc-if value="{{nota}}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; color: {{c.dim}}">{{nota}}</span></sc-if>
  </span>
  <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 52px; height: 52px; border: 2px solid {{tinta}}; color: {{tinta}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 21 12 6 21 6 3"></polygon></svg></span>
</div>
</x-dc>
<script data-dc-script data-props='{"tipo":{"editor":"text","default":"TABATA"},"durata":{"editor":"text","default":"4 MIN"},"nome":{"editor":"text","default":"Tabata brucia grassi"},"nota":{"editor":"text","default":""},"tinta":{"editor":"text","default":"#e4292a"},"$preview":{"width":350,"height":86}}'>
// La riga di un timer nell'elenco della pagina TIMER: la stessa di TimerPagina (timer/design/Home.dc.html), da sola, per le sezioni
// che TimerPagina non ha (I TUOI TIMER, LE COPIE). tipo: 10px 0.16em su fondo `tinta`; durata Saira 14px; nome in maiuscolo (.ob 21px);
// nota: riga dim opzionale (es. «Copia di Tabata della palestra»); tasto ▶ 52px col bordo e il segno della tinta.
const T = {
  sito: { surface: '#ffffff', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { c: T.sito, tipo: p.tipo ?? 'TABATA', durata: p.durata ?? '4 MIN', nomeMaiuscolo: String(p.nome ?? 'Tabata brucia grassi').toUpperCase(), nota: p.nota ?? '', tinta: p.tinta || '#e4292a' };
  }
}
</script>
</body>
</html>
