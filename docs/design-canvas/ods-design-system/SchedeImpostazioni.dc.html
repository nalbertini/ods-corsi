<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Big+Shoulders+Display:wght@800&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div role="tablist" aria-label="Gruppi delle impostazioni" style="display: flex; flex-wrap: wrap; gap: 4px; width: {{larghezza}}; max-width: 100%">
  <sc-for list="{{schede}}" as="x" hint-placeholder-count="7">
    <span role="tab" aria-selected="{{x.selezionata}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; white-space: nowrap; background: {{x.sfondo}}; border: 2px solid {{x.bordo}}; font-family: {{carattere}}; font-size: 14px; font-weight: 700; letter-spacing: 0.18em; color: {{x.colore}}">{{x.nome}}</span>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"acceso":{"editor":"enum","options":["LA STAGIONE","LE SALE E I TABLET","LE RICEVUTE","GLI AVVISI","DATI E PRIVACY","IMPORTA","QUESTO COMPUTER"],"default":"LA STAGIONE"},"telefono":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro","sito"],"default":"sito","section":"Tema"},"$preview":{"width":1100,"height":50}}'>
// COSTRUITA (`../impostazioni-riordino/`, proposta B): le sette schede in cima a IMPOSTAZIONI (`Regole` in
// src/components/segreteria/Regole.tsx, nomi e ordine da `SCHEDE_IMPOSTAZIONI` di src/lib/schedeImpostazioni.ts).
// Stesso pattern di SchedeIscritto (.schede / .scheda / .sg-schede di styles.css): alte 44px, raggio 0, bordo 2px,
// 14px 700 0.18em, quella accesa con fondo `surface-2`, bordo e testo `text`. In piu' `.sg-schede-impostazioni`
// le manda a capo (flex-wrap): sette non stanno in una riga del telefono. Si apre LA STAGIONE; QUESTO COMPUTER e' l'ultima.
// `telefono` stringe la larghezza a 358px per far vedere l'andata a capo.
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', line: '#333333', text: '#f2f2f0', dim: '#8c8c88' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', dim: '#656561' },
  // Il look del sito (src/styles.css, `:root[data-look='sito']`): .scheda prende --cond = Big Shoulders Display.
  sito: { surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f' },
};
const NOMI = ['LA STAGIONE', 'LE SALE E I TABLET', 'LE RICEVUTE', 'GLI AVVISI', 'DATI E PRIVACY', 'IMPORTA', 'QUESTO COMPUTER'];
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.sito;
    const acceso = p.acceso || 'LA STAGIONE';
    const schede = NOMI.map((nome) => {
      const on = nome === acceso;
      return { nome, selezionata: on ? 'true' : 'false', sfondo: on ? c.surface2 : c.surface, bordo: on ? c.text : c.line, colore: on ? c.text : c.dim };
    });
    return {
      schede,
      larghezza: p.telefono === true || p.telefono === 'true' ? '358px' : '100%',
      carattere: p.tema === 'scuro' || p.tema === 'chiaro' ? "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif" : "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif",
    };
  }
}
</script>
</body>
</html>
