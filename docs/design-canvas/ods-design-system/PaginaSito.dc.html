<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Tavola modello, schermo largo, della SEGRETERIA nel look del sito (`<html data-look="sito">`, `aspettoSegreteria.ts`): menu inchiostro di 240px con le icone e i cinque
     gruppi + corpo su fondo azzurro #eef5fa. Qui il corpo e' DA FARE: titolo (`.sg-titolo`, Big Shoulders 800 34px), frase sotto, la striscia COSA MANCA a cinque caselle e le righe;
     solo la prima ha il tasto giallo (uno per schermata). Una schermata nuova della segreteria si fa copiando questo file e sostituendo il contenuto di <main>:
     margine di .sg-corpo (36px ai lati, 28px in alto e in basso, 18px fra i blocchi). -->
<div style="display: flex; width: 1440px; min-height: 1000px; background: #eef5fa">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" attiva="DA FARE" numeri="RICHIESTE ONLINE:3, PRESENZE ISTRUTTORI:2" nome="Marco Rossi" ruolo="Segreteria" altezza="1000px" hint-size="240px,1000px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">DA FARE</h1>
      <span style="font-size: 14px; color: #46606f">domenica 18 ottobre 2026. Quello che aspetta la segreteria: si riconta ogni volta che torni qui.</span>
    </div>
    <dc-import name="CosaManca" voci="14|Appelli non fatti||r; 5|Certificati scaduti||r; 7|Pagamenti||r; 0|Senza tessera||v; 3|Richieste online||g" hint-size="100%,72px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <dc-import name="RigaDaFare" livello="blocca" n="14" titolo="Lezioni senza appello" sotto="Negli ultimi 30 giorni: passate, e nessuno ha segnato. Si apre la lezione e si fa l’appello, o si annulla se non c’è stata." tasto="Vedi tutti" hint-size="100%,100px"></dc-import>
      <dc-import name="RigaDaFare" livello="blocca" n="5" titolo="Iscritti senza certificato valido" sotto="Il certificato medico manca o è scaduto: senza, in sala non si entra." tasto="Vedi tutti" hint-size="100%,96px"></dc-import>
      <dc-import name="RigaDaFare" livello="blocca" n="7" titolo="Iscritti da pagare" sotto="La quota non è in regola." tasto="Vedi tutti" hint-size="100%,96px"></dc-import>
      <div style="padding-top: 6px"></div>
      <dc-import name="RigaDaFare" livello="presto" n="3" titolo="Richieste online nuove" sotto="Da accogliere: aspettano una risposta, ma non bloccano niente." tasto="Vedi tutti" hint-size="100%,96px"></dc-import>
      <dc-import name="RigaDaFare" livello="presto" n="2" titolo="Presenze istruttori da confermare" sotto="Gli istruttori hanno segnato la loro presenza: da confermare." tasto="Vedi tutti" hint-size="100%,96px"></dc-import>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
