<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<span style="display: inline-flex; align-items: center; min-height: {{alto}}; padding: {{padding}}; background: {{sfondo}}; border: 2px solid {{bordo}}; border-left: {{sinistro}}; color: {{colore}}; font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; white-space: nowrap">{{label}}</span>
</x-dc>
<script data-dc-script data-props='{"label":{"editor":"text","default":"JUDO KIDS"},"tipo":{"editor":"enum","options":["corso","tasto"],"default":"corso"},"acceso":{"editor":"boolean","default":false},"tinta":{"editor":"text","default":"#1b8ac4"},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":140,"height":40}}'>
// Riproduzione 1:1 di .mia-chip e .mia-chip-tasto (src/styles.css righe 770-773 e 783-784), usati in AreaIscritti.tsx (righe 111-117 e 197-205):
// tipo corso = il corso di chi guarda la pagina (Saira 12px 700 0.08em, padding 4px 8px, bordo 2px `line`, a sinistra 5px della `tinta` del corso, fondo `surface`);
// tipo tasto = «di chi vedi la pagina» (TU, il nome di chi e' nel nucleo): 36px, padding 6px 12px, testo `dim`, bordo sinistro 2px; acceso = bordo `text`, fondo `surface-2`, testo `text`.
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', surface2: '#242424', line: '#333333', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', faint: '#5a5a56', tasto: '#b8b8b2', tratteggio: '#4a4a46', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suColore: '#121212', suRosso: '#ffffff' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', sec: '#3d3d3a', dim: '#656561', faint: '#a8a8a3', tasto: '#4a4a46', tratteggio: '#b0b0aa', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#121212', suRosso: '#ffffff' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
const tasto = p.tipo === 'tasto', acceso = truthy(p.acceso);
    const tinta = p.tinta || '#1b8ac4';
    return {
      c, cond: COND, label: p.label ?? 'JUDO KIDS',
      alto: tasto ? '36px' : 'auto', padding: tasto ? '6px 12px' : '4px 8px',
      sfondo: tasto && acceso ? c.surface2 : c.surface,
      bordo: tasto && acceso ? c.text : c.line,
      sinistro: tasto ? '2px solid ' + (acceso ? c.text : c.line) : '5px solid ' + tinta,
      colore: tasto && !acceso ? c.dim : c.text,
    };
  }
}
</script>
</body>
</html>
