<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<header style="display: flex; align-items: center; gap: 18px; width: 100%; padding: 18px 32px 14px; border-bottom: 2px solid {{c.lineSoft}}; background: {{c.bg}}; color: {{c.text}}">
  <svg width="70" height="48" viewBox="0 0 160 110" role="img" aria-label="Officine Dello Sport">
    <g fill="none" stroke-width="9" stroke-dasharray="6 7.82">
      <circle cx="38" cy="40" r="22" stroke="#1b8ac4"></circle>
      <circle cx="80" cy="40" r="22" stroke="{{c.text}}"></circle>
      <circle cx="122" cy="40" r="22" stroke="#e4292a"></circle>
      <circle cx="59" cy="74" r="22" stroke="#f4c31b"></circle>
      <circle cx="101" cy="74" r="22" stroke="#16a54a"></circle>
    </g>
    <g fill="none" stroke-width="5">
      <circle cx="38" cy="40" r="14" stroke="#1b8ac4"></circle>
      <circle cx="80" cy="40" r="14" stroke="{{c.text}}"></circle>
      <circle cx="122" cy="40" r="14" stroke="#e4292a"></circle>
      <circle cx="59" cy="74" r="14" stroke="#f4c31b"></circle>
      <circle cx="101" cy="74" r="14" stroke="#16a54a"></circle>
    </g>
  </svg>
  <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 40px; font-weight: 700; letter-spacing: 0.04em; line-height: 1">{{sala}}</span>
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; letter-spacing: 0.2em; color: {{c.dim}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{data}}</span>
  </div>
  <span style="flex-shrink: 0; padding: 6px 12px; background: #14709f; color: {{c.suColore}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; letter-spacing: 0.16em; white-space: nowrap">AREA ISTRUTTORE · <span style="letter-spacing: 0">{{chi}}</span></span>
  <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: 0.02em">{{ora}}</span>
  <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 60px; height: 60px; border: 2px solid {{c.line}}; color: {{c.tasto}}" aria-label="Esci dal tablet">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"></path><path d="M18.4 6.6a9 9 0 1 1-12.8 0"></path></svg>
  </span>
</header>
</x-dc>
<script data-dc-script data-props='{"sala":{"editor":"text","default":"SALA LOTTA"},"data":{"editor":"text","default":"LUNEDÌ 5 OTTOBRE · OFFICINE DELLO SPORT"},"ora":{"editor":"text","default":"17:10"},"chi":{"editor":"text","default":"Maurizio"},"$preview":{"width":1280,"height":92}}'>
// TabletTestata con il bollino blu AREA ISTRUTTORE · <nome> che l'app aggiunge dopo il PIN (Tablet.tsx righe 442-446, .tb-bollino:
// 14px, 0.16em, scritta `su-colore` su fondo --blu, padding 6px 12px; il nome senza spaziatura). prop chi: il nome del PIN.
// Riproduzione 1:1 della testata del tablet di sala: <header className="tb-testata"> in src/components/tablet/Tablet.tsx
// (riga 427) con .tb-testata, .tb-sala, .tb-data, .tb-ora in src/styles.css (righe 815-823). E' il tablet in
// orizzontale: marchio 70px, nome della sala 40px, data a 0.2em, ora da 56px. Non copre il
// A destra il tasto di accensione: ESCI DAL TABLET (col PIN di un istruttore e una conferma), .icon-btn in Tablet.tsx. Non riproduce
// il timer in corso (bordo da 8px nel suo colore, .tb-chip) ne' la spia IN ATTESA DI RETE: stati dinamici.
// Tasti da 60px con icone da 28 (.tb-testata .icon-btn).
const T = {
  sito: { bg: '#eef5fa', lineSoft: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f', tasto: '#0d2a3d', suColore: '#0d2a3d' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      c: T.sito,
      sala: p.sala ?? 'SALA LOTTA',
      data: p.data ?? 'LUNEDÌ 5 OTTOBRE · OFFICINE DELLO SPORT',
      ora: p.ora ?? '17:10',
      chi: p.chi ?? 'Maurizio',
    };
  }
}
</script>
</body>
</html>
