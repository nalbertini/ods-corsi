<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Il sito pubblico usa Big Shoulders Display e Inter (src/lib/sitoGenera.ts); qui il canvas li prende da Google Fonts, come per Saira e Barlow. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="position: relative; display: flex; flex-direction: column; height: 100%; min-height: {{minimo}}; background: {{bg}}; color: {{fg}}; border-radius: 6px; overflow: hidden">
  <sc-if value="{{haFoto}}" hint-placeholder-val="{{ true }}"><div style="height: {{alta}}; flex: none; overflow: hidden"><img src="{{foto}}" alt="{{alt}}" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: {{fuoco}}"></div></sc-if>
  <sc-if value="{{senzaFoto}}" hint-placeholder-val="{{ false }}"><div style="height: {{altaVuota}}; flex: none; background: {{fascia}}; display: flex; align-items: center; justify-content: center; overflow: hidden"><span aria-hidden="true" style="font-family: {{big}}; font-weight: 800; font-size: {{corpoLettera}}; line-height: 1; color: {{lettera}}">{{iniziale}}</span></div></sc-if>
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; padding: {{pad}}">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-family: {{big}}; text-transform: uppercase; font-weight: 800; font-size: {{corpoTitolo}}; line-height: .95; min-height: {{altoTitolo}}; padding-right: 56px">{{titolo}}</div>
      <div style="font-family: {{inter}}; font-size: 16px; line-height: 1.45"><b>{{eta}}</b><br>{{testo}}</div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{tag}}" as="t" hint-placeholder-count="3"><span style="display: inline-flex; align-items: center; gap: 6px; min-height: 32px; background: #cfe6f4; color: #0d2a3d; border-radius: 999px; padding: 6px 12px 6px 8px; font-family: {{inter}}; font-size: 14px; font-weight: 600; line-height: 1"><svg width="20" height="20" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" style="display: block; flex: none"><path d="{{t.d}}"/></svg>{{t.nome}}</span></sc-for>
    </div>
  </div>
  <span aria-hidden="true" style="position: absolute; top: {{topFreccia}}; right: 16px; width: 48px; height: 48px; border-radius: 50%; background: #ffffff; color: #0d2a3d; display: flex; align-items: center; justify-content: center; font-family: {{inter}}; font-size: 24px; font-weight: 600; line-height: 1">↗</span>
</div>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"Judo"},"eta":{"editor":"text","default":"Dai 7 anni agli adulti"},"testo":{"editor":"text","default":"Tecnica, disciplina e rispetto per crescere sul tatami, dai primi passi fino alle gare."},"tag":{"editor":"text","default":"Bambini|Adulti|Agonisti"},"tono":{"editor":"enum","options":["blu","giallo","inchiostro","chiara","bianco"],"default":"blu"},"foto":{"editor":"text","default":""},"fuoco":{"editor":"text","default":"50% 40%"},"fuocoTel":{"editor":"text","default":""},"alt":{"editor":"text","default":""},"alta":{"editor":"text","default":"200px"},"piccolo":{"editor":"boolean","default":false},"$preview":{"width":440,"height":560}}'>
// PROPOSTA home del sito: la scheda corso con foto in cima e freccia (oggi a desktop e' un blocco di colore senza foto ne' freccia, solo sul telefono ha entrambe).
// Senza foto (corsi che non ne hanno ancora una) la fascia e' azzurra (#cfe6f4) con l'iniziale del corso in blu, senza testo che serva a capire: la scheda ha sempre la stessa forma.
// Il fuoco della foto (object-position) viene da proposte-home/gravity/REPORT.md e dalle foto scelte (proposte-home/alternative); fuocoTel e quello del telefono (piccolo). Freccia e scheda: bersaglio 48px. Pastiglie e icone: ICONE di Bambini, Adulti, Agonisti, Anziani (Phosphor, come il sito).
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
// Colori del sito (sito-rebrand/token-proposta.md, A2). Il testo sul blu e sull'inchiostro e' bianco (5,4:1 e 14,8:1); sul giallo e sul chiaro e' inchiostro.
const TONI = { blu: ['#14709f', '#ffffff'], giallo: ['#f4c31b', '#0d2a3d'], inchiostro: ['#0d2a3d', '#ffffff'], chiara: ['#cfe6f4', '#0d2a3d'], bianco: ['#ffffff', '#0d2a3d'] };
const truthy = (v) => v === true || v === 'true';
// [DA CONFERMARE]: un dato che manca resta col testo di oggi, ma ben marcato (contorno rosso tratteggiato + cartellino).
const segna = (nota) => ({ haNota: !!nota, nota: nota || '', contorno: nota ? '3px dashed #e4292a' : 'none' });
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const [bg, fg] = TONI[p.tono] || TONI.blu;
    const ICONE = {"Bambini":"M92,140a12,12,0,1,1,12-12A12,12,0,0,1,92,140Zm72-24a12,12,0,1,0,12,12A12,12,0,0,0,164,116Zm-12.27,45.23a45,45,0,0,1-47.46,0,8,8,0,0,0-8.54,13.54,61,61,0,0,0,64.54,0,8,8,0,0,0-8.54-13.54ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88.11,88.11,0,0,0-84.09-87.91C120.32,56.38,120,71.88,120,72a8,8,0,0,0,16,0,8,8,0,0,1,16,0,24,24,0,0,1-48,0c0-.73.13-14.3,8.46-30.63A88,88,0,1,0,216,128Z","Adulti":"M128,80A32,32,0,1,0,96,48,32,32,0,0,0,128,80Zm0-48a16,16,0,1,1-16,16A16,16,0,0,1,128,32ZM230.86,132.12a8,8,0,0,1-11,2.74c-.35-.21-35.11-20.59-83.88-22.67V149l62,69.73a8,8,0,1,1-12,10.62L128,164,70,229.31a8,8,0,1,1-12-10.62L120,149V112.18c-49,2.08-83.52,22.46-83.88,22.68a8,8,0,1,1-8.23-13.72C29.6,120.11,70.45,96,128,96s98.4,24.11,100.12,25.14A8,8,0,0,1,230.86,132.12Z","Agonisti":"M232,64H208V48a8,8,0,0,0-8-8H56a8,8,0,0,0-8,8V64H24A16,16,0,0,0,8,80V96a40,40,0,0,0,40,40h3.65A80.13,80.13,0,0,0,120,191.61V216H96a8,8,0,0,0,0,16h64a8,8,0,0,0,0-16H136V191.58c31.94-3.23,58.44-25.64,68.08-55.58H208a40,40,0,0,0,40-40V80A16,16,0,0,0,232,64ZM48,120A24,24,0,0,1,24,96V80H48v32q0,4,.39,8Zm144-8.9c0,35.52-29,64.64-64,64.9a64,64,0,0,1-64-64V56H192ZM232,96a24,24,0,0,1-24,24h-.5a81.81,81.81,0,0,0,.5-8.9V80h24Z","Anziani":"M128,80A32,32,0,1,0,96,48,32,32,0,0,0,128,80Zm0-48a16,16,0,1,1-16,16A16,16,0,0,1,128,32Zm96,72a8,8,0,0,1-8,8H136v26.72l51.15,21.93A8,8,0,0,1,192,168v48a8,8,0,0,1-16,0V173.28l-46.45-19.91L53.35,222a8,8,0,1,1-10.7-11.9L120,140.44V112H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,104Z"};
    const foto = p.foto || '';
    const pic = truthy(p.piccolo);
    const alta = p.alta || '200px';
    return {
      big: BIG, inter: INTER, bg, fg, foto, fuoco: (pic && p.fuocoTel) || p.fuoco || '50% 50%', alta, haFoto: foto !== '', senzaFoto: foto === '', altaVuota: pic ? '120px' : alta, corpoLettera: pic ? '80px' : '150px',
      fascia: '#cfe6f4', lettera: '#14709f',
      alt: p.alt || ('Foto del corso di ' + (p.titolo ?? '')), iniziale: String(p.titolo ?? 'J').charAt(0),
      titolo: p.titolo ?? '', eta: p.eta ?? '', testo: p.testo ?? '',
      tag: String(p.tag ?? '').split('|').filter(Boolean).map((nome) => ({ nome, d: ICONE[nome] || ICONE.Adulti })),
      pad: pic ? '20px' : '22px 24px 24px', corpoTitolo: pic ? '36px' : '44px', altoTitolo: pic ? '0' : '84px', minimo: pic ? '420px' : '500px',
      topFreccia: '16px',
    };
  }
}
</script>
</body>
</html>
