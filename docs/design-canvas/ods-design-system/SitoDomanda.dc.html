<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Il sito pubblico usa Big Shoulders Display e Inter (src/lib/sitoGenera.ts); qui il canvas li prende da Google Fonts, come per Saira e Barlow. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="position: relative; height: 100%; min-height: {{minimo}}; background: #cfe6f4; color: #0d2a3d; border-radius: 6px; padding: {{pad}}; outline: {{contorno}}; outline-offset: -3px">
  <div style="font-family: {{big}}; text-transform: uppercase; font-weight: 800; font-size: {{corpoDomanda}}; line-height: .95; margin-bottom: 14px">{{domanda}}</div>
  <div style="font-family: {{inter}}; font-size: 18px; line-height: 1.5">{{risposta}}</div>
  <sc-if value="{{haNota}}" hint-placeholder-val="{{ false }}"><div style="margin-top: 14px"><span style="display: inline-block; background: #ffffff; color: #0d2a3d; border: 2px solid #e4292a; border-radius: 4px; padding: 4px 8px; font-family: {{inter}}; font-size: 12px; font-weight: 700; line-height: 1.2">{{nota}}</span></div></sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"domanda":{"editor":"text","default":"Posso provare prima di iscrivermi?"},"risposta":{"editor":"text","default":"Sì: una settimana di prova a 5 €."},"piccolo":{"editor":"boolean","default":false},"nota":{"editor":"text","default":""},"$preview":{"width":440,"height":260}}'>
// PROPOSTA home del sito: una domanda delle FAQ (cinque invece di sei: la domanda sulla prova era doppia). Risposte di 22-32 parole, tutte della stessa lunghezza.
// Colori della tessera chiara del sito (#cfe6f4, inchiostro sopra).
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
// Colori del sito (sito-rebrand/token-proposta.md, A2). Il testo sul blu e sull'inchiostro e' bianco (5,4:1 e 14,8:1); sul giallo e sul chiaro e' inchiostro.
const TONI = { blu: ['#14709f', '#ffffff'], giallo: ['#f4c31b', '#0d2a3d'], inchiostro: ['#0d2a3d', '#ffffff'], chiara: ['#cfe6f4', '#0d2a3d'], bianco: ['#ffffff', '#0d2a3d'] };
const truthy = (v) => v === true || v === 'true';
// [DA CONFERMARE]: un dato che manca resta col testo di oggi, ma ben marcato (contorno rosso tratteggiato + cartellino).
const segna = (nota) => ({ haNota: !!nota, nota: nota || '', contorno: nota ? '3px dashed #e4292a' : 'none' });
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const pic = truthy(p.piccolo);
    return { big: BIG, inter: INTER, domanda: p.domanda ?? '', risposta: p.risposta ?? '', pad: pic ? '22px' : '28px 32px', corpoDomanda: pic ? '30px' : '34px', minimo: pic ? '200px' : '240px', ...segna(p.nota) };
  }
}
</script>
</body>
</html>
