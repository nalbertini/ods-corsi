<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il riquadro I NOMI NUOVI di Importa.tsx: `Riga` e, per ogni gruppo, `Elenco` (etichetta `.sg-etichetta`, 12px,
     0.18em, dim; nomi 14px `sec`, interlinea 1.5). gruppi: "Titolo|nome · nome;;Titolo|nome". -->
<div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; background: {{c.surface}}; border: 2px solid {{bordo}}; min-width: 0">
  <div style="display: flex; align-items: baseline; gap: 10px">
    <span style="font-family: {{cond}}; font-size: 14px; font-weight: 700; letter-spacing: 0.22em; color: {{c.dim}}">{{titolo}}</span>
    <div style="flex-grow: 1; height: 2px; background: {{c.lineSoft}}"></div>
  </div>
  <sc-for list="{{gruppi}}" as="g" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: {{cond}}; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: {{c.dim}}">{{g.titolo}}</span>
      <span style="font-size: 14px; line-height: 1.5; color: {{c.sec}}">{{g.nomi}}</span>
    </div>
  </sc-for>
  <span style="font-size: 14px; color: {{c.dim}}">{{nota}}</span>
</div>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"I NOMI NUOVI"},"gruppi":{"editor":"text","default":"Istruttori|Elena Marchi · Davide Conti;;Corsi|Judo 2 · Lotta adulti · Pilates 3"},"nota":{"editor":"text","default":""},"$preview":{"width":360,"height":260},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"}}'>
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', bg: '#121212', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', giallo: '#f4c31b', gialloTesto: '#f4c31b', verde: '#16a54a', verdeTesto: '#16a54a' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', bg: '#f4f4f1', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', giallo: '#f4c31b', gialloTesto: '#8f6a00', verde: '#12913f', verdeTesto: '#0b7a33' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const MONO = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const gruppi = String(p.gruppi ?? '').split(';;').filter(Boolean).map((s) => { const i = s.indexOf('|'); return { titolo: s.slice(0, i).toUpperCase(), nomi: s.slice(i + 1) }; });
    return { c, cond: COND, bordo: c.line, titolo: p.titolo ?? 'I NOMI NUOVI', gruppi, nota: p.nota ?? '' };
  }
}
</script>
</body>
</html>
