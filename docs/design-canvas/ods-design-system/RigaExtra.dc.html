<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div role="row" style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; min-height: 48px; margin-left: 16px; padding: 8px 0 8px 14px; border-left: 3px solid #cfe6f4; color: #0d2a3d; flex-direction: {{direzione}}">
  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 130px; flex: 0 1 240px">
    <dc-import name="Badge" tipo="segno" tono="neutro" label="EXTRA" hint-size="70px,26px"></dc-import>
    <span style="font-size: 14px; line-height: 1.35; overflow-wrap: anywhere">{{descrizione}}</span>
  </div>
  <span style="font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 90px">{{importo}}</span>
  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; flex: 1; min-width: 200px">
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <dc-import name="Badge" tipo="segno" tono="{{tono}}" label="{{segno}}" hint-size="160px,26px"></dc-import>
      <sc-if value="{{daRiportare}}" hint-placeholder-val="{{ false }}"><dc-import name="Badge" tipo="segno" tono="giallo" label="DA RIPORTARE FIRMATA" hint-size="210px,26px"></dc-import></sc-if>
    </div>
    <span style="font-size: 13px; color: #46606f; line-height: 1.35">{{nota}}</span>
  </div>
  <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; flex: 0 1 280px">
    <span role="checkbox" aria-checked="{{firmata}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 2px solid #0d2a3d; border-radius: 4px; background: {{fondoSpunta}}; color: #ffffff; font-size: 16px; font-weight: 700">{{segnoSpunta}}</span>Firmata</span>
    <dc-import name="Bottone" label="Ristampa" variante="linea" contesto="segreteria" hint-size="110px,44px"></dc-import>
    <sc-if value="{{nonPagata}}" hint-placeholder-val="{{ true }}"><dc-import name="Bottone" label="Segna pagato" variante="linea" contesto="segreteria" hint-size="140px,44px"></dc-import></sc-if>
    <sc-if value="{{nonPagata}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-basis: 100%; gap: 10px; justify-content: flex-end">
        <dc-import name="Bottone" label="Modifica" variante="linea" contesto="segreteria" hint-size="110px,44px"></dc-import>
        <dc-import name="Bottone" label="Annulla" variante="pericolo" contesto="segreteria" hint-size="100px,44px"></dc-import>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"descrizione":{"editor":"text","default":"Stage di judo del 18 ottobre"},"importo":{"editor":"text","default":"150,00 €"},"stato":{"editor":"enum","options":["da-pagare","pagata"],"default":"da-pagare"},"firmata":{"editor":"boolean","default":true},"nota":{"editor":"text","default":""},"telefono":{"editor":"boolean","default":false},"$preview":{"width":1100,"height":110}}'>
// Una ricevuta di compenso EXTRA sotto la riga del suo tecnico in COMPENSI (costruita da docs/design-canvas/compenso-extra; valori di RigaExtra in Compensi.tsx).
// Rientrata di 16px col filetto a sinistra che la lega al tecnico sopra; il segno EXTRA la dice a parole. Niente lezioni ne' ore: per cosa e importo.
// stato: da-pagare (FATTA · DA PAGARE, Ristampa, Segna pagato e, su una riga loro, Modifica e Annulla); pagata (PAGATA, Ristampa: per cambiarla prima
// si annulla il pagamento in CONTABILITÀ). firmata falso aggiunge DA RIPORTARE FIRMATA; Modifica la rimette da firmare. telefono: le parti vanno a capo.
const vero = (v, d) => (v === undefined ? d : v === true || v === 'true');
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const pagata = p.stato === 'pagata';
    const firmata = vero(p.firmata, true);
    const telefono = vero(p.telefono, false);
    const notaPredefinita = pagata ? 'Pagata il 5 novembre 2026. Per annullarla, prima si annulla il pagamento in CONTABILITÀ.' : 'Fatta il 22 ottobre 2026';
    return {
      direzione: telefono ? 'column' : 'row',
      descrizione: p.descrizione ?? 'Stage di judo del 18 ottobre', importo: p.importo ?? '150,00 €',
      tono: pagata ? 'verde' : 'giallo', segno: pagata ? 'PAGATA' : 'FATTA · DA PAGARE',
      nonPagata: !pagata,
      nota: (p.nota ?? '') !== '' ? p.nota : notaPredefinita,
      firmata, daRiportare: !firmata, fondoSpunta: firmata ? '#0d2a3d' : '#ffffff', segnoSpunta: firmata ? '✓' : '',
    };
  }
}
</script>
</body>
</html>
