<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 12px; padding: 10px 20px; border-top: 2px solid {{c.lineSoft}}">
  <span style="font-size: 14px; line-height: 1.3; color: {{c.sec}}">{{testo}}</span>
  <div style="display: flex; gap: 8px">
    <dc-import name="Bottone" label="CHIAMA" variante="linea" tema="{{ tema }}" hint-size="120px,48px"></dc-import>
    <dc-import name="Bottone" label="SCRIVI" variante="linea" tema="{{ tema }}" hint-size="110px,48px"></dc-import>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"testo":{"editor":"text","default":"Hai bisogno di aiuto? Chiama o scrivi."},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":390,"height":72}}'>
// La riga d'aiuto del modulo a passi (`.passo-aiuto` di src/styles.css, `IscrizioneAPassi.tsx`): in fondo a ogni passo, sopra la barra, nel flusso (non sticky),
// con un filo 2px `lineSoft` sopra; la frase a sinistra (14px `sec`), a destra CHIAMA (`chiama`) e SCRIVI (`scrivi`, WhatsApp col messaggio del passo) di src/lib/sito.ts.
const T = {
  scuro: { sec: '#c9c9c4', lineSoft: '#2a2a2a' },
  chiaro: { sec: '#3d3d3a', lineSoft: '#e2e2dd' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { c: T[p.tema] || T.scuro, testo: p.testo ?? 'Hai bisogno di aiuto? Chiama o scrivi.' };
  }
}
</script>
</body>
</html>
