<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="width: 100%; padding: 4px; background: {{c.giallo}}; color: {{c.suColore}}; font-family: {{cond}}; font-size: {{corpo}}; font-weight: {{peso}}; letter-spacing: {{spazio}}; text-align: center">{{testo}}<span style="display: {{esciVisto}}; align-items: center; min-height: 44px; padding: 0 8px; margin-left: 4px; white-space: nowrap; text-decoration: underline; text-underline-offset: 3px">ESCI DALLA PROVA</span></div>
</x-dc>
<script data-dc-script data-props='{"testo":{"editor":"text","default":"DATI DI PROVA · ORARIO VERO, ISCRITTI INVENTATI"},"esci":{"editor":"boolean","default":false},"$preview":{"width":390,"height":40}}'>
// Riproduzione 1:1 del nastro .nastro-prova (src/styles.css riga 491) in cima all'area degli iscritti (AreaIscritti.tsx riga 76): Saira 12px 700 0.18em,
// testo `su-colore` su fondo `giallo`, centrato, padding 4px. E' il segno che i dati sono inventati.
// sotto :root[data-look='sito'] (sala, area iscritti, istruttori): Big Shoulders 13px 800 0.08em, inchiostro #0d2a3d sul giallo.
// esci: il tasto ESCI DALLA PROVA (.nastro-prova-esci): alto 44px, sottolineato, senza «·» davanti, stesso font (`NastroProva` di ds.tsx: sala e pagina Iscrizioni), quando la prova e' scelta.
const T = {
  sito: { giallo: '#f4c31b', suColore: '#0d2a3d' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
const sito = true;
return { c, cond: sito ? "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif" : COND, corpo: sito ? '13px' : '12px', peso: sito ? 800 : 700, spazio: sito ? '0.08em' : '0.18em', testo: p.testo ?? 'DATI DI PROVA · ORARIO VERO, ISCRITTI INVENTATI', esciVisto: truthy(p.esci) ? 'inline-flex' : 'none' };
  }
}
</script>
</body>
</html>
