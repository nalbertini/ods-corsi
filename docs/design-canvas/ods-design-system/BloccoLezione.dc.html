<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 3px; width: 100%; height: 90px; padding: 8px 12px; overflow: hidden; background: {{sfondo}}; border: 2px solid {{bordo}}; border-left: 8px solid {{tinta}}; text-align: left">
  <span style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 20px; font-weight: 700; line-height: 1.05; color: {{coloreTitolo}}">{{corso}}</span><span style="font-size: 14px; color: {{c.dim}}">{{ora}}</span></span>
  <span style="font-size: 13px; color: {{c.sec}}">{{sotto}}</span>
  <span style="margin-top: auto; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; color: {{coloreStato}}">{{parola}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"corso":{"editor":"text","default":"Judo kids"},"ora":{"editor":"text","default":"18:30"},"sotto":{"editor":"text","default":"Marco R. · 12 iscritti"},"stato":{"editor":"enum","options":["fatto","in_corso","appello_non_fatto","prossima","annullata"],"default":"in_corso"},"tinta":{"editor":"color","default":"#1b8ac4"},"$preview":{"width":300,"height":90}}'>
// Riproduzione di un blocco del tabellone di OGGI: .bn-blocco (src/styles.css) disegnato da `Oggi`, con lo stato calcolato da `tabellone` (src/lib/giornata.ts).
// Altezza di un'ora a 96px, meno 6; da meno di 90px la riga di mezzo sparisce. Lo stato dice sempre la parola (✓ FATTO, ADESSO, ✕ APPELLO NON FATTO, STA PER INIZIARE, ANNULLATA): il colore la rinforza soltanto. L'annullata non e' trasparente: fondo vuoto, bordo `lineSoft`.
const T = {
  sito: { bg: '#eef5fa', surface: '#ffffff', surfaceAlta: '#cfe6f4', menu: '#0d2a3d', line: '#cfe6f4', lineSoft: '#cfe6f4', text: '#0d2a3d', sec: '#0d2a3d', dim: '#46606f', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', rossoTesto: '#b81d1d', verdeTesto: '#0b7a33', suColore: '#0d2a3d' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
    const stato = p.stato || 'in_corso';
    const parole = { fatto: '✓ FATTO · 8 SU 9', in_corso: 'ADESSO · 7 SU 12', appello_non_fatto: '✕ APPELLO NON FATTO', prossima: 'STA PER INIZIARE', annullata: 'ANNULLATA' };
    const bordo = stato === 'fatto' ? c.verde : stato === 'appello_non_fatto' ? c.rosso : stato === 'annullata' ? c.lineSoft : c.line;
    const coloreStato = stato === 'fatto' || stato === 'in_corso' ? c.verdeTesto : stato === 'appello_non_fatto' ? c.rossoTesto : c.dim;
    return { c, corso: p.corso ?? 'Judo kids', ora: p.ora ?? '18:30', sotto: p.sotto ?? 'Marco R. · 12 iscritti', parola: parole[stato], tinta: p.tinta ?? '#1b8ac4', sfondo: stato === 'annullata' ? 'transparent' : c.surface, bordo, coloreStato, coloreTitolo: stato === 'annullata' ? c.sec : c.text };
  }
}
</script>
</body>
</html>
