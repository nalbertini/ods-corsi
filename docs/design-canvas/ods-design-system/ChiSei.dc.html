<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <!-- Big Shoulders Display e Inter (qui da Google Fonts, in app file locali OFL). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: center; gap: 10px; width: 100%; padding: {{padding}}; font-family: {{cond}}; font-size: 12px; font-weight: {{peso}}; letter-spacing: {{spazio}}; color: {{c.dim}}">
  <span style="flex-grow: 1; min-width: 0">{{chi}}</span>
  <sc-if value="{{segreteria}}" hint-placeholder-val="{{ false }}">
    <span style="display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; text-decoration: underline; color: {{c.link}}">SEGRETERIA</span>
  </sc-if>
  <span style="display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; color: {{c.link}}">ESCI</span>
</div>
</x-dc>
<script data-dc-script data-props='{"chi":{"editor":"text","default":"MARCO ROSSI · ISTRUTTORE"},"segreteria":{"editor":"boolean","default":false},"$preview":{"width":390,"height":60}}'>
// Riproduzione 1:1 di ChiSei (src/components/Porta.tsx righe 103-118): chi e' entrato, in una riga sopra il calendario del
// telefono. .row.pad.chi-sei (src/styles.css righe 1207-1211): gap 10px, padding-top 10px, cond 12px 700 0.16em `dim`;
// .chi-esci (riga 1223): cond 13px 700 0.16em `dim`, sottolineato, 44px. «NOME COGNOME · RUOLO» in maiuscolo
// (nomeDelRuolo: Istruttore | Segreteria | Segreteria e istruttore). `segreteria` = SEGRETERIA, per chi ha le due aree.
const T = {
  // Look del sito (COSTRUITO, nessuna regola sua nel look: prende i token): stessa riga di prima con --cond = Big Shoulders 700 12px 0.16em e `dim` #46606f; ESCI e SEGRETERIA nello stesso #46606f (non in inchiostro), sottolineati, alti 44px. Margini laterali 20px.
  sito: { dim: '#46606f', link: '#46606f' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      c: T.sito, cond: BIG,
      padding: '10px 20px 0', peso: 700, spazio: '0.16em',
      chi: p.chi ?? 'MARCO ROSSI · ISTRUTTORE',
      segreteria: truthy(p.segreteria),
    };
  }
}
</script>
</body>
</html>
