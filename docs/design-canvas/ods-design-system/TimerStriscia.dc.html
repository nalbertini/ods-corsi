<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <!-- Tema sito: Big Shoulders Display e Inter (qui da Google Fonts, in app file locali OFL). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="width: 100%">
<sc-if value="{{sito}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: stretch; width: 100%; min-height: 60px; background: {{k.sfondo}}; border-bottom: 2px solid {{k.bordo}}; border-top: {{k.bordoSopra}}; color: {{k.testo}}; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <span style="display: flex; align-items: center; flex-grow: 1; min-width: 0; gap: 12px; padding: 0 8px 0 20px">
    <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
      <span style="font-size: 16px; font-weight: 700; letter-spacing: 0.04em; line-height: 1; color: {{k.etichettaColore}}">{{k.etichettaSito}}</span>
      <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{k.secondo}}">{{riga2}}</span>
    </span>
    <span style="flex-grow: 1"></span>
    <span style="font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 36px; font-weight: 800; line-height: 1">{{tempo}}</span>
  </span>
  <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; min-width: 64px; min-height: 44px; margin: 8px 8px 8px 4px; padding: 0 12px; border: 2px solid {{k.testo}}; border-radius: 6px; font-size: 15px; font-weight: 700; letter-spacing: 0.04em">{{parolaTasto}}</span>
</div>
</sc-if>
<sc-if value="{{nonSito}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: stretch; width: 100%; min-height: 56px; background: {{k.sfondo}}; border-bottom: 2px solid {{k.bordo}}; color: {{k.testo}}">
  <span style="display: flex; align-items: center; flex-grow: 1; min-width: 0; gap: 12px; padding: 0 8px 0 20px">
    <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <span style="font-family: {{cond}}; font-style: oblique 9deg; font-size: 18px; font-weight: 700; letter-spacing: 0.16em; line-height: 1">{{k.etichetta}}</span>
      <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{k.secondo}}">{{riga2}}</span>
    </span>
    <span style="flex-grow: 1"></span>
    <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 700; line-height: 1">{{tempo}}</span>
  </span>
  <sc-if value="{{haStop}}" hint-placeholder-val="{{ true }}">
    <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; min-width: 64px; margin: 6px 8px 6px 4px; padding: 0 12px; border: 2px solid {{k.testo}}; font-family: {{cond}}; font-style: oblique 9deg; font-size: 15px; font-weight: 700; letter-spacing: 0.14em">STOP</span>
  </sc-if>
  <sc-if value="{{haOk}}" hint-placeholder-val="{{ false }}">
    <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; min-width: 64px; margin: 6px 8px 6px 4px; padding: 0 12px; border: 2px solid {{k.testo}}; font-family: {{cond}}; font-style: oblique 9deg; font-size: 15px; font-weight: 700; letter-spacing: 0.14em">OK</span>
  </sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"stato":{"editor":"enum","options":["preparati","lavoro","recupero","riposo","defaticamento","pausa","finito"],"default":"lavoro"},"nome":{"editor":"text","default":"Tabata brucia grassi"},"tempo":{"editor":"text","default":"00:14"},"tema":{"editor":"enum","options":["scuro","chiaro","sito"],"default":"scuro","section":"Tema"},"$preview":{"width":390,"height":56}}'>
// PROPOSTA (non ancora nell'app): la striscia dell'allenamento in corso, visibile da ogni pagina dell'app istruttori mentre
// il timer incorporato non e' a schermo. Il suo stato si legge col colore E col testo (mai solo col colore):
// lavoro = fondo rosso `rosso` (colore della fase di lavoro del timer), testo LAVORO; recupero = fondo `verde`, RECUPERO;
// pausa = fondo `surface-2` con bordo, IN PAUSA; finito = fondo `giallo`, FINITO (la striscia cambia colore e testo, il
// tempo diventa «FINE» e al posto di STOP c'e' OK; il suono e la vibrazione stanno nel codice, non qui).
// Misura: alta 56px, a tutta larghezza, in flusso sotto la testata (spinge giu' il contenuto: non copre i tasti dell'appello).
// Tocco sulla striscia = torna al timer; STOP (min 44px di tocco, bordo 2px) ferma l'allenamento senza aprire il timer.
// tema sito (COSTRUITO, `:root[data-look='sito'] .striscia-timer` in src/styles.css; la fase e lo stato arrivano da `data-fase` e `data-stato`, non da colori in linea): la striscia sta sotto la barra inchiostro di una pagina chiara, quindi deve distinguersi da lei e dalla pagina.
// Lo stato si legge dal segno, dalla parola E dal fondo. Fondi pieni con testo bianco e ▶ davanti: LAVORO #b81d1d (col rosso del timer #e4292a il bianco non da' margine, col #b81d1d si), RECUPERO #0b7a33, RIPOSO e DEFATICAMENTO blu #14709f.
// Fondo bianco con testo inchiostro #0d2a3d (anche il nome, non solo l'etichetta) e una riga da 2px sopra e sotto: PREPARATI e IN PAUSA riga gialla scura #8f6a00 con «… » davanti (IN PAUSA vale per ogni fase: vince sul colore della fase); FINITO riga verde #0b7a33 e «✓ » davanti,
// il tempo diventa FINE e STOP diventa OK. Mai il giallo pieno: e' del tasto principale.
// Il tempo e' una cifra grande: Big Shoulders 800 a 36px; il resto Inter (etichetta 16px 700 0.04em, nome 15px 600). Margine a sinistra 20px (come la striscia di prima). STOP / OK: tasto da 44px con bordo 2px del colore del testo, raggio 6px, Inter 15px 700 0.04em, margine 8px sopra e sotto. Alta 60px (56 piu' la riga), in flusso sotto la barra.
// Il cronometro dell'allenamento (pagina TIMER) resta scuro dentro l'area chiara: `.faccia-timer` ha i token del tema scuro e dipinge il suo fondo; il timer incorporato prende `data-tema="scuro"` (`temaDelTimer` in src/lib/timerNelRiquadro.ts).
// Valori: rosso #e4292a, verde #16a54a, giallo #f4c31b, testo sui colori #121212 (`su-colore`), `surface-2`, `line` di src/styles.css.
const T = {
  scuro: { surface2: '#242424', line: '#333333', text: '#f2f2f0', sec: '#c9c9c4', rosso: '#e4292a', verde: '#16a54a', giallo: '#f4c31b', suColore: '#121212' },
  chiaro: { surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', sec: '#3d3d3a', rosso: '#e4292a', verde: '#12913f', giallo: '#f4c31b', suColore: '#121212' },
  sito: { surface2: '#ffffff', line: '#8f6a00', text: '#0d2a3d', sec: '#0d2a3d', rosso: '#b81d1d', verde: '#0b7a33', giallo: '#ffffff', suColore: '#ffffff' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const sito = p.tema === 'sito';
    const stato = ['preparati', 'lavoro', 'recupero', 'riposo', 'defaticamento', 'pausa', 'finito'].includes(p.stato) ? p.stato : 'lavoro';
    // I tre stati in più sono solo del tema sito (nell'app il fondo viene dalla fase del timer, in CSS): negli altri temi valgono come LAVORO.
    const statoVecchio = ['lavoro', 'recupero', 'pausa', 'finito'].includes(stato) ? stato : 'lavoro';
    const K = {
      lavoro: { sfondo: c.rosso, bordo: c.rosso, testo: c.suColore, secondo: c.suColore, etichetta: 'LAVORO' },
      recupero: { sfondo: c.verde, bordo: c.verde, testo: c.suColore, secondo: c.suColore, etichetta: 'RECUPERO' },
      pausa: { sfondo: c.surface2, bordo: c.line, testo: c.text, secondo: c.sec, etichetta: 'IN PAUSA' },
      finito: { sfondo: c.giallo, bordo: c.giallo, testo: c.suColore, secondo: c.suColore, etichetta: 'FINITO' },
    }[statoVecchio];
    const KS = {
      preparati: { sfondo: '#ffffff', bordo: '#8f6a00', bordoSopra: '2px solid #8f6a00', testo: '#0d2a3d', secondo: '#0d2a3d', etichettaColore: '#0d2a3d', etichettaSito: '… PREPARATI' },
      lavoro: { sfondo: '#b81d1d', bordo: '#b81d1d', bordoSopra: '0', testo: '#ffffff', secondo: '#ffffff', etichettaColore: '#ffffff', etichettaSito: '▶ LAVORO' },
      recupero: { sfondo: '#0b7a33', bordo: '#0b7a33', bordoSopra: '0', testo: '#ffffff', secondo: '#ffffff', etichettaColore: '#ffffff', etichettaSito: '▶ RECUPERO' },
      riposo: { sfondo: '#14709f', bordo: '#14709f', bordoSopra: '0', testo: '#ffffff', secondo: '#ffffff', etichettaColore: '#ffffff', etichettaSito: '▶ RIPOSO' },
      defaticamento: { sfondo: '#14709f', bordo: '#14709f', bordoSopra: '0', testo: '#ffffff', secondo: '#ffffff', etichettaColore: '#ffffff', etichettaSito: '▶ DEFATICAMENTO' },
      pausa: { sfondo: '#ffffff', bordo: '#8f6a00', bordoSopra: '2px solid #8f6a00', testo: '#0d2a3d', secondo: '#0d2a3d', etichettaColore: '#0d2a3d', etichettaSito: '… IN PAUSA' },
      finito: { sfondo: '#ffffff', bordo: '#0b7a33', bordoSopra: '2px solid #0b7a33', testo: '#0d2a3d', secondo: '#0d2a3d', etichettaColore: '#0d2a3d', etichettaSito: '✓ FINITO' },
    }[stato];
    return {
      sito, nonSito: !sito, parolaTasto: stato === 'finito' ? 'OK' : 'STOP',
      k: sito ? KS : K, cond: COND,
      haStop: stato !== 'finito', haOk: stato === 'finito',
      tempo: stato === 'finito' ? 'FINE' : (p.tempo ?? '00:14'),
      riga2: stato === 'finito' ? 'Tocca per tornare al timer' : (p.nome ?? 'Tabata brucia grassi'),
    };
  }
}
</script>
</body>
</html>
