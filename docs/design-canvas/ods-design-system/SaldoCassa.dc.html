<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<section style="display: flex; flex-direction: column; gap: 6px; width: 100%; min-width: 0; padding: 16px 18px; background: {{c.surface}}; border: 2px solid {{c.line}}; color: {{c.text}}; font-family: {{corpo}}">
  <span style="font-family: {{cond}}; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: {{c.dim}}">{{nome}}</span>
  <span style="display: {{mostraNonDisp}}; font-size: 14px">{{nonDisp}}</span>
  <div style="display: {{mostraRighe}}; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; gap: 12px"><span style="font-size: 14px">{{testoInizio}}</span><span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700">{{inizio}}</span></div>
    <div style="display: flex; justify-content: space-between; gap: 12px"><span style="font-size: 14px">Entrate</span><span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700">{{entrate}}</span></div>
    <div style="display: flex; justify-content: space-between; gap: 12px"><span style="font-size: 14px">Uscite</span><span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700">{{uscite}}</span></div>
    <div style="display: flex; justify-content: space-between; gap: 12px"><span style="font-size: 14px">Giroconti</span><span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700">{{giroconti}}</span></div>
    <div style="display: flex; justify-content: space-between; gap: 12px; font-weight: 700; border-top: 1px solid {{c.line}}; padding-top: 6px"><span style="font-size: 14px">{{testoFine}}</span><span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700">{{fine}}</span></div>
  </div>
</section>
</x-dc>
<script data-dc-script data-props='{"nome":{"editor":"text","default":"CASSA CONTANTI"},"testoInizio":{"editor":"text","default":"Saldo al 1 gen 2025"},"inizio":{"editor":"text","default":"1.250,00 €"},"entrate":{"editor":"text","default":"+ 19.400,00 €"},"uscite":{"editor":"text","default":"− 6.300,00 €"},"giroconti":{"editor":"text","default":"− 12.000,00 €"},"testoFine":{"editor":"text","default":"Saldo al 31 dic 2025"},"fine":{"editor":"text","default":"2.350,00 €"},"nonDisponibile":{"editor":"boolean","default":false},"nonDisp":{"editor":"text","default":"Saldo non disponibile: la cassa parte il 01/03/2025."},"tema":{"editor":"enum","options":["scuro","chiaro","sito"],"default":"sito","section":"Tema"},"$preview":{"width":340,"height":220}}'>
// Riproduzione 1:1 del riquadro di cassa di Bilancio.tsx (<section className="sg-riquadro"> con RigaSaldo), nello stile di `Numero`:
// fondo `surface`, bordo 2px `line`, padding 16px 18px, gap 6px; titolo = nome della cassa in maiuscolo, .sg-etichetta (12px 700,
// 0.2em, `dim`). Righe «Saldo iniziale, Entrate, Uscite, Giroconti» a 14px con la cifra .num 15px 700; la finale con filo sopra e
// grassetto. Il saldo iniziale e' «Saldo al 1 gen ANNO» o, se la cassa parte in corso d'anno, «Saldo dal GG/MM/AAAA (la cassa parte
// qui)»; la finale «Saldo al 31 dic ANNO» o, in un anno parziale, «Saldo al GG/MM/AAAA». Giroconti col verso del movimento; zero
// senza segno. nonDisponibile: al posto delle righe la frase «Saldo non disponibile: la cassa parte il GG/MM/AAAA.» (14px).
// Nell'app stanno in una griglia auto-fit minmax(300px, 1fr) sotto SALDI DELLE CASSE.
const T = {
  scuro: { surface: '#1c1c1c', line: '#333333', text: '#f2f2f0', dim: '#8c8c88' },
  chiaro: { surface: '#ffffff', line: '#d4d4ce', text: '#161616', dim: '#656561' },
  sito: { surface: '#ffffff', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const CORPO = "Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const nd = truthy(p.nonDisponibile);
    return {
      c: T[p.tema] || T.sito, cond: COND, corpo: CORPO,
      nome: (p.nome ?? '').toUpperCase(),
      nonDisp: p.nonDisp ?? '', mostraNonDisp: nd ? 'block' : 'none', mostraRighe: nd ? 'none' : 'flex',
      testoInizio: p.testoInizio ?? '', inizio: p.inizio ?? '', entrate: p.entrate ?? '', uscite: p.uscite ?? '',
      giroconti: p.giroconti ?? '', testoFine: p.testoFine ?? '', fine: p.fine ?? '',
    };
  }
}
</script>
</body>
</html>
