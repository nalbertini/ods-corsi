<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Tavola modello, telefono (390px), della SEGRETERIA nel look del sito: la barra inchiostro in cima (BarraTelefono, tema sito) e il corpo su fondo azzurro. Qui il corpo e' DA FARE:
     titolo, COSA MANCA in due colonne (sotto i 768px), e le righe. Sotto i 700px la riga va a capo: il numero sopra, il testo, e il tasto a tutta larghezza (`.sg-dafare-tasto`).
     Una schermata nuova si fa copiando questo file e sostituendo il contenuto di <main>; il menu aperto e' Menu.dc.html (tema="sito") a tutto schermo sotto la barra. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 844px; background: #eef5fa">
  <dc-import name="BarraTelefono" tema="sito" luogo="SEGRETERIA" da-fare="5" hint-size="100%,62px"></dc-import>
  <main style="display: flex; flex-direction: column; gap: 18px; padding: 20px 16px 28px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">DA FARE</h1>
      <span style="font-size: 14px; color: #46606f">domenica 18 ottobre 2026.</span>
    </div>
    <dc-import name="CosaManca" tema="sito" colonne="{{ 2 }}" voci="14|Appelli non fatti||r; 5|Certificati scaduti||r; 7|Pagamenti||r; 0|Senza tessera||v" hint-size="100%,160px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <dc-import name="Riquadro" tema="sito" contesto="segreteria" etichetta="" titolo="Lezioni senza appello" testo="14 lezioni passate, nessuno ha segnato." tono-testo="dim" hint-size="100%,100px"></dc-import>
      <dc-import name="Bottone" tema="sito" contesto="segreteria" label="Fai gli appelli" variante="pieno" larghezza="100%" hint-size="100%,48px"></dc-import>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
