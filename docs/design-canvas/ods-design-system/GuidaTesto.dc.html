<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- La colonna di testo della guida dentro l'app: `<article className="pad guida">` di src/components/Guida.tsx, con `.guida`, `h1`, `h2`, `p`, `ul`, `.guida-tabella` e `th/td` (src/styles.css righe 1926-1947). Una colonna da leggere, larga al massimo 760px, con i caratteri del marchio; h3, h4, codice e collegamenti non ci sono.
     titolo = h1 (Saira obliqua maiuscola), sezione = h2 (spaziato, dim, con la riga sotto), testo = un paragrafo, voci = elenco puntato separato da "|". tabella: intestazioni = "A|B|C" e righe = celle separate da "|" e righe da ";" (vuote: niente tabella). -->
<article style="width: 100%; max-width: 760px; padding: 6px 20px 40px; font-size: 16px; line-height: 1.55; color: {{c.sec}}">
  <div style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 32px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.05; color: {{c.text}}; margin: 14px 0 10px; text-transform: uppercase">{{titolo}}</div>
  <p style="margin: 0 0 12px">{{testo}}</p>
  <div style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: {{c.dim}}; margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 2px solid {{c.lineSoft}}">{{sezione}}</div>
  <ul style="margin: 0 0 12px; padding-left: 24px">
    <sc-for list="{{voci}}" as="v" hint-placeholder-count="3">
      <li style="margin: 4px 0">{{v.testo}}</li>
    </sc-for>
  </ul>
  <sc-if value="{{conTabella}}" hint-placeholder-val="{{ true }}">
    <div style="display: grid; grid-template-columns: {{colonne}}; margin: 0 0 14px; font-size: 15px">
      <sc-for list="{{celle}}" as="x" hint-placeholder-count="6">
        <div style="padding: 8px 10px; border: 2px solid {{c.line}}; margin: 0 -2px -2px 0; background: {{x.fondo}}; color: {{x.colore}}; font-family: {{x.famiglia}}; font-size: {{x.corpo}}; font-weight: {{x.peso}}; letter-spacing: {{x.spazio}}">{{x.testo}}</div>
      </sc-for>
    </div>
  </sc-if>
</article>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"Il timer"},"testo":{"editor":"text","default":"Il timer conta i passi dell’allenamento e passa da solo al successivo."},"sezione":{"editor":"text","default":"I comandi"},"voci":{"editor":"text","default":"AVVIA parte dal primo passo|PAUSA ferma il conto|+30″ allunga il passo in corso"},"intestazioni":{"editor":"text","default":"Colore|Passo"},"righe":{"editor":"text","default":"Rosso|Lavoro;Verde|Recupero;Blu|Riposo tra le serie"},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":480,"height":520}}'>
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', surface2: '#242424', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', faint: '#5a5a56', tasto: '#b8b8b2', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suColore: '#121212', suRosso: '#ffffff' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', faint: '#a8a8a3', tasto: '#4a4a46', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#121212', suRosso: '#ffffff' },
};
const truthy = (v) => v === true || v === 'true';
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const testa = lista(p.intestazioni ?? 'Colore|Passo', '|');
    const righe = lista(p.righe ?? 'Rosso|Lavoro;Verde|Recupero;Blu|Riposo tra le serie', ';').map((r) => r.split('|').map((s) => s.trim()));
    const n = testa.length || (righe[0] ? righe[0].length : 0);
    const celle = [];
    // I titoli di colonna sono maiuscoli come `.guida th`.
    testa.forEach((t) => celle.push({ testo: t.toUpperCase(), fondo: c.surface, colore: c.dim, famiglia: "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif", corpo: '13px', peso: 700, spazio: '0.14em' }));
    righe.forEach((r) => { for (let i = 0; i < n; i++) celle.push({ testo: r[i] ?? '', fondo: 'transparent', colore: c.sec, famiglia: 'inherit', corpo: '15px', peso: 400, spazio: 'normal' }); });
    return {
      c,
      titolo: p.titolo ?? 'Il timer',
      testo: p.testo ?? '',
      sezione: p.sezione ?? '',
      voci: lista(p.voci ?? '', '|').map((testo) => ({ testo })),
      conTabella: n > 0 && righe.length > 0,
      colonne: 'repeat(' + n + ', 1fr)',
      celle,
    };
  }
}
</script>
</body>
</html>
