<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: center; width: 100%; height: 56px; padding: 0 14px; background: {{c.surface}}; border: 2px solid {{bordo}}; font-size: 18px; color: {{colore}}">
  <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{testo}}</span>
</div>
</x-dc>
<script data-dc-script data-props='{"segnaposto":{"editor":"text","default":"nome utente della sala"},"valore":{"editor":"text","default":""},"password":{"editor":"boolean","default":false},"fuoco":{"editor":"boolean","default":false},"$preview":{"width":560,"height":56}}'>
// Riproduzione 1:1 di .tb-campo (src/styles.css, righe 1095-1108), il campo di testo del tablet: alto 56px, bordo da 2px, testo da 18px.
// E' quello della schermata COLLEGA IL TABLET (Preparazione in Tablet.tsx). Con `valore` mostra il testo scritto (con `password`, tanti
// puntini quanti sono i caratteri), senza il segnaposto in `dim`; con `fuoco` il bordo passa a `text` (:focus).
const T = {
  sito: { surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', lineSoft: '#cfe6f4', text: '#0d2a3d', sec: '#0d2a3d', dim: '#46606f', verde: '#12913f', verdeTesto: '#0b7a33', giallo: '#f4c31b', gialloTesto: '#8f6a00', rosso: '#e4292a', rossoTesto: '#b81d1d', blu: '#14709f', suColore: '#0d2a3d', suRosso: '#ffffff', tasto: '#0d2a3d', ombra: '0 16px 50px rgba(0, 0, 0, 0.45)' },
};
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
    const valore = p.valore ?? '';
    const password = truthy(p.password);
    return {
      c,
      testo: valore ? (password ? '•'.repeat(valore.length) : valore) : (p.segnaposto ?? 'nome utente della sala'),
      colore: valore ? c.text : c.dim,
      bordo: truthy(p.fuoco) ? c.text : c.line,
    };
  }
}
</script>
</body>
</html>
