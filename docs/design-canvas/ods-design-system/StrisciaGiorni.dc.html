<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <!-- Look sito: Big Shoulders Display e Inter (qui da Google Fonts, in app file locali OFL). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: {{paddingFascia}}">
  <sc-for list="{{giorni}}" as="g" hint-placeholder-count="7">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 1px; min-height: 62px; padding: 8px 0 6px; background: {{g.sfondo}}; border: {{g.bordoCasella}}; border-radius: {{raggio}}; box-shadow: {{g.ombra}}; color: {{g.coloreNome}}">
      <span style="font-family: {{famNome}}; font-size: 11px; font-weight: {{pesoNome}}; letter-spacing: {{spazioNome}}">{{g.nome}}</span>
      <span style="font-family: {{famNome}}; font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 700; line-height: 1; color: {{g.coloreNum}}">{{g.num}}</span>
      <span style="height: 10px; font-size: 9px; line-height: 1; letter-spacing: 1px; color: #1b8ac4">{{g.punti}}</span>
    </div>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"giorni":{"editor":"text","default":"DOM 4 0, LUN 5 2 o, MAR 6 3 s, MER 7 1, GIO 8 0, VEN 9 4, SAB 10 2"},"$preview":{"width":390,"height":90}}'>
// Riproduzione 1:1 della striscia dei giorni: .striscia-giorni, .giorno e figli (src/styles.css righe 277-295) con
// il markup di CalendarioScreen.tsx (righe 340-353). Sette caselle alte 62px; i puntini blu contano le lezioni
// del giorno (al massimo quattro); oggi ha il numero giallo; il giorno scelto ha bordo `text` e fondo `surface-2`.
// giorni: "NOME numero lezioni [o] [s]" separati da virgola; `o` = oggi, `s` = giorno scelto.
// Il padding laterale di 20px e' quello della classe (--bordo-pagina).
// look sito (COSTRUITO, `:root[data-look='sito'] .striscia-giorni` in src/styles.css; come `.sg-giorno-tel` della segreteria): casella bianca senza bordo, raggio 6px, nome e numero in Inter; il giorno scelto ha il contorno blu #14709f
// da 2px dentro la casella e il nome in inchiostro; oggi ha il numero in giallo scuro #8f6a00 e una riga da 3px sotto (il giallo e' testo e riga, mai fondo). Padding laterale 16px, come le altre tessere.
const T = {
  sito: { surface: '#ffffff', surface2: '#ffffff', line: '#ffffff', text: '#0d2a3d', dim: '#46606f', gialloTesto: '#8f6a00' },
};
class Component extends DCLogic {
  renderVals() {
    const c = T.sito;
    const giorni = String(this.props.giorni ?? 'DOM 4 0, LUN 5 2 o, MAR 6 3 s, MER 7 1, GIO 8 0, VEN 9 4, SAB 10 2')
      .split(',')
      .map((s) => s.trim().split(/\s+/))
      .filter((w) => w.length >= 2 && w[0] !== '')
      .map(([nome, num, lezioni, ...segni]) => {
        const scelto = segni.includes('s');
        const oggi = segni.includes('o');
        const quante = Number(lezioni) || 0;
        return {
          nome, num,
          punti: quante ? '•'.repeat(Math.min(quante, 4)) : ' ',
          sfondo: scelto ? c.surface2 : c.surface,
          bordo: c.line,
          bordoCasella: '0',
          ombra: [scelto ? 'inset 0 0 0 2px #14709f' : '', oggi ? 'inset 0 -3px 0 #8f6a00' : ''].filter(Boolean).join(', ') || 'none',
          coloreNome: scelto ? c.text : c.dim,
          coloreNum: oggi ? c.gialloTesto : c.text,
        };
      });
    return { giorni, raggio: '6px', paddingFascia: '0 16px 4px', famNome: "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif", pesoNome: 600, spazioNome: '0.04em' };
  }
}
</script>
</body>
</html>
