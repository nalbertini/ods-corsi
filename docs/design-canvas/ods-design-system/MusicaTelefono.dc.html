<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 10px; width: 100%; padding: 12px 20px 14px; border-top: 2px solid {{c.lineSoft}}; background: {{c.bg}}; color: {{c.text}}">
  <sc-if value="{{spenta}}" hint-placeholder-val="{{ false }}">
    <span style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: 2px solid {{c.line}}; color: {{c.text}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
      <span style="font-family: {{cond}}; font-style: oblique 9deg; font-size: 17px; font-weight: 700; letter-spacing: 0.12em">ACCENDI LA MUSICA</span>
    </span>
  </sc-if>
  <sc-if value="{{conBarra}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
      <sc-if value="{{copertina}}" hint-placeholder-val="{{ true }}">
        <span style="width: 44px; height: 44px; flex-shrink: 0; background: {{c.surface2}}"></span>
      </sc-if>
      <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
        <span style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{titolo}}</span>
        <span style="font-size: 14px; color: {{coloreSotto}}; overflow: hidden; text-overflow: ellipsis; white-space: {{aCapo}}">{{sotto}}</span>
      </span>
      <sc-if value="{{haVolume}}" hint-placeholder-val="{{ true }}">
        <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border: 2px solid {{c.line}}; font-size: 22px; font-weight: 700">−</span>
        <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; width: 28px; text-align: center; font-size: 16px; font-weight: 700; color: {{c.dim}}">{{volume}}</span>
        <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border: 2px solid {{c.line}}; font-size: 22px; font-weight: 700">+</span>
      </sc-if>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 52px; height: 52px; border: 2px solid {{c.line}}; opacity: {{opSalta}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><rect x="4" y="5" width="2.5" height="14"></rect></svg></span>
      <span style="display: flex; align-items: center; justify-content: center; gap: 10px; flex-grow: 1; height: 52px; border: 2px solid {{bordoPlay}}; background: {{fondoPlay}}; color: {{colorePlay}}">
        <sc-if value="{{inRiproduzione}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg></sc-if>
        <sc-if value="{{inPausa}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 21 12 6 21 6 3"></polygon></svg></sc-if>
      </span>
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 52px; height: 52px; border: 2px solid {{c.line}}; opacity: {{opSalta}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><rect x="17.5" y="5" width="2.5" height="14"></rect></svg></span>
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 52px; height: 52px; border: 2px solid {{bordoListe}}; background: {{fondoListe}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></span>
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 52px; height: 52px; border: 2px solid {{c.line}}" aria-label="Spegni la musica"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
    </div>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"musica":{"editor":"enum","options":["suona","pausa","ferma","errore","spenta"],"default":"suona"},"fonte":{"editor":"enum","options":["spotify","youtube","radio","file"],"default":"spotify"},"titolo":{"editor":"text","default":"Riscaldamento"},"sotto":{"editor":"text","default":"Playlist Spotify · Riscaldamento"},"volume":{"editor":"text","default":"40"},"listeAperte":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":390,"height":140}}'>
// Nell'app (BarraMusicaTelefono / MusicaMini di src/components/TimerIstruttori.tsx, .musica-telefono / .musica-mini di styles.css): la barra della musica nella pagina TIMER del telefono, in fondo sopra
// BarraNavigazione. Gli stessi comandi della barra del tablet (TabletPiedeMusica, MusicaSala.tsx) su due righe, perche' 390px non bastano
// per una: sopra il brano (copertina 44px solo con Spotify, titolo, sotto) e il volume − N + (44px, solo Spotify, come sul tablet);
// sotto ⏮ ▶/⏸ ⏭ ☰ ✕ a 52px, ▶ largo quanto resta. Bordi 2px `line`, fondo `bg`, bordo sopra `line-soft`.
// - musica: suona (⏸), pausa (▶), ferma (dopo un ricaricamento: ▶ pieno verde e il sotto «Tocca ▶ per farla partire»), errore (radio o
//   YouTube senza rete: sotto in rosso, a capo), spenta (resta solo ACCENDI LA MUSICA: la musica nel telefono parte spenta).
// - fonte: spotify, youtube (con YouTube la barra e' MusicaYoutubeTelefono: il video accanto ai comandi), radio (⏮ ⏭ spenti a 0.35), file.
// - listeAperte: ☰ acceso (bordo `text`, fondo `surface-2`); il pannello e' TabletListeMusica con titolo LA MUSICA.
const T = {
  scuro: { bg: '#121212', surface2: '#242424', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', dim: '#8c8c88', verde: '#16a54a', rossoTesto: '#ff5a52', suColore: '#121212' },
  chiaro: { bg: '#f4f4f1', surface2: '#e9e9e5', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', dim: '#656561', verde: '#12913f', rossoTesto: '#b81d1d', suColore: '#121212' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const musica = ['suona', 'pausa', 'ferma', 'errore', 'spenta'].includes(p.musica) ? p.musica : 'suona';
    const fonte = ['spotify', 'youtube', 'radio', 'file'].includes(p.fonte) ? p.fonte : 'spotify';
    const errore = musica === 'errore';
    const ferma = musica === 'ferma';
    const aperte = truthy(p.listeAperte);
    return {
      c, cond: COND,
      spenta: musica === 'spenta',
      conBarra: musica !== 'spenta',
      copertina: fonte === 'spotify' && !errore,
      titolo: p.titolo ?? 'Riscaldamento',
      sotto: errore ? 'Senza rete non parte. I file del telefono suonano lo stesso.' : ferma ? 'Tocca ▶ per farla partire' : (p.sotto ?? 'Playlist Spotify · Riscaldamento'),
      coloreSotto: errore ? c.rossoTesto : c.dim,
      aCapo: errore ? 'normal' : 'nowrap',
      haVolume: fonte === 'spotify' && !errore,
      volume: p.volume ?? '40',
      opSalta: fonte === 'radio' || errore ? '0.35' : '1',
      inRiproduzione: musica === 'suona',
      inPausa: musica !== 'suona',
      bordoPlay: ferma ? c.verde : c.line,
      fondoPlay: ferma ? c.verde : 'transparent',
      colorePlay: ferma ? c.suColore : c.text,
      bordoListe: aperte ? c.text : c.line,
      fondoListe: aperte ? c.surface2 : 'transparent',
    };
  }
}
</script>
</body>
</html>
