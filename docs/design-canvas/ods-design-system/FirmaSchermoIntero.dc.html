<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="position: relative; display: flex; flex-direction: column; width: {{w}}px; height: {{h}}px; background: {{c.bg}}; color: {{c.text}}">
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 2px solid {{c.line}}">
    <span style="display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 16px; border: 2px solid {{c.line}}; font-family: {{cond}}; font-style: oblique 9deg; font-size: 16px; font-weight: 700; letter-spacing: 0.16em; color: {{c.tasto}}">ANNULLA</span>
    <span style="flex-grow: 1; min-width: 0; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: {{cond}}; font-size: 15px; font-weight: 700; letter-spacing: 0.2em; color: {{c.dim}}">{{titolo}}</span>
    <span style="display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; background: {{fondoFatto}}; border: 2px solid {{bordoFatto}}; font-family: {{cond}}; font-style: oblique 9deg; font-size: 16px; font-weight: 700; letter-spacing: 0.16em; color: {{coloreFatto}}">FATTO</span>
  </div>
  <div style="position: relative; flex-grow: 1; margin: 16px 20px; background: {{c.surface}}; border: 2px dashed {{c.tratteggio}}">
    <span style="position: absolute; left: 16px; right: 16px; bottom: 25%; height: 2px; background: {{c.line}}"></span>
    <sc-if value="{{vuota}}" hint-placeholder-val="{{ true }}">
      <span style="position: absolute; left: 0; right: 0; bottom: calc(25% + 12px); text-align: center; font-family: {{cond}}; font-size: 14px; font-weight: 700; letter-spacing: 0.2em; color: {{c.faint}}">{{invito}}</span>
    </sc-if>
    <sc-if value="{{firmata}}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 300 120" preserveAspectRatio="xMidYMid meet" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%" fill="none" stroke="{{c.text}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="La firma">
        <path d="M52 92 C60 56 70 34 78 40 C86 48 66 96 74 96 C86 96 92 62 104 62 C112 62 104 90 114 90 C128 90 130 58 144 58 C152 58 146 84 158 84 C176 84 190 52 214 50 C230 49 226 66 212 74 C196 82 226 84 250 70"></path>
      </svg>
    </sc-if>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 20px 20px">
    <sc-if value="{{verticale}}" hint-placeholder-val="{{ true }}">
      <span style="font-size: 14px; line-height: 1.4; color: {{c.dim}}">{{frase}}</span>
    </sc-if>
    <span style="display: flex; align-items: center; justify-content: center; min-height: 48px; border: 2px solid {{c.line}}; font-family: {{cond}}; font-style: oblique 9deg; font-size: 16px; font-weight: 700; letter-spacing: 0.16em; color: {{c.tasto}}">CANCELLA E RIFAI</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"orientamento":{"editor":"enum","options":["verticale","orizzontale"],"default":"verticale"},"firmata":{"editor":"boolean","default":false},"titolo":{"editor":"text","default":"LA FIRMA DI GIULIA ROSSI"},"invito":{"editor":"text","default":"FIRMA QUI COL DITO"},"frase":{"editor":"text","default":"Gira il telefono per avere più spazio. La schermata non si muove mentre firmi."},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":390,"height":844}}'>
// PROPOSTA, non ancora nell'app: la firma a schermo intero. Si apre dal riquadro del modulo (TavolaFirma) o dal tasto FIRMA A SCHERMO INTERO
// e occupa tutto lo schermo: in cima ANNULLA, il nome di chi firma e FATTO (acceso solo con una firma vera); in mezzo il riquadro, che
// prende tutto lo spazio, con la riga a un quarto dal fondo; sotto la frase e CANCELLA E RIFAI. Verticale 390x844 o orizzontale 844x390
// (telefono girato: piu' spazio per il dito). I valori sono quelli di TavolaFirma e dei tasti (Bottone).
// FISSO: aperta, la schermata non si muove. La pagina sotto non scorre, non si tira per ricaricare, non si ingrandisce con due dita e la barra
// del browser non si ritira: niente puo' spostare il riquadro mentre si firma, se no la firma esce storta. Si esce solo con ANNULLA o FATTO.
// Se si gira il telefono con la firma a meta', la firma si cancella (le misure cambiano) e lo dice.
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', surface2: '#242424', line: '#333333', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', faint: '#5a5a56', tasto: '#b8b8b2', tratteggio: '#4a4a46', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suColore: '#121212', suRosso: '#ffffff' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', sec: '#3d3d3a', dim: '#656561', faint: '#a8a8a3', tasto: '#4a4a46', tratteggio: '#b0b0aa', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#121212', suRosso: '#ffffff' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const orizz = p.orientamento === 'orizzontale';
    const firmata = truthy(p.firmata);
    return {
      c, cond: COND, w: orizz ? 844 : 390, h: orizz ? 390 : 844, firmata, vuota: !firmata,
      verticale: !orizz,
      // In verticale il titolo intero va a capo a 390: resta il nome. In orizzontale sta su una riga.
      titolo: orizz ? (p.titolo ?? '') : (p.titolo ?? '').replace(/^LA FIRMA DI /, ''), invito: p.invito ?? '', frase: p.frase ?? '',
      // FATTO spento: surface-2 con testo dim, 4,60:1 scuro e 4,81:1 chiaro (il vecchio line+dim: 3,74 e 3,93). Non rosso.
      fondoFatto: firmata ? c.rosso : c.surface2, bordoFatto: firmata ? c.rosso : c.line, coloreFatto: firmata ? c.suRosso : c.dim,
    };
  }
}
</script>
</body>
</html>
