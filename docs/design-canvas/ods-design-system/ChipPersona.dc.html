<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<span role="button" aria-pressed="{{acceso}}" aria-label="{{nomeIntero}}" style="display: inline-flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 44px; padding: 4px 12px; background: {{sfondo}}; border: 2px solid {{bordo}}; border-left-width: 2px; color: {{colore}}; font-family: {{cond}}; font-variant-numeric: tabular-nums; white-space: nowrap">
  <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.08em">{{nome}}</span>
  <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: {{coloreStato}}">{{stato}}</span>
</span>
</x-dc>
<script data-dc-script data-props='{"nome":{"editor":"text","default":"PAOLA"},"stato":{"editor":"enum","options":["IN REGOLA","DA SISTEMARE","RIFIUTATA"],"default":"IN REGOLA"},"acceso":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro","sito"],"default":"sito","section":"Tema"},"$preview":{"width":150,"height":50}}'>
// PROPOSTA (../razionalizza-iscritti/): la chip «di chi vedi la pagina» (.mia-chip-tasto di MiaChip, tipo tasto) con sotto lo stato della persona: l'elenco
// del tab NUCLEO si fonde con questo selettore. Stato sempre in parole, mai solo colore: DA SISTEMARE col puntino (giallo-testo, sul tasto acceso `text`
// per il contrasto), RIFIUTATA rosso-testo, IN REGOLA `dim`.
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', line: '#333333', text: '#f2f2f0', dim: '#8c8c88', gialloTesto: '#f4c31b', rossoTesto: '#ff5a52', verdeTesto: '#16a54a', giallo: '#f4c31b', rosso: '#e4292a' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', dim: '#656561', gialloTesto: '#8f6a00', rossoTesto: '#b81d1d', verdeTesto: '#0b7a33', giallo: '#f4c31b', rosso: '#e4292a' },
  sito: { surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f', gialloTesto: '#8f6a00', rossoTesto: '#b81d1d', verdeTesto: '#0b7a33', giallo: '#f4c31b', rosso: '#e4292a' },
};
const truthy = (v) => v === true || v === 'true';
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
class Component extends DCLogic {
  renderVals() {
    const p = this.props, c = T[p.tema] || T.sito, on = truthy(p.acceso), stato = p.stato || 'IN REGOLA';
    const guaio = stato !== 'IN REGOLA';
    const tono = stato === 'RIFIUTATA' ? c.rossoTesto : c.gialloTesto;
    return {
      cond: COND, nome: p.nome ?? 'PAOLA', stato: guaio ? '\u25cf ' + stato : stato, nomeIntero: (p.nome ?? 'PAOLA') + ', ' + stato.toLowerCase(),
      acceso: on ? 'true' : 'false', sfondo: on ? c.surface2 : c.surface, bordo: on ? c.text : c.line, colore: on ? c.text : c.dim,
      coloreStato: guaio ? (on && stato !== 'RIFIUTATA' ? c.text : tono) : c.dim,
    };
  }
}
</script>
</body>
</html>
