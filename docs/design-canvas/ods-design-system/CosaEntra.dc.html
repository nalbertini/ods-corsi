<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il riquadro COSA ENTRA di Importa.tsx (`.sg-riquadro` + `Riga` di comune.tsx + `.sg-cosa-entra`, 3 colonne,
     e `Conto`: numero 30px 700, testo 13px dim). conti: "n|testo;n|testo". nota: la frase `.sg-sotto` sotto. -->
<div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; background: {{c.surface}}; border: 2px solid {{bordo}}; min-width: 0">
  <div style="display: flex; align-items: baseline; gap: 10px">
    <span style="font-family: {{cond}}; font-size: 14px; font-weight: 700; letter-spacing: 0.22em; color: {{c.dim}}">{{titolo}}</span>
    <div style="flex-grow: 1; height: 2px; background: {{c.lineSoft}}"></div>
  </div>
  <div style="display: grid; grid-template-columns: repeat({{colonne}}, minmax(0, 1fr)); gap: 16px">
    <sc-for list="{{conti}}" as="x" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 700; line-height: 1">{{x.n}}</span>
        <span style="font-size: 13px; color: {{c.dim}}">{{x.testo}}</span>
      </div>
    </sc-for>
  </div>
  <span style="font-size: 14px; color: {{c.dim}}">{{nota}}</span>
</div>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"COSA ENTRA"},"conti":{"editor":"text","default":"0|sale nuove;2|istruttori nuovi · 1 già in palestra;4|corsi nuovi;9|giorni di lezione nuovi;118|iscritti nuovi;143|iscrizioni ai corsi"},"nota":{"editor":"text","default":""},"colonne":{"editor":"int","default":3,"min":2,"max":3},"$preview":{"width":560,"height":240},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"}}'>
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', bg: '#121212', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', giallo: '#f4c31b', gialloTesto: '#f4c31b', verde: '#16a54a', verdeTesto: '#16a54a' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', bg: '#f4f4f1', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', giallo: '#f4c31b', gialloTesto: '#8f6a00', verde: '#12913f', verdeTesto: '#0b7a33' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const MONO = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const conti = String(p.conti ?? '').split(';').filter(Boolean).map((s) => { const i = s.indexOf('|'); return { n: s.slice(0, i), testo: s.slice(i + 1) }; });
    return { c, cond: COND, bordo: c.line, titolo: p.titolo ?? 'COSA ENTRA', conti, nota: p.nota ?? '', colonne: Number(p.colonne ?? 3) };
  }
}
</script>
</body>
</html>
