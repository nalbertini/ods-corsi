<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Il sito pubblico usa Big Shoulders Display e Inter (src/lib/sitoGenera.ts); qui il canvas li prende da Google Fonts, come per Saira e Barlow. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="position: relative; height: 100%; min-height: {{minimo}}; background: {{bg}}; color: {{fg}}; border-radius: 6px; padding: {{pad}}; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; outline: {{contorno}}; outline-offset: -3px">
  <sc-if value="{{haNota}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: -12px; right: 12px; z-index: 2; background: #ffffff; color: #0d2a3d; border: 2px solid #e4292a; border-radius: 4px; padding: 4px 8px; font-family: {{inter}}; font-size: 12px; font-weight: 700; line-height: 1.2">{{nota}}</span></sc-if>
  <div style="display: flex; flex-direction: {{dir}}; justify-content: space-between; align-items: {{allinea}}; gap: 6px 16px">
    <div style="font-family: {{big}}; text-transform: uppercase; font-weight: 800; font-size: {{corpoNome}}; line-height: .95">{{nome}}</div>
    <div style="font-family: {{big}}; font-weight: 800; font-size: {{corpoNome}}; line-height: .95; white-space: nowrap">{{ora}}</div>
  </div>
  <div style="display: flex; flex-direction: {{dirSotto}}; justify-content: space-between; gap: 4px 16px; font-family: {{inter}}; font-size: {{corpo}}; line-height: 1.4; font-weight: 500"><span>{{giorni}}</span><span>{{eta}}</span></div>
</div>
</x-dc>
<script data-dc-script data-props='{"nome":{"editor":"text","default":"Judo 2"},"ora":{"editor":"text","default":"17:00 – 18:00"},"giorni":{"editor":"text","default":"lun · mer · ven"},"eta":{"editor":"text","default":"7-9 anni · nati 2019-2017"},"tono":{"editor":"enum","options":["blu","giallo","inchiostro","chiara","bianco"],"default":"chiara"},"piccolo":{"editor":"boolean","default":false},"nota":{"editor":"text","default":""},"$preview":{"width":660,"height":170}}'>
// PROPOSTA pagina del corso: una tessera dell'orario (nome del gruppo, ora, giorni, anni di nascita). Tutte alte uguali nella stessa riga (150px); l'ultimo gruppo (o quello per gli agonisti) puo' essere giallo.
// Oggi: tessera da 170px con la riga dei giorni staccata dal titolo e una riga sola in coda con meta' vuota (corso.md). Sul telefono nome e ora vanno uno sotto l'altro (31px, «Judo principianti» non si spezza).
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
// Colori del sito (sito-approvato/token-proposta.md, A2). Il testo sul blu e sull'inchiostro e' bianco (5,4:1 e 14,8:1); sul giallo e sul chiaro e' inchiostro.
const TONI = { blu: ['#14709f', '#ffffff'], giallo: ['#f4c31b', '#0d2a3d'], inchiostro: ['#0d2a3d', '#ffffff'], chiara: ['#cfe6f4', '#0d2a3d'], bianco: ['#ffffff', '#0d2a3d'] };
const truthy = (v) => v === true || v === 'true';
// [DA CONFERMARE]: un dato che manca resta col testo di oggi, ma ben marcato (contorno rosso tratteggiato + cartellino).
const segna = (nota) => ({ haNota: !!nota, nota: nota || '', contorno: nota ? '3px dashed #e4292a' : 'none' });
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const [bg, fg] = TONI[p.tono] || TONI.chiara;
    const pic = truthy(p.piccolo);
    return { big: BIG, inter: INTER, bg, fg, nome: p.nome ?? '', ora: p.ora ?? '', giorni: p.giorni ?? '', eta: p.eta ?? '', minimo: pic ? '150px' : '150px', pad: pic ? '18px 20px' : '24px 28px', corpoNome: pic ? '34px' : '40px', corpo: pic ? '16px' : '18px', dir: pic ? 'column' : 'row', allinea: pic ? 'flex-start' : 'flex-start', dirSotto: pic ? 'column' : 'row', ...segna(p.nota) };
  }
}
</script>
</body>
</html>
