<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-start; width: 100%; min-height: 110px; padding: 14px 16px; text-align: left; background: {{c.surface}}; border: 2px solid {{c.line}}">
  <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.18em; color: {{c.dim}}">{{titolo}}</span>
  <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 44px; font-weight: 700; line-height: 1; color: {{coloreN}}">{{valore}}</span>
  <span style="font-size: 13px; color: {{c.dim}}">{{sotto}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"titolo":{"editor":"text","default":"SENZA CERTIFICATO"},"valore":{"editor":"text","default":"47"},"sotto":{"editor":"text","default":"in sala non entrano"},"guaio":{"editor":"boolean","default":true},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":260,"height":110}}'>
// Riproduzione di `Cifra` di src/components/segreteria/banco/Oggi.tsx con .bn-cifra, .bn-cifra-n e .bn-cifra-sotto (src/styles.css, sezione «Il Banco»).
// Fondo `surface`, bordo 2px `line`, padding 14px 16px, minimo 110px; il numero Saira 44px, rosso-testo se `guaio` e il valore non e' zero.
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', surfaceAlta: '#242424', menu: '#161616', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', rosso: '#e4292a', giallo: '#f4c31b', verde: '#16a54a', rossoTesto: '#ff5a52', verdeTesto: '#16a54a', suColore: '#121212' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', surfaceAlta: '#e9e9e5', menu: '#ebebe7', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', rossoTesto: '#b81d1d', verdeTesto: '#0b7a33', suColore: '#121212' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    return { c, tema: p.tema || 'scuro', titolo: p.titolo ?? 'SENZA CERTIFICATO', valore: p.valore ?? '47', sotto: p.sotto ?? 'in sala non entrano', coloreN: (p.guaio ?? true) && p.valore !== '0' ? c.rossoTesto : c.text };
  }
}
</script>
</body>
</html>
