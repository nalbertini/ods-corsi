<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Il sito pubblico usa Big Shoulders Display e Inter (src/lib/sitoGenera.ts); qui il canvas li prende da Google Fonts, come per Saira e Barlow. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<a style="position: relative; display: grid; grid-template-columns: 80px minmax(0, 1fr); align-items: stretch; min-height: 104px; background: {{bg}}; color: {{fg}}; border-radius: 6px; overflow: hidden; text-decoration: none">
  <sc-if value="{{haFoto}}" hint-placeholder-val="{{ true }}"><div style="overflow: hidden"><img src="{{foto}}" alt="{{alt}}" style="display: block; width: 100%; height: 100%; object-fit: cover; object-position: {{fuoco}}"></div></sc-if>
  <sc-if value="{{senzaFoto}}" hint-placeholder-val="{{ false }}"><div style="background: #cfe6f4; display: flex; align-items: center; justify-content: center"><span aria-hidden="true" style="font-family: {{big}}; font-weight: 800; font-size: 48px; line-height: 1; color: #14709f">{{iniziale}}</span></div></sc-if>
  <div style="display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 12px 56px 12px 16px">
    <div style="font-family: {{big}}; text-transform: uppercase; font-weight: 800; font-size: 22px; line-height: .95">{{titolo}}</div>
    <div style="font-family: {{inter}}; font-size: 15px; line-height: 1.35"><b>{{eta}}</b><div style="display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden">{{testo}}</div></div>
  </div>
  <span aria-hidden="true" style="position: absolute; top: 50%; right: 12px; margin-top: -20px; width: 40px; height: 40px; border-radius: 50%; background: #ffffff; color: #0d2a3d; display: flex; align-items: center; justify-content: center; font-family: {{inter}}; font-size: 20px; font-weight: 600; line-height: 1">↗</span>
</a>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"Judo"},"eta":{"editor":"text","default":"Dai 7 anni"},"testo":{"editor":"text","default":"Tecnica, disciplina e rispetto."},"tono":{"editor":"enum","options":["blu","giallo","inchiostro","chiara"],"default":"blu"},"foto":{"editor":"text","default":""},"fuoco":{"editor":"text","default":"50% 40%"},"alt":{"editor":"text","default":""},"$preview":{"width":343,"height":104}}'>
// PROPOSTA Home del sito sul telefono: la scheda corso compatta (una riga da 104px, foto o iniziale in una colonna da 80px a sinistra, titolo, eta' e una frase di due righe al massimo, freccia). Tutta la riga e' il link (come la scheda grande: il titolo copre la riga). Colori dei gruppi di eta': giallo (piccoli), blu (ragazzi), inchiostro (dai 14 anni).
// Senza foto: quadrato azzurro #cfe6f4 con l'iniziale in blu, come la fascia di SitoSchedaCorso ma da 48px (non 96).
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const TONI = { blu: ['#14709f', '#ffffff'], giallo: ['#f4c31b', '#0d2a3d'], inchiostro: ['#0d2a3d', '#ffffff'], chiara: ['#cfe6f4', '#0d2a3d'] };
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const t = TONI[p.tono] || TONI.blu;
    const haFoto = !!p.foto;
    return { big: BIG, inter: INTER, bg: t[0], fg: t[1], haFoto, senzaFoto: !haFoto, foto: p.foto || '', fuoco: p.fuoco || '50% 40%', alt: p.alt || '', iniziale: (p.titolo || '?').trim().charAt(0).toUpperCase(), titolo: p.titolo ?? '', eta: p.eta ?? '', testo: p.testo ?? '' };
  }
}
</script>
</body>
</html>
