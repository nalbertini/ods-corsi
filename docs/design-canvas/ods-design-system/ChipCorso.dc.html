<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<ul style="display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; font-family: {{corpoFam}}; color: {{c.text}}">
  <li style="display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 44px; padding: 0 0 0 12px; border: 2px solid {{c.blu}}; background: {{c.surface}}; font-size: 15px; font-weight: 600"><span style="min-width: 0; overflow-wrap: anywhere">{{nome}}</span><span style="flex: none; font-size: 14px; font-weight: 400; color: {{c.dim}}">· {{stato}}</span><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; flex: none; width: 44px; height: 44px; font-size: 18px; opacity: {{opacita}}">&#10005;</span></li>
</ul>
</x-dc>
<script data-dc-script data-props='{"nome":{"editor":"text","default":"Judo adulti"},"stato":{"editor":"enum","options":["2 orari","1 orario","senza giorni","archiviato"],"default":"2 orari"},"disabled":{"editor":"boolean","default":false},"$preview":{"width":420,"height":60}}'>
// Riproduzione 1:1 di .sito-corso-chip e .sito-chip-x di src/styles.css (blocco «L'orario dai corsi nel pannello SITO»), dentro
// OrarioSito.tsx: un corso collegato alla pagina. Alto 44px, padding 0 0 0 12px, bordo 2px `blu` (quadrato: il raggio del look non
// arriva qui), fondo `surface`, nome 15px 600; poi «· N orari» / «· 1 orario» / «· senza giorni» / «· archiviato» in .sg-sotto (14px `dim`);
// in fondo la ✕ da 44x44px (aria-label «Scollega <corso>»; con `disabled` opacita' 0.5). Il nome lungo va a capo, non esce.
const T = {
  sito: { surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', sec: '#0d2a3d', dim: '#46606f', blu: '#14709f', giallo: '#f4c31b', gialloTesto: '#8f6a00' },
};
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const BODY = "Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif";
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
    return { c, corpoFam: INTER, nome: p.nome ?? 'Judo adulti', stato: p.stato ?? '2 orari', opacita: p.disabled === true || p.disabled === 'true' ? '0.5' : '1' };
  }
}
</script>
</body>
</html>
