<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Il sito pubblico usa Big Shoulders Display e Inter (src/lib/sitoGenera.ts); qui il canvas li prende da Google Fonts, come per Saira e Barlow. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="position: relative; height: {{alto}}; background: {{bg}}; color: {{fg}}; border-radius: 6px; padding: {{pad}}; display: flex; flex-direction: column; justify-content: space-between; outline: {{contorno}}; outline-offset: -3px">
  <div>
    <div style="min-height: 36px"><sc-if value="{{haNota}}" hint-placeholder-val="{{ false }}"><div style="margin-bottom: 8px"><span style="display: inline-block; background: #ffffff; color: #0d2a3d; border: 2px solid #e4292a; border-radius: 4px; padding: 4px 8px; font-family: {{inter}}; font-size: 12px; font-weight: 700; line-height: 1.2">{{nota}}</span></div></sc-if></div>
    <sc-if value="{{ i_telefono }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;margin-bottom:10px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></sc-if><sc-if value="{{ i_email }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;margin-bottom:10px"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></sc-if><sc-if value="{{ i_instagram }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;margin-bottom:10px"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg></sc-if><sc-if value="{{ i_facebook }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;margin-bottom:10px"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></sc-if><sc-if value="{{ i_indirizzo }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;margin-bottom:10px"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></sc-if><sc-if value="{{ i_orologio }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block;margin-bottom:10px"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></sc-if>
    <div style="font-family: {{big}}; text-transform: uppercase; font-weight: 800; font-size: {{corpoTitolo}}; line-height: .9">{{titolo}}</div>
  </div>
  <div>
    <div style="font-family: {{big}}; text-transform: uppercase; font-weight: 800; font-size: {{corpoValore}}; line-height: .95">{{valore}}</div>
    <div style="font-family: {{inter}}; font-size: {{corpoAzione}}; line-height: 1.3; margin-top: 10px; display: flex; align-items: center; min-height: 48px; font-weight: 600; border-top: 2px solid {{fg}}; padding-top: 4px">{{azione}}</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"Telefono"},"valore":{"editor":"text","default":"346 329 2786"},"azione":{"editor":"text","default":"Chiama ora →"},"tono":{"editor":"enum","options":["blu","giallo","inchiostro","chiara","bianco"],"default":"giallo"},"alto":{"editor":"text","default":"200px"},"piccolo":{"editor":"boolean","default":false},"nota":{"editor":"text","default":""},"icona":{"editor":"enum","options":["","telefono","email","instagram","facebook","indirizzo","orologio"],"default":""},"$preview":{"width":330,"height":200}}'>
// PROPOSTA contatti del sito: un recapito (telefono, Instagram, Facebook, indirizzo) come tessera intera e cliccabile, tutte alte uguali.
// Il cartellino [DA CONFERMARE] sta nel flusso sopra il titolo (non sopra il testo); la riga del cartellino è riservata anche senza, così i titoli stanno allineati.
// Icona (opzionale): 32px a tratto, decorativa (aria-hidden), sopra il titolo; eredita il colore del testo, quindi lo stesso contrasto. Nel sito vero la sceglie sitoContatti.ts dal link d'azione.
// Oggi: la tessera non e' un link, solo il testo sottolineato (39px di altezza). Qui l'azione in fondo e' una riga da 48px: chi tocca la tessera ha il bersaglio.
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
// Colori del sito (sito-approvato/token-proposta.md, A2). Il testo sul blu e sull'inchiostro e' bianco (5,4:1 e 14,8:1); sul giallo e sul chiaro e' inchiostro.
const TONI = { blu: ['#14709f', '#ffffff'], giallo: ['#f4c31b', '#0d2a3d'], inchiostro: ['#0d2a3d', '#ffffff'], chiara: ['#cfe6f4', '#0d2a3d'], bianco: ['#ffffff', '#0d2a3d'] };
const truthy = (v) => v === true || v === 'true';
// [DA CONFERMARE]: un dato che manca resta col testo di oggi, ma ben marcato (contorno rosso tratteggiato + cartellino).
const segna = (nota) => ({ haNota: !!nota, nota: nota || '', contorno: nota ? '3px dashed #e4292a' : 'none' });
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const [bg, fg] = TONI[p.tono] || TONI.giallo;
    const pic = truthy(p.piccolo);
    return { bg, fg, big: BIG, inter: INTER, titolo: p.titolo ?? '', valore: p.valore ?? '', azione: p.azione ?? '', alto: p.alto || '200px', pad: pic ? '18px 20px' : '22px 24px', corpoTitolo: pic ? '36px' : '44px', corpoValore: pic ? '30px' : '34px', corpoAzione: pic ? '17px' : '18px', ...Object.fromEntries(['telefono', 'email', 'instagram', 'facebook', 'indirizzo', 'orologio'].map((k) => ['i_' + k, p.icona === k])), ...segna(p.nota) };
  }
}
</script>
</body>
</html>
