<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- La testata della schermata del timer: tasto di chiusura, nome e sottotitolo, il segno MAURIZIO e RESET. Riproduce `.timer-top`, `.titolo-timer`, `.icon-btn`, `.icon-btn.testo` e `.badge` di timer/src/styles.css (righe 191-193, 292-296, 605) e le righe 288-330 di timer/src/components/TimerScreen.tsx; l'icona e' Close di timer/src/components/Icons.tsx.
     nome in maiuscolo come nel codice (massimo due righe). sotto = la riga dim (SERIE 2 / 3, oppure la descrizione dello schema). maurizio = il segno giallo (coach acceso nelle impostazioni). -->
<div style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 20px 0">
  <div style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 2px solid {{c.line}}; color: {{c.tasto}}">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
  </div>
  <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 1px; min-width: 0">
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 18px; font-weight: 700; line-height: 1.05; color: {{c.text}}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{nome}}</span>
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.18em; color: {{c.dim}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{sotto}}</span>
  </div>
  <sc-if value="{{maurizio}}" hint-placeholder-val="{{ true }}">
    <span style="align-self: center; padding: 5px 9px; background: {{c.giallo}}; color: {{c.suColore}}; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; white-space: nowrap">MAURIZIO</span>
  </sc-if>
  <div style="min-width: 44px; height: 44px; flex-shrink: 0; padding: 0 11px; display: flex; align-items: center; justify-content: center; border: 2px solid {{c.line}}; color: {{c.tasto}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em">RESET</div>
</div>
</x-dc>
<script data-dc-script data-props='{"nome":{"editor":"text","default":"TABATA"},"sotto":{"editor":"text","default":"SERIE 2 / 3"},"maurizio":{"editor":"boolean","default":true},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":420,"height":58}}'>
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', surface2: '#242424', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', faint: '#5a5a56', tasto: '#b8b8b2', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suColore: '#121212', suRosso: '#ffffff' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', faint: '#a8a8a3', tasto: '#4a4a46', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#121212', suRosso: '#ffffff' },
};
const truthy = (v) => v === true || v === 'true';
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      c: T[p.tema] || T.scuro,
      nome: String(p.nome ?? 'TABATA').toUpperCase(),
      sotto: String(p.sotto ?? '').toUpperCase(),
      maurizio: p.maurizio === undefined ? true : truthy(p.maurizio),
    };
  }
}
</script>
</body>
</html>
