<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Big+Shoulders+Display:wght@800&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div role="tablist" aria-label="Iscritti" style="display: flex; gap: {{gap}}; align-self: flex-start; width: {{larghezza}}; max-width: 100%">
  <sc-for list="{{schede}}" as="x" hint-placeholder-count="2">
    <span role="tab" aria-label="{{x.nomeIntero}}" aria-selected="{{x.selezionata}}" style="display: inline-flex; flex-direction: {{direzione}}; align-items: center; justify-content: center; flex: {{x.flex}}; min-width: 0; gap: {{gapDentro}}; min-height: 44px; padding: {{padding}}; white-space: {{aCapo}}; text-align: center; background: {{x.sfondo}}; border: 2px solid {{x.bordo}}; font-family: {{carattere}}; font-size: {{corpoNome}}; font-weight: 700; letter-spacing: {{spazioNome}}; color: {{x.colore}}">{{x.testo}}<span style="font-size: {{corpoSegno}}; letter-spacing: {{spazioSegno}}; color: {{x.coloreSegno}}">{{x.segno}}</span></span>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"acceso":{"editor":"enum","options":["ELENCO","PAGAMENTI"],"default":"ELENCO"},"telefono":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro","sito"],"default":"sito","section":"Tema"},"$preview":{"width":420,"height":50}}'>
// PROPOSTA «iscritti unico» (../iscritti-unico/): le due schede ELENCO | PAGAMENTI in cima alla voce ISCRITTI, stesso pattern di
// SchedeIscritto e SchedeCorso (.schede / .scheda / .sg-schede: alte 44px, bordo 2px, 0.18em, quella accesa con fondo `surface-2`, bordo e testo `text`).
// Si apre sempre su ELENCO. `telefono`: le due schede a colonne uguali sulla larghezza, senza scorrere.
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', line: '#333333', text: '#f2f2f0', dim: '#8c8c88' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', dim: '#656561' },
  sito: { surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f' },
};
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.sito;
    const acceso = p.acceso || 'ELENCO';
    const tel = truthy(p.telefono);
    const schede = ['ELENCO', 'PAGAMENTI'].map((nome) => {
      const on = nome === acceso;
      return { nomeIntero: nome, testo: nome, segno: '', coloreSegno: c.dim, selezionata: on ? 'true' : 'false', flex: tel ? '1 1 0' : '0 0 auto', sfondo: on ? c.surface2 : c.surface, bordo: on ? c.text : c.line, colore: on ? c.text : c.dim };
    });
    return {
      schede, c, gap: '4px',
      carattere: p.tema === 'scuro' || p.tema === 'chiaro' ? "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif" : "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif", larghezza: tel ? '100%' : 'fit-content',
      direzione: 'row', gapDentro: '8px', padding: tel ? '0 8px' : '0 18px', corpoSegno: '11px', corpoNome: '14px', aCapo: 'nowrap', spazioNome: tel ? '0.1em' : '0.18em', spazioSegno: '0.1em',
    };
  }
}
</script>
</body>
</html>
