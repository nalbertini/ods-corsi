<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 14px 20px 4px; color: {{c.text}}">
  <div style="display: flex; gap: 10px">
    <sc-for list="{{tappe}}" as="t" hint-placeholder-count="3">
      <div style="flex-grow: {{t.quanti}}; flex-basis: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; gap: 3px">
          <sc-for list="{{t.segmenti}}" as="s" hint-placeholder-count="3">
            <div style="flex: 1; height: 6px; background: {{s.colore}}"></div>
          </sc-for>
        </div>
        <span style="font-family: {{cond}}; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: {{t.colore}}">{{t.etichetta}}</span>
      </div>
    </sc-for>
  </div>
  <span style="font-family: {{cond}}; font-size: 24px; font-weight: 700; letter-spacing: 0.12em; line-height: 1.15; color: {{c.text}}">{{titolo}}</span>
</div>
</x-dc>
<script data-dc-script data-props='{"numero":{"editor":"text","default":"3"},"totale":{"editor":"text","default":"8"},"titolo":{"editor":"text","default":"CORSO"},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":390,"height":100}}'>
// L'avanzamento del modulo a passi: `Avanzamento` di src/components/ds.tsx e `.avanza*` di src/styles.css, le tappe da `tappeDelPasso` di src/lib/passiIscrizione.ts.
// Tre tappe affiancate (CHI, IL CORSO, PAGA E MANDA), gap 10px, larghe quanto i loro passi: segmenti da 6px, gap 3px (fatti `verde`, quello di adesso `text`, gli altri `line`);
// sotto il nome in Saira 12px 0.14em: `text` la tappa di adesso, `verdeTesto` con ✓ quella finita, `dim` le altre. Poi il nome del passo in Saira 24px 0.12em.
// Il numero a schermo non c'è: per chi legge lo schermo resta «Passo N di N: nome». `totale` 7 = adulto (CHI ha 1 passo), 8 = figlio (CHI ne ha 2).
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', tasto: '#b8b8b2', rosso: '#e4292a', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suRosso: '#ffffff', suColore: '#121212' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', tasto: '#4a4a46', rosso: '#e4292a', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suRosso: '#ffffff', suColore: '#121212' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const n = Number(p.numero ?? 2);
    const tot = Number(p.totale ?? 4);
    // Le tappe come tappeDelPasso: adulto [1,3,3], figlio [2,3,3]; un totale diverso (canvas vecchi) si divide in tre.
    const quanti = tot === 8 ? [2, 3, 3] : tot === 7 ? [1, 3, 3] : [Math.ceil(tot / 3), Math.ceil((tot - Math.ceil(tot / 3)) / 2), tot - Math.ceil(tot / 3) - Math.ceil((tot - Math.ceil(tot / 3)) / 2)];
    const nomi = ['CHI', 'IL CORSO', 'PAGA E MANDA'];
    let da = 0;
    const tappe = nomi.map((nome, k) => {
      const passi = Array.from({ length: quanti[k] }, (_, i) => da + i + 1);
      da += quanti[k];
      const fatta = passi.every((x) => x < n);
      const adesso = passi.includes(n);
      return {
        quanti: quanti[k],
        etichetta: fatta ? '✓ ' + nome : nome,
        colore: fatta ? c.verdeTesto : adesso ? c.text : c.dim,
        segmenti: passi.map((x) => ({ colore: x < n ? c.verde : x === n ? c.text : c.line })),
      };
    });
    return { c, cond: COND, tappe, titolo: p.titolo ?? 'CORSO' };
  }
}
</script>
</body>
</html>
