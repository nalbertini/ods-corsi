<!doctype html>
<html>

<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<sc-if value="{{una}}" hint-placeholder-val="{{ true }}">
  <svg aria-hidden="{{nascosta}}" role="{{ruolo}}" aria-label="{{etichetta}}" width="{{misura}}" height="{{misura}}" viewBox="0 0 24 24" fill="none" stroke="{{colore}}" stroke-width="{{tratto}}" stroke-linecap="round" stroke-linejoin="round" style="display: block; flex: none">
    <sc-for list="{{tratti}}" as="d" hint-placeholder-count="2"><path d="{{d}}"></path></sc-for>
  </svg>
</sc-if>
<sc-if value="{{tutte}}" hint-placeholder-val="{{ false }}">
  <div style="display: grid; grid-template-columns: repeat(8, 112px); gap: 8px; padding: 20px; background: {{fondo}}; color: {{testo}}; width: 1000px">
    <sc-for list="{{elenco}}" as="x" hint-placeholder-count="12">
      <sc-if value="{{x.titolo}}" hint-placeholder-val="{{ false }}">
        <div style="grid-column: 1 / -1; padding: 14px 0 4px; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: {{dim}}">{{x.nome}}</div>
      </sc-if>
      <sc-if value="{{x.icona}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 10px; border: 1px solid {{x.bordo}}; border-radius: 6px; background: {{carta}}">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <sc-for list="{{x.tratti}}" as="d" hint-placeholder-count="2"><path d="{{d}}"></path></sc-for>
          </svg>
          <span style="font-size: 12px; font-weight: 600">{{x.nome}}</span>
          <span style="font-size: 10px; letter-spacing: 0.08em; color: {{x.coloreStato}}">{{x.stato}}</span>
        </div>
      </sc-if>
    </sc-for>
  </div>
</sc-if>
</x-dc>

  renderVals() {
    const p = this.props;

      una: !tutte, tutte, elenco,
      tratti: ICONE[nome] || ICONE.altro,
