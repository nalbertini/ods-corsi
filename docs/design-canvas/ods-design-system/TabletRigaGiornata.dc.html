<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 0 14px; background: {{c.surface}}; border: 2px solid {{c.bordo}}; color: {{c.text}}">
  <span style="width: 10px; height: 36px; flex-shrink: 0; background: {{tinta}}; opacity: {{opacita}}"></span>
  <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 19px; font-weight: 700; letter-spacing: 0.03em; text-wrap: balance; text-transform: uppercase">{{corso}}</span>
    <span style="display: flex; align-items: center; gap: 8px">
      <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 700; white-space: nowrap; flex-shrink: 0; color: {{c.dim}}">{{ora}}</span>
      <sc-if value="{{haAttivita}}" hint-placeholder-val="{{ false }}">
        <span style="display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; min-width: 0; padding: 2px 8px; border: 2px solid {{c.line}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; line-height: 1.2; color: {{c.sec}}; text-transform: uppercase">{{attivita}}</span>
      </sc-if>
    </span>
  </div>
  <span style="display: inline-flex; gap: 3px; flex-shrink: 0">
    <sc-for list="{{kanji}}" as="k" hint-placeholder-count="1">
      <span style="display: inline-grid; place-items: center; width: 22px; height: 22px; border: 1.5px solid #e4292a; border-radius: 3px; color: {{c.rossoTesto}}; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', 'Noto Serif JP', serif; font-size: 15px; font-weight: 700; line-height: 1">{{k.segno}}</span>
    </sc-for>
  </span>
  <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; white-space: nowrap; color: {{coloreFase}}">{{testoFase}}</span>
</div>
</x-dc>
<script data-dc-script data-props='{"corso":{"editor":"text","default":"Lotta 2"},"ora":{"editor":"text","default":"17:00–18:00"},"kanji":{"editor":"text","default":"闘"},"attivita":{"editor":"text","default":""},"tinta":{"editor":"text","default":"#16a54a"},"fase":{"editor":"enum","options":["finita","aperta","dopo"],"default":"aperta"},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":380,"height":70}}'>
// Riproduzione 1:1 di .tb-giornata-riga in src/components/tablet/TabletHome.tsx (righe 148-162) con
// .tb-giornata-riga, .tb-tacca, .tb-fase in src/styles.css (righe 901-911): una lezione di OGGI IN QUESTA SALA.
// - attivita: l'attivita' del giorno, a bordo accanto all'ora (proposta, vedi TabletLezione).
// - fase aperta: bordo verde, scritta SI SEGNA ORA in verde-testo. dopo: PIU' TARDI, tutto spento di default.
//   finita: si spengono barra (opacita' 0.4) e bordo (line-soft), non le scritte, che devono ancora leggersi.
const T = {
  scuro: { surface: '#1c1c1c', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', verde: '#16a54a', verdeTesto: '#16a54a', rossoTesto: '#ff5a52' },
  chiaro: { surface: '#ffffff', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', verde: '#12913f', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d' },
};
const FASE = { finita: 'FINITA', aperta: 'SI SEGNA ORA', dopo: 'PIÙ TARDI' };
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const fase = FASE[p.fase] ? p.fase : 'aperta';
    return {
      c,
      bordo: fase === 'aperta' ? c.verde : fase === 'finita' ? c.lineSoft : c.line,
      opacita: fase === 'finita' ? '0.4' : '1',
      corso: p.corso ?? 'Lotta 2',
      attivita: p.attivita ?? '',
      haAttivita: !!p.attivita,
      ora: p.ora ?? '17:00–18:00',
      kanji: [...String(p.kanji ?? '')].map((segno) => ({ segno })),
      tinta: p.tinta || '#16a54a',
      testoFase: FASE[fase],
      coloreFase: fase === 'aperta' ? c.verdeTesto : c.dim,
    };
  }
}
</script>
</body>
</html>
