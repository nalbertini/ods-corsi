<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div role="tablist" style="display: grid; grid-auto-flow: column; grid-auto-columns: {{colonna}}; gap: 4px; width: {{larghezza}}; max-width: 100%">
  <sc-for list="{{schede}}" as="x" hint-placeholder-count="4">
    <span role="tab" aria-selected="{{x.selezionata}}" style="display: inline-flex; flex-direction: {{direzione}}; align-items: center; justify-content: center; gap: {{gap}}; min-height: 44px; min-width: 0; padding: {{padding}}; background: {{x.sfondo}}; border: 2px solid {{x.bordo}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: {{corpo}}; font-weight: 700; letter-spacing: {{spaziatura}}; color: {{x.colore}}; white-space: nowrap">
      <sc-if value="{{x.conIcona}}" hint-placeholder-val="{{ true }}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="flex: none">
          <sc-for list="{{x.tratti}}" as="d" hint-placeholder-count="2"><path d="{{d}}"></path></sc-for>
        </svg>
      </sc-if>
      <span>{{x.testo}}</span>
      <span style="font-variant-numeric: tabular-nums; letter-spacing: 0.04em; color: {{x.coloreConto}}">{{x.conto}}</span>
    </span>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"barra":{"editor":"enum","options":["contabilita","corso","presenze"],"default":"contabilita"},"acceso":{"editor":"int","default":0},"conIcone":{"editor":"boolean","default":true},"telefono":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro"},"$preview":{"width":520,"height":48}}'>
// PROPOSTA «icone sulle linguette»: le barre a schede di CONTABILITA' (Contabilita.tsx), del corso (Corsi.tsx) e di PRESENZE
// (Segreteria.tsx), con gli stessi .schede / .scheda / .sg-schede di src/styles.css: alte 44px, bordo 2px, Saira 14px 700 0.18em,
// quella accesa con fondo `surface-2`, bordo e testo `text`. L'icona e' una di quelle del menu (`ICONE_SCHEDE` in src/components/Icons.tsx),
// 18px, tratto 1.75, decorativa. `telefono`: sotto i 560px l'icona sta sopra la parola, perche' quattro linguette fianco a fianco non ci stanno.
// `acceso` e' la posizione della linguetta accesa; `conIcone` falso e' com'e' oggi.
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', line: '#333333', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', sec: '#3d3d3a', dim: '#656561' },
};
// Tratti copiati da ICONE_MENU / ICONE_CONTI (rect e circle riscritti come path).
const IC = {
  frecce: ['M15 4l4 4-4 4', 'M5 8h14', 'M9 20l-4-4 4-4', 'M19 16H5'],
  bilancio: ['M12 20V10M18 20V4M6 20v-4'],
  voci: ['M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z', 'M7 6a1 1 0 1 0 0 2 1 1 0 0 0 0-2z'],
  casse: ['M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z', 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z', 'M6 12h.01M18 12h.01'],
  dati: ['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', 'M14 2v6h6M9 13h6M9 17h4'],
  iscritti: ['M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2', 'M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z', 'M22 21v-2a4 4 0 0 0-3-3.87', 'M16 3.13a4 4 0 0 1 0 7.75'],
  mese: ['M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', 'M16 2v4M8 2v4M3 10h18'],
  segnalate: ['M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z', 'M4 22v-7'],
};
const BARRE = {
  contabilita: [['MOVIMENTI', 'frecce'], ['BILANCIO', 'bilancio'], ['VOCI', 'voci'], ['CASSE', 'casse']],
  corso: [['DATI', 'dati'], ['ISCRITTI', 'iscritti', '14/20']],
  presenze: [['IL MESE', 'mese'], ['SEGNALATE', 'segnalate', '3']],
};
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const tel = truthy(p.telefono);
    const con = p.conIcone === undefined ? true : truthy(p.conIcone);
    const acceso = Number(p.acceso) || 0;
    const voci = BARRE[p.barra] || BARRE.contabilita;
    const schede = voci.map(([testo, icona, conto], i) => ({
      testo, conto: conto || '', tratti: IC[icona], conIcona: con, coloreConto: c.sec, selezionata: i === acceso ? 'true' : 'false',
      sfondo: i === acceso ? c.surface2 : c.surface, bordo: i === acceso ? c.text : c.line, colore: i === acceso ? c.text : c.dim,
    }));
    const sopra = con && tel;
    return {
      schede,
      colonna: tel ? 'minmax(0, 1fr)' : 'minmax(150px, auto)',
      larghezza: tel ? '358px' : 'fit-content',
      direzione: sopra ? 'column' : 'row',
      gap: sopra ? '2px' : '8px',
      padding: sopra ? '4px' : '0 18px',
      corpo: sopra ? '13px' : '14px',
      spaziatura: sopra ? '0.06em' : '0.18em',
    };
  }
}
</script>
</body>
</html>
