<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 100%; color: {{c.text}}">
  <sc-if value="{{eSconto}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; background: {{c.surface}}; border: 2px solid {{c.verde}}">
      <span style="flex: none; font-family: {{cond}}; font-size: 30px; font-weight: 700; line-height: 1; color: {{c.verdeTesto}}">−20%</span>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: {{cond}}; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: {{c.verdeTesto}}">SCONTO FAMIGLIA</span>
        <span style="font-size: 14px; line-height: 1.4">{{testoSconto}}</span>
      </span>
    </div>
  </sc-if>
  <sc-if value="{{eCarta}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; background: {{c.surface}}; border: 2px solid {{c.line}}">
      <span style="font-family: {{cond}}; font-size: 22px; font-weight: 700; letter-spacing: 0.04em">{{titolo}}</span>
      <span style="font-size: 15px; line-height: 1.45">{{frase}}</span>
      <sc-if value="{{haOra}}" hint-placeholder-val="{{ true }}">
        <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: {{c.sec}}"><span style="font-family: {{cond}}; font-size: 11px; font-weight: 700; letter-spacing: 0.16em; padding: 3px 6px; border: 2px solid {{c.line}}">STESSA ORA</span>{{stessaOra}}</span>
      </sc-if>
      <sc-if value="{{haRisparmio}}" hint-placeholder-val="{{ true }}">
        <span style="font-size: 13px; font-weight: 600; color: {{c.verdeTesto}}">{{risparmio}}</span>
      </sc-if>
      <span style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 4px; border: 2px dashed {{c.tratteggio}}; font-family: {{cond}}; font-style: oblique 9deg; font-size: 16px; font-weight: 700; letter-spacing: 0.16em; color: {{c.tasto}}">{{tasto}}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"tipo":{"editor":"enum","options":["carta","sconto"],"default":"carta"},"titolo":{"editor":"text","default":"UN FIGLIO O UNA FIGLIA"},"frase":{"editor":"text","default":"Mentre fai Judo adulti, si allena anche lui: c\u2019è un corso per bambini alla stessa ora."},"stessaOra":{"editor":"text","default":"Judo 3 · lunedì e giovedì 18.00"},"risparmio":{"editor":"text","default":"Con Judo 3 annuale risparmiate 60 €"},"tasto":{"editor":"text","default":"+ AGGIUNGI UN FIGLIO"},"testoSconto":{"editor":"text","default":"Sull\u2019annuale che costa meno della famiglia. Più siete, più conviene."},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":360,"height":260}}'>
// Riproduzione del passo LA FAMIGLIA di src/components/IscrizioneAPassi.tsx (.famiglia-* di src/styles.css).
// tipo = sconto: il riquadro .card.famiglia-sconto, bordo `verde`, −20% Saira 30px e SCONTO FAMIGLIA in `verde-testo`, il testo 14px.
// tipo = carta: una carta di carteDellaFamiglia in un Riquadro: titolo Saira 22px (.famiglia-carta-titolo), la frase, la riga STESSA ORA
// (tag 11px con bordo `line`, poi i corsi 13px `sec`; vuota se nessun corso e' alla stessa ora), il risparmio 13px 600 `verde-testo`
// (vuoto se non si sa) e il tasto tratteggiato .btn-dashed (+ AGGIUNGI UN FIGLIO / UN ADULTO / UN BAMBINO).
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', surface2: '#242424', line: '#333333', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', faint: '#5a5a56', tasto: '#b8b8b2', tratteggio: '#4a4a46', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suColore: '#121212', suRosso: '#ffffff' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', sec: '#3d3d3a', dim: '#656561', faint: '#a8a8a3', tasto: '#4a4a46', tratteggio: '#b0b0aa', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#121212', suRosso: '#ffffff' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const ora = p.stessaOra ?? 'Judo 3 · lunedì e giovedì 18.00';
    const risparmio = p.risparmio ?? 'Con Judo 3 annuale risparmiate 60 €';
    return {
      c, cond: COND, eSconto: p.tipo === 'sconto', eCarta: p.tipo !== 'sconto',
      titolo: p.titolo ?? 'UN FIGLIO O UNA FIGLIA', frase: p.frase ?? '', stessaOra: ora, haOra: ora !== '', risparmio, haRisparmio: risparmio !== '',
      tasto: p.tasto ?? '+ AGGIUNGI UN FIGLIO', testoSconto: p.testoSconto ?? '',
    };
  }
}
</script>
</body>
</html>
