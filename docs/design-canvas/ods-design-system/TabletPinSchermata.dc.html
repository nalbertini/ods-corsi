<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 72px; width: 100%; height: 100%; padding: 22px 32px 24px; color: {{c.text}}">
  <div style="display: flex; flex-direction: column; gap: 16px; max-width: 380px">
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 36px; font-weight: 700; letter-spacing: 0.03em; line-height: 1">{{titolo}}</span>
    <span style="font-size: 18px; line-height: 1.5; color: {{c.sec}}">{{testo}}</span>
    <div style="display: flex; align-items: center; gap: 14px; padding: 8px 0">
      <sc-for list="{{pallini}}" as="x" hint-placeholder-count="4">
        <span style="width: 26px; height: 26px; border: 3px solid {{x.bordo}}; background: {{x.fondo}}"></span>
      </sc-for>
    </div>
    <sc-if value="{{haGuaio}}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 19px; font-weight: 700; color: {{c.rosso}}">{{guaio}}</span>
    </sc-if>
    <sc-if value="{{prova}}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 14px; line-height: 1.5; color: {{c.dim}}">In prova: 1234 è Maurizio, 2468 è Maura, 5678 è Fabio.</span>
    </sc-if>
    <span style="display: flex; align-items: center; justify-content: center; align-self: flex-start; min-height: 60px; padding: 0 22px; border: 2px solid {{c.line}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 18px; font-weight: 700; letter-spacing: 0.12em">ANNULLA</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, 110px); gap: 12px">
    <sc-for list="{{tasti}}" as="t" hint-placeholder-count="12">
      <span style="display: flex; align-items: center; justify-content: center; height: 96px; background: {{t.fondo}}; border: {{t.bordo}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: {{t.corpo}}; font-weight: 700; letter-spacing: 0.06em">{{t.testo}}</span>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"AREA ISTRUTTORE"},"testo":{"editor":"text","default":"Il tuo PIN a quattro cifre. Da qui fai l’appello completo e correggi le presenze segnate sul tablet. Durante una lezione ti segna anche la tua presenza."},"cifre":{"editor":"text","default":"2"},"guaio":{"editor":"text","default":""},"prova":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":1280,"height":608}}'>
// Riproduzione 1:1 della schermata del PIN del tablet (TabletPin.tsx, righe 69-117) con .tb-pin, .tb-pallino, .tb-tastiera, .tb-tasto
// di src/styles.css (righe 851 e 1078-1087). A sinistra, in una colonna da 380px al massimo: titolo da 36px (AREA ISTRUTTORE oppure,
// con `perUscire`, ESCI DAL TABLET), la spiegazione, i quattro pallini, l'errore e ANNULLA; a destra il tastierino da 110x96,
// con CANCELLA piccolo e la cella sotto l'8 vuota. Tutto centrato nel corpo del tablet (altezza tra testata e piede).
// TabletTastiera ha invece i pallini sopra i tasti, in una sola colonna: qui sono come nell'app.
// - cifre: quante cifre sono state battute (0-4). guaio: l'errore (PIN sbagliato. Riprova. / l'avviso del limite / il blocco); con un
//   testo i pallini hanno il bordo rosso e il messaggio e' rosso da 19px. prova: la riga «In prova: 1234 è Maurizio...», solo coi dati di prova.
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', verde: '#16a54a', verdeTesto: '#16a54a', giallo: '#f4c31b', gialloTesto: '#f4c31b', rosso: '#e4292a', rossoTesto: '#ff5a52', blu: '#1b8ac4', suColore: '#121212', suRosso: '#ffffff', tasto: '#b8b8b2', ombra: '0 16px 50px rgba(0, 0, 0, 0.45)' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', verde: '#12913f', verdeTesto: '#0b7a33', giallo: '#f4c31b', gialloTesto: '#8f6a00', rosso: '#e4292a', rossoTesto: '#b81d1d', blu: '#1b8ac4', suColore: '#121212', suRosso: '#ffffff', tasto: '#4a4a46', ombra: '0 16px 50px rgba(0, 0, 0, 0.45)' },
};
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const n = Math.max(0, Math.min(4, parseInt(p.cifre ?? '2', 10) || 0));
    const guaio = p.guaio ?? '';
    const TASTI = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'CANCELLA', '0', ''];
    return {
      c,
      titolo: p.titolo ?? 'AREA ISTRUTTORE',
      testo: p.testo ?? 'Il tuo PIN a quattro cifre. Da qui fai l’appello completo e correggi le presenze segnate sul tablet. Durante una lezione ti segna anche la tua presenza.',
      haGuaio: guaio !== '',
      guaio,
      prova: truthy(p.prova),
      pallini: [0, 1, 2, 3].map((i) => ({ bordo: guaio ? c.rosso : c.text, fondo: i < n ? c.text : 'transparent' })),
      tasti: TASTI.map((testo) => ({ testo, corpo: testo === 'CANCELLA' ? '17px' : '38px', fondo: testo ? c.surface : 'transparent', bordo: testo ? '2px solid ' + c.line : 'none' })),
    };
  }
}
</script>
</body>
</html>
