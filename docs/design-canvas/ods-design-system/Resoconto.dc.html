<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il resoconto di fine import (Importa.tsx passo 3: `.sg-riquadro` con bordo `giallo` se resta qualche riga da
     sistemare, `verde` se non manca niente; max 640px). Titolo `.ob` 30px 700 0.04em; frase 15px `sec`; «N RIGHE DA
     SISTEMARE» cond 14px 700 giallo-testo; elenco `.sg-mono` 13px, interlinea 1.5, `pre-wrap`; spiegazione 14px dim.
     elenco: righe separate da ;; (vuoto = tutto entrato). copiato: il tasto dice COPIATO. -->
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 640px; padding: 18px 20px; background: {{c.surface}}; border: 2px solid {{bordo}}; min-width: 0">
  <span style="font-family: {{cond}}; font-style: oblique 9deg; font-size: 30px; font-weight: 700; letter-spacing: 0.04em">{{titolo}}</span>
  <span style="font-size: 15px; line-height: 1.5; color: {{c.sec}}">{{frase}}</span>
  <sc-if value="{{haElenco}}" hint-placeholder-val="{{ true }}">
    <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; color: {{c.gialloTesto}}">{{conto}}</span>
    <div style="display: flex; flex-direction: column; font-family: {{mono}}; font-size: 13px; line-height: 1.5; white-space: pre-wrap">
      <sc-for list="{{righe}}" as="r" hint-placeholder-count="3"><span>{{r}}</span></sc-for>
    </div>
    <span style="font-size: 14px; line-height: 1.5; color: {{c.dim}}">{{spiegazione}}</span>
    <div style="display: flex; align-self: flex-start">
      <dc-import name="Bottone" label="{{tastoCopia}}" variante="linea" contesto="segreteria" hint-size="190px,48px"></dc-import>
    </div>
  </sc-if>
  <div style="display: flex; flex-wrap: wrap; gap: 10px">
    <dc-import name="Bottone" label="VAI ALLA SETTIMANA" variante="pieno" contesto="segreteria" hint-size="230px,48px"></dc-import>
    <dc-import name="Bottone" label="IMPORTA DI NUOVO" variante="linea" contesto="segreteria" hint-size="210px,48px"></dc-import>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"tono":{"editor":"enum","options":["giallo","verde"],"default":"giallo"},"titolo":{"editor":"text","default":"FATTO, 3 righe da sistemare"},"frase":{"editor":"text","default":""},"conto":{"editor":"text","default":"3 RIGHE DA SISTEMARE"},"elenco":{"editor":"text","default":""},"spiegazione":{"editor":"text","default":""},"copiato":{"editor":"boolean","default":false},"$preview":{"width":640,"height":520}}'>
const T = {
  sito: { surface: '#ffffff', surface2: '#cfe6f4', bg: '#eef5fa', line: '#cfe6f4', lineSoft: '#cfe6f4', text: '#0d2a3d', sec: '#0d2a3d', dim: '#46606f', giallo: '#f4c31b', gialloTesto: '#8f6a00', verde: '#12913f', verdeTesto: '#0b7a33' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const MONO = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
    const righe = String(p.elenco ?? '').split(';;').filter(Boolean);
    return {
      c, cond: COND, mono: MONO, bordo: p.tono === 'verde' ? c.verde : c.giallo,
      titolo: p.titolo ?? 'FATTO, 3 righe da sistemare', frase: p.frase ?? '', conto: p.conto ?? '3 RIGHE DA SISTEMARE', spiegazione: p.spiegazione ?? '',
      righe, haElenco: righe.length > 0, tastoCopia: truthy(p.copiato) ? 'COPIATO' : "COPIA L'ELENCO",
    };
  }
}
</script>
</body>
</html>
