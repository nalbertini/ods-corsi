<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il riquadro RIGA PER RIGA di Importa.tsx (`.sg-riquadro` + `RigaDaGuardare` + `.sg-spiega` chiuso).
     righe: "foglio|riga|nome|motivo|opzioni|scelta;;..." con le opzioni della select separate da # (vuote: niente
     select) e `scelta` l'indice di quella mostrata (0 = quella di base, «non tocco niente»).
     Select = `.sg-campo`: 44px, fondo `bg`, bordo 2px `line`, 15px, a tutta larghezza (styles.css 1360-1364).
     Il sommario (nuove · gia' in palestra · da sistemare) e' 15px con i numeri in grassetto. -->
<div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; background: {{c.surface}}; border: 2px solid {{bordo}}; min-width: 0">
  <div style="display: flex; align-items: baseline; gap: 10px">
    <span style="font-family: {{cond}}; font-size: 14px; font-weight: 700; letter-spacing: 0.22em; color: {{c.dim}}">{{titolo}}</span>
    <div style="flex-grow: 1; height: 2px; background: {{c.lineSoft}}"></div>
  </div>
  <span style="font-size: 15px"><b>{{nuove}}</b> nuove · <b>{{inPalestra}}</b> già in palestra · <b>{{daSistemare}}</b> da sistemare</span>
  <sc-for list="{{righe}}" as="r" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 14px"><span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-weight: 700; color: {{c.gialloTesto}}">{{r.foglio}} · riga {{r.riga}}</span> · {{r.nome}}<span style="color: {{c.dim}}"> — {{r.motivo}}</span></span>
      <sc-if value="{{r.conSelect}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 44px; padding: 0 12px; background: {{c.bg}}; border: 2px solid {{c.line}}; color: {{c.text}}; font-size: 15px">
          <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.scelta}}</span>
          <span style="color: {{c.dim}}; font-size: 12px">▾</span>
        </div>
      </sc-if>
    </div>
  </sc-for>
  <div style="display: inline-flex; align-items: center; align-self: flex-start; gap: 8px; min-height: 44px; font-family: {{cond}}; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: {{c.sec}}"><span style="width: 10px; font-size: 17px">+</span>VEDI TUTTE LE RIGHE</div>
</div>
</x-dc>
<script data-dc-script data-props='{"nuove":{"editor":"int","default":120},"inPalestra":{"editor":"int","default":20},"daSistemare":{"editor":"int","default":7},"righe":{"editor":"text","default":""},"$preview":{"width":640,"height":560},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"}}'>
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', bg: '#121212', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', giallo: '#f4c31b', gialloTesto: '#f4c31b', verde: '#16a54a', verdeTesto: '#16a54a' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', bg: '#f4f4f1', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', giallo: '#f4c31b', gialloTesto: '#8f6a00', verde: '#12913f', verdeTesto: '#0b7a33' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const MONO = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const righe = String(p.righe ?? '').split(';;').filter(Boolean).map((s) => {
      const [foglio, riga, nome, motivo, opzioni = '', scelta = '0'] = s.split('|');
      const o = opzioni.split('#').filter(Boolean);
      return { foglio, riga, nome, motivo, conSelect: o.length > 0, scelta: o[Number(scelta)] ?? '' };
    });
    return { c, cond: COND, bordo: c.line, titolo: 'RIGA PER RIGA', nuove: p.nuove ?? 120, inPalestra: p.inPalestra ?? 20, daSistemare: p.daSistemare ?? 7, righe };
  }
}
</script>
</body>
</html>
