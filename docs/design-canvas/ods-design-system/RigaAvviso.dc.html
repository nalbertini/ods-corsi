<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<span role="button" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 6px 12px; background: {{c.surface}}; border: 2px solid {{c.line}}; border-left: 5px solid {{barra}}; color: {{c.text}}">
  <span style="flex-grow: 1; font-size: 14px; line-height: 1.3">{{testo}}</span>
  <span style="font-family: {{cond}}; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; white-space: nowrap; color: {{c.dim}}">{{vai}} &rsaquo;</span>
</span>
</x-dc>
<script data-dc-script data-props='{"testo":{"editor":"text","default":"Manca il certificato medico"},"vai":{"editor":"text","default":"IN REGOLA"},"tono":{"editor":"enum","options":["avviso","guaio"],"default":"avviso"},"tema":{"editor":"enum","options":["scuro","chiaro","sito"],"default":"sito","section":"Tema"},"$preview":{"width":350,"height":50}}'>
// PROPOSTA (../razionalizza-iscritti/): l'avviso della pagina (il Riquadro `prova` con la frase) ridotto a una riga che e' un tasto: dice cosa manca e porta
// al tab che lo sistema (`vai`). Non compare sul tab stesso. Barra a sinistra gialla (avviso) o rossa (guaio), 44px di altezza minima.
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', line: '#333333', text: '#f2f2f0', dim: '#8c8c88', gialloTesto: '#f4c31b', rossoTesto: '#ff5a52', verdeTesto: '#16a54a', giallo: '#f4c31b', rosso: '#e4292a' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', dim: '#656561', gialloTesto: '#8f6a00', rossoTesto: '#b81d1d', verdeTesto: '#0b7a33', giallo: '#f4c31b', rosso: '#e4292a' },
  sito: { surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f', gialloTesto: '#8f6a00', rossoTesto: '#b81d1d', verdeTesto: '#0b7a33', giallo: '#f4c31b', rosso: '#e4292a' },
};
const truthy = (v) => v === true || v === 'true';
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
class Component extends DCLogic {
  renderVals() {
    const p = this.props, c = T[p.tema] || T.sito;
    return { c, cond: COND, testo: p.testo ?? 'Manca il certificato medico', vai: p.vai ?? 'IN REGOLA', barra: p.tono === 'guaio' ? c.rosso : c.giallo };
  }
}
</script>
</body>
</html>
