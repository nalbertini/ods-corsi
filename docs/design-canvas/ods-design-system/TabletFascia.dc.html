<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: center; gap: 18px; width: 100%; padding: 18px 22px; background: {{c.surface}}; border: 3px solid {{bordo}}; box-shadow: {{ombra}}; color: {{c.text}}">
  <sc-if value="{{conSpunta}}" hint-placeholder-val="{{ true }}">
    <span style="display: flex; flex-shrink: 0; color: {{coloreSpunta}}">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"></polyline></svg>
    </span>
  </sc-if>
  <span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 30px; font-weight: 700; letter-spacing: 0.03em; line-height: 1; color: {{coloreTitolo}}">{{titolo}}</span>
    <span style="font-size: 17px; color: {{c.sec}}">{{sotto}}</span>
  </span>
  <sc-if value="{{haTasto}}" hint-placeholder-val="{{ true }}">
    <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; min-height: 64px; padding: 0 26px; border: 2px solid {{c.line}}; color: {{c.text}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 20px; font-weight: 700; letter-spacing: 0.12em; white-space: nowrap">{{tasto}}</span>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"tipo":{"editor":"enum","options":["fatto","attesa","gia","errore"],"default":"fatto"},"titolo":{"editor":"text","default":"BUON ALLENAMENTO, GIULIA!"},"sotto":{"editor":"text","default":"Presenza segnata. Toccato il nome sbagliato? Annulla qui."},"tasto":{"editor":"text","default":"ANNULLA"},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":820,"height":120}}'>
// Riproduzione 1:1 della fascia che compare in fondo all'elenco dei nomi dopo un tocco: .tb-fascia e .tb-fascia-titolo in
// src/styles.css (righe 1051-1068), FasciaTocco in src/components/tablet/tocchi.tsx (righe 184-262). Bordo da 3px, titolo
// da 30px obliquo, la frase sotto (.tb-sotto, 17px, `sec`) e a destra un tasto grande a linea (TabletTasto, grande).
// - tipo fatto: bordo verde, spunta verde da 40px. attesa: come fatto, ma giallo (manca la rete, la presenza e' in coda).
//   gia: bordo `text`, niente spunta (X E' GIA' TRA I PRESENTI). errore: bordo rosso e titolo rosso (NON E' ANDATA).
// - tasto: ANNULLA | VA BENE; vuoto = nessun tasto (la fascia ANNULLATO non l'ha).
// - L'ombra sale dal fondo: nera sul tema scuro, leggera sul chiaro (riga 1061), altrimenti diventa una fascia grigia.
const T = {
  scuro: { surface: '#1c1c1c', line: '#333333', text: '#f2f2f0', sec: '#c9c9c4', verde: '#16a54a', verdeTesto: '#16a54a', giallo: '#f4c31b', gialloTesto: '#f4c31b', rosso: '#e4292a', ombra: '0 -12px 40px rgba(0, 0, 0, 0.6)' },
  chiaro: { surface: '#ffffff', line: '#d4d4ce', text: '#161616', sec: '#3d3d3a', verde: '#12913f', verdeTesto: '#0b7a33', giallo: '#f4c31b', gialloTesto: '#8f6a00', rosso: '#e4292a', ombra: '0 -8px 28px rgba(0, 0, 0, 0.16)' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const tipo = ['fatto', 'attesa', 'gia', 'errore'].includes(p.tipo) ? p.tipo : 'fatto';
    return {
      c,
      ombra: c.ombra,
      bordo: tipo === 'fatto' ? c.verde : tipo === 'attesa' ? c.giallo : tipo === 'errore' ? c.rosso : c.text,
      conSpunta: tipo === 'fatto' || tipo === 'attesa',
      coloreSpunta: tipo === 'attesa' ? c.gialloTesto : c.verdeTesto,
      coloreTitolo: tipo === 'errore' ? c.rosso : c.text,
      titolo: p.titolo ?? 'BUON ALLENAMENTO, GIULIA!',
      sotto: p.sotto ?? 'Presenza segnata. Toccato il nome sbagliato? Annulla qui.',
      tasto: p.tasto ?? 'ANNULLA',
      haTasto: (p.tasto ?? 'ANNULLA') !== '',
    };
  }
}
</script>
</body>
</html>
