<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <!-- Tema sito (modulo di iscrizione): Big Shoulders Display e Inter. In app saranno i file locali OFL di public/risorse (come nel sito pubblico, src/lib/sitoGenera.ts); qui, come per Saira e Barlow, il canvas li prende da Google Fonts. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 100%; min-width: 0; gap: 6px; color: {{c.text}}; font-family: {{testoFam}}">
  <sc-if value="{{conEtichetta}}" hint-placeholder-val="{{ true }}">
    <span style="font-family: {{cond}}; font-size: {{etichettaCorpo}}; font-weight: {{etichettaPeso}}; letter-spacing: {{etichettaSpazio}}; color: {{coloreEtichetta}}">{{etichetta}}</span>
  </sc-if>
  <sc-if value="{{eControllo}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: {{allinea}}; justify-content: space-between; gap: 8px; width: 100%; min-height: {{alto}}; padding: {{padding}}; background: {{sfondo}}; border: 2px {{stileBordo}} {{bordo}}; border-radius: {{raggio}}; color: {{coloreValore}}; font-family: {{famiglia}}; font-variant-numeric: {{tabulare}}; font-size: {{corpo}}; letter-spacing: {{spazio}}; line-height: {{interlinea}}">
      <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: {{aCapo}}">{{testo}}</span>
      <sc-if value="{{eSelect}}" hint-placeholder-val="{{ false }}">
        <span style="color: {{c.dim}}; font-size: 12px">&#9662;</span>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{eScelta}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 8px 12px; background: {{sfondoScelta}}; border: 2px solid {{bordoScelta}}; border-radius: {{raggio}}; font-size: {{corpoScelta}}; font-weight: 600; text-align: left">
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 22px; height: 22px; border: 2px solid {{bordoScelta}}; border-radius: {{raggioPiccolo}}; font-size: 18px; font-weight: 400; color: {{c.text}}">{{segno}}</span>
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        {{testo}}
        <sc-if value="{{haRiga}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: {{corpoRiga}}; font-weight: 400; line-height: 1.35; color: {{coloreRiga}}">{{rigaPrima}}<sc-for list="{{orario}}" as="o" hint-placeholder-count="0"><span style="font-weight: {{o.peso}}; color: {{o.colore}}">{{o.testo}}</span></sc-for></span>
        </sc-if>
      </span>
    </div>
  </sc-if>
  <sc-if value="{{eUna}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; min-height: 52px; padding: 8px 12px; background: {{fondoUna}}; border: 2px solid {{bordoScelta}}; border-radius: {{raggio}}; font-size: {{corpoScelta}}; font-weight: 600; text-align: center; color: {{coloreUna}}">
      {{testo}}
      <sc-if value="{{haRiga}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: {{corpoRiga}}; font-weight: 400; line-height: 1.35; color: {{coloreRigaUna}}">{{riga}}</span>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{eSpunta}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; font-size: 15px; line-height: 1.4; color: {{c.sec}}">
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 22px; height: 22px; border: 2px solid {{bordoSpunta}}; border-radius: {{raggioPiccolo}}; background: {{sfondoSpunta}}; color: {{suInchiostro}}; font-size: 16px; line-height: 1">{{segnoSpunta}}</span>
      <span>{{testo}}</span>
    </div>
  </sc-if>
  <sc-if value="{{haNota}}" hint-placeholder-val="{{ false }}">
    <span style="font-size: 14px; line-height: 1.35; color: {{coloreNota}}">{{nota}}</span>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"tipo":{"editor":"enum","options":["testo","select","area","sola-lettura","scelta","spunta"],"default":"testo"},"contesto":{"editor":"enum","options":["app","segreteria"],"default":"app"},"etichetta":{"editor":"text","default":"NOME"},"valore":{"editor":"text","default":""},"segnaposto":{"editor":"text","default":""},"codice":{"editor":"boolean","default":false},"nota":{"editor":"text","default":""},"notaTono":{"editor":"enum","options":["guaio","avviso"],"default":"guaio"},"acceso":{"editor":"boolean","default":false},"manca":{"editor":"boolean","default":false},"scelto":{"editor":"boolean","default":false},"una":{"editor":"boolean","default":false},"riga":{"editor":"text","default":""},"orario":{"editor":"text","default":""},"$preview":{"width":360,"height":90}}'>
// Riproduzione 1:1 dei campi, nei due contesti.
// contesto "app" (il modulo di iscrizione: Campo, NotaCampo e SceltaCorsi di src/components/ds.tsx righe 122-200,
//   usati da src/components/ModuloIscrizione.tsx; src/styles.css righe 575-665 e 1201-1205): .modulo-campo = colonna, gap 6px;
//   etichetta .modulo-etichetta (cond 12px 700 0.18em `dim`); controllo .campo (min 52px, padding 0 14px, 17px, fondo `surface`,
//   bordo 2px `line`); codice = .campo-codice (cond tabulare, 0.08em: codice fiscale); area = .campo-note (padding-top 12px,
//   3 righe); sola-lettura = [readonly] (fondo trasparente, bordo tratteggiato, testo `dim`: il luogo letto dal codice fiscale).
// contesto "segreteria" (Campo di src/components/segreteria/comune.tsx righe 319-334; src/styles.css righe 1329 e 1360-1368): etichetta
//   .sg-etichetta (stessa misura; manca = rosso-testo); controllo .sg-campo (44px, padding 0 12px, 15px, fondo `bg`, bordo 2px
//   `line`); acceso = bordo `giallo` (data-acceso); area alta quanto le righe (padding 10px 12px, interlinea 1.4); select = con la ▾.
// nota = NotaCampo (.modulo-nota, 14px, interlinea 1.35): guaio rosso-testo e il campo prende il bordo `rosso` (aria-invalid), avviso giallo-testo.
// PROPOSTA (rifinitura iscrizione): con `una` la scelta e' un SEGMENTO PIENO, senza quadratino: la scelta prende il fondo `text` e il testo `bg`, le altre il bordo `riga-campo`; il quadratino con ✓ resta solo per le scelte multiple. I bordi dei campi e delle scelte usano `riga-campo` (3:1 sul fondo), non `line`.
// scelta = .modulo-corso (52px, fondo `surface`, 15px 600) con la spunta .modulo-spunta (22px): ✓ per piu' d'una, ● con `una` (come paghi);
//   scelto = bordo `text`, fondo `surface-2`; riga = eta' e orari sotto il nome (13px `dim`, `sec` sul scelto);
//   orario = l'orario a pezzi dei corsi proposti in cima (TestoAPezzi di ds.tsx), sulla riga dopo l'eta' e « · »: i pezzi fra asterischi
//   in .orario-evidenza (700 `text`), gli altri col colore della riga: «*lunedì* e giovedì *18.00-19.00*»;
// spunta = .modulo-privacy: la casella 22px (qui disegnata: la nativa dipende dal browser) e il testo 15px `sec`.
// Per scelta e spunta il testo e' `valore`.
// Il fuoco, il segnaposto del browser e il cursore non sono riprodotti (stati dinamici).
const T = {
  // PROPOSTA «modulo di iscrizione nell'aspetto del sito» (A2, docs/design-canvas/sito-approvato/token-proposta.md; CSS in src/lib/sitoGenera.ts:
  // :root, raggio 6px). lineCampo = blu del sito (4,96:1 sul fondo, 5,46:1 sul bianco); `dim` = #46606f, inchiostro attenuato (6,03:1 sul fondo,
  // 5,15:1 su #cfe6f4); `suInchiostro` = bianco sul segmento pieno. Valori e rapporti: iscrizione-sito/token-proposta.md.
  sito: { surface: '#ffffff', surface2: '#cfe6f4', bg: '#eef5fa', line: '#cfe6f4', lineCampo: '#14709f', text: '#0d2a3d', sec: '#0d2a3d', dim: '#46606f', giallo: '#f4c31b', gialloTesto: '#8f6a00', rosso: '#e4292a', rossoTesto: '#b81d1d', suInchiostro: '#ffffff' },
};
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const BODY = "Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
        const sg = p.contesto === 'segreteria';
    // `sito` + contesto segreteria = look del sito della segreteria (:root[data-look='sito']): etichetta in Inter 12px 600 (non Big Shoulders),
    // campo bianco col bordo blu, raggio 6px, `acceso` col bordo giallo scuro #8f6a00 (il giallo pieno e' solo del tasto principale).
    const sgSito = sg;
    const tipo = p.tipo || 'testo';
    const etichetta = p.etichetta ?? 'NOME';
    const nota = p.nota ?? '';
    const guaio = nota !== '' && (p.notaTono || 'guaio') === 'guaio';
    const valore = p.valore ?? '';
    const sola = tipo === 'sola-lettura';
    const area = tipo === 'area';
    const codice = truthy(p.codice);
    const scelto = truthy(p.scelto);
    const una = truthy(p.una);
    const riga = p.riga ?? '';
    const orarioScritto = p.orario ?? '';
    const coloreRiga = scelto ? c.sec : c.dim;
    // «*lunedì* e giovedì *18.00-19.00*»: fra asterischi i pezzi in evidenza (le posizioni dispari dopo lo split).
    const orario = orarioScritto.split('*').map((testo, i) => ({ testo, peso: i % 2 ? 700 : 400, colore: i % 2 ? c.text : coloreRiga })).filter((x) => x.testo !== '');
    return {
      c, cond: sgSito ? INTER : BIG, testoFam: INTER,
      // Il carattere del sito e' piu' stretto: l'etichetta sale da 12px a 15px (800, 0.08em); campi e scelte hanno il raggio da 6px (la casella da 4px).
      etichettaCorpo: sgSito ? '12px' : '15px', etichettaPeso: sgSito ? 600 : 800, etichettaSpazio: sgSito ? '0.12em' : '0.08em',
      raggio: '6px', raggioPiccolo: '4px', corpoScelta: '16px', corpoRiga: '14px',
      suInchiostro: c.suInchiostro || c.bg,
      etichetta, conEtichetta: etichetta !== '',
      coloreEtichetta: truthy(p.manca) ? c.rossoTesto : c.dim,
      eControllo: tipo === 'testo' || tipo === 'select' || area || sola,
      eSelect: tipo === 'select', eScelta: tipo === 'scelta' && !una, eUna: tipo === 'scelta' && una, fondoUna: scelto ? c.text : c.surface, coloreUna: scelto ? (c.suInchiostro || c.bg) : c.text, coloreRigaUna: scelto ? (c.suInchiostro || c.bg) : c.dim, eSpunta: tipo === 'spunta',
      allinea: area ? 'flex-start' : 'center',
      alto: area ? (sg ? '88px' : '104px') : sg ? '44px' : '52px',
      padding: area ? (sg ? '10px 12px' : '12px 14px 0') : sg ? '0 12px' : '0 14px',
      sfondo: sola ? 'transparent' : sg && !c.bg,
      stileBordo: sola ? 'dashed' : 'solid',
      bordo: guaio ? c.rosso : truthy(p.acceso) ? (sgSito ? c.gialloTesto : c.giallo) : c.lineCampo,
      coloreValore: sola ? c.dim : valore !== '' ? c.text : c.dim,
      famiglia: INTER,
      tabulare: codice ? 'tabular-nums' : 'normal',
      corpo: sg ? '15px' : '17px',
      spazio: codice ? '0.08em' : 'normal',
      interlinea: area && sg ? '1.4' : 'normal',
      aCapo: area ? 'normal' : 'nowrap',
      testo: valore !== '' || tipo === 'scelta' || tipo === 'spunta' ? valore : (p.segnaposto ?? ''),
      sfondoScelta: scelto ? c.surface2 : c.surface,
      bordoScelta: scelto ? c.text : c.lineCampo,
      segno: scelto ? (una ? '●' : '✓') : '',
      haRiga: riga !== '' || orario.length > 0, riga, rigaPrima: riga !== '' && orario.length ? `${riga} · ` : riga, orario, coloreRiga,
      bordoSpunta: scelto ? c.text : c.lineCampo,
      sfondoSpunta: scelto ? c.text : 'transparent',
      segnoSpunta: scelto ? '✓' : '',
      haNota: nota !== '', nota,
      coloreNota: guaio ? c.rossoTesto : c.gialloTesto,
    };
  }
}
</script>
</body>
</html>
