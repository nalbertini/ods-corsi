<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 100%; min-width: 0; gap: 6px; color: {{c.text}}">
  <sc-if value="{{conEtichetta}}" hint-placeholder-val="{{ true }}">
    <span style="font-family: {{cond}}; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: {{coloreEtichetta}}">{{etichetta}}</span>
  </sc-if>
  <sc-if value="{{eControllo}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; align-items: {{allinea}}; justify-content: space-between; gap: 8px; width: 100%; min-height: {{alto}}; padding: {{padding}}; background: {{sfondo}}; border: 2px {{stileBordo}} {{bordo}}; color: {{coloreValore}}; font-family: {{famiglia}}; font-variant-numeric: {{tabulare}}; font-size: {{corpo}}; letter-spacing: {{spazio}}; line-height: {{interlinea}}">
      <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: {{aCapo}}">{{testo}}</span>
      <sc-if value="{{eSelect}}" hint-placeholder-val="{{ false }}">
        <span style="color: {{c.dim}}; font-size: 12px">&#9662;</span>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{eScelta}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 8px 12px; background: {{sfondoScelta}}; border: 2px solid {{bordoScelta}}; font-size: 15px; font-weight: 600; text-align: left">
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 22px; height: 22px; border: 2px solid {{bordoScelta}}; font-size: 18px; font-weight: 400; color: {{c.text}}">{{segno}}</span>
      <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        {{testo}}
        <sc-if value="{{haRiga}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 13px; font-weight: 400; line-height: 1.35; color: {{coloreRiga}}">{{riga}}</span>
        </sc-if>
        <sc-if value="{{haAvviso}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 13px; font-weight: 600; line-height: 1.35; color: {{c.gialloTesto}}">{{avviso}}</span>
        </sc-if>
      </span>
    </div>
  </sc-if>
  <sc-if value="{{eUna}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; min-height: 52px; padding: 8px 12px; background: {{fondoUna}}; border: 2px solid {{bordoScelta}}; font-size: 15px; font-weight: 600; text-align: center; color: {{coloreUna}}">
      {{testo}}
      <sc-if value="{{haRiga}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 13px; font-weight: 400; line-height: 1.35; color: {{coloreRigaUna}}">{{riga}}</span>
      </sc-if>
    </div>
  </sc-if>
  <sc-if value="{{eSpunta}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; font-size: 15px; line-height: 1.4; color: {{c.sec}}">
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 22px; height: 22px; border: 2px solid {{bordoSpunta}}; background: {{sfondoSpunta}}; color: {{c.bg}}; font-size: 16px; line-height: 1">{{segnoSpunta}}</span>
      <span>{{testo}}</span>
    </div>
  </sc-if>
  <sc-if value="{{haNota}}" hint-placeholder-val="{{ false }}">
    <span style="font-size: 14px; line-height: 1.35; color: {{coloreNota}}">{{nota}}</span>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"tipo":{"editor":"enum","options":["testo","select","area","sola-lettura","scelta","spunta"],"default":"testo"},"contesto":{"editor":"enum","options":["app","segreteria"],"default":"app"},"etichetta":{"editor":"text","default":"NOME"},"valore":{"editor":"text","default":""},"segnaposto":{"editor":"text","default":""},"codice":{"editor":"boolean","default":false},"nota":{"editor":"text","default":""},"notaTono":{"editor":"enum","options":["guaio","avviso"],"default":"guaio"},"acceso":{"editor":"boolean","default":false},"manca":{"editor":"boolean","default":false},"scelto":{"editor":"boolean","default":false},"una":{"editor":"boolean","default":false},"riga":{"editor":"text","default":""},"avviso":{"editor":"text","default":""},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":360,"height":90}}'>
// Riproduzione 1:1 dei campi, nei due contesti.
// contesto "app" (il modulo di iscrizione: Campo, NotaCampo e SceltaCorsi di src/components/ds.tsx righe 122-200,
//   usati da src/components/ModuloIscrizione.tsx; src/styles.css righe 575-665 e 1201-1205): .modulo-campo = colonna, gap 6px;
//   etichetta .modulo-etichetta (cond 12px 700 0.18em `dim`); controllo .campo (min 52px, padding 0 14px, 17px, fondo `surface`,
//   bordo 2px `line`); codice = .campo-codice (cond tabulare, 0.08em: codice fiscale); area = .campo-note (padding-top 12px,
//   3 righe); sola-lettura = [readonly] (fondo trasparente, bordo tratteggiato, testo `dim`: il luogo letto dal codice fiscale).
// contesto "segreteria" (Campo di src/components/segreteria/comune.tsx righe 319-334; src/styles.css righe 1329 e 1360-1368): etichetta
//   .sg-etichetta (stessa misura; manca = rosso-testo); controllo .sg-campo (44px, padding 0 12px, 15px, fondo `bg`, bordo 2px
//   `line`); acceso = bordo `giallo` (data-acceso); area alta quanto le righe (padding 10px 12px, interlinea 1.4); select = con la ▾.
// nota = NotaCampo (.modulo-nota, 14px, interlinea 1.35): guaio rosso-testo e il campo prende il bordo `rosso` (aria-invalid), avviso giallo-testo.
// PROPOSTA (rifinitura iscrizione): con `una` la scelta e' un SEGMENTO PIENO, senza quadratino: la scelta prende il fondo `text` e il testo `bg`, le altre il bordo `riga-campo`; il quadratino con ✓ resta solo per le scelte multiple. I bordi dei campi e delle scelte usano `riga-campo` (3:1 sul fondo), non `line`.
// scelta = .modulo-corso (52px, fondo `surface`, 15px 600) con la spunta .modulo-spunta (22px): ✓ per piu' d'una, ● con `una` (come paghi);
//   scelto = bordo `text`, fondo `surface-2`; riga = eta' e orari sotto il nome (13px `dim`, `sec` sul scelto);
//   avviso = sotto la riga, 13px 600 `giallo-testo` (.modulo-corso-avviso): un corso del genitore che non e' piu' alla stessa ora.
// spunta = .modulo-privacy: la casella 22px (qui disegnata: la nativa dipende dal browser) e il testo 15px `sec`.
// Per scelta e spunta il testo e' `valore`.
// Il fuoco, il segnaposto del browser e il cursore non sono riprodotti (stati dinamici).
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', bg: '#121212', line: '#333333', lineCampo: '#6e6e6a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', giallo: '#f4c31b', gialloTesto: '#f4c31b', rosso: '#e4292a', rossoTesto: '#ff5a52' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', bg: '#f4f4f1', line: '#d4d4ce', lineCampo: '#8a8a85', text: '#161616', sec: '#3d3d3a', dim: '#656561', giallo: '#f4c31b', gialloTesto: '#8f6a00', rosso: '#e4292a', rossoTesto: '#b81d1d' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const BODY = "Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const sg = p.contesto === 'segreteria';
    const tipo = p.tipo || 'testo';
    const etichetta = p.etichetta ?? 'NOME';
    const nota = p.nota ?? '';
    const guaio = nota !== '' && (p.notaTono || 'guaio') === 'guaio';
    const valore = p.valore ?? '';
    const sola = tipo === 'sola-lettura';
    const area = tipo === 'area';
    const codice = truthy(p.codice);
    const scelto = truthy(p.scelto);
    const una = truthy(p.una);
    const riga = p.riga ?? '';
    return {
      c, cond: COND,
      etichetta, conEtichetta: etichetta !== '',
      coloreEtichetta: truthy(p.manca) ? c.rossoTesto : c.dim,
      eControllo: tipo === 'testo' || tipo === 'select' || area || sola,
      eSelect: tipo === 'select', eScelta: tipo === 'scelta' && !una, eUna: tipo === 'scelta' && una, fondoUna: scelto ? c.text : c.surface, coloreUna: scelto ? c.bg : c.text, coloreRigaUna: scelto ? c.bg : c.dim, eSpunta: tipo === 'spunta',
      allinea: area ? 'flex-start' : 'center',
      alto: area ? (sg ? '88px' : '104px') : sg ? '44px' : '52px',
      padding: area ? (sg ? '10px 12px' : '12px 14px 0') : sg ? '0 12px' : '0 14px',
      sfondo: sola ? 'transparent' : sg ? c.bg : c.surface,
      stileBordo: sola ? 'dashed' : 'solid',
      bordo: guaio ? c.rosso : truthy(p.acceso) ? c.giallo : c.lineCampo,
      coloreValore: sola ? c.dim : valore !== '' ? c.text : c.dim,
      famiglia: codice ? COND : BODY,
      tabulare: codice ? 'tabular-nums' : 'normal',
      corpo: sg ? '15px' : '17px',
      spazio: codice ? '0.08em' : 'normal',
      interlinea: area && sg ? '1.4' : 'normal',
      aCapo: area ? 'normal' : 'nowrap',
      testo: valore !== '' || tipo === 'scelta' || tipo === 'spunta' ? valore : (p.segnaposto ?? ''),
      sfondoScelta: scelto ? c.surface2 : c.surface,
      bordoScelta: scelto ? c.text : c.lineCampo,
      segno: scelto ? (una ? '●' : '✓') : '',
      haRiga: riga !== '', riga, coloreRiga: scelto ? c.sec : c.dim,
      haAvviso: (p.avviso ?? '') !== '', avviso: p.avviso ?? '',
      bordoSpunta: scelto ? c.text : c.lineCampo,
      sfondoSpunta: scelto ? c.text : 'transparent',
      segnoSpunta: scelto ? '✓' : '',
      haNota: nota !== '', nota,
      coloreNota: guaio ? c.rossoTesto : c.gialloTesto,
    };
  }
}
</script>
</body>
</html>
