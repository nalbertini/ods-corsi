<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: {{gap}}; width: 100%; padding: {{spazio}}; background: {{c.surface}}; border: 2px solid {{bordo}}; color: {{c.text}}">
  <sc-if value="{{conTitolo}}" hint-placeholder-val="{{ true }}">
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 34px; font-weight: 700; letter-spacing: 0.03em">{{titolo}}</span>
  </sc-if>
  <sc-if value="{{guaio}}" hint-placeholder-val="{{ false }}">
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.24em; color: {{c.rosso}}">{{etichetta}}</span>
  </sc-if>
  <sc-if value="{{haTesto}}" hint-placeholder-val="{{ true }}">
    <span style="font-size: 18px; line-height: 1.5; color: {{c.sec}}">{{testo}}</span>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"tipo":{"editor":"enum","options":["riquadro","guaio"],"default":"riquadro"},"titolo":{"editor":"text","default":"OGGI QUI NON CI SONO CORSI"},"testo":{"editor":"text","default":"La prossima lezione è mercoledì 7 ottobre alle 16:30: Judo baby, con Maurizio."},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":800,"height":150}}'>
// Riproduzione 1:1 di `Riquadro` e `Guaio` di src/components/tablet/comune.tsx (righe 69-83) con .tb-riquadro* di src/styles.css (righe
// 867-875): il riquadro che il tablet usa per dire una cosa a tutta colonna.
// - tipo riquadro: titolo da 34px obliquo (OGGI QUI NON CI SONO CORSI, PER OGGI QUI E' FINITO) e il testo da 18px in `sec`, padding 28px,
//   bordo `line`. Senza titolo o senza testo quella parte non c'e'.
// - tipo guaio: un errore del server detto in chiaro: bordo rosso, il titolo e' un'etichetta spaziata in rosso (CALENDARIO NON LETTO,
//   ELENCO NON LETTO) e sotto il testo. Nella colonna stretta dell'area istruttore c'e' TabletRiquadro, che ha il padding da 18px.
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', verde: '#16a54a', verdeTesto: '#16a54a', giallo: '#f4c31b', gialloTesto: '#f4c31b', rosso: '#e4292a', rossoTesto: '#ff5a52', blu: '#1b8ac4', suColore: '#121212', suRosso: '#ffffff', tasto: '#b8b8b2', ombra: '0 16px 50px rgba(0, 0, 0, 0.45)' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', verde: '#12913f', verdeTesto: '#0b7a33', giallo: '#f4c31b', gialloTesto: '#8f6a00', rosso: '#e4292a', rossoTesto: '#b81d1d', blu: '#1b8ac4', suColore: '#121212', suRosso: '#ffffff', tasto: '#4a4a46', ombra: '0 16px 50px rgba(0, 0, 0, 0.45)' },
};
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const guaio = p.tipo === 'guaio';
    const titolo = p.titolo ?? 'OGGI QUI NON CI SONO CORSI';
    const testo = p.testo ?? 'La prossima lezione è mercoledì 7 ottobre alle 16:30: Judo baby, con Maurizio.';
    return {
      c,
      guaio,
      conTitolo: !guaio && titolo !== '',
      haTesto: testo !== '',
      titolo: titolo.toUpperCase(),
      etichetta: titolo.toUpperCase(),
      testo,
      bordo: guaio ? c.rosso : c.line,
      gap: '10px',
      spazio: '28px',
    };
  }
}
</script>
</body>
</html>
