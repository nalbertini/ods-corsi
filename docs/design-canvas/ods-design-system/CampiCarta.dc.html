<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font del modulo sono file locali OFL; un canvas e' un Artifact e li prende da Google Fonts: stessi file, stessa licenza. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 10px; width: 100%; color: #0d2a3d">
<sc-if value="{{wallet}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px"><button type="button" style="min-height: 52px; border: 2px solid #14709f; border-radius: 10px; background: #000000; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600">Paga con Apple Pay</button><button type="button" style="min-height: 52px; border: 2px solid #14709f; border-radius: 10px; background: #000000; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 600">Paga con Google Pay</button><div style="display: flex; align-items: center; gap: 10px; margin-top: 4px"><span style="flex-grow: 1; height: 1px; background: #cfe6f4"></span><span style="font-size: 14px; color: #46606f">oppure scrivi i dati della carta</span><span style="flex-grow: 1; height: 1px; background: #cfe6f4"></span></div></div>
</sc-if>
<dc-import name="Campo" tema="sito" etichetta="NUMERO DELLA CARTA" segnaposto="1234 1234 1234 1234" hint-size="100%,80px"></dc-import><dc-import name="Campo" tema="sito" etichetta="SCADENZA" segnaposto="MM/AA" hint-size="100%,80px"></dc-import><dc-import name="Campo" tema="sito" etichetta="CODICE DI SICUREZZA" segnaposto="3 cifre sul retro" hint-size="100%,80px"></dc-import><dc-import name="Campo" tema="sito" etichetta="NOME SULLA CARTA" segnaposto="Come è scritto sulla carta" hint-size="100%,80px"></dc-import><dc-import name="Bottone" label="PAGA {{cifra}}" variante="principale" tema="sito" hint-size="100%,56px"></dc-import><span style="font-size: 14px; line-height: 1.4; color: #46606f">Non serve nessun conto. I numeri della carta li legge solo il circuito di pagamento: la palestra non li vede e non li salva.</span><span style="font-size: 14px; line-height: 1.4; color: #46606f">Se la tua banca chiede una conferma, dalla sua app o con un SMS, confermala e torna qui.</span><dc-import name="Bottone" label="ANNULLA" variante="linea" tema="sito" hint-size="100%,56px"></dc-import>

</div>
</x-dc>
<script data-dc-script data-props='{"wallet":{"editor":"boolean","default":true},"cifra":{"editor":"text","default":"180,00 €"},"$preview":{"width":350,"height":820}}'>
// COSTRUITO (2026-10-25, `../pagamento-carta/`): i campi della carta di src/components/CampiCarta.tsx, sotto il riquadro PAGA quando
// in PAGHI CON c'è Carta. Stili da src/styles.css (.campi-carta gap 10px, .tasto-wallet alto 52px, raggio 10px, bordo 2px `riga-campo`
// #14709f, fondo nero e testo bianco come chiedono Apple e Google; .campi-carta-oppure 14px `testo-spento` tra fili `riga` #cfe6f4).
// wallet = Apple Pay e Google Pay: nell'app c'è solo quello che il telefono sa usare. I quattro campi dentro li disegna PayPal.
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic { renderVals() { return { wallet: truthy(this.props.wallet ?? true), cifra: this.props.cifra ?? '180,00 €' }; } }
</script>
</body>
</html>
