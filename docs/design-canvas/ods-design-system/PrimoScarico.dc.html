<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<section aria-label="Primo scarico da Satispay" style="display: flex; flex-direction: column; gap: 14px; width: 100%; min-width: 0; color: {{c.text}}; font-family: {{c.body}}">
  <span style="font-family: {{c.cond}}; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: {{c.dim}}">ANTEPRIMA · LA CONTABILITÀ NON CAMBIA</span>
  <h2 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.04em">PRIMO SCARICO DA SATISPAY</h2>
  <span style="font-size: 15px">Satispay ha <b>{{tuttiTesto}}</b> del negozio{{dal}}. Ecco cosa ne farebbe l’app.</span>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{righe}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: row; gap: 14px; align-items: baseline">
        <b style="font-family: {{c.cond}}; font-variant-numeric: tabular-nums; font-size: 22px; min-width: 48px; text-align: right">{{r.n}}</b>
        <span><b>{{r.cosa}}</b>{{r.resto}}</span>
      </div>
    </sc-for>
  </div>
  <span style="font-size: 14px; color: {{c.dim}}">Chi ha pagato lo trovi poi in IMPORTAZIONI → Chi ha pagato.</span>
  <div style="display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px">
    <dc-import name="Bottone" contesto="segreteria" variante="pieno" label="Sì, comincia lo scarico" hint-size="260px,48px"></dc-import>
    <dc-import name="Bottone" contesto="segreteria" variante="linea" label="Non ora" hint-size="110px,48px"></dc-import>
  </div>
</section>
</x-dc>
<script data-dc-script data-props='{"incassi":{"editor":"text","default":"31"},"rimborsi":{"editor":"text","default":"2"},"modulo":{"editor":"text","default":"12"},"pagamenti":{"editor":"text","default":"4"},"prima":{"editor":"text","default":"9"},"dal":{"editor":"text","default":"01/06/2026"},"$preview":{"width":820,"height":560}}'>
// COSTRUITA (`PrimoScarico` in src/components/segreteria/ScaricoSatispay.tsx; prima in ../satispay-scarico/, dal 132 in
// ../satispay-chi-ha-pagato/): la pagina intera (`SchedaPiena`) che si apre da IMPORTAZIONI la prima volta. Anteprima: dal 132 lo
// scarico non scrive movimenti, dice solo chi ha pagato. Colonna con gap 14px: .sg-etichetta «ANTEPRIMA · LA CONTABILITÀ NON CAMBIA»,
// titolo 20px 700 «PRIMO SCARICO DA SATISPAY», frase da 15px «Satispay ha N pagamenti del negozio, dal GG/MM/AAAA. Ecco cosa ne farebbe
// l'app.», poi le righe col numero grande a sinistra (.num 22px 700, larghezza minima 48px) e la frase col verbo in grassetto; le righe
// con 0 non ci sono. Cinque righe: pagamenti nei versamenti della banca, rimborsi, modulo, già fra gli incassi degli iscritti, di prima.
// Sotto, la nota da 14px `dim` e i tasti pieno «Sì, comincia lo scarico» e a linea «Non ora».
const T = {
  sito: { bg: '#eef5fa', surface: '#ffffff', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f', giallo: '#8f6a00', rosso: '#b81d1d', cond: "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif", body: "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" },
};
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const n = (k, d) => Number(p[k] ?? d);
    const c = { incassi: n('incassi', 31), rimborsi: n('rimborsi', 2), modulo: n('modulo', 12), pagamenti: n('pagamenti', 4), prima: n('prima', 9) };
    const tutti = c.incassi + c.rimborsi + c.modulo + c.pagamenti + c.prima;
    const righe = [
      [c.incassi, 'pagamenti sono nei versamenti della banca', ': non entrano in contabilità. Arrivano in Conto Corrente col versamento «Da Satispay Europe S.A.».'],
      [c.rimborsi, 'rimborsi escono dai versamenti della banca', ': non entrano in contabilità nemmeno loro.'],
      [c.modulo, 'sono pagamenti del modulo di iscrizione', ': sono già fra gli incassi degli iscritti o in una ricevuta. Non si contano due volte.'],
      [c.pagamenti, 'sono già fra gli incassi degli iscritti', ': pagati in palestra con Satispay e registrati lì, stesso giorno e stesso importo. Non si contano due volte.'],
      [c.prima, 'sono di prima dell’inizio dei conti', ': non entrano.'],
    ].filter((r) => r[0] > 0).map((r) => ({ n: String(r[0]), cosa: r[1], resto: r[2] }));
    return {
      c: T.sito, righe,
      tuttiTesto: tutti === 1 ? '1 pagamento' : tutti + ' pagamenti',
      dal: p.dal ? ', dal ' + p.dal : '',
    };
  }
}
</script>
</body>
</html>
