<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- La cella con i due tasti piu e meno dell'editor del timer: `Stepper` di timer/src/components/EditorScreen.tsx (righe 15-82, FIELD_META) con `.card`, `.icon-btn` e `.num` di timer/src/styles.css. Il bordo alto di 4px ha il colore del campo; il valore e' in Saira 30px, l'unita' 15px dim.
     campo: prepare (PREPARAZIONE, giallo), work (LAVORO, rosso), rest (RECUPERO, verde), rounds (ROUND), sets (SERIE), setRest (RIPOSO SERIE, blu), cooldown (DEFATICAMENTO, blu), duration (DURATA, in minuti, giallo). valore = quel che si legge (secondi, o minuti per duration). Gli esercizi che la cella del lavoro porta sotto (`children`) non ci sono. -->
<div style="display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 10px 12px 12px; background: {{c.surface}}; border: 2px solid {{c.line}}; border-top: 4px solid {{m.tinta}}; color: {{c.text}}">
  <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: {{c.dim}}">{{m.label}}</span>
  <div style="display: flex; align-items: center; gap: 8px">
    <div style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{c.surface2}}; color: {{c.tasto}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </div>
    <div style="display: flex; flex-grow: 1; align-items: baseline; justify-content: center; gap: 2px; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums">
      <span style="font-size: 30px; font-weight: 700; line-height: 1">{{m.valore}}</span>
      <span style="font-size: 15px; font-weight: 600; color: {{c.dim}}">{{m.unita}}</span>
    </div>
    <div style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{c.surface2}}; color: {{c.tasto}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"campo":{"editor":"enum","options":["prepare","work","rest","rounds","sets","setRest","cooldown","duration"],"default":"work"},"valore":{"editor":"int","default":30},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":200,"height":112}}'>
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', surface2: '#242424', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', faint: '#5a5a56', tasto: '#b8b8b2', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suColore: '#121212', suRosso: '#ffffff' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', faint: '#a8a8a3', tasto: '#4a4a46', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#121212', suRosso: '#ffffff' },
};
const truthy = (v) => v === true || v === 'true';
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
const META = {
  prepare: { label: 'PREPARAZIONE', unita: 's', tinta: 'giallo' },
  work: { label: 'LAVORO', unita: 's', tinta: 'rosso' },
  rest: { label: 'RECUPERO', unita: 's', tinta: 'verde' },
  rounds: { label: 'ROUND', unita: '×', tinta: 'text' },
  sets: { label: 'SERIE', unita: '×', tinta: 'text' },
  setRest: { label: 'RIPOSO SERIE', unita: 's', tinta: 'blu' },
  cooldown: { label: 'DEFATICAMENTO', unita: 's', tinta: 'blu' },
  duration: { label: 'DURATA', unita: 'min', tinta: 'giallo' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const m = META[p.campo] || META.work;
    return { c, m: { label: m.label, unita: m.unita, tinta: c[m.tinta], valore: p.valore ?? 30 } };
  }
}
</script>
</body>
</html>
