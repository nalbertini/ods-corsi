<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <!-- Tema sito: Big Shoulders Display 800, come Bottone. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<span style="display: flex; align-items: center; justify-content: center; gap: 10px; width: {{larghezza}}; min-height: {{alto}}; padding: {{spazio}}; font-family: {{famiglia}}; font-style: {{stile}}; font-size: {{corpo}}; font-weight: {{peso}}; letter-spacing: {{spaziatura}}; border-radius: {{raggio}}; white-space: nowrap; background: {{fondo}}; border: {{bordo}}; color: {{colore}}; opacity: {{opacita}}">{{label}}</span>
</x-dc>
<script data-dc-script data-props='{"label":{"editor":"text","default":"ANNULLA"},"variante":{"editor":"enum","options":["linea","verde","rosso"],"default":"linea"},"grande":{"editor":"boolean","default":false},"quadro":{"editor":"boolean","default":false},"acceso":{"editor":"boolean","default":false},"spento":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro","sito"],"default":"sito","section":"Tema"},"$preview":{"width":220,"height":70}}'>
// Riproduzione 1:1 del tasto del tablet di sala: .tb-btn con .tb-btn-linea, .tb-btn-verde, .tb-btn-rosso, .tb-btn-grande e
// .tb-btn-quadro in src/styles.css (righe 1658-1670 e 1788; il tema sito e' il blocco :root[data-look='sito'] .tb-btn, righe 416-425).
// E' il <button className="tb-btn tb-btn-linea"> di Tablet.tsx, TabletHome.tsx, tocchi.tsx e TabletPin.tsx.
// Alto 60px (grande 64px, corpo 20), perche' si tocca da un metro. La sala ha sempre il look sito.
// - variante: linea = bordo `line`, scritta `text` (ANNULLA, VA BENE, AREA ISTRUTTORE); verde = SEGNA LA PRESENZA, scritta scura;
//   rosso = SI', ESCI, scritta bianca (--su-rosso).
//   Tema sito: linea = bordo blu 2px; verde = fondo giallo (uno per schermata); rosso = a linea (fondo trasparente, bordo e scritta rosso scuro).
//   Tema sito: scritta dritta, angoli 6px, Big Shoulders Display 800, spaziatura 0.06em (scuro e chiaro: Saira Condensed obliqua, spigoli vivi, 0.12em).
// - quadro: largo 60px, senza padding (il tasto della musica, il sole del tema). Il contenuto e' una parola o un segno.
// - acceso: aria-expanded='true' (.tb-btn-linea[aria-expanded='true']): bordo `text` e fondo `surface-2`, per i tasti che aprono un pannello (PROVE).
// - spento: disabled. Scuro e chiaro: verde e rosso a meta' opacita', il tasto a linea resta com'e'. Sito: blocco grigio (fondo `surface-2`,
//   scritta `dim`, opacita' piena), col bordo trasparente sui tasti a linea e rosso.
const T = {
  scuro: { surface2: '#242424', line: '#333333', text: '#f2f2f0', verde: '#16a54a', rosso: '#e4292a', suColore: '#121212', suRosso: '#ffffff', famiglia: "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif", stile: 'oblique 9deg', peso: '700', spaziatura: '0.12em', raggio: '0' },
  chiaro: { surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', verde: '#12913f', rosso: '#e4292a', suColore: '#121212', suRosso: '#ffffff', famiglia: "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif", stile: 'oblique 9deg', peso: '700', spaziatura: '0.12em', raggio: '0' },
  sito: { surface2: '#cfe6f4', line: '#14709f', text: '#0d2a3d', verde: '#f4c31b', rosso: '#b81d1d', suColore: '#0d2a3d', suRosso: '#b81d1d', dim: '#46606f', famiglia: "'Big Shoulders Display', 'Helvetica Neue', Arial, sans-serif", stile: 'normal', peso: '800', spaziatura: '0.06em', raggio: '6px' },
};
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.sito;
    const v = p.variante === 'verde' || p.variante === 'rosso' ? p.variante : 'linea';
    const grande = truthy(p.grande);
    const quadro = truthy(p.quadro);
    const acceso = truthy(p.acceso) && v === 'linea';
    const spento = truthy(p.spento);
    const sito = p.tema === 'sito' || !T[p.tema];
    // Sito: il verde e' giallo e il rosso e' a linea; lo spento e' grigio (il bordo dei tasti a linea e rosso sparisce).
    const grigio = sito && spento;
    const rossoLinea = sito && v === 'rosso';
    return {
      label: p.label ?? 'ANNULLA',
      famiglia: c.famiglia,
      stile: c.stile,
      peso: c.peso,
      spaziatura: c.spaziatura,
      raggio: c.raggio,
      alto: grande ? '64px' : '60px',
      corpo: grande ? '20px' : '18px',
      spazio: quadro ? '0' : grande ? '0 26px' : '0 22px',
      larghezza: quadro ? '60px' : 'auto',
      fondo: grigio ? c.surface2 : v === 'verde' ? c.verde : v === 'rosso' ? (rossoLinea ? 'transparent' : c.rosso) : acceso ? c.surface2 : 'transparent',
      bordo: v === 'linea' ? '2px solid ' + (grigio ? 'transparent' : acceso ? c.text : c.line) : rossoLinea ? '2px solid ' + (grigio ? 'transparent' : c.rosso) : 'none',
      colore: grigio ? c.dim : v === 'verde' ? c.suColore : v === 'rosso' ? c.suRosso : c.text,
      opacita: spento && v !== 'linea' && !sito ? '0.5' : '1',
    };
  }
}
</script>
</body>
</html>
