<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <!-- Tema sito: Big Shoulders Display e Inter (qui da Google Fonts, in app file locali OFL). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="width: 100%">
<sc-if value="{{sito}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: stretch; gap: 6px; width: 100%">
  <div style="display: flex; align-items: center; gap: 12px; flex-grow: 1; min-width: 0; min-height: 56px; padding: 0 14px; background: #ffffff; border-radius: 6px; box-shadow: {{barra}}; color: #0d2a3d; text-align: left">
    <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 26px; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; line-height: 1; color: {{coloreSegnoSito}}">
      <sc-if value="{{conAnello}}" hint-placeholder-val="{{ false }}">
        <span style="width: 22px; height: 22px; border: 2px solid #14709f; border-radius: 4px"></span>
      </sc-if>
      <sc-if value="{{conSegno}}" hint-placeholder-val="{{ true }}">
        <span>{{segno}}</span>
      </sc-if>
    </span>
    <span style="flex-grow: 1; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 500; color: {{coloreNomeSito}}; text-decoration: {{decorazione}}">{{nome}}</span>
    <sc-if value="{{prova}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Badge" tipo="prova" label="PROVA" tema="sito" hint-size="70px,24px"></dc-import>
    </sc-if>
  </div>
  <sc-if value="{{conTogli}}" hint-placeholder-val="{{ false }}">
    <span style="display: inline-flex; align-items: center; flex-shrink: 0; min-height: 44px; padding: 0 12px; border: 2px solid #cfe6f4; color: #46606f; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; letter-spacing: 0.12em">TOGLI</span>
  </sc-if>
</div>
</sc-if>
<sc-if value="{{nonSito}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: stretch; gap: 6px; width: 100%">
  <div style="display: flex; align-items: center; gap: 12px; flex-grow: 1; min-width: 0; min-height: 56px; padding: 0 14px; background: {{c.surface}}; border: 2px solid {{bordo}}; color: {{c.text}}; text-align: left">
    <span style="width: 26px; text-align: center; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 22px; font-weight: 700; line-height: 1; color: {{coloreSegno}}">{{segno}}</span>
    <span style="flex-grow: 1; font-size: 17px; font-weight: 500; color: {{coloreNome}}; text-decoration: {{decorazione}}">{{nome}}</span>
    <sc-if value="{{prova}}" hint-placeholder-val="{{ false }}">
      <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; white-space: nowrap; color: {{c.gialloTesto}}; border: 2px solid #f4c31b; padding: 1px 6px">PROVA</span>
    </sc-if>
  </div>
  <sc-if value="{{conTogli}}" hint-placeholder-val="{{ false }}">
    <span style="display: inline-flex; align-items: center; flex-shrink: 0; min-height: 44px; padding: 0 12px; border: 2px solid {{c.line}}; color: {{c.dim}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 700; letter-spacing: 0.12em">TOGLI</span>
  </sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"nome":{"editor":"text","default":"Rossi Giulia"},"stato":{"editor":"enum","options":["niente","presente","assente"],"default":"niente"},"prova":{"editor":"boolean","default":false},"lettura":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro","sito"],"default":"scuro","section":"Tema"},"$preview":{"width":320,"height":70}}'>
// Riproduzione 1:1 della riga dell'appello: .riga-appello e .nome-appello (src/styles.css righe 413-429) usate in
// src/components/AppelloScreen.tsx (righe 365-382). Tre stati, tre colori, e il segno grande a sinistra:
// presente = bordo e segno verdi (--verde, non -testo: il segno e' grande); assente = bordo rosso, segno in
// rosso-testo, nome barrato e spento; niente = bordo `line`, nessun segno.
// prova = la riga di chi viene a provare: marchio PROVA (.prova-marchio) dentro la riga e TOGLI accanto
// (.riga-prova, .prova-togli, righe 457-469; AppelloScreen.tsx righe 386-405).
// tema sito (COSTRUITO, `:root[data-look='sito'] .riga-appello` in src/styles.css): tessera bianca senza bordo, raggio 6px, lo stato in una barra di 4px a sinistra (verde #12913f presente, rosso #e4292a assente) e il segno
// in Inter 22px 700 (✓ verde-testo #0b7a33, ✕ rosso-testo #b81d1d): lo stato si legge dal segno e dalla barra, mai dal solo colore. Il nome assente e' barrato e in #46606f come nel codice.
// Non segnato = un quadratino vuoto da 22px col bordo blu #14709f e raggio 4px al posto del segno: dice «qui si tocca» (e' un disegno, non un testo nuovo).
// `lettura` (appello in SOLA LETTURA): la riga non si tocca (disabled), il quadratino resta, il nome e' sempre in inchiostro #0d2a3d (anche l'assente, barrato) e TOGLI non c'e'.
// PROVA e' il marchio con bordo giallo scuro #8f6a00 (Badge). TOGLI: 44px, bordo 2px celeste #cfe6f4 e testo #46606f, Inter 12px 700, 0.12em, senza raggio (come `.prova-togli`: nel look non e' un tasto a linea blu).
// Alta 56px perche' la si tocca in piedi e di fretta (La Regola del Dito di Fretta, DESIGN.md).
const T = {
  scuro: { surface: '#1c1c1c', line: '#333333', text: '#f2f2f0', dim: '#8c8c88', verde: '#16a54a', rosso: '#e4292a', gialloTesto: '#f4c31b', rossoTesto: '#ff5a52' },
  chiaro: { surface: '#ffffff', line: '#d4d4ce', text: '#161616', dim: '#656561', verde: '#12913f', rosso: '#e4292a', gialloTesto: '#8f6a00', rossoTesto: '#b81d1d' },
  sito: { surface: '#ffffff', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f', verde: '#12913f', rosso: '#e4292a', gialloTesto: '#8f6a00', rossoTesto: '#b81d1d', verdeTesto: '#0b7a33' },
};
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const stato = p.stato || 'niente';
    const sito = p.tema === 'sito';
    return {
      sito, nonSito: !sito, conTogli: truthy(p.prova) && !truthy(p.lettura),
      barra: stato === 'presente' ? 'inset 4px 0 0 #12913f' : stato === 'assente' ? 'inset 4px 0 0 #e4292a' : 'none',
      coloreSegnoSito: stato === 'presente' ? '#0b7a33' : '#b81d1d',
      coloreNomeSito: stato === 'assente' && !truthy(p.lettura) ? '#46606f' : '#0d2a3d',
      conAnello: stato === 'niente', conSegno: stato !== 'niente',
      c,
      nome: p.nome ?? 'Rossi Giulia',
      prova: truthy(p.prova),
      bordo: stato === 'presente' ? c.verde : stato === 'assente' ? c.rosso : c.line,
      segno: stato === 'presente' ? '✓' : stato === 'assente' ? '✕' : '',
      coloreSegno: stato === 'presente' ? c.verde : c.rossoTesto,
      coloreNome: stato === 'assente' ? c.dim : c.text,
      decorazione: stato === 'assente' ? 'line-through' : 'none',
    };
  }
}
</script>
</body>
</html>
