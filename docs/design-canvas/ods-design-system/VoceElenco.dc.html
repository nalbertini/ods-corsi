<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
<div style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 6px 12px; background: {{c.bg}}; border: 2px solid {{c.line}}; color: {{c.text}}">
  <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
    <span style="font-size: 15px; font-weight: 700">{{nome}}</span>
    <sc-if value="{{haGuaio}}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 14px; color: {{c.rossoTesto}}">{{guaio}}</span>
    </sc-if>
    <span style="font-size: 12px; color: {{c.dim}}">{{riassunto}}</span>
  </span>
  <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border: 2px solid {{c.line}}; color: {{c.sec}}; font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; white-space: nowrap">{{tasto}}</span>
</div>
</x-dc>
<script data-dc-script data-props='{"nome":{"editor":"text","default":"Judo kids"},"riassunto":{"editor":"text","default":"nati 2016-2019 — saldo 300 € · annuale 310 € · trimestre 105 €"},"guaio":{"editor":"text","default":""},"tasto":{"editor":"text","default":"CAMBIA"},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":700,"height":64}}'>
// Riproduzione 1:1 di una voce chiusa di LISTINO > I CORSI: <div className="sg-voce-elenco"> di src/components/segreteria/Listino.tsx
// (righe 300-311) con .sg-voce-elenco e .sg-chip di src/styles.css (righe 1804 e 1462-1465). Fondo `bg`, bordo 2px `line`,
// min 48px, padding 6px 12px, gap 12px. Il nome 15px 700; `guaio` una riga 14px rosso-testo (Senza corso: scegli il corso da CAMBIA);
// il riassunto 12px `dim`. A destra il .sg-chip (44px, Saira 13px 0.12em, bordo 2px `line`, testo `sec`).
const T = {
  scuro: { bg: '#121212', line: '#333333', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', rossoTesto: '#ff5a52' },
  chiaro: { bg: '#f4f4f1', line: '#d4d4ce', text: '#161616', sec: '#3d3d3a', dim: '#656561', rossoTesto: '#b81d1d' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const guaio = p.guaio ?? '';
    return {
      c, cond: COND,
      nome: p.nome ?? 'Judo kids',
      riassunto: p.riassunto ?? 'nati 2016-2019 — saldo 300 € · annuale 310 € · trimestre 105 €',
      guaio, haGuaio: guaio !== '',
      tasto: p.tasto ?? 'CAMBIA',
    };
  }
}
</script>
</body>
</html>
