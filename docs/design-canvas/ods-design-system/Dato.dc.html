<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
  <span style="font-family: {{famiglia}}; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: {{coloreEtichetta}}">{{etichetta}}</span>
  <span style="font-family: {{famigliaValore}}; font-size: 16px; font-weight: 500; line-height: 1.3; letter-spacing: {{spazioValore}}; color: {{coloreValore}}; overflow-wrap: anywhere">{{valore}}</span>
  <sc-if value="{{haNota}}" hint-placeholder-val="{{ true }}">
    <span style="font-family: {{famigliaValore}}; font-size: 13px; font-weight: 600; line-height: 1.4; color: {{coloreNota}}">{{nota}}</span>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"etichetta":{"editor":"text","default":"NATO IL"},"valore":{"editor":"text","default":"10 giugno 2012"},"codice":{"editor":"boolean","default":false},"nota":{"editor":"text","default":""},"tono":{"editor":"enum","options":["","giallo","rosso"],"default":""},"tema":{"editor":"enum","options":["scuro","chiaro","sito"],"default":"scuro","section":"Tema"},"$preview":{"width":360,"height":80}}'>
// Un dato in lettura della scheda iscritto: Campo di src/components/segreteria/comune.tsx con dentro
// .sg-valore (src/styles.css: .sg-etichetta 12px 700 0.18em `dim`, .sg-valore 16px 500 1.3). Vuoto = «—» in `dim`.
// codice = il codice fiscale (`num`, 0.04em). Nel look sito l'etichetta e' Inter, non Saira (:root[data-look='sito'] .sg-etichetta).
// PROPOSTA (../scheda-iscritto-persona/): `tono` giallo o rosso colora etichetta e `nota` come .sg-etichetta[data-manca],
// per un dato che serve e manca (il codice fiscale del genitore di un minorenne).
const T = {
  scuro: { text: '#f2f2f0', dim: '#8c8c88', giallo: '#f4c31b', rosso: '#ff5a52' },
  chiaro: { text: '#161616', dim: '#656561', giallo: '#8f6a00', rosso: '#b81d1d' },
  sito: { text: '#0d2a3d', dim: '#46606f', giallo: '#8f6a00', rosso: '#b81d1d' },
};
const SAIRA = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const BARLOW = "Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const sito = p.tema === 'sito';
    const valore = p.valore ?? '';
    const tono = p.tono ? c[p.tono] : '';
    const nota = p.nota ?? '';
    return {
      etichetta: p.etichetta ?? 'NATO IL',
      valore: valore || '—',
      famiglia: sito ? INTER : SAIRA,
      famigliaValore: sito ? INTER : BARLOW,
      spazioValore: truthy(p.codice) ? '0.04em' : 'normal',
      coloreEtichetta: tono || c.dim,
      coloreValore: valore ? c.text : c.dim,
      haNota: nota !== '',
      nota,
      coloreNota: tono || c.dim,
    };
  }
}
</script>
</body>
</html>
