<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; width: 100%; color: #0d2a3d">
  <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
    <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">{{titolo}}</h1>
    <span style="font-size: 14px; color: #46606f; line-height: 1.4">{{sotto}}<sc-if value="{{conLink}}" hint-placeholder-val="{{ false }}"> <span style="color: #14709f; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap">{{link}} →</span></sc-if></span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0">
    <sc-if value="{{conAltro}}" hint-placeholder-val="{{ false }}">
      <div style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 2px solid #14709f; border-radius: 6px; font-size: 16px; font-weight: 600; color: #0d2a3d; white-space: nowrap">{{altro}} <span aria-hidden="true" style="font-size: 12px">▾</span></div>
    </sc-if>
    <sc-if value="{{conSec}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Bottone" label="{{secondaria}}" icona="{{iconaSecondaria}}" variante="linea" contesto="segreteria" alto="44px" hint-size="auto,44px"></dc-import>
    </sc-if>
    <sc-if value="{{conPrimaria}}" hint-placeholder-val="{{ false }}">
      <dc-import name="Bottone" label="{{primaria}}" icona="{{iconaPrimaria}}" variante="pieno" contesto="segreteria" alto="44px" hint-size="auto,44px"></dc-import>
    </sc-if>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"ISCRITTI"},"sotto":{"editor":"text","default":"162 persone attive."},"link":{"editor":"text","default":""},"altro":{"editor":"text","default":""},"secondaria":{"editor":"text","default":"Importa tessere"},"iconaSecondaria":{"editor":"text","default":"carica"},"primaria":{"editor":"text","default":"Nuovo iscritto"},"iconaPrimaria":{"editor":"text","default":"aggiungi"},"$preview":{"width":1100,"height":80}}'>
// PROPOSTA «segreteria in ordine» (../segreteria-ordine/): la testata unica di una pagina di segreteria (`Testa` di comune.tsx, `.sg-testa`).
// Sempre la stessa forma: a sinistra il titolo (Big Shoulders 800 34px, come PaginaSito) e la frase sotto (14px `dim`); a destra, allineate in alto, le azioni,
// tutte alte 44px: prima «Altre azioni ▾» (MenuAzioni) se c'e', poi una a linea, ultima la sola principale gialla. Al massimo una principale e una a linea:
// il resto va in «Altre azioni». Un rimando a un'altra pagina non e' un tasto: e' `link`, testo blu sottolineato in coda alla frase (Presenze → Statistiche).
// Sotto i 1000px le azioni vanno sotto il titolo (non riprodotto qui).
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      conLink: !!p.link, conAltro: !!p.altro, conSec: !!p.secondaria, conPrimaria: !!p.primaria,
    };
  }
}
</script>
</body>
</html>
