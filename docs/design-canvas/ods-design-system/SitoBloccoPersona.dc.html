<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Il sito pubblico usa Big Shoulders Display e Inter (src/lib/sitoGenera.ts); qui il canvas li prende da Google Fonts, come per Saira e Barlow. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="position: relative; height: 100%; min-height: {{minimo}}; background: {{bg}}; color: {{fg}}; border-radius: 6px; padding: {{pad}}; outline: {{contorno}}; outline-offset: -3px">
  <div style="font-family: {{big}}; text-transform: uppercase; font-weight: 800; font-size: {{corpoTitolo}}; line-height: .95; margin-bottom: 14px">{{titolo}}</div>
  <div style="display: flex; flex-direction: column"><div style="font-family: {{inter}}; font-size: {{corpo}}; line-height: 1.5">{{testo}}</div><sc-if value="{{haNota}}" hint-placeholder-val="{{ false }}"><span style="align-self: flex-start; display: inline-block; margin-top: 12px; background: #ffffff; color: #0d2a3d; border: 2px solid #e4292a; border-radius: 4px; padding: 4px 8px; font-family: {{inter}}; font-size: 12px; font-weight: 700; line-height: 1.2">{{nota}}</span></sc-if></div>
</div>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"Chi è"},"testo":{"editor":"text","default":""},"tono":{"editor":"enum","options":["blu","giallo","inchiostro","chiara","bianco"],"default":"inchiostro"},"minimo":{"editor":"text","default":"300px"},"piccolo":{"editor":"boolean","default":false},"nota":{"editor":"text","default":""},"$preview":{"width":440,"height":300}}'>
// PROPOSTA scheda di un istruttore: una delle tre tessere di testo (Chi è / Come ha iniziato / A scuola), di 26-36 parole ciascuna (entro il 20% della media).
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
// Colori del sito (sito-approvato/token-proposta.md, A2). Il testo sul blu e sull'inchiostro e' bianco (5,4:1 e 14,8:1); sul giallo e sul chiaro e' inchiostro.
const TONI = { blu: ['#14709f', '#ffffff'], giallo: ['#f4c31b', '#0d2a3d'], inchiostro: ['#0d2a3d', '#ffffff'], chiara: ['#cfe6f4', '#0d2a3d'], bianco: ['#ffffff', '#0d2a3d'] };
const truthy = (v) => v === true || v === 'true';
// [DA CONFERMARE]: un dato che manca resta col testo di oggi, ma ben marcato (contorno rosso tratteggiato + cartellino).
const segna = (nota) => ({ haNota: !!nota, nota: nota || '', contorno: nota ? '3px dashed #e4292a' : 'none' });
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const [bg, fg] = TONI[p.tono] || TONI.inchiostro;
    const pic = truthy(p.piccolo);
    return { big: BIG, inter: INTER, bg, fg, titolo: p.titolo ?? '', testo: p.testo ?? '', minimo: p.minimo || '300px', pad: pic ? '20px' : '28px 28px 32px', corpoTitolo: pic ? '36px' : '48px', corpo: pic ? '17px' : '19px', ...segna(p.nota) };
  }
}
</script>
</body>
</html>
