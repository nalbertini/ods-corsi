<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<ul style="display: flex; flex-direction: column; gap: 6px; width: 100%; margin: 0; padding: 0; list-style: none; color: {{c.text}}">
  <sc-for list="{{righe}}" as="r" hint-placeholder-count="2">
    <li style="display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 0 10px; padding: 14px 16px; border-left: 6px solid {{r.bordo}}; background: {{c.surface2}}; font-family: {{cond}}; font-size: 24px; font-weight: 800; line-height: 1; text-transform: uppercase"><span>{{r.segno}}{{r.giorni}}</span><sc-if value="{{r.haOra}}" hint-placeholder-val="{{ true }}"><span style="white-space: nowrap; font-size: 22px">{{r.ora}}</span></sc-if></li>
  </sc-for>
</ul>
</x-dc>
<script data-dc-script data-props='{"righe":{"editor":"text","default":"Lunedì e giovedì · 18:00–19:00|Sabato · 10:00–11:00"},"$preview":{"width":420,"height":140}}'>
// Riproduzione 1:1 di .sito-orario-righe / .sito-orario-riga / .sito-orario-ora (src/styles.css, blocco «L'orario dai corsi nel pannello
// SITO») e della lista «Così lo vede il sito» di OrarioSito.tsx. Ogni riga e' un testo «giorni · fascia» (testiOrario di
// src/lib/sitoOrario.ts) spezzato in DUE pezzi: i giorni (a capo se serve) e la fascia, nowrap, a destra. Grid minmax(0,1fr) auto,
// gap 10px, padding 14px 16px, filo a sinistra 6px `blu`, fondo `surface-2`, Big Shoulders 800 24px maiuscolo (22px la fascia).
// Tutte le righe uguali, col filo `blu`. `righe`: «giorni · fascia» separate da |.
// Sotto, nell'app, la frase .sg-sotto «Giorno, ora e durata. Mai sala, istruttore o posti.» (la dice la schermata, non questo componente).
// PROPOSTA scartata (docs/design-canvas/orario-automatico): righe a tinte piene azzurro/giallo, raggio 6px. Vince il costruito.
const T = {
  sito: { surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', sec: '#0d2a3d', dim: '#46606f', blu: '#14709f', giallo: '#f4c31b', gialloTesto: '#8f6a00' },
};
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const BODY = "Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif";
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
        const lista = (p.righe ?? '').split('|').filter((t) => t !== '');
    const righe = lista.map((t, i) => {
      const [giorni, ora] = t.split(' · ');
      return { giorni, ora: ora ?? '', haOra: !!ora, segno: '', bordo: c.blu };
    });
    return { c, cond: BIG, righe };
  }
}
</script>
</body>
</html>
