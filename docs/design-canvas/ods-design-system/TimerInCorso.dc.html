<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Big+Shoulders+Display:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 100%; min-height: {{altezza}}; background: {{c.bg}}; color: {{c.text}}; font-family: {{corpo}}; border: 10px solid {{f.tinta}}">
  <div style="display: flex; align-items: center; gap: 10px; padding: 10px 10px 0">
    <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border: 2px solid {{c.lineaTasto}}; color: {{c.tasto}}; border-radius: {{raggio}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></span>
    <span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
      <span style="font-family: {{cond}}; font-style: {{ob}}; font-size: 18px; font-weight: 700; line-height: 1.05">{{nome}}</span>
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.18em; color: {{c.dim}}">{{serie}}</span>
    </span>
    <span style="padding: 5px 9px; background: #f4c31b; color: {{c.suGiallo}}; font-size: 11px; font-weight: 700; letter-spacing: 0.12em">MAURIZIO</span>
    <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; min-width: 44px; height: 44px; padding: 0 8px; border: 2px solid {{c.lineaTasto}}; color: {{c.tasto}}; border-radius: {{raggio}}; font-family: {{cond}}; font-size: 13px; font-weight: 700; letter-spacing: 0.1em">RESET</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; margin-top: 12px; padding: 16px 4px 0; border-top: 2px solid {{c.lineSoft}}">
    <sc-if value="{{fascia}}" hint-placeholder-val="{{ false }}">
      <span style="display: flex; align-items: center; justify-content: center; align-self: stretch; min-height: 52px; background: {{f.tinta}}; color: {{f.su}}; border-radius: {{raggio}}; font-family: {{cond}}; font-size: 32px; font-weight: 800; letter-spacing: 0.22em; line-height: 1">{{f.parola}}</span>
    </sc-if>
    <sc-if value="{{nonFascia}}" hint-placeholder-val="{{ true }}">
      <span style="font-family: {{cond}}; font-style: {{ob}}; font-size: 30px; font-weight: 700; letter-spacing: 0.26em; color: {{f.testo}}; line-height: 1">{{f.parola}}</span>
    </sc-if>
    <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 120px; font-weight: 800; line-height: 0.88; letter-spacing: -0.02em; color: {{c.text}}">{{f.tempo}}</span>
    <span style="font-family: {{cond}}; font-style: {{ob}}; font-size: 30px; font-weight: 600; letter-spacing: 0.04em; text-align: center">{{f.esercizio}}</span>

    <div style="display: flex; flex-direction: column; gap: 10px; align-self: stretch; padding-top: 16px">
      <span style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 72px; background: {{f.tinta}}; color: {{f.su}}; border-radius: {{raggio}}; font-family: {{cond}}; font-style: {{ob}}; font-size: 26px; font-weight: 800; letter-spacing: 0.18em"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="{{f.icona}}"></path></svg>{{f.tasto}}</span>
      <div style="display: flex; gap: 8px">
        <span style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; border: 2px solid {{c.lineaTasto}}; color: {{c.tasto}}; border-radius: {{raggio}}; font-family: {{cond}}; font-size: 16px; font-weight: 700; letter-spacing: 0.1em">|◁ INDIETRO</span>
        <span style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 48px; border: 2px solid {{f.bordoPiu}}; color: {{c.text}}; opacity: {{f.opPiu}}; border-radius: {{raggio}}; font-family: {{cond}}; font-size: 16px; font-weight: 700; letter-spacing: 0.1em">+30″</span>
        <span style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; border: 2px solid {{c.lineaTasto}}; color: {{c.tasto}}; border-radius: {{raggio}}; font-family: {{cond}}; font-size: 16px; font-weight: 700; letter-spacing: 0.1em">AVANTI ▷|</span>
      </div>
    </div>

    <div style="align-self: stretch; margin-top: 16px">
      <span style="font-family: {{cond}}; font-size: 13px; font-weight: 700; letter-spacing: 0.22em; color: {{c.dim}}">SCALETTA</span>
      <sc-for list="{{righe}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; background: {{r.fondo}}; color: {{r.colore}}; border-bottom: 2px solid {{r.filo}}; font-family: {{cond}}; font-size: 22px; font-weight: 600; letter-spacing: 0.04em">
          <span style="width: 14px; height: 14px; flex-shrink: 0; background: {{r.segno}}"></span>
          <span style="flex: 1">{{r.nome}}</span>
          <span style="font-weight: 700; font-variant-numeric: tabular-nums">{{r.durata}}</span>
        </div>
      </sc-for>
    </div>
  </div>
  <div style="flex-grow: 1"></div>
</div>
</x-dc>
<script data-dc-script data-props='{"stato":{"editor":"enum","options":["pronto","lavoro","recupero"],"default":"pronto"},"nome":{"editor":"text","default":"BRUCIA GRASSI"},"serie":{"editor":"text","default":"SERIE 1 / 3"},"altezza":{"editor":"text","default":"860px"},"tema":{"editor":"enum","options":["scuro","sito"],"default":"scuro","section":"Tema"},"$preview":{"width":390,"height":860}}'>
// L'allenamento nella pagina TIMER dell'area istruttori com'e' costruito (TimerScreen.tsx, .tf-* in timer/src/styles.css, telefono in verticale):
// cornice di 10px del colore della fase, X / nome e SERIE / MAURIZIO / RESET, la fase, le cifre, l'esercizio, il tasto grande (AVVIA,
// PAUSA, RIPRENDI) del colore della fase, INDIETRO +30″ AVANTI, la SCALETTA col passo corrente pieno.
// tema scuro = com'era prima del look: fasi --prepare giallo, --work rosso, --rest verde; la fase scritta nel suo colore (--state-testo).
// tema sito = COSTRUITO (TimerSala con `sito`, :root[data-tema='sito'] e .tf-* in timer/src/styles.css, SU_STATE in Quadrante.tsx): fondo #eef5fa, Big Shoulders e Inter, cifre inchiostro #0d2a3d (mai gialle su chiaro);
// la fase diventa una FASCIA piena con la parola sopra (si legge da lontano, chiesto dall'istruttore); fasi coi colori della
// TimerStriscia nel look sito: PRONTO/PREPARATI giallo #f4c31b con inchiostro, LAVORO #b81d1d e RECUPERO #0b7a33 con bianco,
// RIPOSO e DEFATICAMENTO blu #14709f, sempre col bianco sopra (--su-*); +30″ col bordo della fase; tasti secondari col bordo blu.
// Fuori dagli intervalli (cronometro, conto alla rovescia, chip accesi, COMPLETATO verde #0b7a33) il testo sui fondi pieni è bianco (--su-colore), sul giallo inchiostro (--su-giallo).
const T = {
  scuro: { bg: '#121212', lineSoft: '#2a2a2a', text: '#f2f2f0', dim: '#8c8c88', tasto: '#b8b8b2', lineaTasto: '#333333', suGiallo: '#121212',
    prepare: ['#f4c31b', '#121212', '#f4c31b'], work: ['#e4292a', '#ffffff', '#e4292a'], rest: ['#16a54a', '#121212', '#16a54a'] },
  sito: { bg: '#eef5fa', lineSoft: '#cfe6f4', text: '#0d2a3d', dim: '#46606f', tasto: '#14709f', lineaTasto: '#14709f', suGiallo: '#0d2a3d',
    prepare: ['#f4c31b', '#0d2a3d', '#8f6a00'], work: ['#b81d1d', '#ffffff', '#b81d1d'], rest: ['#0b7a33', '#ffffff', '#0b7a33'] },
};
const SAIRA = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const BARLOW = "Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const PLAY = 'M6 3l15 9-15 9z';
const PAUSA = 'M6 4h4v16H6zM14 4h4v16h-4z';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const sito = p.tema === 'sito';
    const c = sito ? T.sito : T.scuro;
    const stato = p.stato || 'pronto';
    const kind = stato === 'lavoro' ? 'work' : stato === 'recupero' ? 'rest' : 'prepare';
    const [tinta, su, testo] = c[kind];
    const pronto = stato === 'pronto';
    const f = {
      tinta, su, testo,
      parola: pronto ? 'PRONTO' : stato === 'lavoro' ? 'LAVORO' : 'RECUPERO',
      tempo: pronto ? '00:20' : stato === 'lavoro' ? '00:14' : '00:07',
      esercizio: pronto ? 'Brucia grassi' : stato === 'lavoro' ? 'Burpee + salto' : 'Recupero',
      tasto: pronto ? 'AVVIA' : 'PAUSA', icona: pronto ? PLAY : PAUSA,
      bordoPiu: pronto ? c.lineaTasto : tinta, opPiu: pronto ? '0.35' : '1',
    };
    const riga = (k, nome, durata, corrente) => {
      const [t, s] = c[k];
      return corrente
        ? { nome, durata, fondo: t, colore: s, filo: t, segno: s }
        : { nome, durata, fondo: 'transparent', colore: c.text, filo: c.lineSoft, segno: t };
    };
    const righe = [
      riga('prepare', 'PREPARATI', '20"', pronto),
      riga('work', 'BURPEE + SALTO', '20"', stato === 'lavoro'),
      riga('rest', 'RECUPERO', '10"', stato === 'recupero'),
    ];
    return {
      c, f, righe, altezza: p.altezza || '860px', nome: p.nome ?? 'BRUCIA GRASSI', serie: p.serie ?? 'SERIE 1 / 3',
      cond: sito ? BIG : SAIRA, corpo: sito ? INTER : BARLOW, ob: sito ? 'normal' : 'oblique 9deg', raggio: sito ? '6px' : '0',
      fascia: sito, nonFascia: !sito,
    };
  }
}
</script>
</body>
</html>
