<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <!-- Look sito (modulo di iscrizione): Big Shoulders Display e Inter, come in CaricaFile. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 6px; width: 100%; min-width: 0; color: {{c.text}}; font-family: {{testoFam}}">
  <span style="font-family: {{cond}}; font-size: {{etichettaCorpo}}; font-weight: {{etichettaPeso}}; letter-spacing: {{etichettaSpazio}}; color: {{c.dim}}">{{etichetta}}</span>
  <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; background: {{c.surface}}; border: 2px solid {{c.line}}; border-radius: {{raggio}}">
    <sc-if value="{{nessuna}}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 14px; line-height: 1.4; color: {{c.dim}}">Scegli i corsi per vedere quanto costa.</span>
    </sc-if>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{righe}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; font-size: 15px; color: {{r.colore}}">
          <span style="flex-grow: 1">{{r.testo}}</span>
          <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums">{{r.importo}}</span>
        </div>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 12px; padding-top: 6px; border-top: 2px solid {{c.line}}; font-size: 17px; font-weight: 700">
        <span style="flex-grow: 1">Totale</span>
        <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums">{{totale}}</span>
      </div>
    </div>
    <sc-for list="{{frasi}}" as="f" hint-placeholder-count="1">
      <span style="font-size: 14px; line-height: 1.4; color: {{c.dim}}">{{f}}</span>
    </sc-for>
    <sc-if value="{{haAvviso}}" hint-placeholder-val="{{ false }}">
      <span style="font-size: 14px; line-height: 1.4; color: {{c.gialloTesto}}">{{avviso}}</span>
    </sc-if>
    <span style="font-size: 14px; line-height: 1.4; color: {{c.dim}}">{{stima}}</span>
    <span style="margin-top: 4px; padding: 8px 10px; background: {{c.surface2}}; border: 2px solid {{c.line}}; font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 17px; font-weight: 600; letter-spacing: 0.02em">{{iban}}</span>
    <span style="font-size: 14px; line-height: 1.4; color: {{c.dim}}">Causale: <span style="color: {{c.text}}">{{causale}}</span></span>
    <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px">
      <sc-for list="{{tasti}}" as="t" hint-placeholder-count="3">
        <span style="display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 16px; border: 2px solid {{bordoTasto}}; border-radius: {{raggio}}; color: {{c.tasto}}; font-family: {{cond}}; font-style: {{inclina}}; font-size: {{tastoCorpo}}; font-weight: {{etichettaPeso}}; letter-spacing: {{tastoSpazio}}; white-space: nowrap">{{t}}</span>
      </sc-for>
    </span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"righe":{"editor":"text","default":"Quota associativa:50 €|Judo kids · trimestre:105 €|Sconto famiglia 20% su Judo kids di Ginevra:−21 €"},"totale":{"editor":"text","default":"134 €"},"frasi":{"editor":"text","default":"Lo sconto famiglia va sull annuale che costa meno nel nucleo: Judo kids di Ginevra, che l ha già avuto o lo avrà in segreteria."},"avviso":{"editor":"text","default":""},"intestatario":{"editor":"text","default":"ASD Il Centro Judo"},"iban":{"editor":"text","default":"IT00 X000 0000 0000 0000 0000 000"},"causale":{"editor":"text","default":"Iscrizione Giulia Rossi · Judo kids"},"tasti":{"editor":"text","default":"COPIA IBAN|COPIA CAUSALE|PAGA CON SATISPAY"},"etichetta":{"editor":"text","default":"QUANTO COSTA"},"stima":{"editor":"text","default":""},"$preview":{"width":360,"height":420}}'>
// Riproduzione 1:1 di QuantoCosta di src/components/ModuloIscrizione.tsx (righe 832-885): la voce QUANTO COSTA di una persona in piu' nel
// nucleo. Il guscio e' Riquadro stretto (.card.stack.riquadro[data-stretto]: padding 14px, gap 4px) preceduto da .modulo-etichetta (12px 0.18em);
// le righe sono .stima (src/styles.css righe 788-791): .stima-riga 15px, importo in Saira tabulare, riga di sconto in `verde`, .stima-totale
// con filo 2px `line` sopra, 17px 700; le frasi sono .passo-dettaglio (14px `dim`, avviso giallo-testo); l'IBAN e' la scatola .iban; i tasti .passo-btn.
// righe = `Voce:importo` separate da `|` (un importo che comincia per «−» e' lo sconto: verde); totale = la cifra del Totale;
// frasi = .passo-dettaglio separate da `|`; avviso = riga gialla; causale = il testo dopo «Causale:» (in `text`); tasti separati da `|`.
// La stessa scatola fa IL TUO ORDINE di ORDINE ARRIVATO del vestiario (`Arrivato` di src/components/OrdinaVestiario.tsx, righe 407-472):
// `etichetta` = IL TUO ORDINE, `stima` = «Paga entro il … con un bonifico a …:» (il totale lo calcola il server, non e' una stima), `frasi` vuoto.
// Vuoti, restano quelli dell'iscrizione.
// Vuoto `righe`: «Scegli i corsi per vedere quanto costa» (nessun corso scelto).
// Aspetto: il modulo di iscrizione (:root[data-modulo='sito'] di src/styles.css): token del sito, etichetta Big Shoulders 15px 0.08em
// (.modulo-etichetta), raggio 6px (.card), tasti .btn-ghost col bordo `riga-campo` #14709f, Big Shoulders dritto 22px 0.06em.
const T = {
  sito: { bg: '#eef5fa', surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', sec: '#0d2a3d', dim: '#46606f', faint: '#46606f', tasto: '#0d2a3d', tratteggio: '#14709f', blu: '#14709f', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#0d2a3d', suRosso: '#ffffff' },
};
const BIG = "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif";
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
const righe = lista(p.righe ?? 'Quota associativa:50 €|Judo kids · trimestre:105 €|Sconto famiglia 20% su Judo kids di Ginevra:−21 €', '|').map((s) => { const i = s.lastIndexOf(':'); const importo = s.slice(i + 1); return { testo: s.slice(0, i), importo, colore: /^[−-]/.test(importo) ? c.verde : c.text }; });
    const avviso = p.avviso ?? '';
    return {
      c, cond: BIG, testoFam: INTER, raggio: '6px',
      etichettaCorpo: '15px', etichettaSpazio: '0.08em', etichettaPeso: '800',
      bordoTasto: '#14709f', inclina: 'normal', tastoCorpo: '22px', tastoSpazio: '0.06em',
      righe, nessuna: righe.length === 0, totale: p.totale ?? '134 €',
      frasi: lista(p.frasi ?? 'Lo sconto famiglia va sull annuale che costa meno nel nucleo: Judo kids di Ginevra, che l ha già avuto o lo avrà in segreteria.', '|'), avviso, haAvviso: avviso !== '',
      etichetta: p.etichetta || 'QUANTO COSTA',
      stima: p.stima ? p.stima : 'È una stima dal listino: le altre offerte e l importo giusto li conferma la segreteria. Bonifico a ' + (p.intestatario ?? 'ASD Il Centro Judo') + ':',
      iban: p.iban ?? 'IT00 X000 0000 0000 0000 0000 000', causale: p.causale ?? 'Iscrizione Giulia Rossi · Judo kids',
      tasti: lista(p.tasti ?? 'COPIA IBAN|COPIA CAUSALE|PAGA CON SATISPAY', '|'),
    };
  }
}
</script>
</body>
</html>
