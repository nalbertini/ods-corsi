<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 150px 210px 90px; align-items: center; gap: 14px; min-height: 56px; padding: 8px 14px; background: #ffffff; border-bottom: 1px solid #cfe6f4; box-shadow: {{barra}}; cursor: pointer">
  <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{numero}}</span>
  <span style="min-width: 0; font-size: 15px; font-weight: 600"><span style="display: flex; align-items: center; min-height: 44px">{{tipo}}</span><span style="display: block; font-size: 12px; font-weight: 400; color: #46606f">{{odg}}</span></span>
  <span style="font-size: 14px; font-variant-numeric: tabular-nums">{{data}}</span>
  <span><span style="display: inline-block; max-width: 100%; padding: 1px 8px; border: 1.5px solid {{colore}}; border-radius: 6px; background: #ffffff; color: {{colore}}; font-size: 12px; font-weight: 700; letter-spacing: 0.02em">{{stato}}</span></span>
  <span style="display: flex; align-items: center; min-height: 44px; font-size: 14px">{{pdf}}</span>
</div>
</x-dc>
<script data-dc-script data-props='{"numero":{"editor":"text","default":"2026/3"},"tipo":{"editor":"text","default":"Direttivo"},"odg":{"editor":"text","default":"Andamento dei corsi · Cena di Natale"},"data":{"editor":"text","default":"12 marzo 2026"},"firmato":{"editor":"boolean","default":true},"$preview":{"width":1000,"height":72}}'>
// COSTRUITA (src/components/segreteria/Verbali.tsx, elenco; stile in src/segreteria.css, blocco VERBALI): la riga dell'elenco VERBALI.
// Colonne sopra i 1001px: 96px minmax(0,1fr) 150px 210px 90px (NUMERO, RIUNIONE col suo ordine del giorno a 12px `dim`, DATA, STATO, PDF).
// Una bozza (solo gli storici importati a metà o un caricamento interrotto, in DA COMPLETARE) ha la barra gialla a sinistra
// (inset 4px `giallo-testo`) e il tag giallo «Bozza», e si apre in CARICA UN VERBALE; un verbale firmato il tag verde «Firmato»,
// corto (la data della firma è nella scheda), e se ha rettifiche accanto il giallo «Rettificato». Nella colonna PDF il tasto
// «Apri il PDF» (44px, apre il file senza aprire la scheda); senza PDF «—».
// Sotto i 1001px due colonne: RIUNIONE a tutta riga, NUMERO, DATA, STATO e PDF a coppie, la testa nascosta.
// Il tag va a capo (white-space normal) e la riga e' alta almeno 56px, con l'area di tocco del titolo a 44px.
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const firmato = p.firmato === true || p.firmato === 'true';
    return {
      numero: p.numero, tipo: p.tipo, odg: p.odg, data: p.data,
      barra: firmato ? 'none' : 'inset 4px 0 0 #8f6a00',
      colore: firmato ? '#0b7a33' : '#8f6a00',
      stato: firmato ? 'Firmato' : 'Bozza',
      pdf: firmato ? 'Apri il PDF' : '—',
    };
  }
}
</script>
</body>
</html>
