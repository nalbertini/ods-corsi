<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 14px; width: 100%; color: {{c.text}}">
  <span style="font-family: {{cond}}; font-style: oblique 9deg; font-size: {{corpo}}; font-weight: 700; letter-spacing: 0.04em; color: {{colore}}">{{titolo}}</span>
  <sc-for list="{{testi}}" as="t" hint-placeholder-count="0">
    <span style="font-size: 16px; line-height: 1.4; color: {{c.dim}}">{{t}}</span>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"titolo":{"editor":"text","default":"RICHIESTA ARRIVATA"},"tono":{"editor":"enum","options":["fatto","avviso"],"default":"fatto"},"testi":{"editor":"text","default":""},"$preview":{"width":360,"height":90}}'>
// Riproduzione 1:1 di TitoloEsito di src/components/ds.tsx (righe 108-115) con .esito-titolo di src/styles.css (righe 562-564): il titolo di
// un esito, grande e obliquo (Saira, 9 gradi), 30px 700 0.04em; tono fatto = `verde` (RICHIESTA ARRIVATA), avviso = `giallo-testo` e 26px (MANCA QUALCHE FILE).
// Le frasi sotto sono .esito-testo (16px `dim`, interlinea 1.4): `testi` le separa con `|`. Il guscio .esito (padding 20px 20px 28px, gap 14px) lo da' la schermata.
const T = {
  sito: { bg: '#eef5fa', surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', sec: '#0d2a3d', dim: '#46606f', faint: '#46606f', tasto: '#0d2a3d', tratteggio: '#14709f', blu: '#14709f', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#0d2a3d', suRosso: '#ffffff' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
const avviso = p.tono === 'avviso';
    return { c, cond: COND, titolo: p.titolo ?? 'RICHIESTA ARRIVATA', corpo: avviso ? '26px' : '30px', colore: avviso ? c.gialloTesto : c.verde, testi: lista(p.testi ?? '', '|') };
  }
}
</script>
</body>
</html>
