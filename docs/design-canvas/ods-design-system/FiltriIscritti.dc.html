<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <!-- Inter (qui da Google Fonts, in app file locale OFL). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; width: 100%; font-family: {{fam}}">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; flex-basis: 100%">
    <div style="display: flex; align-items: center; width: 360px; max-width: 100%; height: 44px; padding: 0 12px; background: {{campoSfondo}}; border: 2px solid {{campoBordo}}; border-radius: {{raggio}}; font-size: 15px; color: {{coloreCerca}}">{{cercaMostrata}}</div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 44px; padding: 0 12px; background: {{campoSfondo}}; border: 2px solid {{campoBordo}}; border-radius: {{raggio}}; font-size: 15px; color: {{c.text}}">{{corso}}<span style="font-size: 11px; color: {{c.dim}}">▾</span></div>
  </div>
  <sc-for list="{{chip}}" as="x" hint-placeholder-count="3">
    <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border: 2px solid {{x.bordo}}; border-radius: {{raggio}}; background: {{x.sfondo}}; color: {{x.colore}}; font-family: {{x.fam}}; font-variant-numeric: tabular-nums; font-size: {{x.corpo}}; font-weight: {{x.peso}}; letter-spacing: {{x.spazio}}; white-space: nowrap">{{x.testo}}</span>
  </sc-for>
  <span style="display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 600; color: {{c.text}}; text-decoration: underline; text-underline-offset: 4px">{{altriTesto}}</span>
  <sc-if value="{{altriAperti}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-wrap: wrap; gap: 10px; flex-basis: 100%">
      <sc-for list="{{altri}}" as="x" hint-placeholder-count="4">
        <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border: 2px solid {{x.bordo}}; border-radius: {{raggio}}; background: {{x.sfondo}}; color: {{x.colore}}; font-family: {{x.fam}}; font-size: {{x.corpo}}; font-weight: {{x.peso}}; letter-spacing: {{x.spazio}}; white-space: nowrap">{{x.testo}}</span>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"cerca":{"editor":"text","default":""},"corso":{"editor":"text","default":"Tutti i corsi"},"attivi":{"editor":"text","default":"DA PAGARE"},"doppioni":{"editor":"text","default":"0"},"storico":{"editor":"text","default":"0"},"corsiScaduti":{"editor":"boolean","default":false},"aperti":{"editor":"boolean","default":false},"conti":{"editor":"text","default":""},"daStampare":{"editor":"boolean","default":false},"minorenni":{"editor":"boolean","default":false},"famiglie":{"editor":"boolean","default":false},"$preview":{"width":1000,"height":110}}'>
// Riproduzione 1:1 della barra sopra la tabella ISCRITTI: src/components/segreteria/Iscritti.tsx (righe 191-235),
// riga con gap 10px che va a capo. Il campo di ricerca e' .sg-campo (src/styles.css righe 1360-1364: alto 44px,
// padding 0 12px, fondo `bg`, bordo 2px `line`, 15px; placeholder in `dim`) largo 360px; il filtro per corso e'
// una select .sg-campo (la freccia ▾ qui e' disegnata, nell'app la mette il sistema); i filtri sono .sg-chip
// (righe 1352-1357): alti 44px, padding 0 12px, bordo 2px `line`, Saira 13px 700 0.12em, testo `sec`; quelli accesi
// (aria-pressed) hanno bordo e testo `text` e fondo `surface-2`.
// cerca: il testo scritto (vuoto = placeholder "Cerca per nome o email"). corso: la voce scelta. attivi: i filtri accesi
// separati da | (i testi dei chip: SOLO SENZA EMAIL, VENGONO POCO, SENZA CERTIFICATO VALIDO, CERTIFICATO IN SCADENZA,
// DA PAGARE, NON IN REGOLA, SENZA DOCUMENTO). daStampare: compare CERTIFICATI DA STAMPARE (solo se ce ne sono). doppioni: se > 0
// compare POSSIBILI DOPPIONI con il numero.
// storico: PROPOSTA (filtro-storico-pagamenti): se > 0 compare «Pagato nel vecchio programma N» dietro «Altri filtri» (solo se c'e' almeno una persona).
// corsiScaduti (costruito da corsi-da-pagare, FILTRI_VISIBILI di src/lib/filtriIscritti.ts): compare CORSI SCADUTI accanto a DA PAGARE, anche fra i tre in vista (che diventano quattro).
// COSTRUITO (../iscritti-elenco/, contiChip in src/lib/filtriIscritti.ts): `conti` («SENZA CERTIFICATO VALIDO:70|DA PAGARE:22|…») mette dopo la parola del chip il
// numero di persone dopo « · » (tabular-nums); il chip a zero resta, col suo 0.
// COSTRUITO (../minorenni-famiglie/, filtriIscritti.ts): `minorenni` aggiunge MINORENNI fra i filtri in vista (dopo gli altri);
// `famiglie` aggiunge FAMIGLIE (tutti i componenti dei nuclei, titolari compresi) dietro «Altri filtri». Col filtro MINORENNI il sottotitolo dice quanti sono e quanti senza data di nascita non sono contati (fraseMinorenni).
// Non riprodotto: fuoco, passaggio del mouse.
// Look del sito (src/lib/filtriIscritti.ts, `:root[data-look='sito']`): sopra la tabella solo ricerca, corso e i tre filtri che servono al banco (Senza certificato
// valido, Da pagare, Non in regola), poi «Altri filtri (N) ▾», un comando sottolineato; gli altri stanno dietro e si aprono da soli se uno e' acceso
// (`aperti` li apre a mano). I filtri sono in parole con l'iniziale maiuscola, Inter 15px 600, bordo blu; quello acceso e' blu pieno col segno ✓ davanti.
// `attivi` si scrive in maiuscole: il confronto non guarda le maiuscole. `daStampare` e `doppioni` valgono solo se c'e' qualcosa.
const T = {
  sito: { bg: '#ffffff', surface: '#ffffff', surface2: '#cfe6f4', line: '#14709f', text: '#0d2a3d', sec: '#0d2a3d', dim: '#46606f', blu: '#14709f' },
};
const INTER = "Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
    const accesi = String(p.attivi ?? 'DA PAGARE').split('|').map((s) => s.trim().toLowerCase()).filter(Boolean);
    const doppi = Number(p.doppioni) || 0;
    const cap = (s) => s.charAt(0) + s.slice(1).toLowerCase();
    let visibili = ['SOLO SENZA EMAIL', 'VENGONO POCO', 'SENZA CERTIFICATO VALIDO', 'CERTIFICATO IN SCADENZA', 'DA PAGARE', 'NON IN REGOLA', 'SENZA DOCUMENTO'];
    let altri = [];
    if (truthy(p.daStampare)) visibili.push('CERTIFICATI DA STAMPARE');
    if (doppi > 0) visibili.push('POSSIBILI DOPPIONI ' + doppi);
    const storico = Number(p.storico) || 0;
    if (storico > 0) visibili.push('PAGATO NEL VECCHIO PROGRAMMA ' + storico);
    const corsi = truthy(p.corsiScaduti);
    if (truthy(p.famiglie)) visibili.push('FAMIGLIE');
    if (corsi) visibili.splice(visibili.indexOf('DA PAGARE') + 1, 0, 'CORSI SCADUTI');
    const tre = corsi ? ['SENZA CERTIFICATO VALIDO', 'DA PAGARE', 'CORSI SCADUTI', 'NON IN REGOLA'] : ['SENZA CERTIFICATO VALIDO', 'DA PAGARE', 'NON IN REGOLA'];
    altri = visibili.filter((n) => !tre.includes(n));
    visibili = truthy(p.minorenni) ? [...tre, 'MINORENNI'] : tre;
    const conti = Object.fromEntries(String(p.conti ?? '').split('|').map((x) => x.split(':')).filter((x) => x.length === 2).map(([k, v]) => [k.trim().toLowerCase(), v.trim()]));
    const fa = (nome) => {
      const on = accesi.includes(nome.toLowerCase());
      const n = conti[nome.toLowerCase()];
      return { testo: (on ? '✓ ' : '') + cap(nome) + (n === undefined ? '' : ' · ' + n), fam: INTER, corpo: '15px', peso: 600, spazio: '0', bordo: on ? c.blu : c.line, sfondo: on ? c.blu : c.bg, colore: on ? '#ffffff' : c.text };
    };
    const accesiNascosti = altri.filter((n) => accesi.includes(n.toLowerCase())).length;
    const cerca = p.cerca ?? '';
    return {
      c, fam: INTER, raggio: '6px', campoSfondo: c.surface, campoBordo: c.blu,
      chip: visibili.map(fa), altri: altri.map(fa),
      altriAperti: (truthy(p.aperti) || accesiNascosti > 0),
      altriTesto: 'Altri filtri (' + altri.length + (accesiNascosti ? ', ' + accesiNascosti + ' acceso' : '') + ') ' + (truthy(p.aperti) || accesiNascosti ? '▴' : '▾'),
      corso: p.corso || 'Tutti i corsi', cercaMostrata: cerca || 'Cerca per nome o email', coloreCerca: cerca ? c.text : c.dim,
    };
  }
}
</script>
</body>
</html>
