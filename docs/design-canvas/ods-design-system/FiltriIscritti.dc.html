<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; width: 100%">
  <div style="display: flex; align-items: center; width: 360px; max-width: 100%; height: 44px; padding: 0 12px; background: {{c.bg}}; border: 2px solid {{c.line}}; font-size: 15px; color: {{coloreCerca}}">{{cercaMostrata}}</div>
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 44px; padding: 0 12px; background: {{c.bg}}; border: 2px solid {{c.line}}; font-size: 15px; color: {{c.text}}">{{corso}}<span style="font-size: 11px; color: {{c.dim}}">▾</span></div>
  <sc-for list="{{chip}}" as="x" hint-placeholder-count="6">
    <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border: 2px solid {{x.bordo}}; background: {{x.sfondo}}; color: {{x.colore}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; white-space: nowrap">{{x.testo}}</span>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"cerca":{"editor":"text","default":""},"corso":{"editor":"text","default":"Tutti i corsi"},"attivi":{"editor":"text","default":"DA PAGARE"},"doppioni":{"editor":"text","default":"0"},"daStampare":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":1000,"height":110}}'>
// Riproduzione 1:1 della barra sopra la tabella ISCRITTI: src/components/segreteria/Iscritti.tsx (righe 191-235),
// riga con gap 10px che va a capo. Il campo di ricerca e' .sg-campo (src/styles.css righe 1360-1364: alto 44px,
// padding 0 12px, fondo `bg`, bordo 2px `line`, 15px; placeholder in `dim`) largo 360px; il filtro per corso e'
// una select .sg-campo (la freccia ▾ qui e' disegnata, nell'app la mette il sistema); i filtri sono .sg-chip
// (righe 1352-1357): alti 44px, padding 0 12px, bordo 2px `line`, Saira 13px 700 0.12em, testo `sec`; quelli accesi
// (aria-pressed) hanno bordo e testo `text` e fondo `surface-2`.
// cerca: il testo scritto (vuoto = placeholder "Cerca per nome o email"). corso: la voce scelta. attivi: i filtri accesi
// separati da | (i testi dei chip: SOLO SENZA EMAIL, VENGONO POCO, SENZA CERTIFICATO VALIDO, CERTIFICATO IN SCADENZA,
// DA PAGARE, SENZA DOCUMENTO). daStampare: compare CERTIFICATI DA STAMPARE (solo se ce ne sono). doppioni: se > 0
// compare POSSIBILI DOPPIONI con il numero.
// Non riprodotto: fuoco, passaggio del mouse.
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', surface2: '#242424', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', rosso: '#e4292a', giallo: '#f4c31b', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suColore: '#121212', tasto: '#b8b8b2', menu: '#161616' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#121212', tasto: '#4a4a46', menu: '#ebebe7' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
const accesi = String(p.attivi ?? '').split('|').map((s) => s.trim()).filter(Boolean);
    const nomi = ['SOLO SENZA EMAIL', 'VENGONO POCO', 'SENZA CERTIFICATO VALIDO', 'CERTIFICATO IN SCADENZA', 'DA PAGARE', 'SENZA DOCUMENTO'];
    if (truthy(p.daStampare)) nomi.push('CERTIFICATI DA STAMPARE');
    const doppi = Number(p.doppioni) || 0;
    if (doppi > 0) nomi.push('POSSIBILI DOPPIONI ' + doppi);
    const chip = nomi.map((testo) => {
      const on = accesi.includes(testo);
      return { testo, bordo: on ? c.text : c.line, sfondo: on ? c.surface2 : 'transparent', colore: on ? c.text : c.sec };
    });
    const cerca = p.cerca ?? '';
    return { c, chip, corso: p.corso || 'Tutti i corsi', cercaMostrata: cerca || 'Cerca per nome o email', coloreCerca: cerca ? c.text : c.dim };
  }
}
</script>
</body>
</html>
