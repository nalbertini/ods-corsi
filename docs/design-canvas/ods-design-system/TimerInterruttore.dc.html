<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Un interruttore delle impostazioni del timer: Toggle di timer/src/components/SettingsScreen.tsx con .card, .switch e .switch > i di styles.css.
     Acceso: fondo verde, pallino scuro a destra; spento: fondo surface-2, pallino faint a sinistra. -->
<div style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 0 14px; background: {{c.surface}}; border: 2px solid {{c.line}}; text-align: left">
  <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 1px; min-width: 0">
    <span style="font-size: 15px; font-weight: 600">{{nome}}</span>
    <span style="font-size: 12px; color: {{c.dim}}">{{nota}}</span>
  </div>
  <span style="display: flex; align-items: center; flex-shrink: 0; width: 54px; height: 30px; padding: 3px; background: {{fondo}}; justify-content: {{lato}}">
    <i style="display: block; width: 24px; height: 24px; background: {{pallino}}"></i>
  </span>
</div>
</x-dc>
<script data-dc-script data-props='{"nome":{"editor":"text","default":"Player musicale"},"nota":{"editor":"text","default":"Spento, la barra della musica sparisce e non parte niente"},"acceso":{"editor":"boolean","default":true},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":500,"height":64}}'>
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', line: '#333333', dim: '#8c8c88', faint: '#5a5a56', verde: '#16a54a', suColore: '#121212' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', dim: '#656561', faint: '#a8a8a3', verde: '#12913f', suColore: '#121212' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const on = p.acceso === undefined ? true : (p.acceso === true || p.acceso === 'true');
    return { c, nome: p.nome ?? 'Player musicale', nota: p.nota ?? 'Spento, la barra della musica sparisce e non parte niente', fondo: on ? c.verde : c.surface2, lato: on ? 'flex-end' : 'flex-start', pallino: on ? c.suColore : c.faint };
  }
}
</script>
</body>
</html>
