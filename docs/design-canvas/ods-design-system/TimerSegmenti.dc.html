<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Una scelta fra poche voci nelle impostazioni del timer: .segmenti e .segmento (segnali acustici, tema, fonte della musica) e .maurizio-livelli e .livello
     (i quattro livelli di Maurizio) di timer/src/styles.css. voci separate da ";", attiva = la voce accesa, colonne = quante per riga.
     tono "blu" = i segmenti (fondo e bordo blu, scritta scura, corpo 15 e lettere 0,06em); tono "giallo" = i livelli di Maurizio (giallo, corpo 17 e lettere 0,1em). -->
<div style="display: grid; grid-template-columns: repeat({{colonne}}, minmax(0, 1fr)); gap: 8px; width: 100%">
  <sc-for list="{{voci}}" as="v" hint-placeholder-count="3">
    <div style="min-height: 52px; padding: 0 4px; display: flex; align-items: center; justify-content: center; text-align: center; border: 2px solid {{v.bordo}}; background: {{v.fondo}}; color: {{v.testo}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: {{corpo}}; font-weight: 700; letter-spacing: {{lettere}}">{{v.nome}}</div>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"voci":{"editor":"text","default":"MUTO;SOLO BIP;BIP + VOCE"},"attiva":{"editor":"text","default":"BIP + VOCE"},"colonne":{"editor":"int","default":3},"tono":{"editor":"enum","options":["blu","giallo"],"default":"blu"},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":600,"height":60}}'>
const T = {
  scuro: { surface2: '#242424', line: '#333333', tasto: '#b8b8b2', blu: '#1b8ac4', giallo: '#f4c31b', suColore: '#121212' },
  chiaro: { surface2: '#e9e9e5', line: '#d4d4ce', tasto: '#4a4a46', blu: '#1b8ac4', giallo: '#f4c31b', suColore: '#121212' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const tinta = p.tono === 'giallo' ? c.giallo : c.blu;
    const voci = String(p.voci ?? 'MUTO;SOLO BIP;BIP + VOCE').split(';').filter(Boolean).map((n) => {
      const on = n === p.attiva;
      return { nome: n, fondo: on ? tinta : c.surface2, bordo: on ? tinta : c.line, testo: on ? c.suColore : c.tasto };
    });
    return { voci, colonne: Number(p.colonne ?? 3) || 3, corpo: p.tono === 'giallo' ? '17px' : '15px', lettere: p.tono === 'giallo' ? '0.1em' : '0.06em' };
  }
}
</script>
</body>
</html>
