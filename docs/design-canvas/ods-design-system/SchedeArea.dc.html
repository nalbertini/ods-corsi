<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Big+Shoulders+Display:wght@800&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div role="tablist" aria-label="Parti della tua pagina" style="display: flex; gap: 4px; width: 100%">
  <sc-for list="{{schede}}" as="x" hint-placeholder-count="3">
    <span role="tab" aria-label="{{x.nomeIntero}}" aria-selected="{{x.selezionata}}" style="display: inline-flex; flex-direction: column; align-items: center; justify-content: center; flex: 1 1 0; min-width: 0; gap: 2px; min-height: 44px; padding: 4px; text-align: center; background: {{x.sfondo}}; border: 2px solid {{x.bordo}}; font-family: {{carattere}}; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; color: {{x.colore}}">{{x.testo}}<span style="font-size: 11px; letter-spacing: 0.04em; color: {{x.coloreSegno}}">{{x.segno}}</span></span>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"voci":{"editor":"text","default":"LEZIONI|IN REGOLA|NUCLEO"},"acceso":{"editor":"text","default":"LEZIONI"},"segnoSu":{"editor":"text","default":""},"tonoSegno":{"editor":"enum","options":["giallo","rosso"],"default":"giallo"},"parolaSegno":{"editor":"text","default":"DA SISTEMARE"},"$preview":{"width":390,"height":50}}'>
// PROPOSTA (../area-iscritti-tab/): i tab della pagina dell'iscritto in AreaIscritti.tsx, sul telefono: LEZIONI | IN REGOLA | NUCLEO
// (NUCLEO c'e' solo per il titolare di un nucleo). Stesso pattern di SchedeIscritto: alti 44px, bordo 2px, colonne uguali, quello
// acceso con fondo `surface-2`, bordo e testo `text`; il segno d'avviso e' sempre puntino + parola (mai solo colore), in 11px
// sotto il nome, e sul tab acceso il giallo diventa `text` per il contrasto. `voci` sono i tab separati da «|»; `segnoSu` e' il
// nome del tab che porta il segno (vuoto = nessuno), `tonoSegno` giallo o rosso, `parolaSegno` la parola.
const T = {
  sito: { surface: '#ffffff', surface2: '#cfe6f4', line: '#cfe6f4', text: '#0d2a3d', dim: '#46606f', gialloTesto: '#8f6a00', rossoTesto: '#b81d1d' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T.sito;
    const schede = String(p.voci || 'LEZIONI|IN REGOLA|NUCLEO').split('|').map((nome) => {
      const on = nome === p.acceso;
      const ha = !!p.segnoSu && nome === p.segnoSu;
      const tono = p.tonoSegno === 'rosso' ? c.rossoTesto : c.gialloTesto;
      const coloreSegno = on && tono === c.gialloTesto ? c.text : tono;
      return {
        nomeIntero: nome + (ha ? ', ' + String(p.parolaSegno).toLowerCase() : ''),
        testo: nome, segno: ha ? '\u25cf ' + p.parolaSegno : '', coloreSegno,
        selezionata: on ? 'true' : 'false',
        sfondo: on ? c.surface2 : c.surface, bordo: on ? c.text : c.line, colore: on ? c.text : c.dim,
      };
    });
    return { schede, carattere: "'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif" };
  }
}
</script>
</body>
</html>
