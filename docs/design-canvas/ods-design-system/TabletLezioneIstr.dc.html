<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 12px 14px; background: {{fondo}}; border: 2px solid {{bordo}}; border-left: 6px solid {{tinta}}; color: {{c.text}}; text-align: left">
  <span style="display: flex; align-items: center; gap: 10px; min-width: 0">
    <span style="white-space: nowrap; flex-shrink: 0; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 700; color: {{c.dim}}">{{ora}}</span>
    <sc-if value="{{haAttivita}}" hint-placeholder-val="{{ false }}">
      <span style="display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; min-width: 0; padding: 2px 8px; border: 2px solid {{c.line}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; line-height: 1.2; color: {{c.sec}}; text-transform: uppercase">{{attivita}}</span>
    </sc-if>
  </span>
  <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 20px; font-weight: 700; text-transform: uppercase">{{titolo}}</span>
  <sc-if value="{{senzaAppello}}" hint-placeholder-val="{{ false }}">
    <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: {{c.rosso}}">✕ SENZA APPELLO</span>
  </sc-if>
  <sc-if value="{{conSotto}}" hint-placeholder-val="{{ true }}">
    <span style="font-size: 15px; color: {{c.sec}}">{{sotto}}<sc-if value="{{haProve}}" hint-placeholder-val="{{ false }}"><span style="font-weight: 700; color: {{c.gialloTesto}}"> · +{{prove}} PROVA</span></sc-if></span>
  </sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"ora":{"editor":"text","default":"17:00–18:00"},"attivita":{"editor":"text","default":""},"titolo":{"editor":"text","default":"LOTTA 2"},"sotto":{"editor":"text","default":"8 presenti su 14"},"prove":{"editor":"text","default":"0"},"tinta":{"editor":"text","default":"#16a54a"},"scelta":{"editor":"boolean","default":false},"senzaAppello":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":300,"height":100}}'>
// Riproduzione 1:1 di una lezione nell'elenco dell'area istruttore del tablet: .tb-lezione-istr (TabletIstruttore.tsx,
// righe 287-325; src/styles.css, righe 1109-1117). Scheda alta quanto serve, barra a sinistra da 6px nella tinta del corso,
// bordo `line`; ora (16px, `dim`) con l'etichetta dell'attivita' accanto, il nome obliquo da 20px (con PER CORSO e' il
// giorno: OGGI, MARTEDI' 6 OTTOBRE) e sotto «N presenti su M» in `sec`, con «+N PROVA» in giallo-testo.
// - scelta: aria-pressed, fondo `surface-2` e bordo `text`. senzaAppello: lezione finita senza presenti, bordo rosso e
//   ✕ SENZA APPELLO al posto del conto (data-guaio; la barra resta nella tinta).
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', line: '#333333', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', rosso: '#e4292a', gialloTesto: '#f4c31b' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', sec: '#3d3d3a', dim: '#656561', rosso: '#e4292a', gialloTesto: '#8f6a00' },
};
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const scelta = truthy(p.scelta);
    const senzaAppello = truthy(p.senzaAppello);
    return {
      c, senzaAppello, conSotto: !senzaAppello,
      ora: p.ora ?? '17:00–18:00', attivita: p.attivita ?? '', haAttivita: !!p.attivita,
      titolo: p.titolo ?? 'LOTTA 2', sotto: p.sotto ?? '8 presenti su 14',
      prove: p.prove ?? '0', haProve: Number(p.prove) > 0,
      tinta: p.tinta || '#16a54a',
      fondo: scelta ? c.surface2 : c.surface,
      bordo: senzaAppello ? c.rosso : scelta ? c.text : c.line,
    };
  }
}
</script>
</body>
</html>
