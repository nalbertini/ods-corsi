<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Tavola modello, schermo largo: la segreteria (menu fisso di 240px + corpo). Una schermata nuova si fa copiando
     questo file e sostituendo il contenuto di <main>: il menu e lo sfondo restano quelli dell'app, non si ridisegnano.
     Qui il corpo e' PRESENZE (calendario e appello affiancati, `.sala-due` da 960px: minmax(380px, 460px) + resto,
     ciascun lato col suo scorrimento, `.sg-corpo-sala` senza margine). Le altre sezioni hanno invece il margine
     di .sg-corpo: 36px ai lati, 28px in alto e in basso, 18px fra i blocchi, titolo 34px (.sg-titolo).
     Per il tema chiaro: sfondo #f4f4f1 qui sotto e tema="chiaro" su ogni <dc-import>. -->
<div style="display: flex; width: 1440px; min-height: 900px; background: #121212">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" attiva="PRESENZE" numeri="RICHIESTE ONLINE:3, PRESENZE:2" nome="Marco Rossi" ruolo="Segreteria" altezza="900px" hint-size="240px,900px"></dc-import>
  </div>
  <main style="display: grid; grid-template-columns: minmax(380px, 460px) minmax(0, 1fr); flex: 1; min-width: 0">
    <div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px 0">
        <dc-import name="Bottone" label="‹" variante="linea" alto="44px" larghezza="44px" corpo="22px" spazio="0" hint-size="44px,44px"></dc-import>
        <span style="flex-grow: 1; text-align: center; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 17px; font-weight: 700; letter-spacing: 0.06em">MARTEDÌ 6 OTTOBRE</span>
        <dc-import name="Bottone" label="›" variante="linea" alto="44px" larghezza="44px" corpo="22px" spazio="0" hint-size="44px,44px"></dc-import>
      </div>
      <div style="padding-top: 14px">
        <dc-import name="StrisciaGiorni" giorni="MAR 6 4 o s, MER 7 3, GIO 8 2, VEN 9 4, SAB 10 1, DOM 11 0, LUN 12 3" hint-size="100%,66px"></dc-import>
      </div>
      <dc-import name="Titoletto" label="LEZIONI" conto="4" hint-size="100%,50px"></dc-import>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px 16px">
        <dc-import name="RigaCalendario" ora="16:30" corso="Pilates" sala="Sala 2" istruttore="Elena B." tinta="#8b5cc4" iscritti="9" presenti="8" stato="fatto" hint-size="100%,72px"></dc-import>
        <dc-import name="RigaCalendario" ora="18:30" quando="ADESSO" corso="Judo kids" sala="Sala 1" istruttore="Marco R." kanji="柔" tinta="#1b8ac4" iscritti="12" presenti="7" stato="in-corso" aperta="{{ true }}" hint-size="100%,72px"></dc-import>
        <dc-import name="RigaCalendario" ora="19:30" corso="Lotta adulti" sala="Sala 1" istruttore="Davide T." kanji="闘" tinta="#16a54a" iscritti="14" stato="iscritti" prove="1" hint-size="100%,88px"></dc-import>
        <dc-import name="RigaCalendario" ora="20:30" corso="Yoga" sala="Sala 2" istruttore="Elena B." tinta="#f4c31b" iscritti="10" stato="iscritti" hint-size="100%,72px"></dc-import>
      </div>
    </div>
    <div style="border-left: 2px solid #2a2a2a">
      <div style="display: flex; padding: 20px 20px 0">
        <dc-import name="Bottone" label="TUTTI PRESENTI" variante="vai" corpo="17px" alto="56px" hint-size="200px,56px"></dc-import>
      </div>
      <dc-import name="Titoletto" label="ISCRITTI" conto="12" hint-size="100%,50px"></dc-import>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; padding: 0 20px 20px">
        <dc-import name="RigaAppello" nome="Bianchi Luca" stato="presente" hint-size="100%,56px"></dc-import>
        <dc-import name="RigaAppello" nome="Colombo Sara" stato="presente" hint-size="100%,56px"></dc-import>
        <dc-import name="RigaAppello" nome="Ferrari Tommaso" stato="assente" hint-size="100%,56px"></dc-import>
        <dc-import name="RigaAppello" nome="Greco Anna" stato="presente" hint-size="100%,56px"></dc-import>
        <dc-import name="RigaAppello" nome="Marino Pietro" hint-size="100%,56px"></dc-import>
        <dc-import name="RigaAppello" nome="Rossi Giulia" hint-size="100%,56px"></dc-import>
      </div>
      <dc-import name="Titoletto" label="PROVE" conto="1" hint-size="100%,50px"></dc-import>
      <div style="padding: 0 20px 20px">
        <dc-import name="RigaAppello" nome="Neri Chiara" prova="{{ true }}" hint-size="100%,56px"></dc-import>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
