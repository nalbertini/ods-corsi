<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div role="row" style="display: grid; grid-template-columns: 84px minmax(160px, 1fr) 190px 104px 216px; gap: 12px; align-items: center; min-height: 56px; width: 100%; padding: 6px 12px; border-bottom: 1px solid #cfe6f4; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <span style="font-size: 14px; font-variant-numeric: tabular-nums">{{data}}</span>
  <span style="min-width: 0; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere">
    <span style="display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #46606f">{{operazione}}</span>{{testo}}
    <sc-if value="{{conNota}}" hint-placeholder-val="{{ false }}"><span style="display: block; font-size: 13px; color: #8f6a00">{{nota}}</span></sc-if>
  </span>
  <sc-if value="{{entra}}" hint-placeholder-val="{{ true }}">
    <span style="display: flex; align-items: center; height: 44px; padding: 0 10px; border: 2px solid #14709f; border-radius: 6px; background: #ffffff; font-size: 14px; font-weight: 600">{{tipologia}} ▾</span>
  </sc-if>
  <sc-if value="{{conVoce}}" hint-placeholder-val="{{ false }}">
    <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: 14px"><b>{{voce}}</b><span style="font-size: 13px; color: #46606f">{{dettaglio}}</span></span>
  </sc-if>
  <sc-if value="{{scartata}}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
  <b style="text-align: right; font-size: 15px; font-variant-numeric: tabular-nums">{{importo}}</b>
  <sc-if value="{{conPersona}}" hint-placeholder-val="{{ true }}">
    <span style="display: flex; align-items: center; height: 44px; padding: 0 10px; border: 2px solid {{bordoPersona}}; border-radius: 6px; background: #ffffff; font-size: 14px; font-weight: 600; color: {{bordoPersona}}">{{persona}}</span>
  </sc-if>
  <sc-if value="{{conTasti}}" hint-placeholder-val="{{ false }}">
    <span style="display: flex; gap: 8px; justify-content: flex-end">
      <sc-if value="{{decide}}" hint-placeholder-val="{{ false }}"><dc-import name="Bottone" tema="sito" contesto="segreteria" variante="pieno" label="Conferma" larghezza="104px" hint-size="104px,44px"></dc-import></sc-if>
      <sc-if value="{{conNuovo}}" hint-placeholder-val="{{ true }}"><dc-import name="Bottone" tema="sito" contesto="segreteria" variante="linea" label="Nuovo" larghezza="104px" hint-size="104px,44px"></dc-import></sc-if>
    </span>
  </sc-if>
  <sc-if value="{{vuota}}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
</div>
</x-dc>
<script data-dc-script data-props='{"stato":{"editor":"enum","options":["nuova","da controllare","duplicata","da decidere","scartata"],"default":"nuova"},"data":{"editor":"text","default":"29/10/2026"},"operazione":{"editor":"text","default":"BONIFICO SEPA"},"testo":{"editor":"text","default":"Da BIANCHI ANNA per quota trimestre judo"},"tipologia":{"editor":"text","default":"Quota trimestrale"},"persona":{"editor":"text","default":"Anna Bianchi"},"voce":{"editor":"text","default":"Rossi Luca"},"dettaglio":{"editor":"text","default":"ricevuta n. 119 · 26/10/2026"},"importo":{"editor":"text","default":"+ 120,00 €"},"rifiutabile":{"editor":"boolean","default":true},"motivo":{"editor":"text","default":""},"$preview":{"width":1100,"height":70}}'>
// COSTRUITA (ImportaBanca.tsx, `.sg-banca-riga`; docs/design-canvas/importa-banca-snella): una riga del file della banca nella pagina «Importa dalla banca».
// Griglia 84 / 1fr (almeno 160) / 190 / 104 / 216, gap 12, padding 6px 12px, alta almeno 56, filetto 1px `line-soft`; sotto i 1200px data e importo in alto, il resto sotto.
// Niente colonna di stato: lo dice il gruppo (`.sg-banca-gruppo`: forse già nell'app su `tinta-giallo` coi tasti Conferma e Tutti nuovi, movimenti nuovi in `verde-testo`, già nell'app, scartate).
// La descrizione ha il tipo d'operazione della banca sopra (11px 700 `dim`) e il testo senza codici TRN; `nota` gialla 13px per i contanti e per «Nome diverso».
// Nuova e da controllare: TIPOLOGIA (select `sg-campo`) e, in fondo a destra, il campo PERSONA quando la voce la vuole (`persona` vuota = «Assegna», bordo e testo `giallo-testo`); apre CHI HA PAGATO?.
// Da decidere: al posto della tipologia il movimento dell'app che potrebbe essere (nome in grassetto, sotto ricevuta e data), in fondo «Conferma» (giallo) e «Nuovo».
// Duplicata (già nell'app): il movimento dell'app a cui corrisponde; «Nuovo» solo se `rifiutabile`. Scartata: il motivo nel testo, niente altro. I tasti sempre nell'ultima colonna, larghi 104.
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const stato = p.stato || 'nuova';
    const entra = stato === 'nuova' || stato === 'da controllare';
    const decide = stato === 'da decidere';
    const persona = p.persona ?? '';
    const conPersona = entra && persona !== '-';
    const conTasti = decide || (stato === 'duplicata' && p.rifiutabile !== false);
    const nota = stato === 'da controllare' ? 'Contanti: controlla che non siano già nella cassa contanti.' : decide ? (p.motivo ?? '') : '';
    return {
      data: p.data ?? '', operazione: p.operazione ?? '', testo: stato === 'scartata' ? (p.motivo || 'La data non si legge. Correggila nel file e riprova.') : (p.testo ?? ''), importo: p.importo ?? '',
      entra, tipologia: p.tipologia ?? '', conVoce: decide || stato === 'duplicata', voce: p.voce ?? '', dettaglio: p.dettaglio ?? '',
      scartata: stato === 'scartata', conPersona, persona: persona || 'Assegna', bordoPersona: persona ? '#14709f' : '#8f6a00',
      conTasti, decide, conNuovo: decide || p.rifiutabile !== false, vuota: !conPersona && !conTasti,
      conNota: !!nota, nota,
    };
  }
}
</script>
</body>
</html>
