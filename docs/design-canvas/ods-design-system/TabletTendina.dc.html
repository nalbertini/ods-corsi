<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; width: 100%; background: {{c.surface}}; border: 2px solid {{c.text}}; box-shadow: {{c.ombra}}; color: {{c.text}}">
  <sc-for list="{{voci}}" as="v" hint-placeholder-count="3">
    <span style="display: flex; align-items: center; min-height: 52px; padding: 0 14px; background: {{v.fondo}}; font-size: 18px; font-weight: {{v.peso}}">{{v.nome}}</span>
  </sc-for>
</div>
</x-dc>
<script data-dc-script data-props='{"opzioni":{"editor":"text","default":"Judo adulti|Judo baby|Judo kids"},"scelta":{"editor":"text","default":"Judo baby"},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":300,"height":170}}'>
// La tendina CORSO aperta, sotto le schede PER CORSO dell'area istruttore (<select className="tb-select">, TabletIstruttore.tsx riga 247;
// src/styles.css righe 1120-1131). Il <select> e' del sistema: nell'app l'elenco aperto lo disegna il tablet (iPad: una ruota o un menu),
// quindi questo e' un disegno di intenti e non una copia 1:1: righe da 52px per il dito, 18px come il campo, quella scelta in grassetto
// su `surface-2`, bordo `text` e ombra come il pannello delle liste musica (.tb-liste). Si appoggia sotto il campo CORSO (top: 154px nella colonna da 300px).
// - opzioni: i corsi con una lezione utile, in ordine alfabetico, separati da "|". scelta: quello a cui e' ferma la tendina.
const T = {
  scuro: { surface: '#1c1c1c', surface2: '#242424', line: '#333333', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', verde: '#16a54a', verdeTesto: '#16a54a', giallo: '#f4c31b', gialloTesto: '#f4c31b', rosso: '#e4292a', rossoTesto: '#ff5a52', blu: '#1b8ac4', suColore: '#121212', suRosso: '#ffffff', tasto: '#b8b8b2', ombra: '0 16px 50px rgba(0, 0, 0, 0.45)' },
  chiaro: { surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', verde: '#12913f', verdeTesto: '#0b7a33', giallo: '#f4c31b', gialloTesto: '#8f6a00', rosso: '#e4292a', rossoTesto: '#b81d1d', blu: '#1b8ac4', suColore: '#121212', suRosso: '#ffffff', tasto: '#4a4a46', ombra: '0 16px 50px rgba(0, 0, 0, 0.45)' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const scelta = p.scelta ?? 'Judo baby';
    const voci = String(p.opzioni ?? 'Judo adulti|Judo baby|Judo kids').split('|').map((s) => s.trim()).filter(Boolean).map((nome) => ({
      nome,
      fondo: nome === scelta ? c.surface2 : 'transparent',
      peso: nome === scelta ? '700' : '400',
    }));
    return { c, voci };
  }
}
</script>
</body>
</html>
