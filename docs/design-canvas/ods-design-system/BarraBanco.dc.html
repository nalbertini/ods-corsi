<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<header style="width: 100%; background: #eef5fa; border-bottom: 2px solid #cfe6f4; color: #0d2a3d">
  <div style="display: flex; align-items: center; gap: 16px; padding: 10px 28px; background: #0d2a3d; border-bottom: 2px solid #46606f; color: #ffffff">
    <span style="display: flex; align-items: center; gap: 10px; min-width: 170px">
      <svg width="38" height="26" viewBox="0 0 160 110" role="img" aria-label="Officine Dello Sport">
        <g fill="none" stroke-width="9" stroke-dasharray="6 7.82">
          <circle cx="38" cy="40" r="22" stroke="#1b8ac4"></circle>
          <circle cx="80" cy="40" r="22" stroke="#ffffff"></circle>
          <circle cx="122" cy="40" r="22" stroke="#e4292a"></circle>
          <circle cx="59" cy="74" r="22" stroke="#f4c31b"></circle>
          <circle cx="101" cy="74" r="22" stroke="#16a54a"></circle>
        </g>
        <g fill="none" stroke-width="5">
          <circle cx="38" cy="40" r="14" stroke="#1b8ac4"></circle>
          <circle cx="80" cy="40" r="14" stroke="#ffffff"></circle>
          <circle cx="122" cy="40" r="14" stroke="#e4292a"></circle>
          <circle cx="59" cy="74" r="14" stroke="#f4c31b"></circle>
          <circle cx="101" cy="74" r="14" stroke="#16a54a"></circle>
        </g>
      </svg>
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.06em; line-height: 1">ODS CORSI</span>
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.22em; color: #cfe6f4">SEGRETERIA</span>
      </span>
    </span>
    <div style="display: flex; align-items: center; flex: 1 1 320px; max-width: 560px; height: 44px; padding: 0 12px; background: #ffffff; border: 2px solid #14709f; border-radius: 6px; font-size: 15px; color: #46606f">Cerca iscritto, corso, pagamento…</div>
    <div style="flex-grow: 1"></div>
    <span style="display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border: 2px solid #14709f; border-radius: 6px; font-size: 15px; font-weight: 600">Link ▾</span>
    <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 2px solid #46606f; color: #cfe6f4; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 20px; font-weight: 800">?</span>
    <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
      <span style="font-size: 14px; font-weight: 600">{{nome}}</span>
      <span style="font-size: 12px; color: #cfe6f4">{{ruolo}}</span>
    </span>
    <span style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; font-size: 13px; color: #cfe6f4; text-decoration: underline; text-underline-offset: 3px">Esci</span>
  </div>
  <nav style="display: flex; align-items: stretch; gap: 8px; padding: 0 28px; background: #ffffff; border-bottom: 2px solid #cfe6f4">
    <sc-for list="{{luoghi}}" as="l" hint-placeholder-count="5">
      <span style="display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 18px; border-bottom: 4px solid {{l.riga}}; font-size: 19px; font-weight: 700; letter-spacing: 0.12em; color: {{l.colore}}">
        {{l.nome}}
        <sc-if value="{{l.haNumero}}" hint-placeholder-val="{{ false }}">
          <span style="padding: 1px 6px; background: #ffffff; border: 1.5px solid #8f6a00; border-radius: 6px; color: #8f6a00; font-size: 12px; font-weight: 700; letter-spacing: 0.02em">{{l.numero}}</span>
        </sc-if>
      </span>
    </sc-for>
  </nav>
  <sc-if value="{{conVoci}}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 28px; background: #cfe6f4">
    <sc-for list="{{voci}}" as="v" hint-placeholder-count="4">
      <span style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; background: {{v.sfondo}}; border: 2px solid {{v.bordo}}; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: {{v.colore}}">
        {{v.nome}}
        <sc-if value="{{v.haNumero}}" hint-placeholder-val="{{ false }}">
          <span style="padding: 1px 6px; background: #ffffff; border: 1.5px solid #8f6a00; border-radius: 6px; color: #8f6a00; font-size: 12px; font-weight: 700; letter-spacing: 0.02em">{{v.numero}}</span>
        </sc-if>
      </span>
    </sc-for>
  </div>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"luogo":{"editor":"enum","options":["OGGI","PERSONE","CORSI","SOLDI","PALESTRA"],"default":"OGGI"},"voce":{"editor":"text","default":"OGGI"},"numeri":{"editor":"text","default":"OGGI:7, PERSONE:4"},"conVoci":{"editor":"boolean","default":true},"nome":{"editor":"text","default":"Marco Rossi"},"ruolo":{"editor":"text","default":"Segreteria"},"$preview":{"width":1200,"height":190}}'>
// Riproduzione di `BarraBanco` di src/components/segreteria/banco/BarraBanco.tsx nel look del sito (`:root[data-look='sito']`), con
// .bn-alto, .bn-luoghi, .bn-luogo, .bn-voci e .bn-voce di src/styles.css (sezione «Il Banco») e i colori di :root[data-look='sito'].
// In alto inchiostro #0d2a3d, testo bianco, filetto #46606f; ricerca bianca col bordo blu dei campi. Sotto i cinque luoghi (LUOGHI di
// src/lib/luoghiBanco.ts) su bianco, Inter 19px 700, quello aperto in inchiostro con la riga di 4px; poi le voci del luogo su #cfe6f4,
// Inter 15px 700, la voce corrente piena d'inchiostro. Il numero di un luogo e' la somma delle sue voci: tag bianco col bordo giallo scuro.
// `voce` vuota: nessuna voce accesa. `numeri` vale per luoghi e voci insieme (NOME:n). Non riprodotti: l'elenco della ricerca, LINK aperto, DATI DI PROVA.
const LUOGHI = {
  OGGI: ['OGGI', 'SETTIMANA', 'PRESENZE'],
  PERSONE: ['ISCRITTI', 'TESSERE', 'RICHIESTE ONLINE', 'ISTRUTTORI', 'COMPENSI', 'ACCESSI'],
  CORSI: ['CORSI'],
  SOLDI: ['PAGAMENTI', 'CONTABILITÀ', 'LISTINO', 'VESTIARIO'],
  PALESTRA: ['STATISTICHE', 'SEGNALAZIONI', 'SITO', 'IMPOSTAZIONI'],
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const luogo = p.luogo || 'OGGI';
    const voce = p.voce ?? 'OGGI';
    const numeri = Object.fromEntries(String(p.numeri ?? '').split(',').map((s) => s.split(':').map((x) => x.trim())).filter(([k, n]) => k && n));
    const luoghi = Object.keys(LUOGHI).map((nome) => ({
      nome, haNumero: !!numeri[nome], numero: numeri[nome] ?? '',
      riga: nome === luogo ? '#0d2a3d' : 'transparent', colore: nome === luogo ? '#0d2a3d' : '#46606f',
    }));
    const voci = LUOGHI[luogo].map((nome) => {
      const su = nome === voce;
      return { nome, haNumero: !!numeri[nome], numero: numeri[nome] ?? '', sfondo: su ? '#0d2a3d' : 'transparent', bordo: su ? '#0d2a3d' : '#cfe6f4', colore: su ? '#eef5fa' : '#0d2a3d' };
    });
    return { luoghi, voci, conVoci: p.conVoci ?? true, nome: p.nome ?? 'Marco Rossi', ruolo: p.ruolo ?? 'Segreteria' };
  }
}
</script>
</body>
</html>
