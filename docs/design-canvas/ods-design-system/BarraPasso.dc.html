<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 20px 20px; background: {{c.bg}}; border-top: 2px solid {{c.line}}; color: {{c.text}}">
  <sc-if value="{{haManca}}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
      <span style="font-family: {{cond}}; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: {{c.rossoTesto}}">{{mancaTitolo}}</span>
      <sc-for list="{{manca}}" as="m" hint-placeholder-count="2">
        <span style="display: flex; align-items: center; min-height: 44px; padding: 0 12px; border: 2px solid {{c.line}}; font-family: {{cond}}; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: {{c.sec}}">{{m.testo}}</span>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{haNota}}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.35; color: {{c.sec}}">
      <span style="font-family: {{cond}}; font-size: 16px; font-weight: 700; color: {{c.verdeTesto}}">✓</span>
      <span>{{nota}}</span>
    </div>
  </sc-if>
  <div style="display: flex; flex-wrap: wrap; gap: 10px">
    <sc-if value="{{haIndietro}}" hint-placeholder-val="{{ true }}">
      <span style="display: flex; align-items: center; justify-content: center; width: {{larghezzaIndietro}}; min-height: 56px; border: 2px solid {{bordoIndietro}}; font-family: {{cond}}; font-style: oblique 9deg; font-size: 19px; font-weight: 700; letter-spacing: 0.16em; color: {{coloreIndietro}}">{{indietro}}</span>
    </sc-if>
    <span style="display: flex; align-items: center; justify-content: center; flex: 1 1 {{baseAvanti}}; min-width: 0; min-height: 56px; padding: 0 22px; background: {{fondoAvanti}}; border: 2px solid {{bordoAvanti}}; font-family: {{cond}}; font-style: oblique 9deg; font-size: 19px; font-weight: 700; letter-spacing: 0.16em; text-align: center; color: {{coloreAvanti}}">{{avanti}}</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"avanti":{"editor":"text","default":"AVANTI"},"indietro":{"editor":"text","default":"INDIETRO"},"manca":{"editor":"text","default":""},"nota":{"editor":"text","default":""},"tono":{"editor":"enum","options":["principale","vai"],"default":"principale"},"indietroChiede":{"editor":"boolean","default":false},"senzaIndietro":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":390,"height":150}}'>
// Il fondo di ogni passo: `BarraPasso` di src/components/ds.tsx e `.barra-passo*` di src/styles.css (modulo a passi, solo in prova). Nell'app e' sticky: resta in fondo allo schermo, sotto il pollice; qui e' ferma. Se manca qualcosa dice cosa (MANCA 1 COSA: + una pastiglia da 44px per cosa,
// separate da |); se no una riga verde con la nota. Poi INDIETRO (110px, linea) e AVANTI (principale rosso, o vai verde per l'ultimo
// passo che manda la richiesta). `indietroChiede` e' lo stato dei due tocchi di DueTocchi (ds.tsx): bordo e testo rossi,
// LE RISPOSTE SI PERDONO · ESCI?; il tasto prende tutta la riga e AVANTI scende sotto.
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', line: '#333333', lineCampo: '#6e6e6a', lineSoft: '#2a2a2a', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', tasto: '#b8b8b2', rosso: '#e4292a', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suRosso: '#ffffff', suColore: '#121212' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', line: '#d4d4ce', lineCampo: '#8a8a85', lineSoft: '#e2e2dd', text: '#161616', sec: '#3d3d3a', dim: '#656561', tasto: '#4a4a46', rosso: '#e4292a', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suRosso: '#ffffff', suColore: '#121212' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
    const manca = lista(p.manca, '|').map((testo) => ({ testo }));
    const chiede = truthy(p.indietroChiede);
    const vai = p.tono === 'vai';
    return {
      c, cond: COND, manca, haManca: manca.length > 0,
      mancaTitolo: manca.length === 1 ? 'MANCA 1 COSA:' : 'MANCANO ' + manca.length + ' COSE:',
      haNota: manca.length === 0 && String(p.nota ?? '') !== '', nota: p.nota ?? '',
      haIndietro: !truthy(p.senzaIndietro), indietro: chiede ? 'LE RISPOSTE SI PERDONO · ESCI?' : (p.indietro ?? 'INDIETRO'),
      coloreIndietro: chiede ? c.rossoTesto : c.tasto, bordoIndietro: chiede ? c.rosso : c.lineCampo, larghezzaIndietro: chiede ? '100%' : '110px', baseAvanti: chiede ? '100%' : '0',
      avanti: p.avanti ?? 'AVANTI',
      fondoAvanti: vai ? c.verde : c.rosso, bordoAvanti: vai ? c.verde : c.rosso, coloreAvanti: vai ? c.suColore : c.suRosso,
    };
  }
}
</script>
</body>
</html>
