<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px 0; color: {{c.text}}">
  <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: {{c.dim}}">RICHIESTA DI ISCRIZIONE</span>
  <span style="display: flex; align-items: center; gap: 8px">
    <sc-if value="{{riempi}}" hint-placeholder-val="{{ true }}">
      <span style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 12px; border: 2px dashed {{c.gialloTesto}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 14px; font-weight: 700; letter-spacing: 0.14em; color: {{c.gialloTesto}}">RIEMPI</span>
    </sc-if>
    <dc-import name="Badge" tipo="prova" label="PROVA" hint-size="70px,26px"></dc-import>
  </span>
</div>
</x-dc>
<script data-dc-script data-props='{"riempi":{"editor":"boolean","default":true},"$preview":{"width":390,"height":64}}'>
// La riga in cima ai passi del modulo a passi (`.passo-intesta` di src/styles.css, `IscrizioneAPassi.tsx`): RICHIESTA DI ISCRIZIONE (Saira 12px 0.18em `dim`)
// e, solo in prova, il bollino PROVA; accanto, nei passi che si possono riempire (`riempibile`), RIEMPI (`.passo-riempi`: 44px, bordo 2px tratteggiato e testo `gialloTesto`, 14px 0.14em).
const T = {
  sito: { text: '#0d2a3d', dim: '#46606f', giallo: '#f4c31b', gialloTesto: '#8f6a00' },
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { c: T.sito, riempi: p.riempi ?? true };
  }
}
</script>
</body>
</html>
