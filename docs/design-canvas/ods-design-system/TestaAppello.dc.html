<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <!-- Big Shoulders Display e Inter (qui da Google Fonts, in app file locali OFL). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="width: 100%">
<div style="display: flex; flex-direction: column; width: 100%; background: #eef5fa; padding-bottom: 12px; border-bottom: 2px solid #cfe6f4; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 20px 0">
    <sc-if value="{{indietro}}" hint-placeholder-val="{{ true }}">
      <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border: 2px solid #14709f; border-radius: 6px; background: #ffffff; color: #0d2a3d; font-size: 22px; line-height: 1">&#8249;</span>
    </sc-if>
    <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 3px; min-width: 0">
      <span style="font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 0.05em; line-height: 1.05">{{corso}}</span>
      <span style="display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; color: #46606f">
        <span style="display: inline-flex; gap: 3px; flex-shrink: 0">
          <sc-for list="{{kanji}}" as="k" hint-placeholder-count="1">
            <span style="display: inline-grid; place-items: center; width: 22px; height: 22px; border: 1.5px solid #e4292a; border-radius: 3px; color: #b81d1d; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif CJK JP', 'Noto Serif JP', serif; font-size: 15px; font-weight: 700; line-height: 1">{{k.segno}}</span>
          </sc-for>
        </span>
        <span style="min-width: 0; white-space: normal; overflow-wrap: anywhere">{{quando}}</span>
      </span>
      <sc-if value="{{haAttivita}}" hint-placeholder-val="{{ true }}">
        <span style="display: inline-block; align-self: flex-start; min-width: 0; padding: 1px 6px; border: 2px solid #cfe6f4; text-transform: uppercase; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; line-height: 1.2; color: #0d2a3d">{{attivita}}</span>
      </sc-if>
      <sc-if value="{{futura}}" hint-placeholder-val="{{ false }}">
        <span style="font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #8f6a00">… NON ANCORA COMINCIATA</span>
      </sc-if>
    </div>
    <sc-if value="{{conTimer}}" hint-placeholder-val="{{ true }}">
    <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 44px; height: 44px; border: 2px solid #14709f; border-radius: 6px; background: #ffffff; color: #0d2a3d">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2M9 2h6"></path></svg>
    </span>
    </sc-if>
  </div>
  <div style="display: flex; align-items: baseline; gap: 10px; padding: 12px 20px 0">
    <span style="font-variant-numeric: tabular-nums; font-size: 52px; font-weight: 800; line-height: 0.9; white-space: nowrap">{{presenti}}</span>
    <span style="font-variant-numeric: tabular-nums; font-size: 22px; color: #46606f; white-space: nowrap">/ {{iscritti}}</span>
    <sc-if value="{{haProve}}" hint-placeholder-val="{{ true }}">
      <span style="font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; color: #8f6a00; white-space: nowrap">{{proveTesto}}</span>
    </sc-if>
    <span style="flex-grow: 1"></span>
    <div style="display: flex; flex-direction: column; align-items: flex-end; align-self: center; gap: 2px">
      <span style="display: inline-flex; align-items: center; min-height: {{altoStato}}; font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-align: right; color: {{coloreStatoSito}}; text-decoration: {{decorazioneStato}}; text-underline-offset: 4px">{{statoSito}}</span>
      <span style="min-height: 1.3em; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; color: #8f6a00">{{codaSito}}</span>
    </div>
  </div>
  <sc-if value="{{conTasti}}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; align-items: stretch; gap: 8px; padding: 10px 20px 0">
    <span style="display: flex; align-items: center; justify-content: center; flex-grow: 1; min-height: 56px; padding: 0 10px; border: {{bordoTasto}}; border-radius: 6px; background: {{sfondoTasto}}; color: {{coloreTasto}}; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.1em">{{tasto}}</span>
    <span style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 124px; min-height: 56px; padding: 0 8px; border: 2px solid #14709f; color: #0d2a3d; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0.16em; opacity: {{opacitaAzzera}}">AZZERA</span>
  </div>
  </sc-if>
</div>
</div>
</x-dc>
<script data-dc-script data-props='{"corso":{"editor":"text","default":"Judo kids"},"kanji":{"editor":"text","default":"柔"},"quando":{"editor":"text","default":"Lunedì 17:30 · Sala 1 · Marco R."},"attivita":{"editor":"text","default":""},"futura":{"editor":"boolean","default":false},"indietro":{"editor":"boolean","default":true},"presenti":{"editor":"text","default":"7"},"iscritti":{"editor":"text","default":"12"},"prove":{"editor":"text","default":"0"},"stato":{"editor":"enum","options":["mancano","segnati","assenti","chiudi","lettura"],"default":"mancano"},"mancano":{"editor":"text","default":"5"},"coda":{"editor":"text","default":""},"tasto":{"editor":"text","default":"GLI ALTRI PRESENTI"},"tastoSpento":{"editor":"boolean","default":false},"azzeraSpento":{"editor":"boolean","default":false},"senzaTimer":{"editor":"boolean","default":false},"$preview":{"width":390,"height":250}}'>
// Riproduzione 1:1 della testa dell'appello: .appello-testa e quel che c'e' dentro (src/styles.css righe 356-399, 198-216
// e 238-250), usata in src/components/AppelloScreen.tsx (righe 336-398). In cima e ferma mentre si scorre l'elenco
// (qui e' statica): fondo `bg`, riga in basso 2px `line-soft`. Tre righe.
// 1. indietro (.icon-btn, 44px) · titolo .appello-titolo (cond oblique 22px 700 0.06em) con sotto quando/dove (13px dim:
//    kanji .kanji 22px + testo) e l'etichetta dell'attivita' (.attivita-et, `attivita` vuota = niente) · timer (.icon-btn).
//    futura = NON ANCORA COMINCIATA (.appello-futura).
// 2. conto .conto-appello (46px 700, interlinea 0.9) / iscritti 22px dim; prove > 0 = «+N PROVA» (.appello-prove, 14px giallo-testo);
//    a destra .appello-stato (14px, 0.12em): mancano = «N DA SEGNARE» in `sec`; segnati = ✓ TUTTI SEGNATI in verde-testo;
//    assenti = TUTTI ASSENTI in rosso-testo; chiudi = CHIUDI IN FONDO ↓ (verde-testo, sottolineato: e' un tasto).
//    Sotto, .appello-coda (13px giallo-testo, alta 1.3em anche vuota: la testa non cambia altezza), es. «2 DA INVIARE».
// 3. .btn.btn-go (56px, 17px, 0.1em; `tasto` = TUTTI PRESENTI | GLI ALTRI PRESENTI | ✓ TUTTI SEGNATI, `tastoSpento` = disabled,
//    opacita' 0.4) + AZZERA (.btn-ghost.azzera: 124px, 56px, 16px; `azzeraSpento` = nessuno segnato).
// Look del sito (COSTRUITO, area istruttore: `:root[data-look='sito'] .appello-testa` in src/styles.css e `statoAppello` / `tastoAppello` / `codaAppello` in src/lib/etichetteAppello.ts): fondo #eef5fa, riga in basso #cfe6f4, margini laterali 20px;
// i due tasti piccoli (indietro, timer) sono quadrati bianchi con bordo blu #14709f da 2px e raggio 6px. Il titolo e' Big Shoulders 800 dritto (26px, 0.05em); il conto grande e' Inter 800 52px (la classe `num` nel look e' Inter), non Big Shoulders.
// Il sottotitolo (giorno, ora, sala, istruttore) va a capo invece di tagliarsi dietro il tasto del timer; il conto «/ N» non va mai a capo. L'etichetta dell'attivita' e' quella di sempre (bordo celeste #cfe6f4, Big Shoulders 12px).
// Lo stato NON e' un tag: e' testo in Inter 14px 700, 0.04em, a destra del conto, col segno davanti: … N DA SEGNARE e … SOLO LETTURA (aspettano: inchiostro #0d2a3d), ✓ TUTTI SEGNATI (verde #0b7a33), ✕ TUTTI ASSENTI (rosso #b81d1d),
// CHIUDI IN FONDO ↓ (verde, sottolineato: e' un tasto). «+N PROVA» e «… N DA INVIARE» sono testo giallo scuro #8f6a00 (Inter 14px e 13px, 700), non tag. `… NON ANCORA COMINCIATA` e' testo giallo scuro sotto la sala.
// TUTTI PRESENTI / GLI ALTRI PRESENTI e' il tasto principale della schermata: giallo #f4c31b con l'inchiostro, raggio 6px, Big Shoulders 700 17px con 0.1em (sempre in vista perche' la testa resta ferma); spento con «✓ TUTTI SEGNATI» = bianco con testo e bordo 2px verde #0b7a33; spento per elenco vuoto = #cfe6f4 con testo #46606f (opacita' 1). CHIUDI IN FONDO ↓ e' alto 44px (inline-flex).
// AZZERA e' un tasto a linea blu #14709f da 2px, senza raggio e senza fondo, Big Shoulders 700 16px 0.16em, largo 124px. Il giallo pieno e' uno per schermata.
// `senzaTimer` toglie il cronometro (nell'app c'e' solo se `onTimer`).
// stato `lettura` (COSTRUITO): lezione in SOLA LETTURA, la parola SOLO LETTURA al posto di «N DA SEGNARE» e senza la riga dei due tasti (nell'app non ci sono).
// Sotto i 420px il titolo scende a 20px e il conto a 40px (@media del foglio): qui sempre la misura larga.
const truthy = (v) => v === true || v === 'true';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const stato = p.stato || 'mancano';
    const prove = Number(p.prove ?? 0);
    const attivita = p.attivita ?? '';
    const lettura = stato === 'lettura';
    const spento = truthy(p.tastoSpento);
    const SEGNI = { segnati: '✓ TUTTI SEGNATI', assenti: '✕ TUTTI ASSENTI', chiudi: 'CHIUDI IN FONDO ↓', lettura: '… SOLO LETTURA' };
    return {
      statoSito: SEGNI[stato] || '… ' + (p.mancano ?? '5') + ' DA SEGNARE',
      coloreStatoSito: stato === 'segnati' || stato === 'chiudi' ? '#0b7a33' : stato === 'assenti' ? '#b81d1d' : '#0d2a3d',
      altoStato: stato === 'chiudi' ? '44px' : '0',
      decorazioneStato: stato === 'chiudi' ? 'underline' : 'none',
      codaSito: (p.coda ?? '') === '' ? '' : '… ' + p.coda,
      conTasti: !lettura, conTimer: !truthy(p.senzaTimer),
      tuttiSegnatiSpento: spento && String(p.tasto ?? '').startsWith('✓'),
      sfondoTasto: spento ? (String(p.tasto ?? '').startsWith('✓') ? '#ffffff' : '#cfe6f4') : '#f4c31b', coloreTasto: spento ? (String(p.tasto ?? '').startsWith('✓') ? '#0b7a33' : '#46606f') : '#0d2a3d', bordoTasto: spento && String(p.tasto ?? '').startsWith('✓') ? '2px solid #0b7a33' : '0',
      corso: String(p.corso ?? 'Judo kids').toUpperCase(),
      kanji: [...String(p.kanji ?? '柔')].map((segno) => ({ segno })),
      quando: p.quando ?? 'Lunedì 17:30 · Sala 1 · Marco R.',
      attivita, haAttivita: attivita !== '',
      futura: truthy(p.futura),
      indietro: p.indietro === undefined ? true : truthy(p.indietro),
      presenti: p.presenti ?? '7', iscritti: p.iscritti ?? '12',
      haProve: prove > 0, proveTesto: '+' + prove + ' PROVA',
      tasto: p.tasto ?? 'GLI ALTRI PRESENTI',
      opacitaTasto: truthy(p.tastoSpento) ? '0.4' : '1',
      opacitaAzzera: truthy(p.azzeraSpento) ? '0.4' : '1',
    };
  }
}
</script>
</body>
</html>
