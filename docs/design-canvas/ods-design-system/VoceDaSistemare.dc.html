<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Voce da sistemare</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- COSTRUITO (`../scheda-iscritto/`, DaSistemare di Iscritti.tsx, .sg-dsv di src/segreteria.css): una riga di DA SISTEMARE.
     Al computer una griglia 20px | 1fr | 180px | 96px | 200px: icona nel colore dello stato, cosa e perché, la parola dello stato,
     l'importo in cifre tabulari, il tasto a linea che risolve. La barra dello stato è dentro a sinistra (inset 4px). Con «telefono»
     (sotto i 1000px) tre righe: cosa e perché, poi parola e importo, poi il tasto a tutta larghezza. Tasto alto 44px. -->
<div style="display: grid; grid-template-columns: {{colonne}}; grid-template-areas: {{aree}}; align-items: center; gap: {{spazi}}; min-height: 72px; padding: {{imbottitura}}; background: #ffffff; box-shadow: inset 4px 0 0 {{barra}}; border-top: {{filoBordo}}">
  <span style="grid-area: {{aIcona}}; align-self: {{allineaIcona}}; display: flex; color: {{colore}}">
    <dc-import name="Icona" nome="{{icona}}" misura="20" colore="{{colore}}" hint-size="20px,20px"></dc-import>
  </span>
  <span style="grid-area: {{aTesto}}; display: flex; flex-direction: column; gap: 2px; min-width: 0">
    <span style="font-size: 15px; font-weight: 600; color: #0d2a3d">{{cosa}}</span>
    <span style="font-size: 14px; color: #46606f">{{perche}}</span>
  </span>
  <span style="grid-area: {{aParola}}; text-align: {{allineaParola}}; font-size: 14px; font-weight: 600; color: {{colore}}">{{parola}}</span>
  <span style="grid-area: {{aImporto}}; text-align: right; font-size: 15px; font-weight: 600; color: #0d2a3d; font-variant-numeric: tabular-nums">{{importo}}</span>
  <button type="button" style="grid-area: {{aTasto}}; justify-self: {{allineaTasto}}; min-height: 44px; padding: 0 14px; border: 1px solid #14709f; border-radius: 6px; background: #ffffff; color: #0d2a3d; font: 600 14px Inter, sans-serif; white-space: nowrap">{{tasto}}</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icona":{"editor":"text","default":"certificato"},"cosa":{"editor":"text","default":"Certificato medico"},"perche":{"editor":"text","default":"Senza, non può allenarsi"},"parola":{"editor":"text","default":"Scaduto il 09/09/2026"},"tono":{"editor":"enum","options":["rosso","giallo"],"default":"rosso"},"importo":{"editor":"text","default":""},"tasto":{"editor":"text","default":"Carica il certificato"},"filo":{"editor":"boolean","default":false},"telefono":{"editor":"boolean","default":false},"$preview":{"width":1060,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const toni = {
      rosso: { barra: '#e4292a', colore: '#b81d1d' },
      giallo: { barra: '#f4c31b', colore: '#8f6a00' },
    };
    const t = toni[this.props.tono ?? 'rosso'] || toni.rosso;
    const telefono = this.props.telefono ?? false;
    const filo = this.props.filo === true || this.props.filo === 'si';
    const tasto = this.props.tasto ?? 'Carica il certificato';
    return {
      ...t,
      icona: this.props.icona ?? 'certificato',
      cosa: this.props.cosa ?? 'Certificato medico',
      perche: this.props.perche ?? 'Senza, non può allenarsi',
      parola: this.props.parola ?? 'Scaduto il 09/09/2026',
      importo: this.props.importo ?? '',
      tasto,
      colonne: telefono ? '20px minmax(0, 1fr) auto' : '20px minmax(0, 1fr) 180px 96px 200px',
      aree: telefono ? "'icona testo testo' 'icona parola importo' 'icona tasto tasto'" : 'none',
      spazi: telefono ? '6px 12px' : '16px',
      imbottitura: telefono ? '12px 16px 12px 20px' : '10px 16px 10px 20px',
      aIcona: telefono ? 'icona' : 'auto', aTesto: telefono ? 'testo' : 'auto', aParola: telefono ? 'parola' : 'auto',
      aImporto: telefono ? 'importo' : 'auto', aTasto: telefono ? 'tasto' : 'auto',
      allineaIcona: telefono ? 'start' : 'center', allineaParola: telefono ? 'left' : 'right', allineaTasto: telefono ? 'stretch' : 'end',
      filoBordo: filo ? '1px solid #cfe6f4' : '0',
    };
  }
}
</script>
</body>
</html>
