<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<div style="display: flex; align-items: flex-start; gap: 14px; width: 100%; padding: 14px; background: {{c.surface}}; border: 2px solid {{c.line}}; color: {{c.text}}">
  <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 700; line-height: 1; min-width: 22px; text-align: center">{{numero}}</span>
  <span style="display: flex; flex-direction: column; flex-grow: 1; gap: 8px; min-width: 0">
    <span style="font-size: 17px; font-weight: 600; line-height: 1.3">{{titolo}}</span>
    <sc-for list="{{frasi}}" as="f" hint-placeholder-count="1">
      <span style="font-size: 14px; line-height: 1.4; color: {{c.dim}}">{{f}}</span>
    </sc-for>
    <sc-if value="{{haIban}}" hint-placeholder-val="{{ false }}">
      <span style="font-family: {{cond}}; font-variant-numeric: tabular-nums; align-self: stretch; padding: 8px 10px; background: {{c.surface2}}; border: 2px solid {{c.line}}; font-size: 17px; font-weight: 600; letter-spacing: 0.02em">{{iban}}</span>
    </sc-if>
    <sc-for list="{{frasi2}}" as="f" hint-placeholder-count="0">
      <span style="font-size: 14px; line-height: 1.4; color: {{c.dim}}">{{f}}</span>
    </sc-for>
    <sc-if value="{{haTasti}}" hint-placeholder-val="{{ true }}">
      <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <sc-for list="{{tasti}}" as="t" hint-placeholder-count="2">
        <span style="display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 16px; background: {{t.sfondo}}; border: {{t.bordo}}; color: {{t.colore}}; font-family: {{cond}}; font-style: oblique 9deg; font-size: 16px; font-weight: 700; letter-spacing: 0.16em; white-space: nowrap">{{t.testo}}</span>
      </sc-for>
      </span>
    </sc-if>
  </span>
</div>
</x-dc>
<script data-dc-script data-props='{"numero":{"editor":"text","default":"1"},"titolo":{"editor":"text","default":"Leggi il modulo"},"dettaglio":{"editor":"text","default":"Quello per maggiorenni, o quello per minori che firma il genitore."},"iban":{"editor":"text","default":""},"dettaglio2":{"editor":"text","default":""},"tasti":{"editor":"text","default":"MAGGIORENNI|MINORI"},"primoPrincipale":{"editor":"boolean","default":false},"tema":{"editor":"enum","options":["scuro","chiaro"],"default":"scuro","section":"Tema"},"$preview":{"width":360,"height":180}}'>
// Riproduzione 1:1 di un passo della pagina ISCRIZIONI: <li className="card passo"> di src/components/IscrizioniScreen.tsx (righe 59-70)
// con .passo, .passo-num, .passo-testo, .passo-titolo, .passo-dettaglio, .passo-btn, .iban e .riga-tasti di src/styles.css (righe 557 e 570-591).
// Il numero e' in Saira 26px (.passo-num.num); titolo 17px 600; dettaglio 14px `dim`. L'azione sotto il testo e' quella del passo (Azione, Pagamento):
// tasti = i .btn.passo-btn (48px, 16px, 0.16em) separati da `|`, il primo rosso con primoPrincipale (COMPILA LA RICHIESTA), gli altri col bordo;
// iban = la scatola .iban (surface-2, bordo 2px, 17px 600, selezionabile con un tocco) fra dettaglio e dettaglio2 (il passo del pagamento).
// dettaglio e dettaglio2 sono frasi separate da `|` (nel passo del pagamento: il dettaglio del passo e la riga della quota prima dell'IBAN).
// Vuoto quel che non serve. Il passaggio del mouse non e' riprodotto.
const T = {
  scuro: { bg: '#121212', surface: '#1c1c1c', surface2: '#242424', line: '#333333', text: '#f2f2f0', sec: '#c9c9c4', dim: '#8c8c88', faint: '#5a5a56', tasto: '#b8b8b2', tratteggio: '#4a4a46', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#16a54a', gialloTesto: '#f4c31b', verdeTesto: '#16a54a', rossoTesto: '#ff5a52', suColore: '#121212', suRosso: '#ffffff' },
  chiaro: { bg: '#f4f4f1', surface: '#ffffff', surface2: '#e9e9e5', line: '#d4d4ce', text: '#161616', sec: '#3d3d3a', dim: '#656561', faint: '#a8a8a3', tasto: '#4a4a46', tratteggio: '#b0b0aa', blu: '#1b8ac4', rosso: '#e4292a', giallo: '#f4c31b', verde: '#12913f', gialloTesto: '#8f6a00', verdeTesto: '#0b7a33', rossoTesto: '#b81d1d', suColore: '#121212', suRosso: '#ffffff' },
};
const COND = "'Saira Condensed', 'Helvetica Neue', Arial, sans-serif";
const truthy = (v) => v === true || v === 'true';
const lista = (v, sep) => String(v ?? '').split(sep).map((s) => s.trim()).filter((s) => s !== '');
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.scuro;
const principale = truthy(p.primoPrincipale);
    const tasti = lista(p.tasti ?? 'MAGGIORENNI|MINORI', '|').map((testo, i) => i === 0 && principale
      ? { testo, sfondo: c.rosso, bordo: '0', colore: c.suRosso }
      : { testo, sfondo: 'transparent', bordo: '2px solid ' + c.line, colore: c.tasto });
    const iban = p.iban ?? '';
    return {
      c, cond: COND,
      numero: p.numero ?? '1', titolo: p.titolo ?? 'Leggi il modulo',
      frasi: lista(p.dettaglio ?? 'Quello per maggiorenni, o quello per minori che firma il genitore.', '|'), iban, haIban: iban !== '', frasi2: lista(p.dettaglio2 ?? '', '|'),
      tasti, haTasti: tasti.length > 0,
    };
  }
}
</script>
</body>
</html>
