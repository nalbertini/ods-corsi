<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .big { font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-weight: 800; letter-spacing: 0.04em; line-height: 1; }
    .et { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #46606f; }
    .val { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
    .frase { font-size: 14px; color: #46606f; line-height: 1.45; }
    .velo { background: rgba(13, 42, 61, 0.55); }
    .finestra { display: flex; flex-direction: column; background: #ffffff; border: 2px solid #0d2a3d; border-top: 6px solid #0d2a3d; color: #0d2a3d; }
    .nuovo { box-shadow: inset 4px 0 0 #f4c31b; padding-left: 14px; }
    .due { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 32px; }
    .cella { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .tab { display: grid; gap: 14px; align-items: center; padding: 8px 14px; min-height: 48px; border-bottom: 1px solid #cfe6f4; background: #ffffff; font-size: 15px; }
    .num { font-variant-numeric: tabular-nums; text-align: right; }
    .link { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 600; color: #14709f; text-decoration: underline; text-underline-offset: 4px; }
    .piede { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 14px 28px 18px; border-top: 2px solid #cfe6f4; }
  </style>
</helmet>
<!-- OGGI: la scheda di un istruttore (Personale.tsx, `Scheda` dentro `SchedaPiena`), finestra sul velo. RUOLO, ACCESSO, PIN TABLET e KANJI ridotti a una riga: non cambiano. -->
<div style="display: flex; width: 1440px; min-height: 1500px; background: #eef5fa">
  <div style="width: 240px; flex-shrink: 0"><dc-import name="Menu" tema="sito" autorizzazioni="segreteria" attiva="ISTRUTTORI E ACCESSI" numeri="RICHIESTE ONLINE:3, PRESENZE ISTRUTTORI:3" nome="Marco Rossi" ruolo="Segreteria" altezza="1500px" hint-size="240px,1500px"></dc-import></div>
  <main class="velo" style="flex: 1; min-width: 0; padding: 24px 40px">
    <div class="finestra" style="width: 900px; margin: 0 auto">
    <div style="display: flex; align-items: flex-start; gap: 14px; padding: 20px 28px 14px">
      <span style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border: 2px solid #0d2a3d; font-size: 30px">美</span>
      <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 4px; min-width: 0">
        <span class="big" style="font-size: 30px">DIANA BALLABIO</span>
        <span style="font-size: 13px; color: #46606f">Istruttore</span>
      </div>
      <dc-import name="Bottone" label="✕" variante="icona" tema="sito" hint-size="44px,44px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 20px; padding: 8px 28px 20px">
      <div class="due"><div class="cella"><span class="et">EMAIL</span><span class="val">diana.ballabio@esempio.it</span></div><div class="cella"><span class="et">CORSI</span><span class="val">Judo kids, Judo ragazzi</span></div></div>
      <div><dc-import name="Chip" tema="sito" label="Modifica" acceso="{{ false }}" hint-size="132px,44px"></dc-import></div>
      <span class="frase" style="padding: 10px 14px; border: 1px dashed #14709f">RUOLO · ACCESSO · PIN TABLET: come oggi, non cambiano.</span>
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: center; gap: 10px"><dc-import name="Titoletto" tema="sito" label="PRESENZE" conto="" hint-size="100%,50px"></dc-import></div>
        <div style="display: flex; gap: 10px; align-items: center"><div style="width: 220px"><dc-import name="Campo" tema="sito" contesto="segreteria" tipo="select" etichetta="MESE" valore="Ottobre 2026" nota="" nota-tono="avviso" hint-size="100%,80px"></dc-import></div><dc-import name="Chip" tema="sito" label="Scarica" acceso="{{ false }}" hint-size="123px,44px"></dc-import></div>
        <span class="frase">Le lezioni in cui ha messo il PIN sul tablet di sala, confermate: sono quelle da pagare.</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px"><dc-import name="Numero" tema="sito" titolo="LEZIONI" valore="8" sotto="Ottobre 2026" hint-size="100%,110px"></dc-import><dc-import name="Numero" tema="sito" titolo="ORE" valore="12" sotto="da orario delle lezioni" hint-size="100%,110px"></dc-import><dc-import name="Numero" tema="sito" titolo="DA CONFERMARE" valore="0" sotto="niente in sospeso" hint-size="100%,110px"></dc-import></div>
        <div style="display: flex; flex-direction: column">
          <dc-import name="TestataTabella" tema="sito" colonne="CORSO|LEZIONI|ORE" griglia="minmax(0,1fr) 90px 90px" ordinata="CORSO" hint-size="100%,32px"></dc-import>
          <div class="tab" style="grid-template-columns: minmax(0,1fr) 90px 90px"><span style="font-weight: 600">Judo kids</span><span class="num">4</span><span class="num">6</span></div>
          <div class="tab" style="grid-template-columns: minmax(0,1fr) 90px 90px"><span style="font-weight: 600">Judo ragazzi</span><span class="num">4</span><span class="num">6</span></div>
        </div>
      </div>
      <span class="frase" style="padding: 10px 14px; border: 1px dashed #14709f">KANJI: come oggi.</span>
    </div>
    <div class="piede"><dc-import name="Bottone" tema="sito" contesto="segreteria" label="Elimina" variante="rosso" hint-size="110px,48px"></dc-import></div>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
