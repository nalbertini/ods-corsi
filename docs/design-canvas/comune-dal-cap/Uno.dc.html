<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA. Un CAP della provincia di Torino che e di un comune solo: scritto il CAP, il COMUNE vuoto si riempie da se, con la nota sotto. Si puo cambiare a mano; un comune gia scritto non si tocca. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 360px; background: #121212; color: #f2f2f0">
<dc-import name="Titoletto" label="DOVE ABITI" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 16px"><dc-import name="Campo" etichetta="VIA E NUMERO" valore="Via Roma 12" hint-size="100%,80px"></dc-import><dc-import name="Campo" etichetta="CAP" valore="10093" codice="{{ true }}" hint-size="100%,80px"></dc-import><dc-import name="Campo" etichetta="COMUNE" valore="Collegno" segnaposto="" nota="Dal CAP 10093. Se non è il tuo comune, correggilo." notaTono="avviso" hint-size="100%,110px"></dc-import></div>
</div>
</x-dc>
</body>
</html>
