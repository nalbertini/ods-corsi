<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA. Un CAP di pochi comuni (fino a sei): sotto il COMUNE i comuni come tasti; un tocco e il comune e scritto. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 420px; background: #121212; color: #f2f2f0">
<dc-import name="Titoletto" label="DOVE ABITI" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 16px"><dc-import name="Campo" etichetta="VIA E NUMERO" valore="Via Roma 12" hint-size="100%,80px"></dc-import><dc-import name="Campo" etichetta="CAP" valore="10046" codice="{{ true }}" hint-size="100%,80px"></dc-import><dc-import name="Campo" etichetta="COMUNE" valore="" segnaposto="" hint-size="100%,80px"></dc-import><span style="font-size: 14px; line-height: 1.4; color: #c9c9c4">Il CAP 10046 è di due comuni: tocca il tuo.</span><div style="display: flex; gap: 8px"><div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="Isolabella" hint-size="50%,52px"></dc-import></div><div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="Poirino" hint-size="50%,52px"></dc-import></div></div></div>
</div>
</x-dc>
</body>
</html>
