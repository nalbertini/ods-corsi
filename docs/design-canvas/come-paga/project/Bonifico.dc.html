<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font del modulo sono file locali OFL; un canvas e' un Artifact e li prende da Google Fonts: stessi file, stessa licenza. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA 2. Col bonifico la ricevuta è facoltativa: si manda anche senza. La frase dice quando il bonifico vale, così chi manda senza ricevuta non pensa di aver finito. -->
<div style="display: flex; flex-direction: column; width: 375px; min-height: 1000px; background: #eef5fa; color: #0d2a3d">
<main style="display: flex; flex-direction: column; gap: 14px; padding: 20px">
<div style="display: flex; align-items: center; gap: 12px; margin-top: 8px"><span style="font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 0.04em; color: #46606f">IL PAGAMENTO</span><span style="flex-grow: 1; height: 2px; background: #cfe6f4"></span></div>
<dc-import name="IlPagamentoProposta" righe="Quota associativa:30 €|Trimestre MGA metodo globale autodifesa:150 €" totale="180,00 €" modo="bonifico" satispay="{{ true }}" carta="{{ true }}" contanti="{{ true }}" hint-size="100%,520px"></dc-import>
<span style="font-size: 14px; line-height: 1.4; color: #46606f">Bonifico a ASD Il Centro Judo:</span>
<span style="font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.02em">IT03 D076 0101 0000 0007 6350 339</span>
<span style="font-size: 14px; line-height: 1.4; color: #46606f">Causale: <span style="color: #0d2a3d; font-weight: 600">Iscrizione Giulia Bianchi · MGA</span></span>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><dc-import name="Bottone" label="COPIA IBAN" variante="linea" hint-size="150px,48px"></dc-import><dc-import name="Bottone" label="COPIA CAUSALE" variante="linea" hint-size="170px,48px"></dc-import></div>
<dc-import name="CaricaFile" etichetta="RICEVUTA DEL BONIFICO" seManca="FACOLTATIVA" dettaglio="Se l’hai già fatto, una foto o il PDF. Se no la porti dopo in segreteria." hint-size="100%,100px"></dc-import>
<span style="font-size: 14px; line-height: 1.4; color: #46606f">Il bonifico vale come pagato quando la segreteria lo vede sul conto.</span>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1000}}'>
