th: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="Non acconsento" hint-size="50%,52px"></dc-import></div></div><span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #c9c9c4">LE TUE FOTO E I TUOI VIDEO</span><span style="font-size: 14px; line-height: 1.4; color: #8c8c88">Le foto che ti ritraggono, sui social della palestra.</span><div style="display: flex; gap: 8px"><div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="Autorizzo" hint-size="50%,52px"></dc-import></div><div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="Non autorizzo" hint-size="50%,52px"></dc-import></div></div></div></main>
<dc-import name="BarraPasso" manca="IL TESSERAMENTO" avanti="AVANTI" hint-size="100%,150px"></dc-import>
