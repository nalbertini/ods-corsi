<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- COSTRUITA, passo 5: CHI ORDINA (gli stessi campi di prima) e IL RIEPILOGO, raggruppato per persona: PER e il nome in Barlow 600 (PersonaVestiario), poi una scheda per capo (RigaRiepilogoVestiario) dove taglia e quantità si cambiano senza tornare indietro, «Togli» e il conto. Sotto il totale. MANDA L'ORDINE verde nella barra. Cornice copiata da PaginaTelefono.dc.html, solo <dc-import>; dati inventati. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1950px; background: #121212; color: #f2f2f0">
  <dc-import name="Testata" luogo="VESTIARIO" guida="{{ false }}" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; flex-grow: 1">
    <dc-import name="Titoletto" label="CHI ORDINA" hint-size="100%,50px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 0 20px 16px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <dc-import name="Campo" tipo="testo" etichetta="NOME" valore="Paola" hint-size="100%,80px"></dc-import>
        <dc-import name="Campo" tipo="testo" etichetta="COGNOME" valore="Rossi" hint-size="100%,80px"></dc-import>
      </div>
      <dc-import name="Campo" tipo="testo" etichetta="TELEFONO" valore="333 123 4567" hint-size="100%,80px"></dc-import>
      <p style="margin: 0; font-size: 14px; line-height: 1.4; color: #8c8c88">La segreteria ti chiama se manca qualcosa o il pagamento non arriva.</p>
      <dc-import name="Campo" tipo="testo" etichetta="EMAIL · FACOLTATIVA" valore="" segnaposto="nome@esempio.it" hint-size="100%,80px"></dc-import>
    </div>
    <dc-import name="Titoletto" label="IL RIEPILOGO" conto="5 CAPI" hint-size="100%,50px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <dc-import name="PersonaVestiario" nome="Luca Rossi" hint-size="100%,50px"></dc-import>
        <dc-import name="RigaRiepilogoVestiario" capo="Judogi bianco" taglia="130" quanti="1" conto="1 × 35 €" prezzo="35 €" hint-size="100%,210px"></dc-import>
        <dc-import name="RigaRiepilogoVestiario" capo="Cintura" taglia="240" quanti="2" conto="2 × 6 €" prezzo="12 €" hint-size="100%,210px"></dc-import>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <dc-import name="PersonaVestiario" nome="Sara Rossi" hint-size="100%,50px"></dc-import>
        <dc-import name="RigaRiepilogoVestiario" capo="Costumino da lotta" taglia="8" quanti="1" conto="1 × 30 €" prezzo="30 €" hint-size="100%,210px"></dc-import>
        <dc-import name="RigaRiepilogoVestiario" capo="Felpa ODS" taglia="8" quanti="1" conto="1 × 28 €" prezzo="28 €" hint-size="100%,210px"></dc-import>
      </div>
      <dc-import name="RiquadroPasso" titolo="" righe="Totale:105 €" testo="Paghi dopo l’invio: ti diciamo come nella pagina che segue. Va al fornitore solo quello pagato entro il 31 ottobre." tasti="" hint-size="100%,150px"></dc-import>
    </div>
    <div style="flex-grow: 1"></div>
    <dc-import name="BarraPasso" nota="Tutto pronto: puoi mandare l’ordine." totale="105 €" totale-righe="5 capi" avanti="MANDA L’ORDINE" tono="vai" hint-size="100%,150px"></dc-import>
  </main>
</div>
</x-dc>
</body>
</html>
