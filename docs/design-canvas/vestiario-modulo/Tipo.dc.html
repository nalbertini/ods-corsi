<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- COSTRUITA, passo 2: IL TIPO. Un tasto per tipo (SceltaTipo: .modulo-corso col bordo riga-campo, nome, «3 capi · dai 6 €» e ›): un tocco porta alla pagina del tipo, senza AVANTI. La barra ha solo INDIETRO (e il totale, quando c'è un capo). Ci sono solo i tipi che hanno capi; con un tipo solo il passo si salta. Cornice copiata da PaginaTelefono.dc.html, solo <dc-import>; dati inventati. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 844px; background: #121212; color: #f2f2f0">
  <dc-import name="Testata" luogo="VESTIARIO" guida="{{ false }}" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; flex-grow: 1">
    <dc-import name="Titoletto" label="IL TIPO" conto="PER LUCA ROSSI" hint-size="100%,50px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 20px 16px">
      <dc-import name="SceltaTipo" tipo="JUDOGI" riga="3 capi · dai 6 €" hint-size="100%,60px"></dc-import>
      <dc-import name="SceltaTipo" tipo="COSTUMINI LOTTA" riga="1 capo · 30 €" hint-size="100%,60px"></dc-import>
      <dc-import name="SceltaTipo" tipo="VESTIARIO LOGATO" riga="3 capi · dai 18 €" hint-size="100%,60px"></dc-import>
    </div>
    <div style="flex-grow: 1"></div>
    <dc-import name="BarraPasso" senza-avanti="{{ true }}" hint-size="100%,90px"></dc-import>
  </main>
</div>
</x-dc>
</body>
</html>
