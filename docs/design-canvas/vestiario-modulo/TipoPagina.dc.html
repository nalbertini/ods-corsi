<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- COSTRUITA, passo 3: la pagina del tipo, qui JUDOGI per Luca Rossi. In cima la tabella delle taglie del tipo (se c'è), larga quanto lo schermo, alta 200px, senza bordi ai lati: si tocca e si apre grande. Poi un capo per scheda (SchedaCapo). Scelta la taglia QUANTI parte da 1 e la scheda prende il bordo verde: è nell'ordine; «Scegli» la toglie. La Cintura non ha foto: la scheda comincia dal nome, niente segnaposto. Tornando qui con la stessa persona le scelte ci sono. Cornice copiata da PaginaTelefono.dc.html, solo <dc-import>; dati inventati. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1850px; background: #121212; color: #f2f2f0">
  <dc-import name="Testata" luogo="VESTIARIO" guida="{{ false }}" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; flex-grow: 1">
    <dc-import name="Titoletto" label="JUDOGI" conto="PER LUCA ROSSI" hint-size="100%,50px"></dc-import>
    <div style="padding: 0 0 16px">
      <dc-import name="FotoCapo" nome="Tabella delle taglie · JUDOGI" icona="tabella" tabella="{{ true }}" hint-size="100%,200px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px 16px">
      <dc-import name="SchedaCapo" capo="Judogi bianco" prezzo="35 €" nota="Prendi l’altezza del bambino e aggiungi 10 cm. I campioni sono in segreteria." icona="judogi" taglia="130" quanti="1" conto="1 × 35 €" totale="35 €" hint-size="100%,520px"></dc-import>
      <dc-import name="SchedaCapo" capo="Judogi blu" prezzo="45 €" nota="Solo per chi fa le gare: chiedi all’istruttore." icona="judogi" taglia="" hint-size="100%,470px"></dc-import>
      <dc-import name="SchedaCapo" capo="Cintura" prezzo="6 €" nota="Per i bambini va bene la 240." foto="nessuna" taglia="240" quanti="2" conto="2 × 6 €" totale="12 €" hint-size="100%,260px"></dc-import>
    </div>
    <div style="flex-grow: 1"></div>
    <dc-import name="BarraPasso" totale="47 €" totale-righe="3 capi" avanti="AVANTI" hint-size="100%,150px"></dc-import>
  </main>
</div>
</x-dc>
</body>
</html>
