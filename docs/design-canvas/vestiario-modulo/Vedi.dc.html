<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- COSTRUITA: VEDI LA PAGINA, in VESTIARIO e in CATALOGO E CHIUSURA: apre la pagina degli ordini in un'altra scheda (a destra, alla misura del telefono). Con una bozza aperta, sotto la testata, la riga gialla dice che l'altra scheda mostra il salvato. Cornice copiata da Pagina.dc.html e PaginaTelefono.dc.html, solo <dc-import>; dati inventati. -->
<div style="display: flex; width: 1440px; min-height: 1000px; background: #121212; color: #f2f2f0">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" attiva="VESTIARIO" numeri="RICHIESTE ONLINE:3, VESTIARIO:6" nome="Marco Rossi" ruolo="Segreteria" altezza="1000px" hint-size="240px,1000px"></dc-import>
  </div>
  <main style="display: flex; gap: 40px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0">
    <div style="display: flex"><dc-import name="Bottone" label="‹ GLI ORDINI" variante="linea" contesto="segreteria" hint-size="150px,48px"></dc-import></div>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <h1 style="margin: 0; flex-grow: 1; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-weight: 700; letter-spacing: 0.04em; font-size: 34px; line-height: 1">CATALOGO E CHIUSURA</h1>
      <dc-import name="Bottone" label="VEDI LA PAGINA ↗" variante="linea" contesto="segreteria" hint-size="200px,48px"></dc-import>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.4; color: #8c8c88">Quello che vede chi ordina dal link. Si cambia in una bozza e si salva tutto insieme, come il listino.</p>
      <span style="font-size: 14px; color: #f4c31b">VEDI LA PAGINA mostra quello salvato: i cambi e le foto nuove si vedono dopo SALVA.</span>
      <dc-import name="BarraSalva" frase="Ci sono cambi da salvare: fino ad allora la pagina degli ordini mostra il catalogo di prima. Con SALVA si cancella la foto di prima di Judogi bianco." hint-size="100%,96px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; width: 390px; flex-shrink: 0">
      <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #8c8c88">L’ALTRA SCHEDA · LA PAGINA DEGLI ORDINI</span>
      <div style="display: flex; flex-direction: column; border: 2px solid #333333; background: #121212">
        <dc-import name="Testata" luogo="VESTIARIO" guida="{{ false }}" hint-size="100%,72px"></dc-import>
        <dc-import name="Titoletto" label="JUDOGI" conto="PER LUCA ROSSI" hint-size="100%,50px"></dc-import>
        <div style="padding: 0 0 16px">
          <dc-import name="FotoCapo" nome="Tabella delle taglie · JUDOGI" icona="tabella" tabella="{{ true }}" hint-size="100%,200px"></dc-import>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px 16px">
          <dc-import name="SchedaCapo" capo="Judogi bianco" prezzo="35 €" nota="Prendi l’altezza del bambino e aggiungi 10 cm." icona="judogi" taglia="" hint-size="100%,470px"></dc-import>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
