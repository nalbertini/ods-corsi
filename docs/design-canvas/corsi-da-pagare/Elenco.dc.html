<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA: ISCRITTI col filtro Corsi scaduti acceso. Una persona compare una volta sola, coi corsi scoperti e la data al posto dei corsi; la colonna WHATSAPP e' quella del sollecito. -->
<div style="display: flex; width: 1440px; min-height: 900px; background: #eef5fa">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" tema="sito" attiva="ISCRITTI" numeri="" nome="Marco Rossi" ruolo="Segreteria" altezza="900px" hint-size="240px,900px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">ISCRITTI</h1>
      <span style="font-size: 14px; color: #46606f">9 iscritti hanno un corso scaduto o pagato in parte.</span>
    </div>
    <dc-import name="FiltriIscritti" tema="sito" attivi="CORSI SCADUTI" corsiScaduti="{{ true }}" hint-size="100%,110px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <dc-import name="RigaIscritto" tema="sito" nome="Bianchi Laura" corsi="Judo 3: scaduto il 15 dicembre" contatto="333 1234567" bollini="CERTIFICATO:verde|QUOTA:verde" frequenza="6/8" sollecito="tasto" griglia="1.2fr 1.6fr 1.1fr 150px 80px 150px" hint-size="100%,70px"></dc-import>
      <dc-import name="RigaIscritto" tema="sito" nome="Conti Marco" corsi="Pilates: mancano 40 € · Judo adulti: scaduto il 30 novembre" contatto="347 5550101" bollini="CERTIFICATO:verde|QUOTA:verde" frequenza="4/8" sollecito="tasto" sollecitato="Sollecitato il 10/12 da Marco" griglia="1.2fr 1.6fr 1.1fr 150px 80px 150px" hint-size="100%,70px"></dc-import>
      <dc-import name="RigaIscritto" tema="sito" nome="Ferri Paolo" corsi="Judo kids: scaduto il 15 dicembre" contatto="0471 123456" bollini="CERTIFICATO:verde|QUOTA:rosso" frequenza="7/8" sollecito="fisso" griglia="1.2fr 1.6fr 1.1fr 150px 80px 150px" hint-size="100%,70px"></dc-import>
      <dc-import name="RigaIscritto" tema="sito" nome="Gallo Elia" corsi="MGA: pagato fuori dall’app fino al 30 novembre" contatto="349 7778899" bollini="CERTIFICATO:verde|QUOTA:verde" frequenza="2/8" sollecito="tasto" griglia="1.2fr 1.6fr 1.1fr 150px 80px 150px" hint-size="100%,70px"></dc-import>
      <div style="padding: 12px 14px; font-size: 14px; color: #46606f">… e altri 5. Ferri Paolo ha anche la quota scaduta: sta anche in Da pagare.</div>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
