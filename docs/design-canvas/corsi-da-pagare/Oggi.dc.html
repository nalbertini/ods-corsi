<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Com'e' oggi, il 16 dicembre: Laura ha pagato quota e primo trimestre a settembre; il trimestre e' finito il 15 dicembre, ma «in regola» guarda solo la quota. -->
<div style="display: flex; width: 1440px; min-height: 760px; background: #eef5fa">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" tema="sito" attiva="DA FARE" numeri="" nome="Marco Rossi" ruolo="Segreteria" altezza="760px" hint-size="240px,760px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">DA FARE</h1>
      <span style="font-size: 14px; color: #46606f">mercoledì 16 dicembre 2026. Quello che aspetta la segreteria: si riconta ogni volta che torni qui.</span>
    </div>
    <dc-import name="CosaManca" tema="sito" colonne="5" voci="0|Appelli non fatti||r; 2|Certificati scaduti||r; 0|Pagamenti||r; 0|Senza tessera||v; 1|Richieste online||g" hint-size="100%,72px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <dc-import name="RigaDaFare" tema="sito" livello="blocca" principale="{{ true }}" n="2" titolo="Iscritti senza certificato valido" sotto="Il certificato medico manca o è scaduto: senza, in sala non si entra." tasto="Chiedi i certificati" hint-size="100%,96px"></dc-import>
      <div style="padding-top: 6px"></div>
      <dc-import name="RigaDaFare" tema="sito" livello="presto" n="1" titolo="Richieste online nuove" sotto="Da accogliere: aspettano una risposta, ma non bloccano niente." tasto="Accogli le richieste" hint-size="100%,96px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; background: #ffffff; border-radius: 6px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #46606f">LA SCHEDA DI LAURA, QUOTA E PAGAMENTI</span>
      <dc-import name="Timbro" tema="sito" titolo="QUOTA" parola="IN REGOLA" tono="verde" righe="" hint-size="320px,90px"></dc-import>
      <dc-import name="CorsiPagati" righe="Judo 3: valeva fino al 15 dicembre 2026:dim" hint-size="100%,24px"></dc-import>
      <span style="font-size: 14px; color: #b81d1d">Il trimestre è scaduto, ma qui si vede solo in grigio: Pagamenti dice ✓ 0 e il filtro Da pagare non la mostra.</span>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
