<helmet>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Big+Shoulders+Display:wght@800&amp;display=swap">

  </style>
</helmet>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 20px 12px"><span style="font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: 0.03em; line-height: 1.05">Paola Marchiò</span><span style="display:inline-flex"><dc-import name="MiaChip" label="JUDO KIDS" tipo="corso" tinta="#1b8ac4" tema="chiaro" hint-size="130px,32px"></dc-import></span></div>
<div style="padding: 0 20px 14px"><dc-import name="SchedeArea" acceso="IN REGOLA" voci="LEZIONI|IN REGOLA|NUCLEO" segnoSu="IN REGOLA" tonoSegno="giallo" parolaSegno="DA SISTEMARE" tema="sito" hint-size="100%,50px"></dc-import></div>
<dc-import name="Titoletto" label="CERTIFICATO E QUOTA" conto="" tema="sito" hint-size="100%,50px"></dc-import><div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px 16px"><dc-import name="CaricaFile" etichetta="CERTIFICATO MEDICO" dettaglio="Manca. Una foto o il PDF, fino a 10 MB." tema="sito" hint-size="100%,100px"></dc-import><dc-import name="Riquadro" etichetta="QUOTA ASSOCIATIVA" cifra="MANCANO 30 €" testo="Hai pagato 50 € su 80 €. Il resto lo paghi qui con Satispay." tonoTesto="avviso" tema="sito" hint-size="100%,110px"></dc-import><dc-import name="Bottone" label="PAGA 30 € CON SATISPAY" variante="principale" tema="sito" hint-size="100%,56px"></dc-import></div><div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px 24px"><dc-import name="Riquadro" etichetta="QUALCOSA NON TORNA?" testo="Per un cambio di corso, o per pagare in palestra, passa da noi o chiama il 346 329 2786." tonoTesto="testo" tema="sito" hint-size="100%,110px"></dc-import><dc-import name="Bottone" label="CHIAMA" variante="principale" tema="sito" hint-size="100%,56px"></dc-import></div>
</div>
