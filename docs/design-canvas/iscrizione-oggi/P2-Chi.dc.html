<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font del modulo saranno file locali OFL (public/risorse, come Big Shoulders Display e Inter del sito pubblico, src/lib/sitoGenera.ts); un canvas e' un Artifact e li prende da Google Fonts: stessi file, stessa licenza. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- COM'È OGGI (produzione, 2026-10-19): la cima del modulo: COMPILA LA RICHIESTA apre il modulo al posto della pagina, in una pagina sola lunga. Testi e campi da src/components/IscrizioniScreen.tsx, ModuloIscrizione.tsx e src/lib/richieste.ts. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 780px; background: #eef5fa; color: #0d2a3d">
<dc-import name="Testata" tema="sito" luogo="ISCRIZIONI" guida="{{ false }}" senzaTema="{{ true }}" hint-size="100%,72px"></dc-import>
<main style="display: flex; flex-direction: column">
<dc-import name="Titoletto" tema="sito" label="RICHIESTA DI ISCRIZIONE" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 8px"><div style="width: 150px"><dc-import name="Bottone" tema="sito" label="← INDIETRO" variante="linea" larghezza="150px" alto="48px" hint-size="150px,48px"></dc-import></div></div>
<dc-import name="Titoletto" tema="sito" label="CHI SI ISCRIVE" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 8px"><dc-import name="Campo" tema="sito" tipo="testo" etichetta="NOME" valore="" hint-size="100%,88px"></dc-import><dc-import name="Campo" tema="sito" tipo="testo" etichetta="COGNOME" valore="" hint-size="100%,88px"></dc-import><dc-import name="Campo" tema="sito" tipo="testo" etichetta="CODICE FISCALE" valore="" codice="{{ true }}" hint-size="100%,88px"></dc-import><dc-import name="Campo" tema="sito" tipo="testo" etichetta="DATA DI NASCITA" valore="" segnaposto="gg/mm/aaaa" hint-size="100%,88px"></dc-import><dc-import name="Campo" tema="sito" tipo="testo" etichetta="LUOGO DI NASCITA" valore="" segnaposto="Lo dice il codice fiscale" hint-size="100%,88px"></dc-import></div>
</main>
</div>
</x-dc>
</body>
</html>
