<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Movimento aperto, persona e voce suggerite</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #cfe6f4; color: #0d2a3d; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Proposta: colonna unica. Testata (chi, quanto, quando), suggerimento a tutta larghezza con VOCE e PERSONA affiancate,
     campi in griglia a due colonne, piede coi tasti separato da un filetto. Gli importi e i nomi sono esempi. -->
<div style="width: 808px; padding: 24px; background: #cfe6f4">
  <div style="display: flex; flex-direction: column; gap: 22px; padding: 28px 32px; background: #ffffff; border: 2px solid #0d2a3d">

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
        <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #46606f">IL MOVIMENTO</span>
        <h1 style="margin: 0; font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 30px; font-weight: 700; letter-spacing: 0.03em">Satispay · Federica V.</h1>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px">
          <span style="padding: 6px 12px; border: 2px solid #cfe6f4; font-size: 14px; font-weight: 600">14 ott 2026</span>
          <span style="padding: 6px 12px; border: 2px solid #cfe6f4; font-size: 14px; font-weight: 600">Entrata</span>
          <span style="padding: 6px 12px; border: 2px solid #cfe6f4; font-size: 14px; font-weight: 600">Satispay</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none">
        <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #46606f">ENTRATA</span>
        <b style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums">240,00 €</b>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 18px 20px; border: 2px solid #f4c31b; background: #eef5fa">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8f6a00; font-family: Inter, Arial, sans-serif">SUGGERITO · CONFERMA TU</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #46606f; font-family: Inter, Arial, sans-serif">VOCE</span>
          <b style="font-size: 18px; font-family: Inter, Arial, sans-serif">Corsi e altri pagamenti</b>
          <span style="font-size: 14px; line-height: 1.4; font-family: Inter, Arial, sans-serif">240 € è il prezzo di Judo kids, saldo.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #46606f; font-family: Inter, Arial, sans-serif">PERSONA</span>
          <b style="font-size: 18px; font-family: Inter, Arial, sans-serif">Vitali Federica</b>
          <span style="font-size: 14px; line-height: 1.4; font-family: Inter, Arial, sans-serif">Il nome nel testo combacia con questa scheda.</span>
        </div>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <dc-import name="Bottone" label="CONFERMA VOCE E PERSONA" variante="pieno" contesto="segreteria" alto="48px" hint-size="260px,48px"></dc-import>
        <dc-import name="Bottone" label="SCEGLI TU" variante="linea" contesto="segreteria" alto="48px" hint-size="120px,48px"></dc-import>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px">
      <dc-import name="Campo" tipo="select" contesto="segreteria" etichetta="VOCE" valore="Corsi e altri pagamenti" hint-size="100%,90px"></dc-import>
      <dc-import name="Campo" tipo="select" contesto="segreteria" etichetta="PERSONA" valore="Vitali Federica" hint-size="100%,90px"></dc-import>
      <div style="grid-column: 1 / -1">
        <dc-import name="Campo" tipo="testo" contesto="segreteria" etichetta="DESCRIZIONE" valore="Satispay · Federica V." hint-size="100%,90px"></dc-import>
      </div>
      <div style="grid-column: 1 / -1">
        <dc-import name="Campo" tipo="area" contesto="segreteria" etichetta="NOTA" valore="" segnaposto="Una nota per chi guarda dopo di te" hint-size="100%,120px"></dc-import>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 20px; border-top: 2px solid #cfe6f4">
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <dc-import name="Bottone" label="CAMBIA LA VOCE" variante="pieno" contesto="segreteria" alto="48px" hint-size="180px,48px"></dc-import>
        <dc-import name="Bottone" label="SALVA IL TESTO" variante="linea" contesto="segreteria" alto="48px" hint-size="160px,48px"></dc-import>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <dc-import name="Bottone" label="ANNULLA IL MOVIMENTO" variante="pericolo" contesto="segreteria" alto="48px" hint-size="230px,48px"></dc-import>
        <dc-import name="Bottone" label="CHIUDI" variante="linea" contesto="segreteria" alto="48px" hint-size="110px,48px"></dc-import>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":808,"height":820}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
