<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Movimento aperto, com'è oggi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #cfe6f4; color: #0d2a3d; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Com'è adesso (Contabilita.tsx, MovimentoAperto), semplificato: colonna sinistra corta con 4 righe di dettaglio, destra lunga
     col suggerimento «Non so la voce» e i campi; tasti in basso a sinistra, staccati dall'importo. -->
<div style="width: 808px; padding: 24px; background: #cfe6f4">
  <div style="display: flex; flex-direction: column; gap: 22px; padding: 28px 32px; background: #ffffff; border: 2px solid #0d2a3d">
    <h1 style="margin: 0; font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 30px; font-weight: 700; letter-spacing: 0.03em">IL MOVIMENTO · Satispay · Federica V.</h1>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #46606f; font-family: 'Saira Condensed', Arial, sans-serif">DATA</span><span style="font-size: 16px; font-weight: 500">14 ott 2026</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #46606f; font-family: 'Saira Condensed', Arial, sans-serif">TIPO</span><span style="font-size: 16px; font-weight: 500">Entrata</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #46606f; font-family: 'Saira Condensed', Arial, sans-serif">CASSA</span><span style="font-size: 16px; font-weight: 500">Satispay</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #46606f; font-family: 'Saira Condensed', Arial, sans-serif">IMPORTO</span><span style="font-size: 16px; font-weight: 500">240,00 €</span></div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border: 2px solid #f4c31b; background: #eef5fa">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8f6a00; font-family: Inter, Arial, sans-serif">SUGGERITO · CONFERMA TU</span>
          <span style="font-size: 14px; line-height: 1.4; font-family: Inter, Arial, sans-serif">Non so la voce: scegli tu.</span>
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #46606f; font-family: Inter, Arial, sans-serif">PERSONA</span>
            <b style="font-size: 18px; font-family: Inter, Arial, sans-serif">Vitali Federica</b>
          </div>
          <dc-import name="Bottone" label="CONFERMA VOCE E PERSONA" variante="pieno" contesto="segreteria" disabled="{{ true }}" alto="48px" hint-size="260px,48px"></dc-import>
        </div>
        <dc-import name="Campo" tipo="select" contesto="segreteria" etichetta="VOCE" valore="Scegli la voce" hint-size="100%,90px"></dc-import>
        <dc-import name="Campo" tipo="testo" contesto="segreteria" etichetta="DESCRIZIONE" valore="Satispay · Federica V." hint-size="100%,90px"></dc-import>
        <dc-import name="Campo" tipo="area" contesto="segreteria" etichetta="NOTA" valore="" hint-size="100%,120px"></dc-import>
      </div>
    </div>
    <div style="display: flex; gap: 10px; flex-wrap: wrap">
      <dc-import name="Bottone" label="CAMBIA LA VOCE" variante="pieno" contesto="segreteria" alto="48px" hint-size="180px,48px"></dc-import>
      <dc-import name="Bottone" label="SALVA IL TESTO" variante="linea" contesto="segreteria" alto="48px" hint-size="160px,48px"></dc-import>
      <dc-import name="Bottone" label="ANNULLA IL MOVIMENTO" variante="pericolo" contesto="segreteria" alto="48px" hint-size="230px,48px"></dc-import>
      <dc-import name="Bottone" label="CHIUDI" variante="linea" contesto="segreteria" alto="48px" hint-size="110px,48px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":808,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
