<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Movimento aperto, telefono</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #ffffff; color: #0d2a3d; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Telefono: tutto impilato, tasti a tutta larghezza (tocco 48px). Stesso caso della tavola principale. -->
<div style="display: flex; flex-direction: column; gap: 20px; width: 390px; padding: 20px 16px 28px; background: #ffffff">

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #46606f">IL MOVIMENTO</span>
    <h1 style="margin: 0; font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 26px; font-weight: 700; letter-spacing: 0.03em">Satispay · Federica V.</h1>
    <b style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums">240,00 €</b>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="padding: 6px 12px; border: 2px solid #cfe6f4; font-size: 14px; font-weight: 600">14 ott 2026</span>
      <span style="padding: 6px 12px; border: 2px solid #cfe6f4; font-size: 14px; font-weight: 600">Entrata</span>
      <span style="padding: 6px 12px; border: 2px solid #cfe6f4; font-size: 14px; font-weight: 600">Satispay</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border: 2px solid #f4c31b; background: #eef5fa">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #8f6a00; font-family: Inter, Arial, sans-serif">SUGGERITO · CONFERMA TU</span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #46606f; font-family: Inter, Arial, sans-serif">VOCE</span>
      <b style="font-size: 18px; font-family: Inter, Arial, sans-serif">Corsi e altri pagamenti</b>
      <span style="font-size: 14px; line-height: 1.4; font-family: Inter, Arial, sans-serif">240 € è il prezzo di Judo kids, saldo.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #46606f; font-family: Inter, Arial, sans-serif">PERSONA</span>
      <b style="font-size: 18px; font-family: Inter, Arial, sans-serif">Vitali Federica</b>
      <span style="font-size: 14px; line-height: 1.4; font-family: Inter, Arial, sans-serif">Il nome nel testo combacia con questa scheda.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <dc-import name="Bottone" label="CONFERMA VOCE E PERSONA" variante="pieno" contesto="segreteria" larghezza="100%" alto="48px" hint-size="100%,48px"></dc-import>
      <dc-import name="Bottone" label="SCEGLI TU" variante="linea" contesto="segreteria" larghezza="100%" alto="48px" hint-size="100%,48px"></dc-import>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px">
    <dc-import name="Campo" tipo="select" contesto="segreteria" etichetta="VOCE" valore="Corsi e altri pagamenti" hint-size="100%,90px"></dc-import>
    <dc-import name="Campo" tipo="select" contesto="segreteria" etichetta="PERSONA" valore="Vitali Federica" hint-size="100%,90px"></dc-import>
    <dc-import name="Campo" tipo="testo" contesto="segreteria" etichetta="DESCRIZIONE" valore="Satispay · Federica V." hint-size="100%,90px"></dc-import>
    <dc-import name="Campo" tipo="area" contesto="segreteria" etichetta="NOTA" valore="" segnaposto="Una nota per chi guarda dopo di te" hint-size="100%,120px"></dc-import>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 18px; border-top: 2px solid #cfe6f4">
    <dc-import name="Bottone" label="CAMBIA LA VOCE" variante="pieno" contesto="segreteria" larghezza="100%" alto="48px" hint-size="100%,48px"></dc-import>
    <dc-import name="Bottone" label="SALVA IL TESTO" variante="linea" contesto="segreteria" larghezza="100%" alto="48px" hint-size="100%,48px"></dc-import>
    <dc-import name="Bottone" label="CHIUDI" variante="linea" contesto="segreteria" larghezza="100%" alto="48px" hint-size="100%,48px"></dc-import>
    <dc-import name="Bottone" label="ANNULLA IL MOVIMENTO" variante="pericolo" contesto="segreteria" larghezza="100%" alto="48px" hint-size="100%,48px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1330}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
