<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Resoconto di fine import: le righe con l'email già di un altro entrano con quell'indirizzo come contatto, e l'elenco dice nome e indirizzo (non «12 email già presenti»). Niente «da sistemare» per questo. Fatto copiando Pagina.dc.html; dati inventati. -->
<div style="display: flex; width: 1440px; min-height: 900px; background: #121212">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" attiva="ISCRITTI" numeri="RICHIESTE ONLINE:3, PRESENZE:2" nome="Marco Rossi" ruolo="Segreteria" altezza="900px" tema="scuro" hint-size="240px,900px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 34px; font-weight: 700; letter-spacing: 0.04em; line-height: 1">IMPOSTAZIONI</h1>
      <span style="font-size: 14px; color: #8c8c88">Le scelte che spettano alla palestra, non al programma.</span>
    </div>
    <dc-import name="Resoconto" tono="giallo" titolo="FATTO, 2 righe da controllare" frase="Sono entrati 118 iscritti. Per 2 l'email era già di un'altra persona: ora è la loro email di contatto." conto="2 CON L'EMAIL DI CONTATTO" elenco="iscritti.csv riga 14: Sara Rossi, contatto giulia.rossi@esempio.it (email di Giulia Rossi);;iscritti.csv riga 61: Marta Conti, contatto davide.conti@esempio.it (email di Davide Conti, istruttore)" spiegazione="Entrano senza email di accesso: l'email di accesso resta di chi ce l'aveva. Il contatto si vede nella scheda." tema="scuro" hint-size="640px,520px"></dc-import>
  </main>
</div>
</x-dc>
</body>
</html>
