<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }

</helmet>

<dc-import name="Avanzamento" numero="1" totale="6" titolo="I DATI" hint-size="100%,120px"></dc-import><dc-import name="Titoletto" label="TU, GENITORE" hint-size="100%,50px"></dc-import><div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px"><dc-import name="Campo" etichetta="CODICE FISCALE" valore="BNCLCU15M12L219X" codice="{{ true }}" nota="Metti il tuo codice fiscale, non quello di Luca." hint-size="100%,90px"></dc-import><dc-import name="Campo" etichetta="DOVE SEI NATO" valore="" segnaposto="Comune" hint-size="100%,90px"></dc-import><dc-import name="Campo" etichetta="PROVINCIA" valore="" segnaposto="ES. TO" nota="Dal tuo codice fiscale non riusciamo a leggerlo: scrivilo tu." notaTono="avviso" hint-size="100%,90px"></dc-import></div>
</main>
<dc-import name="BarraPasso" manca="CODICE FISCALE|DOVE SEI NATO|PROVINCIA" compatta="{{ true }}" avanti="AVANTI" senzaIndietro="{{ true }}" hint-size="100%,150px"></dc-import>
</div>
</x-dc>
</body>
</html>
