      <dc-import name="RigaIscritto" tema="sito" nome="Bianchi Sofia" corsi="Judo kids" contatto="338 727 9888" bollini="Non serve:nota" quota="ok:ok" frequenza="6/8" poco="{{ false }}" proposta="{{ true }}" colonnaFamiglia="{{ true }}" piu="" minorenne="{{ true }}" famiglia="Bianchi Marco" griglia="minmax(0, 1fr) 150px 150px 120px minmax(0, 1.2fr) 150px 80px" hint-size="100%,50px"></dc-import>
