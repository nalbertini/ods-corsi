<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .et { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #46606f; }
    .frase { font-size: 14px; color: #46606f; line-height: 1.45; }
  </style>
</helmet>
<!-- PROPOSTA: ogni presenza in coda sa chi l'ha scritta. Quelle di un altro account non partono e non si buttano: aspettano che lui rientri. Testi da avvisiCoda in src/lib/coda.ts. -->
<div style="display:flex;flex-direction:column;width:390px;min-height:560px;background:#eef5fa">
  <dc-import name="BarraTelefono" luogo="ISTRUTTORI" da-fare="0" hint-size="100%,62px"></dc-import>
  <div style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">
    <span class="et">ENTRA GIULIA: LE SUE PARTONO, QUELLE DI MARCO ASPETTANO</span>
    <dc-import name="SpiaCoda" titolo="1 PRESENZA DA INVIARE" testo="È salvata sul telefono: parte da sola appena c’è rete." tono="attesa" hint-size="100%,100px"></dc-import>
    <dc-import name="SpiaCoda" titolo="3 PRESENZE DI MARCO ROSSI" testo="Segnate dal 24 settembre, non ancora arrivate: partono quando Marco entra di nuovo con il suo account. Le tue non sono toccate." tono="attesa" hint-size="100%,120px"></dc-import>
    <span class="et">RIENTRA MARCO</span>
    <dc-import name="SpiaCoda" titolo="3 PRESENZE DA INVIARE" testo="Sono salvate sul telefono: partono da sole appena c’è rete." tono="attesa" hint-size="100%,100px"></dc-import>
    <span class="frase">Con la rete partono subito, a nome di Marco, e la spia sparisce.</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":560}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
