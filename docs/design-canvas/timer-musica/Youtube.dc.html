<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA «musica nel timer istruttori»: con YouTube il video vuole un riquadro visibile da 200px: sta sopra la barra, a destra, e il tempo dell'allenamento resta grande a sinistra. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 844px; background: #121212">
  <dc-import name="Testata" luogo="ISTRUTTORI" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; flex-grow: 1">
    <dc-import name="TimerAllenamento" altezza="352px" hint-size="100%,352px"></dc-import>
    <div style="display: flex; justify-content: flex-end; padding: 12px 20px 0"><div style="width: 200px; height: 200px; background: #242424; border: 2px solid #333333; display: flex; align-items: center; justify-content: center; color: #8c8c88; font-size: 13px; font-weight: 600; letter-spacing: 0.12em">VIDEO YOUTUBE</div></div>
  </main>
  <dc-import name="MusicaTelefono" musica="suona" fonte="youtube" titolo="Randori" sotto="Playlist YouTube · Randori" hint-size="100%,140px"></dc-import>
  <dc-import name="BarraNavigazione" voci="CALENDARIO|TIMER|I MIEI|ORE" attiva="TIMER" hint-size="100%,66px"></dc-import>
</div>
</x-dc>
</body>
</html>
