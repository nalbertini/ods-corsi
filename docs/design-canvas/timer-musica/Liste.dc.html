<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA «musica nel timer istruttori»: ☰ apre LA MUSICA dal basso, sopra la barra: un tocco su una lista e parte subito, come sul tablet. Le liste YouTube dicono che col telefono bloccato si fermano. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 844px; background: #121212">
  <dc-import name="Testata" luogo="ISTRUTTORI" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; flex-grow: 1; justify-content: flex-end; background: rgba(0,0,0,0.6)">
    <dc-import name="TabletListeMusica" titolo="LA MUSICA" filtri="Judo, Preparazione" liste="Riscaldamento|Playlist Spotify · Riscaldamento; Randori|Playlist YouTube · si ferma col telefono bloccato; Radio della palestra|Radio; Defaticamento|Spotify non è collegato su questo telefono|spenta" scelta="Riscaldamento" hint-size="100%,480px"></dc-import>
  </main>
  <dc-import name="MusicaTelefono" musica="suona" listeAperte="{{ true }}" hint-size="100%,140px"></dc-import>
  <dc-import name="BarraNavigazione" voci="CALENDARIO|TIMER|I MIEI|ORE" attiva="TIMER" hint-size="100%,66px"></dc-import>
</div>
</x-dc>
</body>
</html>
