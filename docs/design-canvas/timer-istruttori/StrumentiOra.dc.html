<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- COM'E' OGGI: STRUMENTI in fondo al calendario sul telefono (Sala.tsx, `Strumenti`, `.strumenti`): griglia a due colonne, tasti linea 52px; TIMER ↗ apre l'app del timer in un'altra scheda. -->
<div style="width: 390px; background: #121212">
  <div style="display: flex; flex-direction: column; background: #121212">
    <dc-import name="Titoletto" label="STRUMENTI" hint-size="100%,50px"></dc-import>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 0 20px 20px">
      <dc-import name="Bottone" label="I MIEI TIMER" variante="linea" alto="52px" corpo="16px" spazio="0.08em" hint-size="100%,52px"></dc-import>
      <dc-import name="Bottone" label="LE MIE ORE" variante="linea" alto="52px" corpo="16px" spazio="0.08em" hint-size="100%,52px"></dc-import>
      <dc-import name="Bottone" label="TIMER ↗" variante="linea" alto="52px" corpo="16px" spazio="0.08em" hint-size="100%,52px"></dc-import>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
