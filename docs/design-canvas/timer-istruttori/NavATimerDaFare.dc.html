<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- VARIANTE A, pagina TIMER, scheda DA FARE (telefono). Due schede in cima (SchedeTimer): DA FARE, la pagina di oggi (DI QUESTA LEZIONE, DEL CORSO, LIBRERIA e il cronometro libero, tutto di TimerPagina), e I MIEI. Barra in basso con TIMER acceso. Senza ‹: si arriva dalla barra. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1120px; background: #121212">
  <dc-import name="Testata" luogo="ISTRUTTORI" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; flex-grow: 1">
    <div style="padding: 16px 20px 0">
      <span style="flex-grow: 1; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 22px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.05">TIMER</span>
    </div>
    <div style="padding: 12px 20px 0">
      <dc-import name="SchedeTimer" schede="DA FARE|I MIEI" attiva="DA FARE" hint-size="100%,56px"></dc-import>
    </div>
    <dc-import name="TimerPagina" indietro="" con-titolo="{{ false }}" con-barra="{{ false }}" tutti="LIBRERIA" cronometro="{{ true }}" altezza="100px" hint-size="100%,900px"></dc-import>
  </main>
  <dc-import name="BarraNavigazione" voci="CALENDARIO|TIMER|ORE" attiva="TIMER" hint-size="100%,66px"></dc-import>
</div>
</x-dc>
</body>
</html>
