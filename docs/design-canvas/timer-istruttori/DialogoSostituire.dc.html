<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA: con un allenamento in corso, toccare il cronometro di un'ALTRA lezione chiede prima di sostituirlo. La risposta sicura e' tenere quello in corso (tasto pieno, a sinistra del gesto che fa); SOSTITUISCI ferma il vecchio e apre il timer della lezione toccata. Dialogo come in ods-design-system/Dialogo.dc.html (tipo conferma, restare). -->
<div style="width: 390px; height: 844px; background: #121212">
  <dc-import name="Dialogo" tipo="conferma" restare="{{ true }}" domanda="Sostituire l'allenamento in corso?" resto="Sul timer c'è già TABATA BRUCIA GRASSI, serie 2 di 3, di Judo kids delle 18:30. Se parti con quello di Judo adulti delle 20:00, il primo si ferma e non si riprende." no="TIENI QUELLO IN CORSO" si="SOSTITUISCI" altezza="844px" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
</body>
</html>
