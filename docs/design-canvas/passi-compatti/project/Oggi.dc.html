<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Oggi</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- OGGI, dopo AVANTI a modulo vuoto (adulto, passo DATI). La testata del sito, la riga RICHIESTA DI ISCRIZIONE e l avanzamento col titolo prendono ~236px; la barra ~146. Tutti i campi rossi con «Manca», anche data e luogo che riempie il codice fiscale; MANCANO 10. -->
<div style="display: flex; flex-direction: column; width: 390px; height: 664px; overflow: hidden; background: #eef5fa">
  <dc-import name="Testata" luogo="ISCRIZIONI" guida="{{ false }}" hint-size="100%,72px"></dc-import>
  <dc-import name="IntestaPasso" hint-size="100%,60px"></dc-import>
  <dc-import name="Avanzamento" numero="1" totale="7" titolo="DATI" hint-size="100%,100px"></dc-import>
  <main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 14px 20px 0">
      <dc-import name="Campo" etichetta="NOME" manca="{{ true }}" nota="Manca" hint-size="100%,90px"></dc-import>
      <dc-import name="Campo" etichetta="COGNOME" manca="{{ true }}" nota="Manca" hint-size="100%,90px"></dc-import>
      <dc-import name="Campo" etichetta="CODICE FISCALE" codice="{{ true }}" manca="{{ true }}" nota="Manca" hint-size="100%,90px"></dc-import>
      <dc-import name="Campo" etichetta="DATA DI NASCITA" manca="{{ true }}" nota="Manca" hint-size="100%,90px"></dc-import>
      <dc-import name="Campo" etichetta="LUOGO DI NASCITA" manca="{{ true }}" nota="Manca" hint-size="100%,90px"></dc-import>
      <dc-import name="Campo" etichetta="VIA E NUMERO" manca="{{ true }}" nota="Manca" hint-size="100%,90px"></dc-import>
  </main>
  <dc-import name="BarraPasso" compatta="{{ true }}" manca="NOME|COGNOME|CODICE FISCALE|DATA DI NASCITA|LUOGO DI NASCITA|VIA E NUMERO|CAP|COMUNE|EMAIL|TELEFONO" hint-size="100%,146px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":664}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
