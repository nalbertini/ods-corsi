<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Copiata da ods-design-system/PaginaSitoTelefono.dc.html: la scheda iscritto a 390px con il Sollecito sotto i timbri, tasto a tutta larghezza. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1100px; background: #eef5fa">
  <dc-import name="BarraTelefono" tema="sito" hint-size="390px,56px"></dc-import>
  <main style="display: flex; flex-direction: column; gap: 14px; padding: 18px 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">ROSSI MARCO</h1>
      <span style="font-size: 14px; color: #46606f">9 anni · Judo kids · genitore Rossi Laura</span>
    </div>
    <dc-import name="Timbro" tema="sito" titolo="CERTIFICATO MEDICO" parola="SCADUTO" tono="rosso" righe="il 12 marzo 2026" hint-size="100%,96px"></dc-import>
    <dc-import name="Timbro" tema="sito" titolo="QUOTA" parola="DA PAGARE" tono="rosso" righe="" hint-size="100%,72px"></dc-import>
    <dc-import name="Sollecito" tema="sito" motivi="Quota associativa da pagare: 30,00 €:rosso|Certificato medico scaduto il 12 marzo 2026:rosso" testo="Ciao Laura, ti scriviamo dalla segreteria del Centro Judo per Marco: la quota associativa è da pagare (30,00 €) e il certificato medico è scaduto il 12 marzo 2026. Puoi passare in segreteria o rispondere qui. Grazie!" chi="A Rossi Laura (genitore) · 333 123 4567" telefono="{{ true }}" ultimo="Sollecitato l’ultima volta il 14 ottobre 2026 da Giulia" hint-size="100%,420px"></dc-import>
    <dc-import name="SchedeIscritto" tema="sito" acceso="PERSONA" telefono="{{ true }}" hint-size="100%,44px"></dc-import>
    <span style="font-size: 14px; line-height: 1.45; color: #46606f">Sul telefono «Apri WhatsApp» apre l’app WhatsApp del telefono stesso.</span>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
