<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- L'appello di una lezione (AppelloScreen.tsx) come lo vede l'istruttore (`soloDi`): testa ferma, ATTIVITÀ DI QUESTA
     LEZIONE, ISCRITTI con la ricerca e le righe, PROVE, + AGGIUNGI CHI PROVA e il tasto in fondo. Copia di
     PaginaTelefono.dc.html; l'appello non ha la testata dell'app: la sua testa e' TestaAppello. Qui lezione di oggi,
     appena cominciata, con tre iscritti segnati e una prova. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1180px; background: #121212; color: #f2f2f0">
  <dc-import name="TestaAppello" corso="Judo kids" kanji="柔" quando="Martedì 17:30 · Sala 1" presenti="2" iscritti="5" prove="1" mancano="2" coda="1 DA INVIARE" tasto="GLI ALTRI PRESENTI" hint-size="100%,224px"></dc-import>
  <main style="display: flex; flex-direction: column">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 20px 0">
      <dc-import name="Campo" tipo="select" etichetta="ATTIVITÀ DI QUESTA LEZIONE" valore="Nessuna attività" nota="Cambia solo questa lezione." notaTono="avviso" hint-size="100%,110px"></dc-import>
    </div>

    <dc-import name="Titoletto" label="ISCRITTI" conto="5" hint-size="100%,50px"></dc-import>
    <div style="padding: 0 20px 10px">
      <dc-import name="Campo" etichetta="CERCA PER NOME O COGNOME" hint-size="100%,88px"></dc-import>
    </div>
    <p style="margin: 0 0 10px; padding: 0 20px; font-size: 14px; line-height: 1.4; color: #8c8c88">Un tocco sul nome: presente, poi assente, poi di nuovo da segnare.</p>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 20px 20px">
      <dc-import name="RigaAppello" nome="Bianchi Sofia" stato="presente" hint-size="100%,56px"></dc-import>
      <dc-import name="RigaAppello" nome="Ferrari Matteo" stato="presente" hint-size="100%,56px"></dc-import>
      <dc-import name="RigaAppello" nome="Greco Luca" stato="assente" hint-size="100%,56px"></dc-import>
      <dc-import name="RigaAppello" nome="Marino Anna" stato="niente" hint-size="100%,56px"></dc-import>
      <dc-import name="RigaAppello" nome="Rossi Giulia" stato="niente" hint-size="100%,56px"></dc-import>
    </div>

    <dc-import name="Titoletto" label="PROVE" conto="1" hint-size="100%,50px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 20px 20px">
      <dc-import name="RigaAppello" nome="Colombo Davide" stato="presente" prova="{{ true }}" hint-size="100%,56px"></dc-import>
    </div>

    <div style="padding: 4px 20px 0">
      <dc-import name="Bottone" label="+ AGGIUNGI CHI PROVA" variante="tratteggiato" alto="52px" corpo="16px" hint-size="100%,52px"></dc-import>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 20px 20px 28px">
      <dc-import name="Bottone" label="CHIUDI · 2 ASSENTI" variante="principale" hint-size="100%,56px"></dc-import>
      <span style="font-size: 14px; line-height: 1.4; color: #8c8c88">I 2 non segnati risultano assenti. Si può sempre riaprire e correggere.</span>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
