<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Timer desktop E · comandi nel riquadro di destra</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  </style>
</helmet>
<!-- Proposta E, ipotesi su D: i comandi (+30, indietro, PAUSA, avanti) passano nel riquadro di destra, sopra il lettore; a sinistra restano solo quello che si guarda. Per il resto come D: le due colonne di A con la scaletta ridotta ai prossimi tre passi; in fondo la barra di C, che al posto dell'anello e delle tacche si colora via via: i passi fatti pieni, quello in corso a meta', i prossimi tenui. Qui siamo al giro 3 di 8, dopo 13 secondi di lavoro. -->
<div style="position: relative; display: flex; flex-direction: column; width: 1440px; height: 900px; background: #121212">
  <div style="position: absolute; inset: 0; border: 14px solid #e4292a; pointer-events: none; z-index: 5"></div>
  <div style="display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 14px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 24px 0">
      <button type="button" aria-label="Chiudi il timer" style="width: 44px; height: 44px; border: 2px solid #333333; color: #b8b8b2; font-size: 20px">✕</button>
      <div style="flex: 1; min-width: 0">
        <div style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 22px; font-weight: 700; line-height: 1; letter-spacing: 0.03em">LOTTA TERRA</div>
        <div style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #8c8c88; margin-top: 4px">SERIE 1 / 3</div>
      </div>
      <span style="background: #f4c31b; color: #121212; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; padding: 5px 9px">MAURIZIO</span>
      <button type="button" style="min-width: 44px; height: 44px; padding: 0 11px; border: 2px solid #333333; color: #b8b8b2; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em">RESET</button>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); flex: 1; min-height: 0; margin-top: 16px; border-top: 2px solid #2a2a2a">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; padding: 28px 40px 24px; min-height: 0">
        <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 44px; font-weight: 700; letter-spacing: 0.26em; color: #e4292a; line-height: 1">LAVORO</span>
        <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 230px; font-weight: 700; line-height: 0.88; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">00:17</span>
        <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 44px; font-weight: 600; letter-spacing: 0.04em; text-align: center">LOTTA TERRA</span>
        <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 0.1em; color: #8c8c88">3 SERIE × 12 RIPETIZIONI</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 22px; padding: 28px 28px 24px; border-left: 2px solid #2a2a2a; min-height: 0">
        <div style="display: flex; flex-direction: column; gap: 4px; font-family: 'Saira Condensed', Arial, sans-serif">
            <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.22em; color: #8c8c88">RESTA</span>
            <span style="font-size: 64px; font-weight: 700; line-height: 0.9; font-variant-numeric: tabular-nums">12:41</span>
            <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.16em; color: #8c8c88">FINE ALLE 18:04</span>
          </div>
        <dc-import name="TimerScaletta" righe="work:LOTTA TERRA:30:1;rest:RECUPERO:15:1;work:LOTTA TERRA:30:3" altri="+ ALTRI 10 PASSI" hint-size="100%,260px"></dc-import>
        <div style="display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 6px">
      <button type="button" style="min-width: 66px; height: 44px; padding: 0 12px; border: 2px solid #333333; background: #1c1c1c; color: #8c8c88; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.06em; opacity: 0.35">+30&Prime;</button>
      <div style="display: flex; gap: 12px; flex: 1">
        <button type="button" aria-label="Intervallo precedente" style="width: 68px; height: 68px; flex-shrink: 0; border: 2px solid #333333; color: #b8b8b2; font-size: 22px">⏮</button>
        <button type="button" style="flex: 1; height: 68px; background: #f4c31b; color: #121212; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 22px; font-weight: 700; letter-spacing: 0.16em">❚❚ PAUSA</button>
        <button type="button" aria-label="Intervallo successivo" style="width: 68px; height: 68px; flex-shrink: 0; border: 2px solid #333333; color: #b8b8b2; font-size: 22px">⏭</button>
      </div>
        </div>
        <div style="margin-top: auto">
          <div style="display: flex; align-items: center; gap: 12px; background: #1c1c1c; border: 2px solid #333333; padding: 8px 12px">
            <span style="width: 40px; height: 40px; flex-shrink: 0; background: #242424"></span>
            <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Billy Idol - Eyes Without A Face</span><span style="display: block; font-size: 13px; color: #8c8c88">Anni 80</span></span>
            <span style="font-size: 18px; color: #b8b8b2; letter-spacing: 0.4em">⏮ ▶ ⏭</span>
          </div>
        </div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 24px; padding: 16px 24px 18px; border-top: 2px solid #2a2a2a">
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.2em; color: #8c8c88; margin-bottom: 10px">
          <span>GIRO <b style="color: #f2f2f0; font-size: 22px">3 / 8</b> &nbsp;·&nbsp; SERIE 1 / 3 &nbsp;·&nbsp; <span style="color: #f4c31b">PREPARATI</span> · <span style="color: #e4292a">LOTTA</span> · <span style="color: #16a54a">RECUPERO</span> · <span style="color: #1b8ac4">RIPOSO</span></span>
          <span>FINE ALLE 18:04</span>
        </div>
        <dc-import name="TimerLinea" blocchi="prepare:5,work:30,rest:15,work:30,rest:15,work:30,rest:15,work:30,rest:15,work:30,rest:15,work:30,rest:15,work:30,rest:15,work:30,setRest:60,work:30,rest:15,work:30,rest:15,work:30" attuale="5" avanzamento="0.43" alto="44px" hint-size="100%,44px"></dc-import>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

  renderVals() { return {}; }

</script>
</body>
</html>
