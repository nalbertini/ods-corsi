<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Timer telefono F</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  </style>
</helmet>
<!-- Versione telefono di F: stesso ordine in verticale. Intestazione, stato e cifre, nome dell'esercizio, il tasto grande con i tre a parole,
     i prossimi due passi della scaletta, in fondo la barra che si colora e il lettore. Bordo di 10px del colore dello stato. -->
<div style="position: relative; display: flex; flex-direction: column; width: 390px; height: 844px; background: #121212">
  <div style="position: absolute; inset: 0; border: 10px solid #e4292a; pointer-events: none; z-index: 5"></div>
  <div style="display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 10px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 14px 12px 0">
      <button type="button" aria-label="Chiudi il timer" style="width: 44px; height: 44px; flex-shrink: 0; border: 2px solid #333333; color: #b8b8b2; font-size: 18px">✕</button>
      <div style="flex: 1; min-width: 0">
        <div style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 20px; font-weight: 700; line-height: 1; letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">LOTTA TERRA</div>
        <div style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #8c8c88; margin-top: 4px">SERIE 1 / 3</div>
      </div>
      <span style="background: #f4c31b; color: #121212; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; padding: 4px 7px">MAURIZIO</span>
      <button type="button" style="min-width: 44px; height: 44px; padding: 0 9px; border: 2px solid #333333; color: #b8b8b2; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.1em">RESET</button>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 20px 12px 0">
      <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 30px; font-weight: 700; letter-spacing: 0.26em; color: #e4292a; line-height: 1">LAVORO</span>
      <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 128px; font-weight: 700; line-height: 0.88; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">00:17</span>
      <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 32px; font-weight: 600; letter-spacing: 0.04em; text-align: center">LOTTA TERRA</span>
      <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.1em; color: #8c8c88">3 SERIE × 12 RIPETIZIONI</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 18px 12px 0">
      <button type="button" style="width: 100%; height: 72px; background: #e4292a; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 12px; font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 26px; font-weight: 700; letter-spacing: 0.18em">❚❚ PAUSA</button>
      <div style="display: flex; gap: 8px">
        <button type="button" style="flex: 1; height: 48px; border: 2px solid #333333; color: #b8b8b2; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.1em">⏮ INDIETRO</button>
        <button type="button" aria-label="Aggiungi trenta secondi a questo intervallo" style="flex: 1; height: 48px; border: 2px solid #e4292a; background: #1c1c1c; color: #f2f2f0; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.06em">+30&Prime;</button>
        <button type="button" style="flex: 1; height: 48px; border: 2px solid #333333; color: #b8b8b2; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.1em">AVANTI ⏭</button>
      </div>
    </div>
    <div style="padding: 16px 12px 0">
      <dc-import name="TimerScaletta" righe="work:LOTTA TERRA:30:1;rest:RECUPERO:15:1" altri="+ ALTRI 11 PASSI" hint-size="100%,190px"></dc-import>
    </div>
    <div style="margin-top: auto; padding: 0 12px 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: #8c8c88; margin-bottom: 8px">
        <span>GIRO <b style="color: #f2f2f0; font-size: 18px">3 / 8</b></span>
        <span>RESTA <b style="color: #f2f2f0">12:41</b></span>
      </div>
      <dc-import name="TimerLinea" blocchi="prepare:5,work:30,rest:15,work:30,rest:15,work:30,rest:15,work:30,rest:15,work:30,rest:15,work:30,rest:15,work:30,rest:15,work:30,setRest:60,work:30,rest:15,work:30,rest:15,work:30" attuale="5" avanzamento="0.43" alto="30px" hint-size="100%,30px"></dc-import>
      <div style="display: flex; align-items: center; gap: 10px; background: #1c1c1c; border: 2px solid #333333; padding: 6px 10px; margin-top: 10px">
        <span style="width: 32px; height: 32px; flex-shrink: 0; background: #242424"></span>
        <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Billy Idol - Eyes Without A Face</span><span style="display: block; font-size: 12px; color: #8c8c88">Anni 80</span></span>
        <span style="font-size: 16px; color: #b8b8b2; letter-spacing: 0.3em">⏮ ▶ ⏭</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
