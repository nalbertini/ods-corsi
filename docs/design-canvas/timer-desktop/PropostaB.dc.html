<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Timer desktop B · cifre protagoniste</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  </style>
</helmet>
<!-- Proposta B: senza anello. Il giro e RESTA salgono nell'intestazione, le tacche dei giri diventano alte, le cifre prendono tutta la larghezza
     e PROSSIMO sta sotto il nome dell'esercizio. -->
<div style="position: relative; display: flex; flex-direction: column; width: 1440px; height: 900px; background: #121212">
  <div style="position: absolute; inset: 0; border: 14px solid #f4c31b; pointer-events: none; z-index: 5"></div>
  <div style="display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 14px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 24px 0">
      <button type="button" aria-label="Chiudi il timer" style="width: 44px; height: 44px; border: 2px solid #333333; color: #b8b8b2; font-size: 20px">✕</button>
      <div style="flex: 1; min-width: 0">
        <div style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 22px; font-weight: 700; line-height: 1; letter-spacing: 0.03em">LOTTA TERRA</div>
        <div style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #8c8c88; margin-top: 4px">SERIE 1 / 3 &nbsp;·&nbsp; <b style="color: #f2f2f0">GIRO 1 / 8</b> &nbsp;·&nbsp; RESTA 16:32</div>
      </div>
      <span style="background: #f4c31b; color: #121212; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; padding: 5px 9px">MAURIZIO</span>
      <button type="button" style="min-width: 44px; height: 44px; padding: 0 11px; border: 2px solid #333333; color: #b8b8b2; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em">RESET</button>
    </div>
    <div style="display: flex; gap: 4px; padding: 12px 24px 0">
      <span style="flex: 1; height: 22px; background: #f4c31b; border: 2px solid #f4c31b"></span>
      <span style="flex: 1; height: 22px; border: 2px solid #333333"></span><span style="flex: 1; height: 22px; border: 2px solid #333333"></span><span style="flex: 1; height: 22px; border: 2px solid #333333"></span><span style="flex: 1; height: 22px; border: 2px solid #333333"></span><span style="flex: 1; height: 22px; border: 2px solid #333333"></span><span style="flex: 1; height: 22px; border: 2px solid #333333"></span><span style="flex: 1; height: 22px; border: 2px solid #333333"></span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-height: 0; gap: 8px; margin-top: 16px; border-top: 2px solid #2a2a2a">
      <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 48px; font-weight: 700; letter-spacing: 0.26em; color: #f4c31b; line-height: 1">PRONTO</span>
      <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-size: 400px; font-weight: 700; line-height: 0.84; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">00:05</span>
      <span style="font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 56px; font-weight: 600; letter-spacing: 0.04em">LOTTA TERRA</span>
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.18em; color: #8c8c88">
        PROSSIMO <span style="width: 14px; height: 14px; background: #e4292a"></span> <span style="color: #b8b8b2">LOTTA 30&Prime;</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; width: 100%; max-width: 640px; margin-top: 28px">
      <button type="button" style="min-width: 66px; height: 44px; padding: 0 12px; border: 2px solid #333333; background: #1c1c1c; color: #8c8c88; font-family: 'Saira Condensed', Arial, sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.06em; opacity: 0.35">+30&Prime;</button>
      <div style="display: flex; gap: 12px; flex: 1">
        <button type="button" aria-label="Intervallo precedente" style="width: 68px; height: 68px; flex-shrink: 0; border: 2px solid #333333; color: #b8b8b2; font-size: 22px">⏮</button>
        <button type="button" style="flex: 1; height: 68px; background: #f4c31b; color: #121212; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Saira Condensed', Arial, sans-serif; font-style: oblique 9deg; font-size: 22px; font-weight: 700; letter-spacing: 0.16em">▶ AVVIA</button>
        <button type="button" aria-label="Intervallo successivo" style="width: 68px; height: 68px; flex-shrink: 0; border: 2px solid #333333; color: #b8b8b2; font-size: 22px">⏭</button>
      </div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #1c1c1c; border: 2px solid #333333; padding: 8px 12px">
      <span style="width: 40px; height: 40px; flex-shrink: 0; background: #242424"></span>
      <span style="flex: 1; min-width: 0"><span style="display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Billy Idol - Eyes Without A Face</span><span style="display: block; font-size: 13px; color: #8c8c88">Anni 80</span></span>
      <span style="font-size: 18px; color: #b8b8b2; letter-spacing: 0.4em">⏮ ▶ ⏭</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
