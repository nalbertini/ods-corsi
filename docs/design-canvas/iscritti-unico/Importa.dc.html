<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .riga { display: grid; grid-template-columns: 1.3fr 1.6fr 140px 110px 30px; gap: 12px; align-items: center; padding: 14px; border-bottom: 1px solid #cfe6f4; font-size: 15px; background: #fff; }
    .riga b { font-weight: 600; }
    .dim { color: #46606f; font-size: 13px; }
    .imp { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tag { font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-weight: 800; letter-spacing: 0.08em; font-size: 14px; padding: 3px 8px; border: 2px solid #0d2a3d; justify-self: start; }
    .vai { text-align: right; font-size: 18px; color: #46606f; }
    .testa { display: grid; grid-template-columns: 1.3fr 1.6fr 140px 110px 30px; gap: 12px; padding: 10px 14px; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-weight: 800; letter-spacing: 0.1em; font-size: 14px; color: #46606f; border-bottom: 2px solid #0d2a3d; }
    .nota { font-size: 14px; color: #46606f; }
    .az { display: flex; gap: 10px; align-items: center; }
    .card { background: #fff; border: 2px solid #cfe6f4; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  </style>
</helmet>
<div style="position:relative;display:flex;width:1440px;min-height:1000px;background:#eef5fa">
  <div style="width:240px;flex-shrink:0"><dc-import name="Menu" tema="sito" iscrittiUnico="true" autorizzazioni="segreteria e amministrazione" attiva="ISCRITTI" numeri="" nome="Marco Rossi" ruolo="Segreteria" altezza="1500px" hint-size="240px,1500px"></dc-import></div>
  <main style="display:flex;flex-direction:column;gap:18px;flex:1;min-width:0;padding:28px 36px">
    <div style="display:flex;flex-direction:column;gap:4px"><h1 style="margin:0;font-family:'Big Shoulders Display','Arial Narrow',Arial,sans-serif;font-size:34px;font-weight:800;letter-spacing:.04em;line-height:1">ISCRITTI</h1><span style="font-size:14px;color:#46606f">Importa tessere dal RASD.</span></div>
    <div class="card">
      <dc-import name="Passi" attivo="2" tema="chiaro" hint-size="520px,50px"></dc-import>
      <dc-import name="FoglioLetto" foglio="tessere-rasd.csv" righe="260" saltate="4" tema="chiaro" hint-size="300px,150px"></dc-import>
      <dc-import name="CosaEntra" titolo="COSA ENTRA" conti="248|tessere nuove;12|già in app;4|righe non abbinate" nota="Non si scrive niente finché non premi METTI. Rifare lo stesso foglio non crea doppioni." tema="chiaro" hint-size="560px,240px"></dc-import>
      <div class="az"><dc-import name="Bottone" tema="sito" contesto="segreteria" variante="principale" label="METTI" hint-size="160px,48px"></dc-import><dc-import name="Bottone" tema="sito" contesto="segreteria" variante="linea" label="ANNULLA" hint-size="160px,48px"></dc-import></div>
    </div>
    <div class="nota">Lo stesso pannello di oggi, ma si apre dall'Elenco (tasto «Importa tessere») e si richiude tornando all'Elenco.</div>
  </main>
</div>
</x-dc>
