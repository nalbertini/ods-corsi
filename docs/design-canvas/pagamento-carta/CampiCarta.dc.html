GA 180,00 €" variante="principale" tema="sito" hint-size="100%,56px"></dc-import><span style="font-size: 14px; line-height: 1.4; color: #46606f">Non serve nessun conto. I numeri della carta li legge solo il circuito di pagamento: la palestra non li vede e non li salva.</span><span style="font-size: 14px; line-height: 1.4; color: #46606f">Se la tua banca chiede una conferma, dalla sua app o con un SMS, confermala e torna qui.</span><dc-import name="Bottone" label="ANNULLA" variante="linea" tema="sito" hint-size="100%,56px"></dc-import>
