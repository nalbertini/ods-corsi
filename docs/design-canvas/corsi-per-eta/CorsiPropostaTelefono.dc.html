cnica, disciplina e rispetto per crescere sul tatami, dai primi passi fino alle gare." tono="blu" foto="" alt="" hint-size="100%,104px"></dc-import><dc-import name="SitoRigaCorso" titolo="Lotta" eta="Dai 7 anni agli adulti" testo="Gioco, movimento e rispetto per crescere insieme, dalla prima prova alla gara." tono="blu" foto="" alt="" hint-size="100%,104px"></dc-import><dc-import name="SitoRigaCorso" titolo="Aikido" eta="Dai 7 anni agli adulti" testo="Armonia, equilibrio e difesa, in una disciplina adatta anche a chi ha più anni." tono="blu" foto="" alt="" hint-size="100%,104px"></dc-import><dc-import name="SitoRigaCorso" titolo="Sollevamento pesi" eta="Dagli 11 anni" testo="Un percorso per imparare e perfezionare il sollevamento pesi, dai ragazzi agli adulti." tono="blu" foto="" alt="" hint-size="100%,104px"></dc-import></div></section><section id="adulti" style="padding:32px 16px 0"><h3 style="font-family:'Big Shoulders Display','Arial Narrow',sans-serif;text-transform:uppercase;font-weight:800;margin:0 0 12px;font-size:40px;line-height:.95">Dai 14 anni <span style="font-family:Inter,Arial,sans-serif;text-transform:none;font-weight:600;font-size:16px">Giovani e adulti</span></h3><div style="display:grid;gap:6px"><dc-import name="SitoRigaCorso" titolo="Preparazione atletica" eta="Dai 14 anni" testo="Allenamenti mirati per migliorare forza, resistenza, velocità e coordinazione, anche per chi gareggia." tono="inchiostro" foto="https://qfejpnkryrvjubcxvuco.supabase.co/storage/v1/object/public/sito/1a03b6b2-3311-441f-b35d-bd7a8e2471cb.jpg" alt="L'istruttore sorride in sala attrezzata mentre i ragazzi si allenano" hint-size="100%,104px"></dc-import><dc-import name="SitoRigaCorso" titolo="Metodo globale di autodifesa" eta="Dai 15 anni" testo="Autodifesa pratica e realistica, basata su situazioni reali, spiegata passo dopo passo." tono="inchiostro" foto="" alt="" hint-size="100%,104px"></dc-import><dc-import name="SitoRigaCorso" titolo="Pre pugilistica" eta="Dai 18 anni"
