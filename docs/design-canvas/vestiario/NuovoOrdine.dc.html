<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
<!-- NUOVO ORDINE dal banco: chi ordina, la raccolta, le righe; SALVA L’ORDINE o SALVA, GIÀ SALDATO con la tendina del modo (in contanti, con bonifico, con Satispay); sotto, la domanda quando il telefono c’è già nella raccolta: APRI QUELLO o SALVA LO STESSO. Cornice copiata da Pagina.dc.html / PaginaTelefono.dc.html, solo <dc-import>; dati inventati. -->
<div style="display: flex; width: 1440px; min-height: 1600px; background: #121212; color: #f2f2f0">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" attiva="VESTIARIO" numeri="RICHIESTE ONLINE:3, VESTIARIO:6" nome="Marco Rossi" ruolo="Segreteria" altezza="1600px" hint-size="240px,1600px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <div style="display: flex"><dc-import name="Bottone" label="‹ GLI ORDINI" variante="linea" contesto="segreteria" hint-size="150px,48px"></dc-import></div>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
      <h1 style="margin: 0; flex-grow: 1; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-weight: 700; letter-spacing: 0.04em; font-size: 34px; line-height: 1">NUOVO ORDINE</h1>
      
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.4; color: #8c8c88">Dal banco, per chi non usa il link. Si può scrivere anche a raccolta chiusa.</p>
    <div style="display: flex; flex-direction: column; gap: 20px; max-width: 980px">
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; min-width: 0; background: #1c1c1c; border: 2px solid #333333">
        <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-weight: 700; letter-spacing: 0.04em; font-size: 20px">CHI ORDINA</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <dc-import name="Campo" tipo="testo" contesto="segreteria" etichetta="NOME" valore="Davide" hint-size="100%,72px"></dc-import>
          <dc-import name="Campo" tipo="testo" contesto="segreteria" etichetta="COGNOME" valore="Conti" hint-size="100%,72px"></dc-import>
          <dc-import name="Campo" tipo="testo" contesto="segreteria" etichetta="TELEFONO" valore="351 118 7740" hint-size="100%,72px"></dc-import>
          <dc-import name="Campo" tipo="testo" contesto="segreteria" etichetta="EMAIL · FACOLTATIVA" valore="" hint-size="100%,72px"></dc-import>
        </div>
        <span style="font-size: 14px; line-height: 1.4; color: #8c8c88">Va nella raccolta di adesso: chiude il 31 ottobre 2026 · aperta. Per un’altra, spostalo dopo dall’ordine.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; min-width: 0; background: #1c1c1c; border: 2px solid #333333">
        <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-weight: 700; letter-spacing: 0.04em; font-size: 20px">LE RIGHE</span>
      <div style="display: flex; flex-direction: column">
        <dc-import name="TestataTabella" colonne="PER CHI|CAPO|TAGLIA|QUANTI|PREZZO| " griglia="minmax(0, 1fr) minmax(0, 1.7fr) 84px 68px 64px 44px" verso="niente" ultima-a-destra="{{ false }}" hint-size="100%,30px"></dc-import>
        <dc-import name="RigaVestiario" contesto="segreteria" per-chi="Davide Conti" capo="Felpa ODS" taglia="L" quantita="1" prezzo="28 €" guaio="" togli="{{ true }}" griglia="minmax(0, 1fr) minmax(0, 1.7fr) 84px 68px 64px 44px" hint-size="100%,58px"></dc-import>
        <dc-import name="RigaVestiario" contesto="segreteria" per-chi="Davide Conti" capo="Cintura" taglia="240" quantita="1" prezzo="6 €" guaio="" togli="{{ true }}" griglia="minmax(0, 1fr) minmax(0, 1.7fr) 84px 68px 64px 44px" hint-size="100%,58px"></dc-import>
      </div>

        <dc-import name="Bottone" label="+ AGGIUNGI UNA RIGA" variante="tratteggiato" contesto="segreteria" hint-size="220px,48px"></dc-import>
      <div style="display: flex; align-items: baseline; gap: 12px; padding-top: 8px; border-top: 2px solid #333333">
        <span style="flex-grow: 1; font-size: 17px; font-weight: 700">Totale</span>
        <span style="font-size: 14px; color: #8c8c88; text-decoration: line-through"></span>
        <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 700">34 €</span>
      </div>
      </div>
      <div style="display: flex; gap: 10px; flex-wrap: wrap">
        <dc-import name="Bottone" label="SALVA L’ORDINE" variante="pieno" contesto="segreteria" hint-size="190px,48px"></dc-import>
        <div style="display: flex; gap: 6px">
          <dc-import name="Bottone" label="SALVA, GIÀ SALDATO" variante="vai" contesto="segreteria" hint-size="230px,48px"></dc-import>
          <div style="width: 150px"><dc-import name="Campo" tipo="select" contesto="segreteria" etichetta="" valore="in contanti" hint-size="100%,44px"></dc-import></div>
        </div>
        <dc-import name="Bottone" label="LASCIA STARE" variante="linea" contesto="segreteria" hint-size="170px,48px"></dc-import>
      </div>
      <dc-import name="Titoletto" label="SE IL TELEFONO C’È GIÀ NELLA RACCOLTA" hint-size="100%,50px"></dc-import>
      <div style="width: 640px">
        <dc-import name="Dialogo" tipo="conferma" domanda="C’è già un ordine di Marta Conti con questo telefono, arrivato il 9 ottobre, 16:10 · dal link. Salvarne un altro?" resto="" no="APRI QUELLO" si="SALVA LO STESSO" altezza="380px" hint-size="640px,380px"></dc-import>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
