<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
<!-- ORDINE ARRIVATO: le righe col totale del server, come pagare, la causale e CONDIVIDI IL RIEPILOGO. Da qui l’ordine non si riapre. Cornice copiata da Pagina.dc.html / PaginaTelefono.dc.html, solo <dc-import>; dati inventati. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1350px; background: #121212; color: #f2f2f0">
  <dc-import name="Testata" luogo="VESTIARIO" guida="{{ false }}" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column">
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 28px">
      <dc-import name="TitoloEsito" titolo="ORDINE ARRIVATO" tono="fatto" testi="Grazie, Paola. La segreteria ha il tuo ordine: 3 capi, 93 €.|Va al fornitore solo quello pagato entro il 31 ottobre. Se il pagamento non arriva, la segreteria ti chiama al 333 123 4567." hint-size="100%,230px"></dc-import>
      <dc-import name="StimaCosto" etichetta="IL TUO ORDINE" righe="Luca Rossi · Judogi bianco 130:35 €|Sara Rossi · Costumino da lotta 8:30 €|Sara Rossi · Felpa ODS 8:28 €" totale="93 €" frasi="" stima="Paga entro il 31 ottobre con un bonifico a ASD Il Centro Judo:" iban="IT03 D076 0101 0000 0007 6350 339" causale="Vestiario Rossi Paola" tasti="COPIA IBAN|COPIA CAUSALE|PAGA CON SATISPAY" hint-size="100%,460px"></dc-import>
      <span style="font-size: 14px; line-height: 1.4; color: #8c8c88">Oppure in contanti, in segreteria. Con Satispay scrivi la stessa causale nel messaggio.</span>
      <dc-import name="Bottone" label="CONDIVIDI IL RIEPILOGO" variante="principale" hint-size="100%,56px"></dc-import>
      <span style="font-size: 14px; line-height: 1.4; color: #8c8c88">Mandalo a te o all’altro genitore: ci sono i capi, il totale, l’IBAN e la causale. Questa pagina non si riapre.</span>
      <dc-import name="Bottone" label="FAI UN ALTRO ORDINE" variante="tratteggiato" alto="48px" corpo="16px" hint-size="100%,48px"></dc-import>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
