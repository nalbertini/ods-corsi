<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .et { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #46606f; }
    .big { font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-weight: 800; letter-spacing: 0.04em; line-height: 1; }
    .frase { font-size: 14px; color: #46606f; line-height: 1.45; }
  </style>
</helmet>
<!-- SALA, la tessera del nome (TabletTessera, 233px come in una griglia da cinque): oggi e con il segno COMPLEANNO, nei tre stati (da segnare, presente, IN ATTESA DI RETE). Il segno e' sotto il nome, dentro la tessera: non copre la spunta e non e' un secondo tasto, tutta la tessera resta l'area da toccare (84px). Mai eta', mai cognome intero. -->
<div style="display:flex;gap:40px;padding:28px 32px;width:1100px;min-height:520px;background:#eef5fa">
  <div style="display:flex;flex-direction:column;gap:6px;width:200px"><h1 class="big" style="margin:0;font-size:34px">COMPLEANNO</h1><span class="frase">Sul tablet di sala, per chi compie gli anni oggi.</span></div>
  <div style="display:flex;flex-direction:column;gap:12px;width:233px"><span class="et">OGGI</span>
  <dc-import name="TabletTessera" tema="sito" nome="Giulia F." hint-size="100%,84px"></dc-import>
  <dc-import name="TabletTessera" tema="sito" nome="Giulia F." stato="fatto" hint-size="100%,84px"></dc-import>
  <dc-import name="TabletTessera" tema="sito" nome="Giulia F." stato="attesa" hint-size="100%,84px"></dc-import>
  <span class="frase">Com'è ora.</span></div>
  <div style="display:flex;flex-direction:column;gap:12px;width:233px"><span class="et">PROPOSTA</span>
  <dc-import name="TabletTessera" tema="sito" nome="Giulia F." compleanno="{{ true }}" hint-size="100%,84px"></dc-import>
  <dc-import name="TabletTessera" tema="sito" nome="Giulia F." stato="fatto" compleanno="{{ true }}" hint-size="100%,84px"></dc-import>
  <dc-import name="TabletTessera" tema="sito" nome="Giulia F." stato="attesa" compleanno="{{ true }}" hint-size="100%,84px"></dc-import>
  <span class="frase">Torta + parola, giallo con testo scuro: si capisce anche in bianco e nero. Con IN ATTESA le righe sono tre e la tessera resta da 84px.</span></div>
</div></x-dc>
<script data-dc-script data-props='{"$preview":{"width":1100,"height":520}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
