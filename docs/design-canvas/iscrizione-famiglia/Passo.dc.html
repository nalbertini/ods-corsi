<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA. La famiglia sta sempre sotto l avanzamento, in ogni passo: una pastiglia per persona (quella di adesso accesa, le altre col numero delle cose che mancano) e AGGIUNGI UN FAMILIARE. Il totale sopra la barra e quello di tutta la famiglia, con lo sconto. Le parole sono quelle della palestra: la famiglia, il conto. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1180px; background: #121212; color: #f2f2f0">
<dc-import name="Testata" luogo="ISCRIZIONI" guida="{{ false }}" hint-size="100%,72px"></dc-import>
<dc-import name="RigaChiama" hint-size="100%,62px"></dc-import>
<main style="display: flex; flex-direction: column; flex-grow: 1"><dc-import name="Avanzamento" numero="3" totale="6" titolo="SCEGLI IL CORSO" hint-size="100%,120px"></dc-import><dc-import name="Titoletto" label="LA FAMIGLIA" conto="3" hint-size="100%,50px"></dc-import><div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px"><div style="display: flex; flex-wrap: wrap; gap: 8px"><dc-import name="Chip" label="LUCA" acceso="{{ true }}" hint-size="130px,44px"></dc-import><dc-import name="Chip" label="MATTEO" numero="4" tonoNumero="giallo" hint-size="130px,44px"></dc-import><dc-import name="Chip" label="PAOLA" numero="5" tonoNumero="giallo" hint-size="130px,44px"></dc-import></div><dc-import name="Bottone" label="+ AGGIUNGI UN FAMILIARE" variante="tratteggiato" alto="48px" corpo="16px" hint-size="100%,48px"></dc-import><span style="font-size: 14px; line-height: 1.4; color: #c9c9c4">Indirizzo e contatti li scrivi una volta sola. Ognuno sceglie i suoi corsi, anche a orari diversi.</span></div><div style="height: 12px"></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 0 20px"><span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #8c8c88">PER LA SUA ETÀ · LUCA</span><dc-import name="Campo" tipo="scelta" etichetta="" valore="Judo kids" riga="nati 2018-2017-2016 · martedì e giovedì 17.30-18.30" scelto="{{ true }}" hint-size="100%,72px"></dc-import><dc-import name="Campo" tipo="scelta" etichetta="" valore="Judo 3" riga="nati 2016-2015-2014-2013 · lunedì, mercoledì e venerdì 18.00-19.00" hint-size="100%,72px"></dc-import></div><dc-import name="Titoletto" label="QUANDO PAGA LUCA" hint-size="100%,50px"></dc-import><div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px"><div style="display: flex; gap: 8px"><div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="Annuale" hint-size="50%,52px"></dc-import></div><div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="Trimestre" scelto="{{ true }}" hint-size="50%,52px"></dc-import></div></div></div></main>
<dc-import name="BarraPasso" manca="IL CORSO DI MATTEO|IL CORSO DI PAOLA" avanti="AVANTI" totale="855 €" totaleRighe="Luca 155 € + Matteo 410 € + Paola 350 € − sconto famiglia 60 €" compatta="{{ true }}" hint-size="100%,190px"></dc-import>
</div>
</x-dc>
</body>
</html>
