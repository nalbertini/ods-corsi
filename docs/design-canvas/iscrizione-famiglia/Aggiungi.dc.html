<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA. Il foglio che si apre da AGGIUNGI UN FAMILIARE, sopra il passo di adesso (sotto un velo). Due scelte: adulto o bambino. Per un bambino dice chi firma, tra gli adulti gia nella famiglia. Dati di residenza e contatti gia compilati dalla persona di prima. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 900px; background: #121212; color: #f2f2f0">
<dc-import name="Testata" luogo="ISCRIZIONI" guida="{{ false }}" hint-size="100%,72px"></dc-import>
<dc-import name="RigaChiama" hint-size="100%,62px"></dc-import>
<main style="display: flex; flex-direction: column; flex-grow: 1"><div style="opacity: 0.35"><dc-import name="Avanzamento" numero="3" totale="6" titolo="SCEGLI IL CORSO" hint-size="100%,120px"></dc-import><dc-import name="Titoletto" label="LA FAMIGLIA" conto="3" hint-size="100%,50px"></dc-import><div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px"><div style="display: flex; flex-wrap: wrap; gap: 8px"><dc-import name="Chip" label="LUCA" acceso="{{ true }}" hint-size="130px,44px"></dc-import><dc-import name="Chip" label="MATTEO" numero="4" tonoNumero="giallo" hint-size="130px,44px"></dc-import><dc-import name="Chip" label="PAOLA" numero="5" tonoNumero="giallo" hint-size="130px,44px"></dc-import></div></div></div><div style="flex-grow: 1; min-height: 120px"></div></main>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 22px; background: #1c1c1c; border-top: 2px solid #333333">
<span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 0.04em; font-style: oblique 9deg; color: #f2f2f0">CHI AGGIUNGI?</span>
<div style="display: flex; gap: 8px"><div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="UN ADULTO" hint-size="50%,52px"></dc-import></div><div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="UN BAMBINO" scelto="{{ true }}" hint-size="50%,52px"></dc-import></div></div>
<span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #8c8c88">CHI FIRMA PER LUI?</span>
<div style="display: flex; gap: 8px"><div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="PAOLA" scelto="{{ true }}" hint-size="50%,52px"></dc-import></div><div style="flex: 1; min-width: 0"><dc-import name="Campo" tipo="scelta" una="{{ true }}" etichetta="" valore="MATTEO" hint-size="50%,52px"></dc-import></div></div>
<span style="font-size: 14px; line-height: 1.4; color: #c9c9c4">Indirizzo, telefono ed email restano quelli di Luca: li cambi dopo, se serve. Quello che hai scritto finora non si perde.</span>
<dc-import name="Bottone" label="AGGIUNGI" variante="principale" hint-size="100%,56px"></dc-import>
<dc-import name="Bottone" label="ANNULLA" variante="linea" hint-size="100%,52px"></dc-import>
</div>
</div>
</x-dc>
</body>
</html>
