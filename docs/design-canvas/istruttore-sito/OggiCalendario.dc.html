<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il calendario dell'istruttore sul telefono (390px): testata, striscia dell'allenamento in corso (LAVORO) sotto la testata, ChiSei, la lezione di adesso, la settimana a elenco e la barra delle pagine in basso. Nell'app la barra sta ferma in fondo allo schermo; qui e' in flusso dopo l'ultima lezione. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 844px; background: #121212; color: #f2f2f0">
  <dc-import name="Testata" luogo="ISTRUTTORI" hint-size="100%,72px"></dc-import>
  <dc-import name="TimerStriscia" stato="lavoro" nome="Tabata brucia grassi" tempo="00:14" hint-size="100%,56px"></dc-import>
  <main style="display: flex; flex-direction: column; flex: 1">
    <dc-import name="ChiSei" chi="MARCO ROSSI · ISTRUTTORE" hint-size="100%,54px"></dc-import>
    <dc-import name="Titoletto" label="ADESSO" giallo="{{ true }}" hint-size="100%,50px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px">
      <dc-import name="RigaCalendario" ora="18:30" corso="Judo kids" sala="Sala 1" istruttore="Marco R." kanji="柔" tinta="#1b8ac4" iscritti="12" stato="in-corso" presenti="7" prove="1" quando="ADESSO" hint-size="100%,110px"></dc-import>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 14px 20px 0">
      <dc-import name="Bottone" label="‹" variante="linea" alto="44px" larghezza="44px" corpo="22px" spazio="0" hint-size="44px,44px"></dc-import>
      <span style="flex-grow: 1; text-align: center; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 17px; font-weight: 700; letter-spacing: 0.06em">6 OTT – 12 OTT</span>
      <dc-import name="Bottone" label="›" variante="linea" alto="44px" larghezza="44px" corpo="22px" spazio="0" hint-size="44px,44px"></dc-import>
    </div>
    <dc-import name="Titoletto" label="OGGI · MARTEDÌ 6 OTTOBRE" conto="2" giallo="{{ true }}" hint-size="100%,50px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px">
      <dc-import name="RigaCalendario" ora="16:30" corso="Judo ragazzi" sala="Sala 1" istruttore="Marco R." kanji="柔" tinta="#1b8ac4" iscritti="8" stato="da-chiudere" presenti="3" hint-size="100%,88px"></dc-import>
      <dc-import name="RigaCalendario" ora="20:00" corso="Judo adulti" sala="Sala 1" istruttore="Marco R." kanji="柔" tinta="#1b8ac4" iscritti="9" stato="iscritti" hint-size="100%,76px"></dc-import>
    </div>
    <dc-import name="Titoletto" label="GIOVEDÌ 8 OTTOBRE" conto="1" hint-size="100%,50px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px">
      <dc-import name="RigaCalendario" ora="17:30" corso="Judo kids" sala="Sala 1" istruttore="Marco R." kanji="柔" tinta="#1b8ac4" iscritti="12" stato="iscritti" hint-size="100%,76px"></dc-import>
    </div>
    <dc-import name="Titoletto" label="SABATO 10 OTTOBRE" conto="1" hint-size="100%,50px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 20px; padding-bottom: 28px">
      <dc-import name="RigaCalendario" ora="10:00" corso="Judo kids" sala="Sala 1" istruttore="Marco R." kanji="柔" tinta="#1b8ac4" iscritti="12" stato="iscritti" prove="2" hint-size="100%,100px"></dc-import>
    </div>
  </main>
  <div style="margin-top: auto">
    <dc-import name="BarraNavigazione" voci="CALENDARIO|TIMER|I MIEI|ORE" attiva="CALENDARIO" hint-size="100%,66px"></dc-import>
  </div>
</div>
</x-dc>
</body>
</html>
