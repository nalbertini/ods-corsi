<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>D · Tablet, presenze solo in memoria</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- D. Il tablet non riesce a tenere la coda (memoria piena o finestra privata): ricaricando si perderebbe. Il tasto verde prova a mandarle, RICARICA LO STESSO resta a linea, discreto. -->
<div style="position: relative; display: flex; flex-direction: column; width: 1280px; height: 800px; overflow: hidden; background: #eef5fa; color: #0d2a3d">
  <dc-import name="TabletTestata" sala="SALA LOTTA" data="MERCOLEDÌ 18 NOVEMBRE · OFFICINE DELLO SPORT" ora="17:10" hint-size="100%,92px"></dc-import>
  <main style="display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 64px 40px">
    <dc-import name="TabletAvviso" tipo="guaio" titolo="3 PRESENZE NON SONO ANCORA ARRIVATE" testo="Questo tablet non riesce a tenerle da parte: ricaricando adesso si perdono. Prima prova a mandarle." hint-size="800px,150px"></dc-import>
    <div style="display: flex; gap: 20px; width: 800px">
      <dc-import name="TabletTasto" label="PROVA A MANDARLE" variante="verde" grande="{{ true }}"  hint-size="390px,70px"></dc-import>
      <dc-import name="TabletTasto" label="RICARICA LO STESSO" variante="linea" grande="{{ true }}"  hint-size="390px,70px"></dc-import>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
