<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>B · Telefono, presenze al sicuro</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- B. Telefono con 2 presenze ancora da mandare, tenute sul telefono: la riga in più dice che restano e partono da sole. RICARICA prima prova a mandarle per qualche secondo (tasto STO MANDANDO), poi ricarica comunque: la coda resta su disco. -->
<div style="position: relative; display: flex; flex-direction: column; width: 390px; height: 760px; overflow: hidden; background: #eef5fa; color: #0d2a3d">
  <dc-import name="Testata" luogo="ISTRUTTORI" guida="{{ false }}" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; gap: 16px; padding: 28px 20px">
    <dc-import name="Riquadro" tono="guaio" contesto="app" etichetta="LA PAGINA SI È BLOCCATA" testo="Con RICARICA riparte da capo. Le 2 presenze non ancora arrivate restano su questo telefono e partono da sole appena c’è rete." hint-size="100%,180px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <dc-import name="Bottone" label="RICARICA" variante="principale" contesto="app"  hint-size="100%,56px"></dc-import>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
