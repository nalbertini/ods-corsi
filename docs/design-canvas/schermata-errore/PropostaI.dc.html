<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>I · Timer nel tablet</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- I. Si blocca il timer, non l appello: il confine attorno al timer tiene in piedi l appello e offre di tornarci. Il timer da solo (ODS Timer) ha la stessa schermata con il solo RICARICA. Se farlo e una DOMANDA. -->
<div style="position: relative; display: flex; flex-direction: column; width: 1280px; height: 800px; overflow: hidden; background: #eef5fa; color: #0d2a3d">
  <dc-import name="TabletTestata" sala="SALA LOTTA" data="MERCOLEDÌ 18 NOVEMBRE · OFFICINE DELLO SPORT" ora="17:10" hint-size="100%,92px"></dc-import>
  <main style="display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 64px 40px">
    <dc-import name="TabletAvviso" tipo="guaio" titolo="IL TIMER SI È BLOCCATO" testo="L’appello e le presenze non sono toccati. Torna all’appello, o ricarica il timer." hint-size="800px,150px"></dc-import>
    <div style="display: flex; gap: 20px; width: 800px">
      <dc-import name="TabletTasto" label="TORNA ALL’APPELLO" variante="verde" grande="{{ true }}"  hint-size="390px,70px"></dc-import>
      <dc-import name="TabletTasto" label="RICARICA IL TIMER" variante="linea" grande="{{ true }}"  hint-size="390px,70px"></dc-import>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
