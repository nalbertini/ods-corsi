<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .et { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #46606f; }
    .frase { font-size: 14px; color: #46606f; line-height: 1.45; }
  </style>
</helmet>
<!-- PROPOSTA: la sessione e' scaduta con 3 modifiche in coda. Restano in coda (non si buttano) e la porta lo dice sopra il modulo. -->
<div style="display:flex;flex-direction:column;width:390px;min-height:600px;background:#eef5fa">
  <div style="padding:20px 16px 8px"><span class="et">ACCESSO</span></div>
  <div style="padding:0 16px;display:flex;flex-direction:column;gap:12px">
    <dc-import name="SpiaCoda" titolo="3 MODIFICHE DA INVIARE" testo="Sono salvate su questo dispositivo: entra di nuovo e partono da sole." tono="attesa" hint-size="100%,100px"></dc-import>
    <span class="frase" style="font-size:15px">Entra con l’account che ti ha dato la palestra, e l’app ti porta da sola nella tua area.</span>
    <dc-import name="Campo" etichetta="EMAIL, O NOME UTENTE DELLA SALA" hint-size="100%,76px"></dc-import>
    <dc-import name="Campo" etichetta="PASSWORD" hint-size="100%,76px"></dc-import>
    <dc-import name="Bottone" label="ENTRA" variante="vai" hint-size="100%,56px"></dc-import>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":600}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
