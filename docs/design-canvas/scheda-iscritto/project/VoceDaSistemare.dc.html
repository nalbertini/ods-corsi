<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Voce da sistemare</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA «Scheda iscritto»: una riga di DA SISTEMARE. Prende il posto di una riga di COSA MANCA (.sg-scheda-manca) e di un timbro
     (.sg-timbro) insieme: cosa e perché a sinistra, la parola dello stato colorata, l'importo a destra in cifre tabulari, il tasto che
     risolve. La barra dello stato è dentro a sinistra (inset 4px), come nel restyle. Con «telefono» la riga va su due piani e il tasto
     diventa a tutta larghezza sotto. Tasto alto 44px (Regola del Dito di Fretta). -->
<div style="display: flex; flex-wrap: {{giro}}; align-items: center; column-gap: 16px; row-gap: 10px; min-height: 72px; padding: 12px 16px 12px 20px; background: #ffffff; box-shadow: inset 4px 0 0 {{barra}}; border-top: {{filoBordo}}">
  <span style="display: flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 36px; height: 36px; border-radius: 6px; background: {{tinta}}; color: {{colore}}">
    <dc-import name="Icona" nome="{{icona}}" misura="20" colore="{{colore}}" hint-size="20px,20px"></dc-import>
  </span>
  <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 200px; min-width: 0">
    <span style="font-size: 15px; font-weight: 600; color: #0d2a3d">{{cosa}}</span>
    <span style="font-size: 14px; color: #46606f">{{perche}}</span>
  </span>
  <span style="flex: 0 0 auto; font-size: 14px; font-weight: 600; color: {{colore}}">{{parola}}</span>
  <span style="flex: 0 0 96px; text-align: right; font-size: 15px; font-weight: 600; color: #0d2a3d; font-variant-numeric: tabular-nums">{{importo}}</span>
  <sc-if value="{{conTasto}}" hint-placeholder-val="{{ true }}">
    <button type="button" style="flex: {{tastoFlex}}; min-height: 44px; padding: 0 14px; border: 1px solid #14709f; border-radius: 6px; background: #ffffff; color: #0d2a3d; font: 600 14px Inter, sans-serif; white-space: nowrap">{{tasto}}</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"icona":{"editor":"text","default":"certificato"},"cosa":{"editor":"text","default":"Certificato medico"},"perche":{"editor":"text","default":"Senza, non può salire sul tatami"},"parola":{"editor":"text","default":"Scaduto il 09/09/2026"},"tono":{"editor":"enum","options":["rosso","giallo","verde"],"default":"rosso"},"importo":{"editor":"text","default":""},"tasto":{"editor":"text","default":"Carica il certificato"},"filo":{"editor":"boolean","default":false},"telefono":{"editor":"boolean","default":false},"$preview":{"width":1060,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const toni = {
      rosso: { barra: '#e4292a', colore: '#b81d1d', tinta: '#fbe9e9' },
      giallo: { barra: '#f4c31b', colore: '#8f6a00', tinta: '#fcf6e6' },
      verde: { barra: '#12913f', colore: '#0b7a33', tinta: '#e3f2e8' },
    };
    const t = toni[this.props.tono ?? 'rosso'] || toni.rosso;
    const telefono = this.props.telefono ?? false;
    const filo = this.props.filo === true || this.props.filo === 'si';
    const tasto = this.props.tasto ?? 'Carica il certificato';
    return {
      ...t,
      icona: this.props.icona ?? 'certificato',
      cosa: this.props.cosa ?? 'Certificato medico',
      perche: this.props.perche ?? 'Senza, non può salire sul tatami',
      parola: this.props.parola ?? 'Scaduto il 09/09/2026',
      importo: this.props.importo ?? '',
      tasto,
      conTasto: tasto !== '',
      giro: telefono ? 'wrap' : 'nowrap',
      tastoFlex: telefono ? '1 1 100%' : '0 0 190px',
      filoBordo: filo ? '1px solid #cfe6f4' : '0',
    };
  }
}
</script>
</body>
</html>
