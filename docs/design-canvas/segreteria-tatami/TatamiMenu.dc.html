<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: transparent; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<nav style="display: flex; flex-direction: column; gap: 26px; width: 260px; height: {{altezza}}; overflow: hidden; padding: 28px 14px 24px; background: {{c.menu}}; color: {{c.menuTesto}}">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
    <svg width="60" height="41" viewBox="0 0 160 110" role="img" aria-label="Officine Dello Sport">
      <g fill="none" stroke-width="9" stroke-dasharray="6 7.82">
        <circle cx="38" cy="40" r="22" stroke="#1b8ac4"></circle>
        <circle cx="80" cy="40" r="22" stroke="{{c.menuTesto}}"></circle>
        <circle cx="122" cy="40" r="22" stroke="#e4292a"></circle>
        <circle cx="59" cy="74" r="22" stroke="#f4c31b"></circle>
        <circle cx="101" cy="74" r="22" stroke="#16a54a"></circle>
      </g>
      <g fill="none" stroke-width="5">
        <circle cx="38" cy="40" r="14" stroke="#1b8ac4"></circle>
        <circle cx="80" cy="40" r="14" stroke="{{c.menuTesto}}"></circle>
        <circle cx="122" cy="40" r="14" stroke="#e4292a"></circle>
        <circle cx="59" cy="74" r="14" stroke="#f4c31b"></circle>
        <circle cx="101" cy="74" r="14" stroke="#16a54a"></circle>
      </g>
    </svg>
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; font-size: 26px; font-weight: 700; letter-spacing: 0.04em; line-height: 1">ODS CORSI</span>
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.22em; color: {{c.menuSec}}">SEGRETERIA</span>
    </span>
  </div>
  <div style="display: flex; align-items: center; gap: 12px; height: 68px; padding: 0 16px; background: {{c.sup}}; border: 2px solid {{c.orlo}}; font-size: 21px; font-weight: 500; color: {{c.dim}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.5" stroke-linecap="square" role="img" aria-label="Cerca"><circle cx="10" cy="10" r="6"></circle><path d="M15 15l6 6"></path></svg>Cerca iscritto</div>
  <div style="display: flex; flex-direction: column">
    <sc-for list="{{voci}}" as="v" hint-placeholder-count="12">
      <div style="display: flex; align-items: center; min-height: {{v.altezza}}; margin-top: {{v.sopra}}; margin-bottom: {{v.sotto}}; padding: {{v.padding}}; border-left: 6px solid {{v.barra}}; background: {{v.sfondo}}; color: {{v.colore}}; font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-size: {{v.corpo}}; font-weight: 700; letter-spacing: {{v.spazio}}">
        <span style="flex: 1; min-width: 0">{{v.testo}}</span>
        <sc-if value="{{v.haNumero}}" hint-placeholder-val="{{ false }}">
          <span style="margin-left: 8px; padding: 0 4px; background: #f4c31b; color: {{c.su}}; font-size: 14px; font-weight: 700; letter-spacing: 0.12em">{{v.numero}}</span>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 2px solid {{c.menuSec}}">
    <span style="font-size: 16px; font-weight: 600">{{nome}}</span>
    <span style="font-size: 14px; color: {{c.menuSec}}">{{ruolo}} · accesso completo</span>
  </div>
</nav>
</x-dc>
<script data-dc-script data-props='{"tema":{"editor":"enum","options":["tatami","scuro","chiaro"],"default":"tatami","section":"Tema"},"attiva":{"editor":"text","default":"SETTIMANA"},"numeri":{"editor":"text","default":"RICHIESTE ONLINE:3, PRESENZE:2"},"nome":{"editor":"text","default":"Marco Rossi"},"ruolo":{"editor":"text","default":"Segreteria"},"altezza":{"editor":"text","default":"960px"},"$preview":{"width":260,"height":960}}'>
// PROPOSTA «Tatami»: il menu di segreteria con le stesse voci e gli stessi gruppi di Menu.dc.html (GRUPPI di
// Segreteria.tsx righe 50-86), su fondo `muschio`: e' la barra colorata del guscio. La voce corrente e' un tatami
// (fondo `paglia-chiara`, barra di 6px `orlo`), MAI rossa: il rosso e' per cio' che manca.
// numeri: "VOCE:n" separati da virgola, bollino giallo come nell'app.
const T = {
  tatami: { fondo: '#ebe6d0', sup: '#f6f3e4', supAlta: '#d9d2b0', cuci: '#bdb68f', orlo: '#1d1d1b', ink: '#1d1d1b', dim: '#5d5c4f', su: '#1d1d1b', verdeT: '#0b7a33', rossoT: '#b81d1d', gialloT: '#8f6a00', menu: '#2f3d2b', menuTesto: '#f6f3e4', menuSec: '#cfd6c0' },
  scuro: { fondo: '#121212', sup: '#1c1c1c', supAlta: '#242424', cuci: '#333333', orlo: '#4a4a46', ink: '#f2f2f0', dim: '#8c8c88', su: '#121212', verdeT: '#16a54a', rossoT: '#ff5a52', gialloT: '#f4c31b', menu: '#161616', menuTesto: '#f2f2f0', menuSec: '#c9c9c4' },
  chiaro: { fondo: '#f4f4f1', sup: '#ffffff', supAlta: '#e9e9e5', cuci: '#d4d4ce', orlo: '#8a8a85', ink: '#161616', dim: '#656561', su: '#121212', verdeT: '#0b7a33', rossoT: '#b81d1d', gialloT: '#8f6a00', menu: '#ebebe7', menuTesto: '#161616', menuSec: '#3d3d3a' },
};
const GRUPPI = [
  ['OGNI GIORNO', ['DA FARE', 'SETTIMANA', 'RICHIESTE ONLINE', 'PRESENZE']],
  ['PERSONE', ['ISCRITTI', 'CORSI']],
  ['ISTRUTTORI', ['PRESENZE ISTRUTTORI', 'ISTRUTTORI E ACCESSI']],
  ['LA PALESTRA', ['STATISTICHE', 'LISTINO', 'VESTIARIO', 'ESERCIZI', 'SEGNALAZIONI']],
];
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const c = T[p.tema] || T.tatami;
    const numeri = {};
    for (const s of String(p.numeri ?? '').split(',')) {
      const i = s.lastIndexOf(':');
      if (i > 0) numeri[s.slice(0, i).trim()] = s.slice(i + 1).trim();
    }
    const voci = [];
    GRUPPI.forEach(([titolo, elenco], g) => {
      voci.push({ testo: titolo, haNumero: false, numero: '', altezza: '0', padding: '0 12px 0 18px', barra: 'transparent', sfondo: 'transparent', colore: c.menuSec, corpo: '14px', spazio: '0.22em', sopra: g === 0 ? '0' : '20px', sotto: '4px' });
      elenco.forEach((testo, i) => {
        const corrente = testo === p.attiva;
        voci.push({ testo, haNumero: !!numeri[testo], numero: numeri[testo] ?? '', altezza: '52px', padding: '0 10px 0 14px', barra: corrente ? c.ink : 'transparent', sfondo: corrente ? c.sup : 'transparent', colore: corrente ? c.ink : c.menuTesto, corpo: '19px', spazio: '0.1em', sopra: i === 0 ? '0' : '2px', sotto: '0' });
      });
    });
    return { c, voci, nome: p.nome ?? 'Marco Rossi', ruolo: p.ruolo ?? 'Segreteria', altezza: p.altezza ?? '960px' };
  }
}
</script>
</body>
</html>
