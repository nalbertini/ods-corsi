<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA, telefono 390px · pagina non collegata («Nessuno»): come oggi. -->
<div style="display:flex;flex-direction:column;width:390px;min-height:844px;background:#eef5fa;color:#0d2a3d">
  <dc-import name="BarraTelefono" tema="sito" luogo="SEGRETERIA" da-fare="5" hint-size="100%,62px"></dc-import>
  <main style="display:flex;flex-direction:column;gap:14px;padding:18px 16px 28px">
    <div style="display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-family:'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif;font-size:30px;font-weight:800;letter-spacing:0.04em;line-height:1;text-transform:uppercase">Judo</h1><div><span style="display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:6px;border:1.5px solid #0b7a33;background:#ffffff;color:#0b7a33;font-size:13px;font-weight:600;white-space:nowrap">Pubblicata</span></div></div>
    
    <div style="display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:6px;background:#ffffff"><span style="font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#46606f">Collegata al corso</span><dc-import name="Campo" tema="sito" contesto="segreteria" tipo="select" etichetta="" valore="Nessuno" hint-size="100%,44px"></dc-import><span style="font-size:14px;line-height:1.4;color:#46606f">Nessuno: l’orario resta quello scritto a mano, come oggi.</span></div>
    <dc-import name="Campo" tema="sito" contesto="segreteria" tipo="area" etichetta="Orario (scritto a mano)" valore="Lunedì e mercoledì · 17:00–18:00 / Sabato · 10:00–11:00" acceso="{{ true }}" hint-size="100%,104px"></dc-import>
    <dc-import name="Bottone" tema="sito" contesto="segreteria" label="Pubblica" variante="principale" hint-size="100%,48px"></dc-import>
  </main>
</div>
</x-dc>
</body>
</html>
