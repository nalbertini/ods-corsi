<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font del modulo saranno file locali OFL (public/risorse, come Big Shoulders Display e Inter del sito pubblico, src/lib/sitoGenera.ts); un canvas e' un Artifact e li prende da Google Fonts: stessi file, stessa licenza. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- I corsi e COME PAGHI nell'aspetto del sito. La scelta scelta ha bordo inchiostro #0d2a3d, fondo #cfe6f4 e il segno ✓ (corsi, piu' risposte) o ● (come paghi): si riconosce anche in bianco e nero. Con `una` (annuale / trimestre, affiancati) il segmento scelto e' pieno: fondo inchiostro e testo bianco (14,83:1). Le scelte non scelte hanno il bordo blu #14709f su fondo bianco. L'orario sotto il nome e' Inter 14px #46606f (5,15:1 anche sul fondo #cfe6f4 della scelta). Raggio 6px. Fuoco da tastiera non riprodotto (contorno 3px blu).

Board di partenza (stessi campi, testi e ordine): iscrizione/ModuloCorsi.dc.html. -->
<!-- Il modulo di iscrizione, tratto I CORSI e COME PAGHI (SceltaCorsi di ds.tsx; corsiPerEta di listino.ts). Giulia, nata nel 2017: in cima PER LA SUA ETA' i corsi giusti, ognuno con eta' e orari del listino sotto il nome (scelto: bordo e fondo chiari, ✓); poi SENZA FASCIA D'ETA' (il listino non dice gli anni; qui «prezzo da confermare» dove manca il prezzo) e ALTRI CORSI, che si scelgono lo stesso: l'avviso giallo dice quali sono fuori eta' e che la segreteria richiama. COME PAGHI: annuale o trimestre, due tasti affiancati, il pallino sul scelto. Sul telefono i corsi sono in una colonna sola. Non riprodotti: «Un attimo…» mentre leggono e l'errore «I corsi non si leggono: …». -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1000px; background: #eef5fa; color: #0d2a3d">
<main style="display: flex; flex-direction: column">
<dc-import name="Titoletto" tema="sito" label="I CORSI" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<div style="display: flex; flex-direction: column; gap: 6px">
  <span style="font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.08em; color: #46606f">PER LA SUA ETÀ</span>
  <dc-import name="Campo" tema="sito" tipo="scelta" etichetta="" valore="Judo 2" riga="nati 2019-2018-2017 · lunedì, mercoledì e venerdì 17.00-18.00" scelto="{{ true }}" hint-size="100%,72px"></dc-import>
  <dc-import name="Campo" tema="sito" tipo="scelta" etichetta="" valore="Aikido 2" riga="nati 2019-2018-2017-2016 · lunedì e giovedì 17.00-18.00" hint-size="100%,72px"></dc-import>
  <dc-import name="Campo" tema="sito" tipo="scelta" etichetta="" valore="Lotta 2" riga="nati 2019-2018-2017 · lunedì, mercoledì e venerdì 17.00-18.00" hint-size="100%,72px"></dc-import>
  <div style="margin-top: 10px"><span style="font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.08em; color: #46606f">SENZA FASCIA D’ETÀ</span></div>
  <dc-import name="Campo" tema="sito" tipo="scelta" etichetta="" valore="Judo agonisti" riga="solo judoka agonisti (2015-2014 e prima) · martedì e giovedì 18.00-19.30" hint-size="100%,72px"></dc-import>
  <dc-import name="Campo" tema="sito" tipo="scelta" etichetta="" valore="Corso di prova autunno" riga="prezzo da confermare" hint-size="100%,72px"></dc-import>
  <div style="margin-top: 10px"><span style="font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.08em; color: #46606f">ALTRI CORSI</span></div>
  <dc-import name="Campo" tema="sito" tipo="scelta" etichetta="" valore="Judo adulti" riga="nati nel 2012 o prima · lunedì, mercoledì e venerdì 19.00-20.30" hint-size="100%,72px"></dc-import>
  <dc-import name="Campo" tema="sito" tipo="scelta" etichetta="" valore="Lotta 3" riga="nati 2016-2015-2014 e prima · lunedì e mercoledì 18.00-19.30" scelto="{{ true }}" hint-size="100%,72px"></dc-import>
  <span style="font-size: 15px; line-height: 1.4; color: #8f6a00">! Lotta 3 non è della sua età: la segreteria ti richiama.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
  <span style="font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.08em; color: #46606f">COME PAGHI</span>
  <div style="display: flex; gap: 8px">
  <div style="flex: 1; min-width: 0"><dc-import name="Campo" tema="sito" tipo="scelta" una="{{ true }}" etichetta="" valore="Annuale" hint-size="50%,52px"></dc-import></div>
  <div style="flex: 1; min-width: 0"><dc-import name="Campo" tema="sito" tipo="scelta" una="{{ true }}" etichetta="" valore="Trimestre" scelto="{{ true }}" hint-size="50%,52px"></dc-import></div>
</div>
</div>
</div>
</main>
</div>
</x-dc>
</body>
</html>
