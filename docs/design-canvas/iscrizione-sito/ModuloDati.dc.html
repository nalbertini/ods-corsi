<helmet>
  <!-- Nell'app i font del modulo saranno file locali OFL (public/risorse, come Big Shoulders Display e Inter del sito pubblico, src/lib/sitoGenera.ts); un canvas e' un Artifact e li prende da Google Fonts: stessi file, stessa licenza. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il modulo di iscrizione VERO nell'aspetto del sito pubblico «tatami blu e giallo» (A2): sempre chiaro, qualunque sia il tema dell'app, anche aperto dall'area iscritti. Valori di sito-rebrand/token-proposta.md e src/lib/sitoGenera.ts (:root, .pulsante, h1-h3, raggio 6px); gli unici valori nuovi (#46606f) e i rapporti di contrasto sono in iscrizione-sito/token-proposta.md. Qui la cima del modulo, per una minorenne: titoli di sezione in Big Shoulders 800 (26px), etichette dei campi Big Shoulders 15px, testo e campi in Inter; campi 52px con bordo blu #14709f (4,96:1 sul fondo) e raggio 6px; bersagli almeno 44px. SCELTE MIE DA CONFERMARE: (1) la testata e' quella del modulo ma chiara, col nome in Big Shoulders e il tasto del tema che nel modulo non cambia nulla; (2) il «!» davanti all'avviso giallo e alle note di errore, cosi' lo stato non e' solo colore. Il fuoco da tastiera non e' riprodotto: contorno 3px blu #14709f con scarto 3px (come a:focus-visible del sito).

Board di partenza (stessi campi, testi e ordine): iscrizione/ModuloDati.dc.html. -->
<!-- Il modulo di iscrizione (ModuloIscrizione.tsx), cima: chi si iscrive e il genitore, per una minorenne. Giulia Rossi, nata il 14/03/2017: scritto il codice fiscale, data e luogo di nascita si riempiono da soli (campo tratteggiato, non si scrive) e accanto alla data c'e' l'eta' in giallo; la data dice minorenne, quindi compaiono l'avviso e la sezione IL GENITORE (nome, cognome, codice fiscale), e piu' sotto i contatti sono quelli del genitore. Nome del titolo come in IscrizioniScreen (RICHIESTA DI ISCRIZIONE). Col database vero non c'e' il bollino PROVA: RESTA SU QUESTO DISPOSITIVO. Nome, cognome e indirizzo d'esempio inventati. -->
