<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font del modulo saranno file locali OFL (public/risorse, come Big Shoulders Display e Inter del sito pubblico, src/lib/sitoGenera.ts); un canvas e' un Artifact e li prende da Google Fonts: stessi file, stessa licenza. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Il modulo dopo MANDA LA RICHIESTA con le risposte che non vanno, nell'aspetto del sito. Lo stato di errore non e' solo rosso: bordo rosso #e4292a (4,52:1 sul bianco) + nota sotto in #b81d1d (6,50:1 sul bianco) che dice cosa fare (come oggi nell'app: lo stato lo dicono le parole, non un segno); in fondo il riquadro bianco col bordo rosso e «!» davanti all'elenco di cosa manca, sopra il tasto giallo MANDA LA RICHIESTA. Le note sono in Inter 14px.

Board di partenza (stessi campi, testi e ordine): iscrizione/ModuloErrori.dc.html. -->
<!-- Il modulo di iscrizione dopo MANDA LA RICHIESTA con le risposte che non vanno (un maggiorenne, Luca Bianchi): sotto ogni campo la sua nota (Campo + NotaCampo): rosso col bordo rosso dove ferma l'invio, e «Manca» solo dopo il primo tentativo. Il codice fiscale dice quanti caratteri mancano. In fondo il riquadro rosso con l'elenco (controlla di richieste.ts) sopra il tasto, che e' sempre MANDA LA RICHIESTA. Non riprodotti: il fuoco sul primo campo sbagliato e le note «Non torna con nome e cognome» o «con la data di nascita», che seguono lo stesso schema. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1500px; background: #eef5fa; color: #0d2a3d">
<dc-import name="Testata" tema="sito" luogo="ISCRIZIONI" guida="{{ false }}" hint-size="100%,72px"></dc-import>
<main style="display: flex; flex-direction: column">
<dc-import name="Titoletto" tema="sito" label="RICHIESTA DI ISCRIZIONE" hint-size="100%,50px"></dc-import>
<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 14px 20px 0">
  <dc-import name="Bottone" tema="sito" label="← INDIETRO" variante="linea" alto="48px" corpo="20px" hint-size="160px,48px"></dc-import>
</div>
<dc-import name="Titoletto" tema="sito" label="CHI SI ISCRIVE" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<dc-import name="Campo" tema="sito" etichetta="NOME" valore="" nota="Manca" hint-size="100%,104px"></dc-import>
<dc-import name="Campo" tema="sito" etichetta="COGNOME" valore="Bianchi" hint-size="100%,80px"></dc-import>
<dc-import name="Campo" tema="sito" etichetta="CODICE FISCALE" valore="BNCLCU90A01L219" codice="{{ true }}" nota="Manca 1 carattere" hint-size="100%,104px"></dc-import>
<dc-import name="Campo" tema="sito" etichetta="DATA DI NASCITA" valore="01/01/1990" hint-size="100%,80px"></dc-import>
<dc-import name="Campo" tema="sito" etichetta="LUOGO DI NASCITA" valore="" nota="Manca" hint-size="100%,104px"></dc-import>
</div>
<dc-import name="Titoletto" tema="sito" label="RESIDENZA" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<dc-import name="Campo" tema="sito" etichetta="VIA E NUMERO" valore="" nota="Manca" hint-size="100%,104px"></dc-import>
<dc-import name="Campo" tema="sito" etichetta="CAP" valore="1009" codice="{{ true }}" nota="Sono 5 cifre" hint-size="100%,104px"></dc-import>
<dc-import name="Campo" tema="sito" etichetta="COMUNE" valore="" nota="Manca" hint-size="100%,104px"></dc-import>
</div>
<dc-import name="Titoletto" tema="sito" label="COME RAGGIUNGERTI" hint-size="100%,50px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 4px">
<dc-import name="Campo" tema="sito" etichetta="EMAIL" valore="luca.bianchi@example" nota="Non sembra giusta" hint-size="100%,104px"></dc-import>
<dc-import name="Campo" tema="sito" etichetta="TELEFONO" valore="" nota="Manca" hint-size="100%,104px"></dc-import>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 20px 20px 28px">
  <dc-import name="RiquadroPasso" tema="sito" tono="guaio" titolo="" testo="Mancano: nome, luogo di nascita, indirizzo, comune, telefono" tonoTesto="testo" tasti="" hint-size="100%,80px"></dc-import>
  <dc-import name="Bottone" tema="sito" label="MANDA LA RICHIESTA" variante="vai" hint-size="100%,56px"></dc-import>
</div>
</main>
</div>
</x-dc>
</body>
</html>
