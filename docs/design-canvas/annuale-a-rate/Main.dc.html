<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Scheda oggi</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- COM'È OGGI: l'anticipo di 150 € non ha una riga. Si vede la ricevuta da 500 €, un bonifico da 150 € e «Manca 200,00 €»: il conto sembra sbagliato. -->
<div style="display: flex; width: 1440px; min-height: 900px; background: #eef5fa">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" tema="sito" attiva="ISCRITTI" numeri="" nome="Marco Rossi" ruolo="Segreteria" altezza="900px" hint-size="240px,900px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 1; min-width: 0; padding: 28px 36px">
    <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">ROSSI ANNA</h1>
    <dc-import name="SchedeIscritto" tema="sito" acceso="QUOTA E PAGAMENTI" segnoQuota="giallo" parolaQuota="DA PAGARE" hint-size="100%,56px"></dc-import>
    <div style="display: flex; flex-direction: column; gap: 10px; max-width: 820px; padding: 16px 18px; background: #ffffff; border-radius: 6px">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; color: #46606f">RICEVUTE E PAGAMENTI</span>
      <dc-import name="RigaPagamento" tipo="ricevuta" titolo="N. 315/2026 · 28 ottobre 2026" sotto="ANNUALE JUDO ADULTI · ANTICIPO 150,00 €" importo="500,00 €" tasti="PDF|ANNULLA RICEVUTA" hint-size="100%,100px"></dc-import>
      <dc-import name="RigaPagamento" tipo="pagamento" titolo="Bonifico · 28 ottobre 2026" sotto="PAGATO SULLA RICEVUTA 315/2026" importo="150,00 €" tasti="" hint-size="100%,70px"></dc-import>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px solid #cfe6f4">
        <span style="font-size: 14px; color: #46606f">Manca</span>
        <span style="font-size: 20px; font-weight: 700; color: #b81d1d">200,00 €</span>
      </div>
    </div>
    <p style="margin: 0; max-width: 820px; font-size: 14px; line-height: 1.5; color: #46606f">500 − 150 − 150 = 200, ma l’anticipo non è scritto da nessuna parte: chi guarda la scheda vede un solo pagamento da 150 € e pensa che il conto sia sbagliato. Non si vede nemmeno che è un annuale a rate, né entro quando va chiuso.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

</script>
</body>
</html>
