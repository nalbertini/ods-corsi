<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font del modulo saranno file locali OFL (public/risorse, come Big Shoulders Display e Inter del sito pubblico, src/lib/sitoGenera.ts); un canvas e' un Artifact e li prende da Google Fonts: stessi file, stessa licenza. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA. COME PAGHI: tre scelte. Con SATISPAY non servono IBAN, causale né ricevuta: l'importo lo ricalcola il server dal listino, e il tasto in fondo manda la richiesta e apre Satispay con l'importo già scritto. Niente più «stima»: il totale e' quello che si paga. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 980px; background: #eef5fa; color: #0d2a3d">
<main style="display: flex; flex-direction: column">
<dc-import name="Titoletto" tema="sito" label="QUANTO PAGHI" hint-size="100%,50px"></dc-import><div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 8px"><div style="display: flex; flex-direction: column; gap: 4px; padding: 14px; background: #ffffff; border: 2px solid #14709f; border-radius: 6px">
<div style="display: flex; gap: 12px; font-size: 15px"><span style="flex-grow: 1">Quota associativa</span><span style="font-variant-numeric: tabular-nums">50 €</span></div>
<div style="display: flex; gap: 12px; font-size: 15px"><span style="flex-grow: 1">Judo adulti · trimestre</span><span style="font-variant-numeric: tabular-nums">180 €</span></div>
<div style="display: flex; gap: 12px; padding-top: 6px; border-top: 2px solid #14709f; font-size: 17px; font-weight: 700"><span style="flex-grow: 1">Totale</span><span style="font-variant-numeric: tabular-nums">230 €</span></div>
</div></div><dc-import name="Titoletto" tema="sito" label="COME PAGHI" hint-size="100%,50px"></dc-import><div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 8px"><dc-import name="Campo" tema="sito" tipo="scelta" una="{{ true }}" etichetta="" valore="Satispay" riga="Paghi subito, dall’app: l’importo è già scritto" scelto="{{ true }}" hint-size="100%,72px"></dc-import><dc-import name="Campo" tema="sito" tipo="scelta" una="{{ true }}" etichetta="" valore="Bonifico" riga="Carichi la ricevuta del bonifico" scelto="{{ false }}" hint-size="100%,72px"></dc-import><dc-import name="Campo" tema="sito" tipo="scelta" una="{{ true }}" etichetta="" valore="In segreteria" riga="Contanti, POS o assegno, quando vieni" scelto="{{ false }}" hint-size="100%,72px"></dc-import></div><div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 32px"><span style="font-size: 14px; line-height: 1.4; color: #46606f">Quando mandi la richiesta si apre Satispay con 230 €. Confermi lì e torni qui.</span><dc-import name="Bottone" tema="sito" label="MANDA E PAGA CON SATISPAY" variante="vai" larghezza="100%" alto="56px" hint-size="100%,56px"></dc-import></div>
</main>
</div>
</x-dc>
</body>
</html>
