<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font del modulo saranno file locali OFL (public/risorse, come Big Shoulders Display e Inter del sito pubblico, src/lib/sitoGenera.ts); un canvas e' un Artifact e li prende da Google Fonts: stessi file, stessa licenza. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA. RICHIESTA ARRIVATA mentre il pagamento aspetta: la richiesta c'e' gia'. Se chi paga torna da Satispay senza aver confermato, o la pagina si ricarica, il tasto riapre lo stesso pagamento (mai due). La pagina ha un indirizzo suo: si puo' tornare anche dopo. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 620px; background: #eef5fa; color: #0d2a3d">
<dc-import name="Testata" tema="sito" luogo="ISCRIZIONI" guida="{{ false }}" senzaTema="{{ true }}" hint-size="100%,72px"></dc-import>
<main style="display: flex; flex-direction: column">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 28px"><dc-import name="TitoloEsito" tema="sito" titolo="RICHIESTA ARRIVATA" tono="avviso" testi="Manca il pagamento: 230 € con Satispay.|Se hai chiuso Satispay senza confermare, riaprilo da qui: è lo stesso pagamento, non paghi due volte." hint-size="100%,200px"></dc-import><dc-import name="Bottone" tema="sito" label="PAGA 230 € CON SATISPAY" variante="vai" larghezza="100%" alto="56px" hint-size="100%,56px"></dc-import><span style="font-size: 14px; line-height: 1.4; color: #46606f">Puoi pagare anche più tardi da questa pagina: salva il link o tienila aperta.</span></div>
</main>
</div>
</x-dc>
</body>
</html>
