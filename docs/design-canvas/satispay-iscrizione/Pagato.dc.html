<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<x-dc>
<helmet>
  <!-- Nell'app i font del modulo saranno file locali OFL (public/risorse, come Big Shoulders Display e Inter del sito pubblico, src/lib/sitoGenera.ts); un canvas e' un Artifact e li prende da Google Fonts: stessi file, stessa licenza. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA. RICHIESTA ARRIVATA dopo che Satispay ha confermato: PAGATO, quanto, per chi e quando. La ricevuta della palestra la fa la segreteria quando accoglie la richiesta. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 560px; background: #eef5fa; color: #0d2a3d">
<dc-import name="Testata" tema="sito" luogo="ISCRIZIONI" guida="{{ false }}" senzaTema="{{ true }}" hint-size="100%,72px"></dc-import>
<main style="display: flex; flex-direction: column">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 28px"><dc-import name="TitoloEsito" tema="sito" titolo="RICHIESTA ARRIVATA · PAGATO" tono="fatto" testi="Hai pagato 230 € con Satispay il 20 ottobre, per Paolo Bianchi.|La segreteria controlla la richiesta e ti scrive se manca qualcosa. La ricevuta della palestra te la dà la segreteria." hint-size="100%,220px"></dc-import><dc-import name="Bottone" tema="sito" label="TORNA ALLE ISCRIZIONI" variante="linea" larghezza="100%" alto="56px" hint-size="100%,56px"></dc-import></div>
</main>
</div>
</x-dc>
