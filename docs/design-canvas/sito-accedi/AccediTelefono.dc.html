<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <title>Menu del telefono</title>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>* { box-sizing: border-box; } body { margin: 0; -webkit-font-smoothing: antialiased; }</style>
</helmet>
<!-- PROPOSTA: sul telefono il menu (`#menu:target`) chiude con due pulsanti da 48px a tutta larghezza: «Iscriviti» giallo, poi «Accedi» a linea. -->
<div style="width: 375px; height: 520px; position: relative; overflow: hidden; background: #eef5fa; color: #0d2a3d"><dc-import name="SitoTestata" logo="logo.webp" attiva="Home" prova="Iscriviti" piccolo="{{ true }}" hint-size="100%,96px"></dc-import><div style="position:absolute;left:0;right:0;top:96px;z-index:10;padding:12px 16px 24px;background:#eef5fa;box-shadow:0 14px 24px rgba(13,42,61,.2);display:grid;gap:6px"><span style="display:inline-flex;align-items:center;min-height:48px;padding:0 16px;border-radius:6px;font:500 17px Inter,Arial,sans-serif">Home</span><span style="display:inline-flex;align-items:center;min-height:48px;padding:0 16px;border-radius:6px;font:500 17px Inter,Arial,sans-serif">I nostri corsi</span><span style="display:inline-flex;align-items:center;min-height:48px;padding:0 16px;border-radius:6px;font:500 17px Inter,Arial,sans-serif">Chi siamo</span><span style="display:inline-flex;align-items:center;min-height:48px;padding:0 16px;border-radius:6px;font:500 17px Inter,Arial,sans-serif">Contatti</span><span style="display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:12px;border-radius:6px;background:#f4c31b;font:600 16px Inter,Arial,sans-serif">Iscriviti</span><span style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:6px;border:2px solid #0d2a3d;font:600 16px Inter,Arial,sans-serif">Accedi</span></div></div>
</x-dc>
</body>
</html>
