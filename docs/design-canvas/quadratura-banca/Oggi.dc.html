<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Tessera del Conto Corrente, com'è oggi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .t { font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-weight: 800; letter-spacing: 0.04em; line-height: 1; }
    .et { font-size: 12px; font-weight: 600; letter-spacing: 0.12em; color: #46606f; }
    .sotto { font-size: 14px; color: #46606f; line-height: 1.45; }
  </style>
</helmet>
<!-- Com'è adesso (Contabilita.tsx, Casse): la tessera dice il saldo secondo i conti e basta.
     Che il conto torni con la banca si scopre solo a fine anno, confrontando a mano. -->
<div style="width: 600px; padding: 28px 36px; background: #eef5fa">
  <section style="display: flex; flex-direction: column; gap: 14px; padding: 22px 24px; background: #fff; border: 2px solid #cfe6f4">
    <span class="et">CASSA</span>
    <span class="t" style="font-size: 22px">CONTO CORRENTE</span>
    <div style="display: flex; gap: 24px; align-items: baseline"><span class="et">SUL CONTO</span><span style="font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums">12.430,00 €</span></div>
    <span class="sotto">entrate 96.210,00 € · uscite 83.780,00 €</span>
    <span class="sotto">Il Conto Corrente non si conta: si confronta con l’estratto della banca.</span>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
      <dc-import name="Campo" tipo="testo" contesto="segreteria" etichetta="SALDO INIZIALE" valore="4.120,00" hint-size="250px,70px"></dc-import>
      <dc-import name="Campo" tipo="data" contesto="segreteria" etichetta="DAL" valore="01/01/2026" hint-size="250px,70px"></dc-import>
    </div>
  </section>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":600,"height":420}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
