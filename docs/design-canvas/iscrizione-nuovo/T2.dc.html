<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Saira+Condensed:wght@500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #121212; color: #f2f2f0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- Due richieste mandate una dopo l’altra, prima il bambino e poi il genitore. Su tutte e due la segreteria trova una riga automatica nelle note («mandata insieme alla richiesta di …, sconto famiglia da applicare»): il legame lo fa lei, a mano. La ricevuta, se c’è, va su tutte e due. Il server accetta 3 richieste al giorno per email: con più figli l’ultima può fermarsi, e l’esito lo dice. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1494px; background: #121212; color: #f2f2f0">
<dc-import name="Testata" luogo="ISCRIZIONI" guida="{{ false }}" hint-size="100%,72px"></dc-import>
<main style="display: flex; flex-direction: column; flex-grow: 1">
<dc-import name="Avanzamento" numero="6" totale="6" titolo="CONTROLLA E INVIA" hint-size="100%,120px"></dc-import><div style="display: flex; flex-direction: column; gap: 12px; padding: 14px 20px 12px"><span style="font-size: 14px; line-height: 1.4; color: #c9c9c4">Due iscrizioni, due richieste. Tocca MODIFICA per cambiare qualcosa.</span><dc-import name="Riepilogo" righe="fatto~Matteo Rossi~Judo 3 · annuale · 350 € con la quota~MODIFICA|fatto~Giulia Rossi~Judo adulti · annuale · 410 € con la quota~MODIFICA|fatto~Firma di Giulia~vale per i due moduli~MODIFICA|fatto~Carta d’identità~fronte~MODIFICA|manca~Certificato medico di Matteo~non caricato: lo porti in segreteria~CARICA|manca~Certificato medico di Giulia~non caricato: lo porti in segreteria~CARICA|manca~Ricevuta del pagamento~una sola, per tutte e due: paghi in segreteria~CARICA" hint-size="100%,560px"></dc-import><dc-import name="RiquadroPasso" titolo="Il conto" righe="Matteo:350 €|Giulia:410 €|Sconto famiglia 20% sull’annuale più basso:−60 €|Totale:700 €" testo="È una stima: lo sconto lo conferma la segreteria. La quota associativa vale fino a luglio 2027 e non ha sconti." tasti="" hint-size="100%,250px"></dc-import><span style="font-size: 14px; line-height: 1.4; color: #f4c31b">I certificati medici di Matteo e di Giulia si portano in segreteria prima della prima lezione.</span><dc-import name="Campo" tipo="area" etichetta="NOTE PER LA SEGRETERIA · FACOLTATIVE" segnaposto="Niente dati sulla salute: quelli si portano in segreteria." hint-size="100%,130px"></dc-import><span style="font-size: 14px; line-height: 1.4; color: #8c8c88">Mandale una volta sola: ogni invio è una richiesta per la segreteria.</span></div>
</main>
<dc-import name="BarraPasso" avanti="MANDA LE RICHIESTE" tono="vai" nota="Tutto a posto: puoi mandare." hint-size="100%,150px"></dc-import>
</div>
</x-dc>
</body>
</html>
