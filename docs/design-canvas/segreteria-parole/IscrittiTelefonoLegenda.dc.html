<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  </style>
</helmet>
<!-- PROPOSTA B, l'alternativa: i segni compatti restano (✕ rosso, … giallo, ✓ verde), le testate dicono la parola (CERT., QUOTA) e sopra
     la tabella c'è una riga di legenda. Più fitta, ma chi guarda deve ancora tradurre: «…» vuol dire da archiviare, scade presto, senza data. -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 844px; background: #eef5fa">
  <dc-import name="Testata" luogo="GESTIONE" guida="{{ false }}" hint-size="100%,72px"></dc-import>
  <main style="display: flex; flex-direction: column; gap: 14px; padding: 20px 16px">
    <dc-import name="TestataPagina" titolo="ISCRITTI" sotto="162 persone attive. 14 certificati da archiviare." secondaria="" primaria="" hint-size="100%,70px"></dc-import>
    <div style="display: flex; align-items: center; height: 44px; padding: 0 14px; background: #fff; border: 2px solid #14709f; border-radius: 6px; font-size: 15px; color: #46606f">Cerca per nome o email</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #46606f"><span><b style="color: #b81d1d">✕</b> manca o scaduto</span><span><b style="color: #8f6a00">…</b> da guardare</span><span><b style="color: #0b7a33">✓</b> in regola</span></div>
    <div style="display: flex; flex-direction: column; background: #fff; border: 1px solid #cfe6f4; border-radius: 6px; overflow: hidden">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px 48px; padding: 12px 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #46606f"><span>NOME ⌃</span><span style="text-align: center">CERT.</span><span style="text-align: center">QUOTA</span><span style="text-align: right">30 GG</span></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px 48px; align-items: center; min-height: 50px; padding: 0 14px; border-top: 1px solid #e3eef6; font-size: 15px"><span style="font-weight: 600">Barbieri Alessandro</span><span style="text-align: center; font-weight: 700; color: #8f6a00">…</span><span style="text-align: center; font-weight: 700; color: #0b7a33">✓</span><span style="text-align: right; font-weight: 700">8/8</span></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px 48px; align-items: center; min-height: 50px; padding: 0 14px; border-top: 1px solid #e3eef6; font-size: 15px"><span style="font-weight: 600">Barbieri Aurora</span><span style="text-align: center; font-weight: 700; color: #8f6a00">…</span><span style="text-align: center; font-weight: 700; color: #0b7a33">✓</span><span style="text-align: right; font-weight: 700">12/12</span></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px 48px; align-items: center; min-height: 50px; padding: 0 14px; border-top: 1px solid #e3eef6; font-size: 15px"><span style="font-weight: 600">Barbieri Beatrice</span><span style="text-align: center; font-weight: 700; color: #b81d1d">✕</span><span style="text-align: center; font-weight: 700; color: #0b7a33">✓</span><span style="text-align: right; font-weight: 700">0/4</span></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px 48px; align-items: center; min-height: 50px; padding: 0 14px; border-top: 1px solid #e3eef6; font-size: 15px"><span style="font-weight: 600">Bianchi Luca</span><span style="text-align: center; font-weight: 700; color: #b81d1d">✕</span><span style="text-align: center; font-weight: 700; color: #b81d1d">✕</span><span style="text-align: right; font-weight: 700">2/8</span></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px 48px; align-items: center; min-height: 50px; padding: 0 14px; border-top: 1px solid #e3eef6; font-size: 15px"><span style="font-weight: 600">Colombo Sara</span><span style="text-align: center; font-weight: 700; color: #0b7a33">✓</span><span style="text-align: center; font-weight: 700; color: #0b7a33">✓</span><span style="text-align: right; font-weight: 700">6/8</span></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 56px 56px 48px; align-items: center; min-height: 50px; padding: 0 14px; border-top: 1px solid #e3eef6; font-size: 15px"><span style="font-weight: 600">Conti Marco</span><span style="text-align: center; font-weight: 700; color: #0b7a33">✓</span><span style="text-align: center; font-weight: 700; color: #8f6a00">…</span><span style="text-align: right; font-weight: 700">5/8</span></div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
