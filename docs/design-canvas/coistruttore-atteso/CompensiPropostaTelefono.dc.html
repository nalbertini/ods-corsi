<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <!-- Nell'app i font stanno in public/fonts; un canvas e' un Artifact e li puo' caricare solo da Google Fonts: stessi file, stessa licenza OFL. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    .big { font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-weight: 800; letter-spacing: 0.04em; line-height: 1; }
    .et { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: #46606f; }
    .val { font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
    .frase { font-size: 14px; color: #46606f; line-height: 1.45; }
    .velo { background: rgba(13, 42, 61, 0.55); }
    .finestra { display: flex; flex-direction: column; background: #ffffff; border: 2px solid #0d2a3d; border-top: 6px solid #0d2a3d; color: #0d2a3d; }
    .nuovo { box-shadow: inset 4px 0 0 #f4c31b; padding-left: 14px; }
    .due { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 32px; }
    .cella { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .tab { display: grid; gap: 14px; align-items: center; padding: 8px 14px; min-height: 48px; border-bottom: 1px solid #cfe6f4; background: #ffffff; font-size: 15px; }
    .num { font-variant-numeric: tabular-nums; text-align: right; }
    .link { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 600; color: #14709f; text-decoration: underline; text-underline-offset: 4px; }
    .piede { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 14px 28px 18px; border-top: 2px solid #cfe6f4; }
  </style>
</helmet>
<!-- PROPOSTA: COMPENSI sul telefono. Le lezioni senza firma si vedono sempre, anche a riga chiusa, con C'ERA e «Non c'era». -->
<div style="display: flex; flex-direction: column; width: 390px; min-height: 1800px; background: #eef5fa">
  <dc-import name="BarraTelefono" tema="sito" luogo="SEGRETERIA" da-fare="5" hint-size="100%,62px"></dc-import>
  <main style="display: flex; flex-direction: column; gap: 16px; padding: 20px 16px 28px">
    <div style="display: flex; flex-direction: column; gap: 4px"><h1 class="big" style="margin: 0; font-size: 34px">COMPENSI</h1><span class="frase">Per ogni corso, ore confermate × la sua tariffa.</span></div>
    <dc-import name="Campo" tema="sito" contesto="segreteria" tipo="select" etichetta="MESE" valore="Ottobre 2026" nota="" nota-tono="avviso" hint-size="100%,80px"></dc-import>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><dc-import name="Numero" tema="sito" titolo="DA FARE" valore="2" sotto="405,00 €" hint-size="100%,110px"></dc-import><dc-import name="Numero" tema="sito" titolo="FERMI" valore="2" sotto="da sistemare" allarme="{{ true }}" hint-size="100%,110px"></dc-import></div>
    <dc-import name="Bottone" tema="sito" contesto="segreteria" label="Prepara e stampa (2)" variante="pieno" larghezza="100%" hint-size="100%,48px"></dc-import>
    <span class="frase">Salta Rossi Marco (presenze da confermare) e Verdi Luca (senza tariffa per Karate).</span>
    <div style="display: flex; gap: 8px; flex-wrap: wrap"><dc-import name="Chip" tema="sito" label="Tutti" acceso="{{ true }}" hint-size="105px,44px"></dc-import><dc-import name="Chip" tema="sito" label="Da riportare firmate" acceso="{{ false }}" numero="1" tono-numero="giallo" hint-size="240px,44px"></dc-import></div>
    <div style="display: flex; flex-direction: column">
      <dc-import name="RigaCompenso" nome="Ballabio Diana" stato="da-fare" lezioni="8" ore="12" importo="180,00 €" telefono="{{ true }}" hint-size="100%,150px"></dc-import>
      <dc-import name="RigaCompenso" nome="Neri Maura" stato="solo-attese" lezioni="0" ore="0" importo="" attese="Judo adulti:ven 3/10:Anna Gialli|Judo adulti:ven 10/10:Anna Gialli" telefono="{{ true }}" hint-size="100%,420px"></dc-import>
      <dc-import name="RigaCompenso" nome="Bianchi Sara" stato="da-pagare" lezioni="6" ore="9" importo="135,00 €" firmata="{{ false }}" telefono="{{ true }}" hint-size="100%,150px"></dc-import>
      <dc-import name="RigaCompenso" nome="Rossi Marco" stato="da-confermare" lezioni="5" ore="7,5" importo="" quante="3" telefono="{{ true }}" hint-size="100%,150px"></dc-import>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1800}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
