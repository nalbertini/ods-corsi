<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <title>Istruttore scheda minima telefono</title>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>* { box-sizing: border-box; } body { margin: 0; -webkit-font-smoothing: antialiased; }</style>
</helmet>
<!-- PROPOSTA (375px): la scheda di default sul telefono (esempio Fabio Berta): foto, nome, due pulsanti, una tessera «Corsi», invito. Niente tessere vuote. -->
<div style="width: 375px; min-height: 2255px; position: relative; overflow: hidden; background: #eef5fa; color: #0d2a3d">
  <dc-import name="SitoTestata" logo="logo.webp" attiva="Chi siamo" prova="Prova una settimana a 5 €" piccolo="{{ true }}" hint-size="100%,96px"></dc-import>
  <section style="padding:0 16px"><span style="display:inline-block;background:#ffffff;color:#0d2a3d;border:2px solid #e4292a;border-radius:4px;padding:4px 8px;font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-size:12px;font-weight:700;line-height:1.2">DA CONFERMARE I11 · voce di menu o sotto «Chi siamo»?</span></section>
  <section style="padding:12px 16px 0"><span style="display:inline-flex;align-items:center;min-height:48px;font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:600">← Gli istruttori</span></section>
  <section style="padding:8px 16px 0">
    <div style="height:343px;overflow:hidden;border-radius:6px"><img src="img/p948-4.jpg" alt="Ritratto di Fabio Berta" style="display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%"></div>
    <h1 style="font-family:'Big Shoulders Display','Arial Narrow',sans-serif;text-transform:uppercase;font-weight:800;margin:24px 0 16px;font-size:88px;line-height:.86;letter-spacing:-.01em">Fabio<br>Berta</h1>
    <dc-import name="SitoPulsante" label="Prova una settimana a 5 €" tono="giallo" alto="56px" larghezza="100%" hint-size="343px,56px"></dc-import>
    <div style="height:6px"></div>
    <dc-import name="SitoPulsante" label="Scrivici" tono="inchiostro" alto="56px" larghezza="100%" hint-size="343px,56px"></dc-import>
  </section>
  <section style="padding:32px 16px 0">
    <dc-import name="SitoDatoPersona" etichetta="Corsi" valore="Aikido" tono="giallo" piccolo="{{ true }}" alto="auto" hint-size="100%,120px"></dc-import>
  </section>
  <section style="padding:64px 16px 0"><div style="display:flex;flex-direction:column;justify-content:center;gap:16px;background:#0d2a3d;color:#ffffff;border-radius:6px;padding:28px 20px">
  <div style="font-family:'Big Shoulders Display','Arial Narrow',sans-serif;text-transform:uppercase;font-weight:800;font-size:48px;line-height:.9">Vieni a conoscerli sul tatami.</div>
  <p style="font-family:'Inter','Helvetica Neue',Arial,sans-serif;margin:0;font-size:17px;line-height:1.5;max-width:560px">Una settimana a 5 €: provi tutte le discipline, incontri gli istruttori e scegli. Ti aspettiamo in Via Sassi 26, Collegno.</p>
  <div style="display:flex;flex-direction:column;gap:12px;flex-wrap:wrap"><dc-import name="SitoPulsante" label="Prova una settimana a 5 €" tono="giallo" alto="56px" larghezza="100%" hint-size="100%,56px"></dc-import><span style="display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 28px;border-radius:6px;background:#ffffff;color:#0d2a3d;font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-weight:600;font-size:16px">Scrivici</span></div>
</div></section>
  <section style="padding:24px 16px 32px">
    <dc-import name="SitoPiedeContatti" piccolo="{{ true }}" hint-size="100%,520px"></dc-import>
  </section>
</div>
</x-dc>
</body>
</html>
