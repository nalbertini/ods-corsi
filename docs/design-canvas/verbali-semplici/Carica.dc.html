<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Carica un verbale</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef5fa; color: #0d2a3d; font-family: Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #14709f; } a:hover { color: #0d2a3d; }
  </style>
</helmet>
<!-- PROPOSTA: l'unica schermata per mettere un verbale nell'app, nuovo o vecchio: La riunione + il PDF firmato. Niente bozza, niente testo,
     niente delibere: il verbale nasce già firmato. Un verbale vecchio (storico) si carica uguale; le ore, se non si sanno, restano vuote. -->
<div style="display: flex; flex-wrap: wrap; min-height: 1200px; background: #eef5fa">
  <div style="width: 240px; flex-shrink: 0">
    <dc-import name="Menu" attiva="VERBALI" numeri="RICHIESTE ONLINE:3" nome="Marco Rossi" ruolo="Segreteria" altezza="1200px" hint-size="240px,1200px"></dc-import>
  </div>
  <main style="display: flex; flex-direction: column; gap: 18px; flex: 999 1 560px; min-width: 0; max-width: 1000px; padding: 28px 36px">
    <a href="Elenco.dc.html" style="font-size: 15px; font-weight: 600; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; align-self: flex-start">‹ Tutti i verbali</a>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', 'Arial Narrow', Arial, sans-serif; font-size: 34px; font-weight: 800; letter-spacing: 0.04em; line-height: 1">CARICA UN VERBALE</h1>
      <span style="font-size: 14px; color: #46606f">Il PDF firmato e i dati della riunione. Vale anche per i verbali vecchi.</span>
    </div>

    <section style="display: flex; flex-direction: column; gap: 14px; padding: 18px; background: #ffffff; border: 1px solid #cfe6f4; border-radius: 6px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #46606f">IL PDF FIRMATO</span>
      <label style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px; border: 2px dashed #cfe6f4; border-radius: 6px; text-align: center; cursor: pointer">
        <span style="font-size: 15px; font-weight: 600">verbale-3-2026-firmato.pdf · 1,1 MB</span>
        <span style="font-size: 14px; color: #46606f">La scansione con le firme. Solo PDF, fino a 20 MB. <span style="color: #14709f; font-weight: 600">Cambia file</span></span>
        <input type="file" accept="application/pdf" style="position: absolute; width: 1px; height: 1px; opacity: 0">
      </label>
      <dc-import name="Campo" tema="sito" contesto="segreteria" etichetta="FIRMATO IL" valore="13/11/2026" hint-size="100%,72px"></dc-import>
    </section>

    <section style="display: flex; flex-direction: column; gap: 14px; padding: 18px; background: #ffffff; border: 1px solid #cfe6f4; border-radius: 6px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.2em; color: #46606f">LA RIUNIONE</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px">
        <dc-import name="Campo" tema="sito" contesto="segreteria" tipo="select" etichetta="RIUNIONE" valore="Direttivo" hint-size="100%,72px"></dc-import>
        <dc-import name="Campo" tema="sito" contesto="segreteria" etichetta="NUMERO" valore="n.3-2026" nota="Il prossimo libero del 2026. Per un verbale vecchio scrivi il suo." hint-size="100%,96px"></dc-import>
        <dc-import name="Campo" tema="sito" contesto="segreteria" etichetta="DATA" valore="12/11/2026" hint-size="100%,72px"></dc-import>
        <dc-import name="Campo" tema="sito" contesto="segreteria" etichetta="DOVE" valore="Sede, via Sassi 24/26" hint-size="100%,72px"></dc-import>
        <dc-import name="Campo" tema="sito" contesto="segreteria" etichetta="INIZIO" valore="20:30" hint-size="100%,72px"></dc-import>
        <dc-import name="Campo" tema="sito" contesto="segreteria" etichetta="FINE" valore="22:10" hint-size="100%,72px"></dc-import>
        <div style="grid-column: 1 / -1"><dc-import name="Campo" tema="sito" contesto="segreteria" tipo="area" etichetta="ORDINE DEL GIORNO · UN PUNTO PER RIGA (SE VUOI)" valore="Approvazione del verbale precedente&#10;Quote della stagione 2027&#10;Nomina del segretario" nota="Serve solo per ritrovarlo con la ricerca." hint-size="100%,150px"></dc-import></div>
      </div>
    </section>

    <dc-import name="Campo" tema="sito" contesto="segreteria" tipo="spunta" etichetta="Ho controllato: il PDF è firmato e i dati sono quelli del foglio" scelto="{{true}}" hint-size="100%,56px"></dc-import>
    <div style="display: flex; gap: 8px; justify-content: flex-end">
      <dc-import name="Bottone" tema="sito" contesto="segreteria" variante="linea" label="Annulla" hint-size="120px,56px"></dc-import>
      <dc-import name="Bottone" tema="sito" contesto="segreteria" variante="principale" label="Carica" hint-size="140px,56px"></dc-import>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
