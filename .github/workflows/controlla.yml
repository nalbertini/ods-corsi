name: Controlla

# Le prove su ogni PR, prima di unirla: che compili, e che tutte le prove del
# README («Le prove») tornino. Senza, le prove si lanciavano solo a mano e un
# guaio si scopriva dopo l'unione, su main, con la versione già alzata.
#
# Le prove nuove entrano da sé: gli script `prova:*` di package.json e i file
# di supabase/prova (vedi scripts/prova-sql.sh).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuovo sulla stessa PR rende inutile il controllo di prima.
concurrency:
  group: controlla-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compila:
    name: Compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            timer/package-lock.json

      - run: npm ci
      - run: npm ci --prefix timer

      # Come in pubblica.yml, senza segreti: l'app in modalità prova. Dentro
      # c'è anche il controllo dei tipi (tsc -b).
      - run: npm run build:tutto

  # Solo avvisi (vedi lighthouserc.json): serve a vedere i numeri veri prima
  # di decidere quali soglie far diventare bloccanti. `continue-on-error` per
  # non fermare la PR se Lighthouse stesso inciampa (rete, Chrome).
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            timer/package-lock.json

      # Il timer sta dentro la build dell'app (tsc -b lo controlla).
      - run: npm ci
      - run: npm ci --prefix timer
      - run: npm run build
      # Il token della GitHub App di Lighthouse CI fa comparire il risultato
      # come controllo della PR, con il link al report. Senza (PR da fork,
      # segreto mancante) il job gira lo stesso e i link restano nel log.
      - run: npx --yes @lhci/cli@0.15.1 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  prove:
    name: Prove dell'app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Per prova:moduli. Versione e impronta fissate: un binario cambiato in
      # silenzio non passa. Si aggiornano insieme, da una release di PdfCraft.
      - name: pdfcraft-cli
        run: |
          curl -fsSL -o pdfcraft-cli.tar.gz https://github.com/storytold/pdfcraft/releases/download/v0.8.0/pdfcraft-cli-0.8.0-linux-x86_64.tar.gz
          echo "e57630c62e23288bacb1591ef86f0c530da1bd63743b800cae3ebc875a4708cd  pdfcraft-cli.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" pdfcraft-cli-estratto
          tar -xzf pdfcraft-cli.tar.gz -C pdfcraft-cli-estratto
          install "$(find pdfcraft-cli-estratto -name pdfcraft-cli -type f)" "$HOME/.local/bin/pdfcraft-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pdfcraft-cli" --version

      # Tutte, anche se una cade, per vedere in un giro solo cosa non torna.
      - name: npm run prova:*
        run: |
          guai=0
          for s in $(node -p "Object.keys(require('./package.json').scripts).filter((s) => s.startsWith('prova:') && s !== 'prova:sql' && s !== 'prova:a11y-axe').join(' ')"); do
            echo "::group::$s"
            npm run -s "$s" || { echo "::error::$s non torna"; guai=1; }
            echo '::endgroup::'
          done
          exit $guai

  # axe-core sulle schermate principali in modalità prova: serve la build e un
  # Chromium vero, quindi un lavoro suo e non il giro di `prova:*`. Le
  # violazioni note stanno in scripts/a11y-note.json, con il motivo.
  accessibilita:
    name: Accessibilità (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            timer/package-lock.json

      - run: npm ci
      - run: npm ci --prefix timer
      - run: npm run build:tutto
      - run: npx playwright install --with-deps chromium
      - run: npm run prova:a11y-axe

  database:
    name: Prove del database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prova
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: prova
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `psql` c'è già sul runner: niente Node, niente npm.
      - run: bash scripts/prova-sql.sh
