name: Backup del database

# Una copia del database Supabase una volta a settimana, il lunedì alle 3:17
# UTC (di notte in Italia, a palestra chiusa), più il lancio a mano quando
# serve una copia subito, per esempio prima di lanciare un file SQL nuovo: da
# IMPOSTAZIONI → IL BACKUP in segreteria (la funzione `backup` di Supabase
# chiama `workflow_dispatch`), o da Actions → Backup del database → Run workflow.
#
# Il piano gratuito di Supabase non lascia scaricare i suoi backup: questa è
# l'unica copia che la palestra ha in mano. Come rimetterla a posto è in
# supabase/LEGGIMI.md, «Il backup». Nella stessa copia cifrata ci sono anche i
# file del contenitore `certificati` dello Storage (i certificati medici), se
# ci sono i segreti SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Una copia per volta: due dump insieme non servono a niente.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Copia e cifra
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      # Senza l'indirizzo del database non c'è niente da copiare: la palestra
      # non ha ancora il suo, e una X rossa ogni lunedì non direbbe niente.
      # Con l'indirizzo ma senza la password, invece, si ferma rosso: il dump
      # non deve mai uscire di qui in chiaro.
      - name: Controlla i segreti
        id: segreti
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::Manca il segreto SUPABASE_DB_URL: niente da copiare (vedi supabase/LEGGIMI.md, «Il backup»)."
            echo "pronto=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "::error::Manca il segreto BACKUP_PASSWORD: senza, la copia uscirebbe in chiaro e non la si fa."
            exit 1
          fi
          echo "pronto=si" >> "$GITHUB_OUTPUT"
          # I file dei certificati servono altri due segreti: senza, la copia
          # del database si fa lo stesso e si dice cosa manca.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Mancano i segreti SUPABASE_URL e SUPABASE_SERVICE_ROLE_KEY: i certificati medici nello Storage non entrano nella copia (vedi supabase/LEGGIMI.md, «Il backup»)."
            echo "certificati=no" >> "$GITHUB_OUTPUT"
          else
            echo "certificati=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.segreti.outputs.pronto == 'si'
        with:
          version: latest

      # Il modo che Supabase consiglia: ruoli, schema e dati in tre file, senza
      # gli schemi che Supabase gestisce da sé e rimette in ogni progetto. Lo
      # `pg_dump` lo lancia la CLI in un container della stessa versione del
      # server, quindi non c'è da inseguire la versione di Postgres.
      - name: Copia il database
        if: steps.segreti.outputs.pronto == 'si'
        run: |
          giorno=$(date -u +%F)
          echo "GIORNO=$giorno" >> "$GITHUB_ENV"
          mkdir -p "backup-$giorno"
          cd "backup-$giorno"
          supabase db dump --db-url "$SUPABASE_DB_URL" -f ruoli.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dati.sql --use-copy --data-only
          # Un dump vuoto vuol dire che qualcosa non è andato, anche se la CLI
          # non l'ha detto: meglio rosso che una copia inutile.
          for f in ruoli.sql schema.sql dati.sql; do
            [ -s "$f" ] || { echo "::error::$f è vuoto"; exit 1; }
          done
          ls -l

      # I certificati medici stanno nello Storage, non nel dump: si scaricano
      # dal contenitore `certificati` con la chiave di servizio, nella stessa
      # cartella del dump, così escono nella stessa copia cifrata. Una
      # cartella per persona. Se qualcosa non va si ferma rosso: una copia
      # senza i file, detta completa, è peggio di nessuna.
      - name: Copia i certificati
        if: steps.segreti.outputs.pronto == 'si' && steps.segreti.outputs.certificati == 'si'
        run: |
          set -euo pipefail
          base="${SUPABASE_URL%/}/storage/v1"
          dest="backup-$GIORNO/certificati"
          mkdir -p "$dest"
          # Se qualcosa non va, il passo si ferma rosso e dice cosa guardare: mai la chiave.
          trap 'rc=$?; [ "$rc" -eq 0 ] || echo "::error::Copia dei certificati non riuscita (vedi sopra). Controlla i segreti SUPABASE_URL (https://<id>.supabase.co) e SUPABASE_SERVICE_ROLE_KEY (la chiave service_role) e che il contenitore «certificati» esista (supabase/44-certificati-online.sql). La copia del database NON è stata cifrata né caricata: va rifatta."' EXIT
          guaio() {
            echo "Errore: $1" >&2
            exit 1
          }
          chiama() {
            # $1 = percorso, resto = argomenti di curl; scrive su stdout, o in -o.
            local percorso="$1"; shift
            curl --silent --show-error --fail --max-time 120 "$base/$percorso" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" "$@" \
              || guaio "la richiesta a «$percorso» è fallita (indirizzo, chiave o rete)"
          }
          # Un file o una cartella per riga, da `prefisso` (le pagine sono da mille).
          elenca() {
            local da=0 pagina
            while :; do
              pagina=$(chiama object/list/certificati -X POST -H 'Content-Type: application/json' \
                -d "$(jq -n --arg p "$1" --argjson o "$da" '{prefix: $p, limit: 1000, offset: $o}')")
              echo "$pagina" | jq -e 'type == "array"' > /dev/null || guaio "l'elenco dei file non è quello atteso"
              echo "$pagina" | jq -c '.[]'
              [ "$(echo "$pagina" | jq length)" -lt 1000 ] && break
              da=$((da + 1000))
            done
          }
          scarica() {
            mkdir -p "$dest/$(dirname "$1")"
            chiama "object/certificati/$1" -o "$dest/$1"
            [ -s "$dest/$1" ] || guaio "il file «$1» è arrivato vuoto"
          }
          n=0
          # In una variabile, non in una sostituzione di processo: un errore dell'elenco ferma il passo.
          voci=$(elenca "")
          while IFS= read -r voce; do
            [ -n "$voce" ] || continue
            nome=$(echo "$voce" | jq -r .name)
            if [ "$(echo "$voce" | jq -r .id)" = null ]; then
              files=$(elenca "$nome")
              while IFS= read -r file; do
                [ -n "$file" ] || continue
                [ "$(echo "$file" | jq -r .id)" = null ] && continue
                scarica "$nome/$(echo "$file" | jq -r .name)"
                n=$((n + 1))
              done <<< "$files"
            else
              scarica "$nome"
              n=$((n + 1))
            fi
          done <<< "$voci"
          echo "Certificati copiati: $n"

      # Il repository è pubblico, e gli artefatti di un repository pubblico li
      # scarica chiunque abbia un account GitHub. Dentro ci sono nomi,
      # contatti, presenze e certificati medici: si cifrano con AES-256 e la
      # password sta solo nei segreti (e, a parte, alla segreteria).
      - name: Cifra
        if: steps.segreti.outputs.pronto == 'si'
        run: |
          tar czf "backup-$GIORNO.tar.gz" "backup-$GIORNO"
          printf '%s' "$BACKUP_PASSWORD" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o "backup-$GIORNO.tar.gz.gpg" "backup-$GIORNO.tar.gz"
          rm -rf "backup-$GIORNO" "backup-$GIORNO.tar.gz"
          ls -l "backup-$GIORNO.tar.gz.gpg"

      # Novanta giorni è il massimo che GitHub tiene per un repository
      # pubblico: restano le ultime tredici settimane, e le più vecchie se ne
      # vanno da sole.
      - uses: actions/upload-artifact@v4
        if: steps.segreti.outputs.pronto == 'si'
        with:
          name: backup-${{ env.GIORNO }}
          path: backup-${{ env.GIORNO }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
          # È già compresso e cifrato: ricomprimerlo non guadagna niente.
          compression-level: 0
