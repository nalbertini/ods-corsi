name: Pubblica

# Si pubblica a ogni push su main, e resta il lancio a mano (Actions → Pubblica
# → Run workflow) per ripubblicare senza un push.
#
# Era stato tolto quando il repository era privato e Pages, su un account
# gratuito, non c'era: ogni push dava una X rossa senza che niente fosse rotto.
# Ora il sito c'è, e senza il push automatico restava indietro rispetto a main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Preteso da `deploy-pages` dalla v4 in poi: senza, il job di pubblicazione
  # non riesce a leggere l'artefatto che il job di compilazione ha caricato.
  actions: read

# Una pubblicazione per volta, senza interrompere quella in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            timer/package-lock.json

      - run: npm ci

      # Il timer sta in `timer/` con le sue dipendenze.
      - run: npm ci --prefix timer

      # Il controllo dei tipi è dentro `npm run build` (tsc -b && vite build):
      # se non compila, il push è rosso.
      #
      # I due segreti sono facoltativi: senza, l'app parte in modalità
      # prova con un orario inventato, e il client Supabase non finisce nemmeno
      # nel pacchetto. Si impostano in Settings → Secrets → Actions quando la
      # palestra ha il suo database (vedi supabase/LEGGIMI.md).
      #
      # Il Client ID di Spotify serve anche qui: la sala mostra i comandi della
      # musica collegata dal timer, e per rinnovarne l'accesso vuole lo stesso ID.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}

      # Il timer si compila dopo, dentro dist/timer: un'app a sé, con il suo
      # service worker, pubblicata nella sottocartella dello stesso sito. Gli
      # stessi due segreti: con quelli ritrova l'accesso fatto in ODS Corsi e
      # tiene timer, storico e preferenze sul database; senza, fa come prima.
      #
      # Il Client ID di Spotify è facoltativo anche lui: senza, lo si incolla
      # nelle impostazioni del timer su ogni dispositivo. Non è un segreto vero
      # (sta in chiaro nella pagina), ma sta qui per non legarlo al codice.
      - run: npm run build:timer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Pubblica
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      # Niente `configure-pages`: provato due volte, da repository privato e da
      # pubblico, risponde sempre «Resource not accessible by integration». Il
      # token del workflow non può creare il sito Pages, e non è un permesso
      # concedibile da `permissions:`. Accenderlo resta un passaggio a mano in
      # Settings › Pages › Source: GitHub Actions, una volta sola.
      - id: pubblicazione
        uses: actions/deploy-pages@v5
