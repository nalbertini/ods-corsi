name: Prova di ripristino del backup

# Un backup che non si ripristina non serve a niente, e lo si scoprirebbe il
# giorno che serve. Ogni lunedì, un'ora dopo il backup (backup.yml), questo
# prende l'ultima copia, la decifra, la rimette in un Postgres usa e getta e
# conta le righe. Mai il database vero: non vede nemmeno l'indirizzo.
#
# Il repository è pubblico e i log di Actions li legge chiunque: escono solo
# numeri (quante persone, quante iscrizioni…), mai testo dei dati né di un
# errore sui dati. Se qualcosa non torna, si rifà in locale con la password:
# scripts/ripristina.sh, e supabase/LEGGIMI.md, «Il backup».
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ripristino
  cancel-in-progress: false

jobs:
  ripristino:
    name: Rimetti a posto l'ultima copia
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prova
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: prova
      GH_TOKEN: ${{ github.token }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      # Come backup.yml: senza l'indirizzo del database la palestra non ha
      # ancora una copia e non c'è niente da ripristinare; con l'indirizzo e
      # senza la password non si può aprire la copia, e si ferma rosso.
      - name: Controlla i segreti
        id: segreti
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::Manca il segreto SUPABASE_DB_URL: non c'è nessuna copia da ripristinare (vedi supabase/LEGGIMI.md, «Il backup»)."
            echo "pronto=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BACKUP_PASSWORD" ]; then
            echo "::error::Manca il segreto BACKUP_PASSWORD: la copia è cifrata e non si apre."
            exit 1
          fi
          echo "pronto=si" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.segreti.outputs.pronto == 'si'

      # L'ultima copia riuscita. Se il backup è passato ma non c'è nessun
      # artefatto (scaduto, o mai fatto), si ferma rosso: è proprio quello che
      # questa prova deve far vedere.
      - name: Scarica l'ultima copia
        if: steps.segreti.outputs.pronto == 'si'
        run: |
          set -euo pipefail
          id=$(gh run list --workflow=backup.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          [ -n "$id" ] || { echo "::error::Nessun backup riuscito: niente da ripristinare."; exit 1; }
          gh run download "$id" --pattern 'backup-*' -D scarico || { echo "::error::Il backup $id non ha nessuna copia (scaduta dopo 90 giorni?)."; exit 1; }
          ls -l scarico/*

      - name: Decifra
        if: steps.segreti.outputs.pronto == 'si'
        run: |
          set -euo pipefail
          f=$(ls scarico/*/*.tar.gz.gpg | head -1)
          printf '%s' "$BACKUP_PASSWORD" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt -o copia.tar.gz "$f"
          mkdir copia && tar xzf copia.tar.gz -C copia
          ls copia/*

      - name: Rimetti a posto
        if: steps.segreti.outputs.pronto == 'si'
        run: |
          set -euo pipefail
          cartella=$(ls -d copia/backup-* | head -1)
          certificati=""
          [ -d "$cartella/certificati" ] && certificati="$cartella/certificati"
          scripts/ripristina.sh "$cartella" $certificati
