<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #0B0B0B; }
    a { color: #1B8AC4; } a:hover { color: #4FB0E4; }
    .ods-c { font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .ods-ob { font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; }
  </style>
</helmet>

<div style="width: 1280px; height: 800px; background: #121212; display: flex; flex-direction: column; color: #F2F2F0; position: relative; overflow: hidden;">

  <div style="position: absolute; inset: 0; border: 14px solid {{s.color}}; pointer-events: none; z-index: 5;"></div>

  <div style="display: flex; align-items: center; gap: 22px; padding: 24px 44px 20px 44px; border-bottom: 2px solid #2A2A2A; position: relative;">
    <svg width="92" height="63" viewBox="0 0 160 110" aria-label="Officine dello Sport">
      <g fill="none" stroke-width="9" stroke-dasharray="6 7.82">
        <circle cx="38" cy="40" r="22" stroke="#1B8AC4"></circle>
        <circle cx="80" cy="40" r="22" stroke="#F2F2F0"></circle>
        <circle cx="122" cy="40" r="22" stroke="#E4292A"></circle>
        <circle cx="59" cy="74" r="22" stroke="#F4C31B"></circle>
        <circle cx="101" cy="74" r="22" stroke="#16A54A"></circle>
      </g>
      <g fill="none" stroke-width="5">
        <circle cx="38" cy="40" r="14" stroke="#1B8AC4"></circle>
        <circle cx="80" cy="40" r="14" stroke="#F2F2F0"></circle>
        <circle cx="122" cy="40" r="14" stroke="#E4292A"></circle>
        <circle cx="59" cy="74" r="14" stroke="#F4C31B"></circle>
        <circle cx="101" cy="74" r="14" stroke="#16A54A"></circle>
      </g>
    </svg>
    <div style="width: 2px; height: 52px; background: #2A2A2A;"></div>
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <span class="ods-ob" style="font-size: 30px; font-weight: 700; letter-spacing: 0.04em; line-height: 1;">TABATA BRUCIA GRASSI</span>
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.2em; color: #8C8C88;">OFFICINE DELLO SPORT &middot; COLLEGNO</span>
    </div>
    <div style="flex-grow: 1;"></div>
    <div style="display: flex; align-items: baseline; gap: 10px; padding: 9px 20px; border: 2px solid #333333; background: #1C1C1C;">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: #8C8C88;">SERIE</span>
      <span class="ods-c" style="font-size: 32px; font-weight: 700; line-height: 1;">2</span>
      <span class="ods-c" style="font-size: 21px; font-weight: 500; color: #8C8C88; line-height: 1;">/3</span>
    </div>
    <div style="display: flex; align-items: baseline; gap: 10px; padding: 9px 20px; border: 2px solid {{s.color}}; background: #1C1C1C;">
      <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: #8C8C88;">ROUND</span>
      <span class="ods-c" style="font-size: 32px; font-weight: 700; line-height: 1; color: {{s.color}};">{{s.round}}</span>
      <span class="ods-c" style="font-size: 21px; font-weight: 500; color: #8C8C88; line-height: 1;">/8</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 56px; padding: 0 60px; position: relative;">

    <div style="position: relative; width: 300px; height: 300px; flex-shrink: 0;">
      <svg width="300" height="300" viewBox="0 0 100 100" style="transform: rotate(-90deg);">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#242424" stroke-width="10" stroke-dasharray="9 10.9"></circle>
        <circle cx="50" cy="50" r="42" fill="none" stroke="{{s.color}}" stroke-width="10" stroke-dasharray="{{s.dash}}"></circle>
        <circle cx="50" cy="50" r="30" fill="none" stroke="#242424" stroke-width="5"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
        <span class="ods-c" style="font-size: 20px; font-weight: 700; letter-spacing: 0.2em; color: #8C8C88;">RESTA</span>
        <span class="ods-c" style="font-size: 62px; font-weight: 700; line-height: 1; color: {{s.color}};">{{s.left}}</span>
        <span class="ods-c" style="font-size: 18px; font-weight: 600; letter-spacing: 0.16em; color: #8C8C88;">TOTALE</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 0; min-width: 0;">
      <div style="display: flex; align-items: center; gap: 20px;">
        <div style="width: 56px; height: 8px; background: {{s.color}};"></div>
        <span class="ods-ob" style="font-size: 46px; font-weight: 700; letter-spacing: 0.24em; color: {{s.color}}; line-height: 1;">{{s.label}}</span>
      </div>
      <div class="ods-c" style="font-size: 240px; font-weight: 700; line-height: 0.88; letter-spacing: -0.03em; color: #F2F2F0;">{{s.time}}</div>
      <span class="ods-ob" style="font-size: 46px; font-weight: 600; letter-spacing: 0.05em; color: #F2F2F0;">{{s.name}}</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; position: relative;">
    <div style="height: 12px; background: #242424; display: flex;">
      <div style="height: 100%; background: {{s.color}}; width: {{s.pct}};"></div>
    </div>

    <div style="display: flex; gap: 6px; padding: 18px 44px 0 44px;">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="8">
        <div style="flex-grow: 1; height: 16px; background: {{d.bg}}; border: 2px solid {{d.border}};"></div>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 28px; padding: 20px 44px 28px 44px;">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 320px;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.22em; color: #8C8C88;">PROSSIMO</span>
        <span class="ods-c" style="font-size: 32px; font-weight: 600; letter-spacing: 0.05em; color: #B8B8B2;">{{s.next}}</span>
      </div>
      <div style="flex-grow: 1;"></div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <button onClick="{{prev}}" style="width: 88px; height: 88px; background: #1C1C1C; border: 2px solid #333333; color: #B8B8B2; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
        </button>
        <button onClick="{{toggle}}" style="height: 88px; padding: 0 56px; background: {{s.color}}; border: none; color: #121212; cursor: pointer; display: flex; align-items: center; gap: 16px;">
          <sc-if value="{{running}}" hint-placeholder-val="{{true}}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          </sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 21 12 6 21 6 3"></polygon></svg>
          </sc-if>
          <span class="ods-ob" style="font-size: 34px; font-weight: 700; letter-spacing: 0.18em;">{{s.button}}</span>
        </button>
        <button onClick="{{next}}" style="width: 88px; height: 88px; background: #1C1C1C; border: 2px solid #333333; color: #B8B8B2; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
        </button>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"lavoro":{"editor":"color","default":"#E4292A","options":["#E4292A","#1B8AC4","#F4C31B","#16A54A"],"section":"Stati"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 7, remaining: 14, running: true };
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (!this.state.running) return;
      const r = this.state.remaining - 1;
      if (r > 0) { this.setState({ remaining: r }); return; }
      this.go(1);
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  plan() {
    const out = [{ kind: 'prep', label: 'PREPARATI', name: 'Mettiti in posizione', dur: 10, round: 0 }];
    const moves = ['BURPEE + SALTO', 'MOUNTAIN CLIMBER', 'JUMP SQUAT', 'PLANK JACK'];
    for (let r = 1; r <= 8; r++) {
      out.push({ kind: 'work', label: 'LAVORO', name: moves[(r - 1) % 4], dur: 20, round: r });
      out.push({ kind: 'rest', label: 'RECUPERO', name: 'Respira e bevi', dur: 10, round: r });
    }
    return out;
  }
  go(step) {
    const p = this.plan();
    let i = this.state.idx + step;
    if (i >= p.length) i = 0;
    if (i < 0) i = 0;
    this.setState({ idx: i, remaining: p[i].dur });
  }
  renderVals() {
    const work = this.props.lavoro ?? '#E4292A';
    const tone = { prep: '#F4C31B', work: work, rest: '#16A54A' };
    const p = this.plan();
    const cur = p[this.state.idx];
    const nx = p[this.state.idx + 1];
    const color = tone[cur.kind];
    const pad = (n) => String(n).padStart(2, '0');
    let left = 0;
    for (let i = this.state.idx + 1; i < p.length; i++) left += p[i].dur;
    left += this.state.remaining;
    const frac = (cur.dur - this.state.remaining) / cur.dur;
    const circ = 2 * Math.PI * 42;
    const dots = [];
    for (let r = 1; r <= 8; r++) {
      const done = r < cur.round;
      const now = r === cur.round;
      dots.push({ bg: now ? color : (done ? '#4A4A46' : 'transparent'), border: now ? color : '#333333' });
    }
    return {
      running: this.state.running,
      paused: !this.state.running,
      dots: dots,
      s: {
        color: color,
        label: cur.label,
        time: pad(Math.floor(this.state.remaining / 60)) + ':' + pad(this.state.remaining % 60),
        name: cur.name,
        round: pad(Math.max(cur.round, 1)),
        pct: Math.round(frac * 100) + '%',
        dash: (circ * frac).toFixed(1) + ' ' + circ.toFixed(1),
        left: pad(Math.floor(left / 60)) + ':' + pad(left % 60),
        next: nx ? (nx.label + ' · ' + nx.dur + '"') : 'FINE ALLENAMENTO',
        button: this.state.running ? 'PAUSA' : 'RIPRENDI'
      },
      toggle: () => this.setState({ running: !this.state.running }),
      next: () => this.go(1),
      prev: () => this.go(-1)
    };
  }
}
</script>
</body>
</html>
