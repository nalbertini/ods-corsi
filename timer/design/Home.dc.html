<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Barlow, 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #0B0B0B; }
    a { color: #1B8AC4; } a:hover { color: #4FB0E4; }
    .ods-c { font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-variant-numeric: tabular-nums; }
    .ods-ob { font-family: 'Saira Condensed', 'Helvetica Neue', Arial, sans-serif; font-style: oblique 9deg; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #121212; color: #F2F2F0; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 56px 20px 14px 20px; display: flex; align-items: center; gap: 12px;">
    <svg width="58" height="40" viewBox="0 0 160 110" aria-label="Officine dello Sport">
      <g fill="none" stroke-width="9" stroke-dasharray="6 7.82">
        <circle cx="38" cy="40" r="22" stroke="#1B8AC4"></circle>
        <circle cx="80" cy="40" r="22" stroke="#F2F2F0"></circle>
        <circle cx="122" cy="40" r="22" stroke="#E4292A"></circle>
        <circle cx="59" cy="74" r="22" stroke="#F4C31B"></circle>
        <circle cx="101" cy="74" r="22" stroke="#16A54A"></circle>
      </g>
      <g fill="none" stroke-width="5">
        <circle cx="38" cy="40" r="14" stroke="#1B8AC4"></circle>
        <circle cx="80" cy="40" r="14" stroke="#F2F2F0"></circle>
        <circle cx="122" cy="40" r="14" stroke="#E4292A"></circle>
        <circle cx="59" cy="74" r="14" stroke="#F4C31B"></circle>
        <circle cx="101" cy="74" r="14" stroke="#16A54A"></circle>
      </g>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
      <span class="ods-ob" style="font-size: 19px; font-weight: 700; letter-spacing: 0.04em; line-height: 1;">OFFICINE DELLO SPORT</span>
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.22em; color: #8C8C88;">COLLEGNO</span>
    </div>
    <button style="width: 44px; height: 44px; background: transparent; border: 2px solid #333333; color: #B8B8B2; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <div style="margin: 6px 20px 0 20px; padding: 14px 16px; background: #1C1C1C; border: 2px solid #333333; border-left: none; display: flex; align-items: center; gap: 14px;">
    <div style="width: 6px; align-self: stretch; background: repeating-linear-gradient(-45deg, #F4C31B 0 7px, #121212 7px 14px);"></div>
    <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #8C8C88;">RIPRENDI</span>
      <span class="ods-ob" style="font-size: 21px; font-weight: 700; letter-spacing: 0.03em; line-height: 1;">EMOM 12 &middot; GAMBE</span>
    </div>
    <button style="width: 48px; height: 48px; background: #F4C31B; border: none; color: #121212; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 21 12 6 21 6 3"></polygon></svg>
    </button>
  </div>

  <div style="display: flex; gap: 8px; padding: 20px 20px 14px 20px; overflow: hidden;">
    <div style="padding: 10px 16px; background: #1B8AC4; color: #121212; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; white-space: nowrap;">TUTTI</div>
    <div style="padding: 10px 16px; background: #1C1C1C; border: 2px solid #333333; color: #B8B8B2; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; white-space: nowrap;">TABATA</div>
    <div style="padding: 10px 16px; background: #1C1C1C; border: 2px solid #333333; color: #B8B8B2; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; white-space: nowrap;">EMOM</div>
    <div style="padding: 10px 16px; background: #1C1C1C; border: 2px solid #333333; color: #B8B8B2; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; white-space: nowrap;">AMRAP</div>
  </div>

  <div style="display: flex; align-items: baseline; gap: 10px; padding: 0 20px 10px 20px;">
    <span class="ods-c" style="font-size: 15px; font-weight: 700; letter-spacing: 0.24em; color: #8C8C88;">I TUOI TIMER</span>
    <div style="flex-grow: 1; height: 2px; background: #2A2A2A;"></div>
    <span class="ods-c" style="font-size: 15px; font-weight: 600; color: #8C8C88;">6</span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; padding: 0 20px; overflow: hidden;">
    <sc-for list="{{workouts}}" as="w" hint-placeholder-count="4">
      <div style="background: #1C1C1C; border: 2px solid #333333; padding: 13px 15px; display: flex; align-items: center; gap: 14px; min-height: 86px;">
        <div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1; min-width: 0;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="padding: 3px 9px; background: {{w.tint}}; color: #121212; font-size: 10px; font-weight: 700; letter-spacing: 0.16em;">{{w.type}}</span>
            <span class="ods-c" style="font-size: 14px; font-weight: 600; letter-spacing: 0.1em; color: #8C8C88;">{{w.dur}}</span>
          </div>
          <span class="ods-ob" style="font-size: 21px; font-weight: 700; letter-spacing: 0.03em; line-height: 1.05;">{{w.name}}</span>
          <span style="font-size: 13px; font-weight: 500; color: #8C8C88;">{{w.detail}}</span>
        </div>
        <button style="width: 52px; height: 52px; background: transparent; border: 2px solid {{w.tint}}; color: {{w.tint}}; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 21 12 6 21 6 3"></polygon></svg>
        </button>
      </div>
    </sc-for>
  </div>

  <div style="padding: 14px 20px 12px 20px;">
    <button style="width: 100%; height: 56px; background: transparent; border: 2px dashed #4A4A46; color: #B8B8B2; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span class="ods-ob" style="font-size: 17px; font-weight: 700; letter-spacing: 0.18em;">NUOVO TIMER</span>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 2px solid #2A2A2A; background: #171717; padding: 10px 8px 26px 8px;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px; color: #1B8AC4; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2"></path><path d="M9 2h6"></path></svg>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.14em;">TIMER</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px; color: #8C8C88; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h5v16H4z"></path><path d="M11 4h4v16h-4z"></path><path d="M17 5l3 15"></path></svg>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.14em;">LIBRERIA</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px; color: #8C8C88; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 8v4l3 2"></path></svg>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.14em;">STORICO</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px; color: #8C8C88; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.14em;">PROFILO</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      workouts: [
        { type: 'TABATA', tint: '#E4292A', dur: '12:30', name: 'BRUCIA GRASSI', detail: '8 × 20"/10" · 3 serie' },
        { type: 'EMOM', tint: '#16A54A', dur: '12:00', name: 'EMOM 12 · GAMBE', detail: '12 minuti · 4 esercizi' },
        { type: 'AMRAP', tint: '#F4C31B', dur: '20:00', name: 'AMRAP DEL SABATO', detail: 'giro libero · cap 20 min' },
        { type: 'CIRCUITO', tint: '#1B8AC4', dur: '24:00', name: 'CIRCUITO SALA ATTREZZI', detail: '6 stazioni × 4 giri' }
      ]
    };
  }
}
</script>
</body>
</html>
